icaz na grande maioria dos casos. A avaliação do estado de hidratação é clínica e padronizada pelos planos A, B e C do Ministério da Saúde. Os rotavírus e norovírus são agentes frequentes em crianças pequenas, e a vacinação contra rotavírus reduz formas graves. A orientação sobre tratamento domiciliar da água e a busca de outras crianças acometidas são fundamentais no contexto comunitário.","referencias":["Manejo do paciente com diarreia – Ministério da Saúde (cartaz com os Planos A, B e C)","AIDPI – Atenção Integrada às Doenças Prevalentes na Infância (Ministério da Saúde/OPAS)","Tratado de Pediatria – Sociedade Brasileira de Pediatria"]}],"instituicoes":[{"id":"ufam","sigla":"UFAM","nome":"Universidade Federal do Amazonas","cidade":"Manaus/AM","cursos":["medicina","direito"],"fontes":[{"titulo":"Grade curricular — Faculdade de Medicina da UFAM (versões 2025/2 e 2010/1, segundo a busca)","url":"https://fm.ufam.edu.br/graduacao/grade-curricular.html","obs":"não lido: acesso bloqueado no ambiente de construção"},{"titulo":"PPC do curso de Medicina — PROEG/UFAM","url":"https://proeg.ufam.edu.br/dae/57-proeg/1176-ppc-do-curso-de-medicina.html","obs":"não lido"}]},{"id":"uea","sigla":"UEA","nome":"Universidade do Estado do Amazonas","cidade":"Manaus/AM","cursos":["medicina","direito"],"fontes":[]},{"id":"fametro","sigla":"FAMETRO","nome":null,"cidade":"Manaus/AM","cursos":["medicina","direito"],"fontes":[]},{"id":"nilton-lins","sigla":"Nilton Lins","nome":null,"cidade":"Manaus/AM","cursos":["medicina","direito"],"fontes":[]},{"id":"afya","sigla":"Afya (AM)","nome":null,"cidade":"Amazonas (unidade a confirmar)","cursos":["medicina"],"fontes":[]}],"grades":[]};

/** Registro de eventos delegados (preenchido pelos módulos; ver 06-ui). */
const ACOES = {}, MUDANCAS = {}, ENTRADAS = {}, FORMS = {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LETRAS = "ABCDE";
const DIA = 86400000;

/** Texto normalizado para busca: minúsculo e sem acentos. */
const norm = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48) || "item";
const novoId = (p = "x") => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/** Datas sempre em horário local no formato AAAA-MM-DD. */
const diaISO = (d = new Date()) => { const x = new Date(d); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
const hoje = () => diaISO();
const somaDias = (iso, n) => { const [a, m, d] = iso.split("-").map(Number); return diaISO(new Date(a, m - 1, d + n)); };
const dataBR = iso => { if (!iso) return "—"; const [a, m, d] = String(iso).slice(0, 10).split("-"); return `${d}/${m}/${a}`; };
const dataCurta = ts => new Date(ts).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
const diasAte = iso => Math.round((new Date(iso + "T00:00:00") - new Date(hoje() + "T00:00:00")) / DIA);
const quando = iso => { const n = diasAte(iso); return n < -1 ? `atrasada ${-n} dias` : n === -1 ? "ontem" : n === 0 ? "hoje" : n === 1 ? "amanhã" : `em ${n} dias`; };
const mmss = ms => { const s = Math.max(0, Math.round(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
const horas = seg => { const m = Math.round(seg / 60); return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0"); };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

const embaralhar = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const unicos = a => [...new Set(a.filter(x => x != null && x !== ""))];
const porChave = (a, f) => a.reduce((m, x) => { const k = f(x); (m[k] = m[k] || []).push(x); return m; }, {});
const ordenarPt = (a, f = x => x) => a.slice().sort((x, y) => String(f(x)).localeCompare(String(f(y)), "pt"));

/** localStorage tolerante a falhas (aba privada, bloqueio, prévia). */
const ls = {
  get(k, def = null) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } },
};

/** Carrega um script de CDN sob demanda (PDF, planilha, DOCX). */
const _scripts = {};
function carregarScript(src) {
  return _scripts[src] || (_scripts[src] = new Promise((ok, erro) => {
    const s = document.createElement("script"); s.src = src; s.onload = ok;
    s.onerror = () => { delete _scripts[src]; erro(new Error("Não foi possível carregar " + src.split("/").pop() + ". Verifique a conexão.")); };
    document.head.appendChild(s);
  }));
}

/** Similaridade de nomes (Jaccard de palavras significativas). Usada só como sugestão. */
const PARADAS = new Set("a o e de da do das dos em no na nos nas i ii iii iv v vi vii viii ix x para com sem ao aos".split(" "));
const palavras = s => new Set(norm(s).split(/[^a-z0-9]+/).filter(w => w.length > 2 && !PARADAS.has(w)));
function similaridade(a, b) { const A = palavras(a), B = palavras(b); if (!A.size || !B.size) return 0; let i = 0; A.forEach(w => B.has(w) && i++); return i / (A.size + B.size - i); }

/* ---------- Temas (entidade central) ----------
   Um tema médico pertence a N especialidades e N disciplinas (muitos-para-muitos).

const AREAS_MED = DADOS.mapa?.areas || [];
const ESPECIALIDADES = {};
AREAS_MED.forEach(a => (a.especialidades || []).forEach(e => { ESPECIALIDADES[e.id] = { ...e, area: a.id, areaNome: a.nome }; }));

const TEMAS = {};
(DADOS.mapa?.temas || []).forEach(t => {
  TEMAS[t.id] = { dominio: "medicina", sinonimos: [], especialidades: [], disciplinas: [], subtemas: [], objetivos: [], resumo: "", ...t };
});
const ENEM_AREAS = DADOS.enem?.areas || [];
const ENEM_DISC = {};
ENEM_AREAS.forEach(a => (a.disciplinas || []).forEach(d => {
  ENEM_DISC[d.id] = { ...d, area: a.id, areaNome: a.nome };
  (d.assuntos || []).forEach(s => {
    TEMAS[s.id] = {
      id: s.id, nome: s.nome, dominio: "enem", area: a.id, areaNome: a.nome, disciplinaId: d.id, disciplinas: [d.nome],
      especialidades: [], sinonimos: [], objetivos: [], resumo: s.teoria || "",
      subtemas: (s.subassuntos || []).map(n => ({ id: s.id + "." + slug(n), nome: n })),
    };
  });
}));
const temaPorNome = (() => {
  const idx = {};
  Object.values(TEMAS).forEach(t => [t.nome, ...(t.sinonimos || [])].forEach(n => { idx[norm(n)] = t.id; }));
  return nome => idx[norm(nome)] || null;
})();
const nomeTema = id => TEMAS[id]?.nome || id || "—";
const nomeSubtema = (tid, sid) => (TEMAS[tid]?.subtemas || []).find(s => s.id === sid)?.nome || null;
const espPorNome = nome => Object.values(ESPECIALIDADES).find(e => norm(e.nome) === norm(nome))?.id || null;

/* ---------- Questões ----------
   Formato interno curto: t trilha, a área, q enunciado, o alternativas, c correta, e explicação. */
const normQuestao = (q, t, src = "banco") => ({
  id: q.id, t, a: q.area || q.a || "Geral", q: q.enunciado ?? q.q, o: q.alternativas ?? q.o, c: q.correta ?? q.c, e: q.explicacao ?? q.e ?? "",
  tema: q.tema ?? null, subtema: q.subtema ?? null, esp: q.especialidade ?? q.esp ?? null,
  disc: q.disciplina ?? q.disc ?? q.area ?? q.a ?? null, dif: q.dificuldade ?? q.dif ?? null,

const QUESTOES_BASE = Object.entries(DADOS.banco || {}).flatMap(([t, arr]) => arr.map(q => normQuestao(q, t)));

/* ---------- Casos clínicos (educacionais) ---------- */
const CASOS_BASE = (DADOS.casos || []).map(c => ({

/* ---------- Instituições e matrizes curriculares ----------
   Instituição → Curso → Matriz (versão) → Período → Disciplina/Módulo → Unidade → Tema.

   e têm prioridade quando usam o mesmo id. */
const INSTITUICOES_BASE = DADOS.instituicoes || [];
const GRADES_BASE = DADOS.grades || [];
const CURSOS = { medicina: "Medicina", direito: "Direito" };

/* ---------- Guia de referência (antigo "Grade") ---------- */
const GUIA = DADOS.guia || {};
const NOME_GUIA = { enem: "ENEM", vestibulares: "Vestibulares", medicina: "Medicina – graduação", residencia: "Residência médica", direito: "Direito – graduação", oab: "OAB e pós" };

/* ---- 03-store.js ---- */
/* ============================================================
   03-store — banco do usuário.
   Cada entidade é um documento JSON separado (evita um "estado" monolítico):
     local: localStorage "gab2:<doc>"   |   conta: db data/users/<id>/<doc>
   O mais recente (_ts) vence ao sincronizar. Escritas são agrupadas (1 por doc por vez).
   ============================================================ */
const DOC_PADRAO = {
  perfil:       () => ({ faculdade: null, gradeId: null, periodo: null, metas: { questoes: 20, minutos: 60 } }),
  dias:         () => ({ d: {} }),       // d[AAAA-MM-DD] = {q, ac, seg, temas:[]}  → StudySession diária
  erros:        () => ({ itens: {} }),   // itens[qid] = {qid, tema, ts, resp, motivo, coment, card, srs, status}
  cards:        () => ({ itens: {} }),   // itens[id]  = {id, frente, verso, tema, subtema, origem, dif, criado, srs}
  revisoes:     () => ({ temas: {} }),   // temas[id]  = srs (revisão espaçada do tema)
  notas:        () => ({ temas: {} }),   // temas[id]  = {texto, atualizado}
  materiais:    () => ({ itens: {} }),   // itens[id]  = {id, titulo, tipo, url, assetId, tema, criado}
  plano:        () => ({ itens: {} }),   // itens[id]  = {id, data, titulo, tema, disciplina, min, nq, rev, feito}
  simulados:    () => ({ hist: [] }),    // [{d, t, n, ac, seg, areas, filtros}]
  redacoes:     () => ({ itens: {} }),   // itens[id]  = {id, proposta, tema, texto, ts, aval:{fonte, notas[5], comentario}}
  casos:        () => ({ itens: {} }),   // casos criados pelo usuário/IA
  questoes:     () => ({ itens: {} }),   // questões próprias/IA
  grades:       () => ({ itens: {} }),   // matrizes importadas/editadas
  instituicoes: () => ({ itens: {} }),   // instituições adicionadas pelo usuário
  guia:         () => ({ g: {} }),       // checklist do guia de referência
  backups:      () => ({ itens: [] }),   // registro dos backups automáticos (não entra no próprio backup)
};
// Progresso das questões, fragmentado por trilha para cada doc ficar pequeno:
// prog-<trilha>.q[qid] = {n, ac, h:[[ts, resp, ok, ms, origem]…], m: marcada, r: revisar}
const docProg = t => "prog-" + t;
const padrao = nome => nome.startsWith("prog-") ? { q: {} } : (DOC_PADRAO[nome] || (() => ({})))();

const store = (() => {
  const docs = {}, sujos = new Set(), gravando = {}, pend = {};
  let db = null, uid = null, timer = null, aoMudarRemoto = null;
  const chaveLS = n => "gab2:" + n;

  function doc(nome) {
    if (!docs[nome]) docs[nome] = Object.assign(padrao(nome), ls.get(chaveLS(nome)) || {});
    return docs[nome];
  }
  function mudou(nome) {
    const d = doc(nome); d._ts = Date.now();
    ls.set(chaveLS(nome), d);
    const lista = ls.get("gab2:lista", []); if (!lista.includes(nome)) { lista.push(nome); ls.set("gab2:lista", lista); }
    if (!db) return;
    sujos.add(nome); clearTimeout(timer); timer = setTimeout(descarregar, 900); status("salvando…");
  }
  async function gravar(nome) {
    if (gravando[nome]) { pend[nome] = true; return; }
    gravando[nome] = true;
    try { await db.doc(`data/users/${uid}/${nome}`).set(JSON.parse(JSON.stringify(docs[nome]))); status("salvo na sua conta"); }
    catch (e) { status(e?.code === "quota_exceeded" ? "limite de armazenamento atingido" : "sem conexão — salvo neste aparelho"); }
    gravando[nome] = false;
    if (pend[nome]) { pend[nome] = false; gravar(nome); }
  }
  function descarregar() { const l = [...sujos]; sujos.clear(); l.forEach(gravar); }
  function status(t) { const el = document.getElementById("sync"); if (el) el.textContent = t; }

  /** Conecta à conta (quando o app roda como artefato). Sem conta, tudo fica local. */
  async function conectar() {
    // Carrega tudo o que existe localmente
    ls.get("gab2:lista", []).forEach(doc);
    migrarLocalV1();
    const use = window.claude && window.claude.use;
    if (!use) { status("salvando neste aparelho"); return; }
    try {
      const [u, d] = await Promise.all([use("user"), use("db")]);
      if (!u || !d) { status("salvando neste aparelho"); return; }
      uid = await u.id(); if (!uid) { status("salvando neste aparelho"); return; }
      db = d;
      const snap = await db.collection(`data/users/${uid}`).get();
      const remotos = {}; snap.docs.forEach(x => { remotos[x.id] = x.data(); });
      if (!remotos.perfil && remotos.estado) await migrarRemotoV1(remotos.estado);
      let mudouAlgo = false;
      for (const [nome, corpo] of Object.entries(remotos)) {
        if (nome === "estado" || !(nome in DOC_PADRAO || nome.startsWith("prog-"))) continue;
        const local = docs[nome];
        if (!local || (corpo._ts || 0) > (local._ts || 0)) { docs[nome] = Object.assign(padrao(nome), JSON.parse(JSON.stringify(corpo))); ls.set(chaveLS(nome), docs[nome]); mudouAlgo = true; }
      }
      // O que só existe (ou é mais novo) aqui sobe para a conta
      Object.keys(docs).forEach(n => { if (!remotos[n] || (docs[n]._ts || 0) > (remotos[n]._ts || 0)) sujos.add(n); });
      descarregar();
      status("salvo na sua conta");
      if (mudouAlgo && aoMudarRemoto) aoMudarRemoto();
    } catch (e) { db = null; status("salvando neste aparelho"); }
  }

  /* ---------- Migração do formato v1 (estado único {r,g,dias,sim} + questões próprias) ---------- */
  function aplicarV1(estado, extras) {
    if (!estado) return;
    const tr = {};
    QUESTOES_BASE.forEach(q => { tr[q.id] = q.t; });
    (extras || []).forEach(x => { tr[x.id] = x.t; });
    for (const [qid, v] of Object.entries(estado.r || {})) {
      const t = tr[qid]; if (!t || !Array.isArray(v)) continue;
      const p = doc(docProg(t)); if (p.q[qid]) continue;
      p.q[qid] = { n: (v[0] || 0) + (v[1] || 0), ac: v[0] || 0, h: [[v[3] || Date.now(), null, v[2] ? 1 : 0, null, "v1"]], m: 0, r: 0 };
      mudou(docProg(t));
    }
    const g = doc("guia"); Object.assign(g.g, estado.g || {}); mudou("guia");
    const dd = doc("dias"); for (const [k, n] of Object.entries(estado.dias || {})) dd.d[k] = dd.d[k] || { q: n, ac: 0, seg: 0, temas: [] }; mudou("dias");
    const s = doc("simulados"); if (!s.hist.length && Array.isArray(estado.sim)) { s.hist = estado.sim.slice(-50); mudou("simulados"); }
    const qs = doc("questoes"); (extras || []).forEach(x => { if (x && x.id && !qs.itens[x.id]) qs.itens[x.id] = x; }); mudou("questoes");
    const p = doc("perfil"); p.migradoDe = "v1"; mudou("perfil");
  }
  function migrarLocalV1() {
    if (ls.get("gab2:lista", []).includes("perfil")) return;
    const v1 = ls.get("gabarito-am-v1");
    if (v1) aplicarV1(v1.estado, v1.extras);
    else mudou("perfil");
  }
  async function migrarRemotoV1(estado) {
    let extras = [];
    try { const qs = await db.collection(`data/users/${uid}/estado/questoes`).get(); extras = qs.docs.map(x => ({ ...x.data(), id: x.id })); } catch (e) { }
    aplicarV1(estado, extras);
  }

  /** Backup completo (exportação/importação manual). */
  const exportar = () => ({ formato: "gabarito-am", versao: 2, exportado: new Date().toISOString(), docs: Object.fromEntries(Object.keys(docs).filter(n => n !== "backups").map(n => [n, docs[n]])) });
  function importar(obj) {
    if (obj && obj.estado) { aplicarV1(obj.estado, obj.extras); return; } // backup antigo
    if (!obj || obj.formato !== "gabarito-am" || typeof obj.docs !== "object") throw new Error("formato");
    // Restaurar = voltar ao estado do backup: coleções que não existiam nele voltam ao padrão.
    Object.keys(docs).forEach(n => { if (n !== "backups" && !(n in obj.docs)) { docs[n] = padrao(n); mudou(n); } });
    for (const [n, corpo] of Object.entries(obj.docs)) {
      if (!(n in DOC_PADRAO || n.startsWith("prog-")) || n === "backups" || typeof corpo !== "object") continue;
      docs[n] = Object.assign(padrao(n), corpo); mudou(n);
    }
  }
  function zerar(nomes) { nomes.forEach(n => { docs[n] = padrao(n); mudou(n); }); }
  const nomes = () => Object.keys(docs);

  return { doc, mudou, conectar, exportar, importar, zerar, nomes, aoRemoto: f => { aoMudarRemoto = f; }, get naConta() { return !!db; } };
})();

/* ---- 04-estudo.js ---- */
/* ============================================================
   04-estudo — regras de negócio: tentativas, caderno de erros,
   repetição espaçada, flashcards, desempenho e matrizes.
   ============================================================ */

/* ---------- Questões (banco + próprias) ---------- */
let _cacheQ = null;
function questoes() {
  if (!_cacheQ) {
    const minhas = Object.values(store.doc("questoes").itens).filter(x => x && Array.isArray(x.o || x.alternativas)).map(x => normQuestao(x, x.t, x.src || "minha"));
    _cacheQ = QUESTOES_BASE.concat(minhas);
    _cacheQ.porId = Object.fromEntries(_cacheQ.map(q => [q.id, q]));
  }
  return _cacheQ;
}
const invalidarQuestoes = () => { _cacheQ = null; };
const qPorId = id => questoes().porId[id];
function salvarQuestaoPropria(x) {
  const d = store.doc("questoes"); d.itens[x.id] = x; store.mudou("questoes"); invalidarQuestoes();
}
function apagarQuestaoPropria(id) { const d = store.doc("questoes"); delete d.itens[id]; store.mudou("questoes"); invalidarQuestoes(); }

/* ---------- Progresso e tentativas (QuestionAttempt) ---------- */
const progDe = q => store.doc(docProg(q.t)).q[q.id];
function statusQ(q) {
  const p = progDe(q);
  if (!p || !p.n) return { chave: "nao", nome: "Não respondida", marcada: !!p?.m, revisar: !!p?.r };
  const ult = p.h[p.h.length - 1];
  return { chave: ult && ult[2] ? "correta" : "incorreta", nome: ult && ult[2] ? "Correta" : "Incorreta", marcada: !!p.m, revisar: !!p.r, n: p.n, ac: p.ac };
}
function alternarFlag(q, flag) {
  const d = store.doc(docProg(q.t)); const p = d.q[q.id] = d.q[q.id] || { n: 0, ac: 0, h: [], m: 0, r: 0 };
  p[flag] = p[flag] ? 0 : 1; store.mudou(docProg(q.t)); return p[flag];
}

/** Registra uma tentativa. origem: pratica | tema | simulado | revisao | erro */
function registrarResposta(q, resp, ms, origem) {
  const ok = resp === q.c, agora = Date.now();
  const d = store.doc(docProg(q.t)); const p = d.q[q.id] = d.q[q.id] || { n: 0, ac: 0, h: [], m: 0, r: 0 };
  p.n++; if (ok) p.ac++;
  p.h.push([agora, resp, ok ? 1 : 0, Math.round(ms || 0), origem]); if (p.h.length > 12) p.h = p.h.slice(-12);
  store.mudou(docProg(q.t));
  const dia = diaDe(hoje()); dia.q++; if (ok) dia.ac++; if (q.tema && !dia.temas.includes(q.tema)) dia.temas.push(q.tema); store.mudou("dias");
  // Caderno de erros: todo erro gera (ou reabre) um registro com revisão em 1 dia
  const E = store.doc("erros");
  if (!ok) {
    const prev = E.itens[q.id];
    E.itens[q.id] = { qid: q.id, tema: q.tema, ts: agora, resp, n: (prev?.n || 0) + 1,
      motivo: prev?.motivo || null, motivoSugerido: motivoSugerido(q, ms, prev), coment: prev?.coment || "", card: prev?.card || null,
      srs: agendar(prev?.srs && origem === "erro" ? prev.srs : null, 0), status: "aberto" };
    store.mudou("erros");
  } else if (E.itens[q.id] && E.itens[q.id].status === "aberto" && (origem === "erro" || origem === "revisao")) {
    const e = E.itens[q.id]; e.srs = agendar(e.srs, 2); if (e.srs.etapa >= 2) e.status = "resolvido"; store.mudou("erros");
  }
  return ok;
}
function motivoSugerido(q, ms, prev) {
  if (prev) return "Erro repetido — lacuna de conteúdo";
  if (ms && ms < 15000) return "Resposta rápida — possível desatenção";
  if (ms && ms > 240000) return "Muito tempo — dúvida de conteúdo ou interpretação";
  return "Conteúdo";
}
const MOTIVOS = ["Lacuna de conteúdo", "Desatenção / leitura apressada", "Interpretação do enunciado", "Chute", "Confundi conceitos parecidos", "Falta de tempo"];

/* ---------- Dia de estudo (StudySession agregada por dia) ---------- */
function diaDe(iso) { const D = store.doc("dias"); return D.d[iso] = Object.assign({ q: 0, ac: 0, seg: 0, temas: [] }, D.d[iso] || {}); }
function registrarTempo(seg) { diaDe(hoje()).seg += seg; store.mudou("dias"); }
function marcarTemaEstudado(temaId) { const d = diaDe(hoje()); if (!d.temas.includes(temaId)) d.temas.push(temaId); store.mudou("dias"); }
function sequencia() {
  const D = store.doc("dias").d; let n = 0, d = hoje();
  if (!(D[d]?.q || D[d]?.seg >= 60 || D[d]?.temas?.length)) d = somaDias(d, -1);
  while (D[d] && (D[d].q || D[d].seg >= 60 || D[d].temas?.length)) { n++; d = somaDias(d, -1); }
  return n;
}

/* ---------- Repetição espaçada ----------
   Etapas base 1 → 7 → 30 → 90 dias; depois disso o intervalo cresce pela "facilidade".
   Nota: 0 errei (volta ao início), 1 difícil (repete a etapa com metade do intervalo),
   2 bom (avança), 3 fácil (pula uma etapa). A facilidade sobe/desce com o desempenho. */
const INTERVALOS = [1, 7, 30, 90];
function agendar(srs, nota) {
  const s = Object.assign({ etapa: -1, ease: 2.2, int: 0, prox: hoje(), hist: [] }, srs ? JSON.parse(JSON.stringify(srs)) : {});
  let etapa = s.etapa, dias;
  if (nota === 0) { etapa = 0; s.ease = Math.max(1.3, s.ease - 0.2); }
  else if (nota === 1) { etapa = Math.max(0, etapa); s.ease = Math.max(1.3, s.ease - 0.15); }
  else if (nota === 2) etapa = etapa + 1;
  else { etapa = etapa + 2; s.ease = Math.min(3, s.ease + 0.15); }
  if (etapa < INTERVALOS.length) dias = INTERVALOS[etapa];
  else dias = Math.round(Math.max(90, s.int || 90) * s.ease);
  if (nota === 1) dias = Math.max(1, Math.round((INTERVALOS[etapa] || s.int || 1) / 2));
  s.etapa = etapa; s.int = dias; s.prox = somaDias(hoje(), dias);
  s.hist = (s.hist || []).concat([[Date.now(), nota]]).slice(-20);
  return s;
}
const previaIntervalo = (srs, nota) => agendar(srs, nota).int;
const vencido = srs => srs && srs.prox <= hoje();

/* ---------- Revisão de temas ---------- */
function estudarTema(temaId) {
  marcarTemaEstudado(temaId);
  const R = store.doc("revisoes");
  if (!R.temas[temaId]) { R.temas[temaId] = agendar(null, 2); store.mudou("revisoes"); } // 1ª revisão em 1 dia
}
/** Nota da revisão a partir do aproveitamento nas questões do tema. */
const notaPorDesempenho = p => p < 50 ? 0 : p < 70 ? 1 : p < 90 ? 2 : 3;
function revisarTema(temaId, nota) {
  const R = store.doc("revisoes"); R.temas[temaId] = agendar(R.temas[temaId], nota); store.mudou("revisoes"); marcarTemaEstudado(temaId);
}

/* ---------- Flashcards ---------- */
function criarCard(c) {
  const C = store.doc("cards"), id = novoId("c");
  C.itens[id] = { id, frente: c.frente, verso: c.verso, tema: c.tema || null, subtema: c.subtema || null, origem: c.origem || "manual", ref: c.ref || null, dif: c.dif || 2, criado: Date.now(), srs: { etapa: -1, ease: 2.2, int: 0, prox: hoje(), hist: [] } };
  store.mudou("cards"); return id;
}
function cardDeQuestao(q, origem = "questao") {
  return criarCard({ frente: q.q, verso: `${q.o[q.c]}\n\n${q.e || ""}`.trim(), tema: q.tema, subtema: q.subtema, origem, ref: q.id, dif: q.dif || 2 });
}
function avaliarCard(id, nota) { const C = store.doc("cards"); const c = C.itens[id]; if (!c) return; c.srs = agendar(c.srs, nota); store.mudou("cards"); if (c.tema) marcarTemaEstudado(c.tema); }
const cards = () => Object.values(store.doc("cards").itens);

/* ---------- Pendências de revisão (agenda unificada) ---------- */
function pendencias() {
  const cs = cards().filter(c => vencido(c.srs));
  const temas = Object.entries(store.doc("revisoes").temas).filter(([, s]) => vencido(s)).map(([id, s]) => ({ id, srs: s }));
  const erros = Object.values(store.doc("erros").itens).filter(e => e.status === "aberto" && vencido(e.srs) && qPorId(e.qid));
  const planoHoje = Object.values(store.doc("plano").itens).filter(p => !p.feito && p.data <= hoje());
  return { cards: cs, temas, erros, plano: planoHoje, total: cs.length + temas.length + erros.length };
}

/* ---------- Desempenho (PerformanceMetric calculado sob demanda) ---------- */
function agregados(filtro = () => true) {
  const res = { n: 0, ac: 0, ms: 0, nms: 0, vistas: 0, por: { disc: {}, esp: {}, tema: {}, trilha: {}, area: {} } };
  const soma = (m, k, p, ok) => { if (!k) return; const x = m[k] = m[k] || { n: 0, ac: 0 }; x.n += p; x.ac += ok; };
  for (const q of questoes()) {
    if (!filtro(q)) continue;
    const p = progDe(q); if (!p || !p.n) continue;
    res.vistas++; res.n += p.n; res.ac += p.ac;
    for (const h of p.h) if (h[3]) { res.ms += h[3]; res.nms++; }
    soma(res.por.disc, q.disc, p.n, p.ac); soma(res.por.esp, q.esp, p.n, p.ac); soma(res.por.tema, q.tema, p.n, p.ac);
    soma(res.por.trilha, q.t, p.n, p.ac); soma(res.por.area, q.a, p.n, p.ac);
  }
  return res;
}
const listaPor = (m, min = 1) => Object.entries(m).filter(([, v]) => v.n >= min).map(([k, v]) => ({ k, ...v, p: v.ac / v.n }));
function desempenhoTema(temaId) {
  const a = agregados(q => q.tema === temaId);
  return { ...a, total: questoes().filter(q => q.tema === temaId).length, tempoMedio: a.nms ? a.ms / a.nms : null };
}

/* ---------- Matrizes curriculares ---------- */
function instituicoes() {
  const extras = Object.values(store.doc("instituicoes").itens);
  return INSTITUICOES_BASE.concat(extras.filter(e => !INSTITUICOES_BASE.some(b => b.id === e.id)));
}
const instPorId = id => instituicoes().find(i => i.id === id);
function grades() {
  const user = store.doc("grades").itens, porId = {};
  GRADES_BASE.forEach(g => { porId[g.id] = { ...g, origem: "base" }; });
  Object.values(user).forEach(g => { porId[g.id] = { ...g, origem: porId[g.id] ? "editada" : "importada" }; });
  return Object.values(porId);
}
const gradePorId = id => grades().find(g => g.id === id);
const gradesDe = (instId, curso) => grades().filter(g => g.instituicao === instId && (!curso || g.curso === curso));
/** Grava a matriz no banco do usuário (uma matriz de fábrica editada vira cópia do usuário). */
function salvarGrade(g) {
  const G = store.doc("grades"); const c = JSON.parse(JSON.stringify(g)); delete c.origem;
  c.atualizado = new Date().toISOString(); G.itens[c.id] = c; store.mudou("grades");
}
function itensGrade(g) { return (g?.periodos || []).flatMap(p => (p.itens || []).map(it => ({ ...it, periodo: p.numero, periodoNome: p.nome || `${p.numero}º período` }))); }
const temasDoItem = it => unicos([...(it.temas || []), ...(it.unidades || []).flatMap(u => u.temas || [])]);
/** tema → onde aparece na matriz: [{periodo, item}] */
function temasNaGrade(g) {
  const m = {};
  itensGrade(g).forEach(it => temasDoItem(it).forEach(t => { (m[t] = m[t] || []).push({ periodo: it.periodo, item: it }); }));
  return m;
}
const chTotal = g => { const it = itensGrade(g); const conhecidas = it.filter(x => typeof x.ch === "number"); return { total: conhecidas.reduce((s, x) => s + x.ch, 0), conhecidas: conhecidas.length, itens: it.length }; };

/* ============================================================
   06-ui — roteador, layout, navegação e componentes reutilizáveis.
   Páginas registram rotas e devolvem {secao, crumbs, titulo, sub, acoes, html, ctx}.
   Eventos são delegados: data-act (clique), data-chg (change), data-inp (input), data-form (submit).
   ============================================================ */
const ROTAS = [];
function rota(padrao, fn) { const partes = padrao.split("/").filter(Boolean); ROTAS.push({ partes, fn }); }
function casar(caminho) {
  const seg = caminho.split("/").filter(Boolean).map(decodeURIComponent);
  for (const r of ROTAS) {
    if (r.partes.length !== seg.length) continue;
    const p = {}; let ok = true;
    r.partes.forEach((x, i) => { if (x[0] === ":") p[x.slice(1)] = seg[i]; else if (x !== seg[i]) ok = false; });
    if (ok) return { r, p };
  }
  return null;
}
const caminhoAtual = () => (location.hash || "#/").slice(1) || "/";

/* ============================================================
   07-arvore — mapa mental visual (árvore vertical com ramos recolhíveis).
   Vertical de propósito: cabe no celular sem rolagem lateral.
   no = {t, sub?, href?, cls?: "ok"|"bad"|"", filhos?: no[]}
   ============================================================ */
function noHTML(no, nivel) {
  const f = (no.filhos || []).filter(Boolean);
  const rot = `<span class="no ${no.cls || ""}">${no.href ? `<a href="${no.href}">${esc(no.t)}</a>` : esc(no.t)}${no.sub ? ` <small>${esc(no.sub)}</small>` : ""}</span>`;
  if (!f.length) return `<li>${rot}</li>`;
  return `<li><details ${nivel < 2 ? "open" : ""}><summary>${rot} <small class="muted">${f.length}</small></summary><ul>${f.map(x => noHTML(x, nivel + 1)).join("")}</ul></details></li>`;
}
const arvore = raiz => `<ul class="arvore" role="tree">${noHTML(raiz, 0)}</ul>`;

/** Converte um texto indentado ("- item" / "  - subitem") numa árvore. Usado no mapa mental da IA. */
function textoParaArvore(txt, titulo = "Mapa mental") {
  const linhas = String(txt).split(/\r?\n/).map(l => {
    const m = l.replace(/\t/g, "  ").match(/^(\s*)(?:[-*•]|\d+[.)])?\s*(.+?)\s*$/);
    return m && m[2] ? { n: m[1].length, t: m[2].replace(/\*\*/g, "") } : null;
  }).filter(Boolean);
  if (!linhas.length) return { t: titulo };
  const min = Math.min(...linhas.map(l => l.n)), topo = linhas.filter(l => l.n === min);
  const raiz = topo.length === 1 && linhas[0].n === min ? { t: linhas.shift().t, filhos: [] } : { t: titulo, filhos: [] };
  const pilha = [{ n: -1, no: raiz }];
  for (const l of linhas) {
    const no = { t: l.t, filhos: [] };
    while (pilha.length > 1 && pilha[pilha.length - 1].n >= l.n) pilha.pop();
    pilha[pilha.length - 1].no.filhos.push(no);
    pilha.push({ n: l.n, no });
  }
  return raiz;
}
/** Classe de cor pelo aproveitamento (só com 2+ respostas, para não pintar por acaso). */
const clsDesempenho = a => a.n >= 2 ? (a.ac / a.n >= .7 ? "ok" : a.ac / a.n < .5 ? "bad" : "") : "";

function temasEstudados() { const s = new Set(); Object.values(store.doc("dias").d).forEach(d => (d.temas || []).forEach(t => s.add(t))); return s; }

function blocoEvolucao(nDias = 14) {
  const D = store.doc("dias").d, dias = [];
  for (let i = nDias - 1; i >= 0; i--) { const k = somaDias(hoje(), -i); dias.push({ k, ...(D[k] || { q: 0, ac: 0, seg: 0 }) }); }
  const max = Math.max(1, ...dias.map(d => d.q));
  return `<div class="colunas" role="img" aria-label="Questões por dia nos últimos ${nDias} dias">${dias.map(d => `<div class="col ${d.k === hoje() ? "hoje" : ""}" title="${dataBR(d.k)}: ${d.q} questões, ${pct(d.ac, d.q)}% de acerto, ${horas(d.seg || 0)}"><em>${d.q || ""}</em><i style="height:${d.q / max * 100}%"></i><small>${d.k.slice(8)}</small></div>`).join("")}</div>`;
}
function semanas(n = 4) {
  const D = store.doc("dias").d, linhas = [];
  for (let w = 0; w < n; w++) {
    let q = 0, ac = 0, seg = 0;
    for (let i = 0; i < 7; i++) { const d = D[somaDias(hoje(), -(w * 7 + i))]; if (d) { q += d.q || 0; ac += d.ac || 0; seg += d.seg || 0; } }
    linhas.push([w === 0 ? "Últimos 7 dias" : `${w * 7 + 1}–${w * 7 + 7} dias atrás`, q, q ? pct(ac, q) + "%" : "—", horas(seg)]);
  }
  return tabela([{ t: "Semana" }, { t: "Questões", num: 1 }, { t: "Acerto", num: 1 }, { t: "Tempo", num: 1 }], linhas);
}

function acharItem(g, iid) { for (const p of g.periodos || []) { const it = (p.itens || []).find(x => x.id === iid); if (it) return { p, it }; } return {}; }

function interpretarTexto(txt) {

      const mt = resto.match(/((?:[\s;,|]+\d{1,4}){1,6})\s*$/);

}

      <h2 class="sec">Por período</h2>${tabela([{ t: "Período" }, { t: nA }, { t: nB }], Array.from({ length: maxP + 1 }, (_, n) => n).filter(n => (A.periodos || []).some(p => p.numero === n) || (B.periodos || []).some(p => p.numero === n)).map(n => [n ? n + "º" : "Optativas", lista(A, n), lista(B, n)]), { resp: false })}
      <h2 class="sec">Temas em comum e ordem de ensino</h2>${comuns.length ? tabela([{ t: "Tema" }, { t: `Período em ${nA}` }, { t: `Período em ${nB}` }, { t: "Diferença" }], comuns.map(t => { const pa = Math.min(...ta[t].map(o => o.periodo)), pb = Math.min(...tb[t].map(o => o.periodo)); return [linkTema(t), `${onde(ta, t)} <span class="small muted">${ta[t].map(o => esc(o.item.nome)).join(", ")}</span>`, `${onde(tb, t)} <span class="small muted">${tb[t].map(o => esc(o.item.nome)).join(", ")}</span>`, pa === pb ? "mesmo período" : `${Math.abs(pa - pb)} período(s) ${pa < pb ? "antes em " + nA : "antes em " + nB}`]; })) : vazio("Nenhum tema vinculado em comum. Vincule temas às disciplinas das duas matrizes para comparar conteúdo.")}
      <div class="grid g2"><section><h2 class="sec">Só em ${esc(nA)}</h2>${soA.length ? `<div class="chips">${soA.map(t => `<a class="chip" href="#/tema/${encodeURIComponent(t)}">${esc(nomeTema(t))}</a>`).join("")}</div>` : `<p class="muted">—</p>`}</section>
      <section><h2 class="sec">Só em ${esc(nB)}</h2>${soB.length ? `<div class="chips">${soB.map(t => `<a class="chip" href="#/tema/${encodeURIComponent(t)}">${esc(nomeTema(t))}</a>`).join("")}</div>` : `<p class="muted">—</p>`}</section></div>

  return res.sort((a, b) => b.minha - a.minha || a.periodo - b.periodo);
}

  const e = ESPECIALIDADES[t.especialidades?.[0]];

}

/** Mapa do tema montado só com dados do app: subtemas (com desempenho), objetivos, grade, especialidades, materiais e temas relacionados. */
function mapaDoTema(id) {
  const t = TEMAS[id], med = t.dominio === "medicina", enc = encodeURIComponent(id);
  const qs = questoes().filter(q => q.tema === id), cs = cards().filter(c => c.tema === id), casos = todosCasos().filter(c => c.temaId === id);
  const nota = store.doc("notas").temas[id]?.texto, mats = Object.values(store.doc("materiais").itens).filter(m => m.tema === id);
  const subs = (t.subtemas || []).map(s => { const a = agregados(q => q.tema === id && q.subtema === s.id), n = qs.filter(q => q.subtema === s.id).length;
    return { t: s.nome, sub: n ? `${n} q.${a.n ? " · " + pct(a.ac, a.n) + "%" : ""}` : "", cls: clsDesempenho(a) }; });
  const rel = med ? Object.values(TEMAS).filter(x => x.id !== id && x.dominio === "medicina").map(x => ({ x, s: (x.especialidades || []).filter(e => (t.especialidades || []).includes(e)).length * 2 + (x.disciplinas || []).filter(d => (t.disciplinas || []).includes(d)).length }))
    .filter(o => o.s >= 3).sort((a, b) => b.s - a.s).slice(0, 6).map(o => ({ t: o.x.nome, href: "#/tema/" + encodeURIComponent(o.x.id) }))
    : Object.values(TEMAS).filter(x => x.id !== id && x.disciplinaId === t.disciplinaId).slice(0, 6).map(x => ({ t: x.nome, href: "#/tema/" + encodeURIComponent(x.id) }));
  const onde = med ? ondeNaGrade(id) : [];
  const d = desempenhoTema(id);
  return { t: t.nome, sub: d.n ? `${pct(d.ac, d.n)}% em ${d.n} resp.` : "", filhos: [
    subs.length && { t: "Subtemas", filhos: subs },
    (t.objetivos || []).length && { t: "Objetivos", filhos: t.objetivos.map(o => ({ t: o })) },
    onde.length && { t: "Na grade", filhos: onde.map(o => ({ t: `${nomeInst(o.g.instituicao)} · ${o.periodo}º · ${o.item.nome}`, href: `#/medicina/grade/${o.g.id}/item/${o.item.id}` })) },
    med && (t.especialidades || []).length && { t: "Especialidades", filhos: t.especialidades.map(e => ({ t: ESPECIALIDADES[e]?.nome || e, href: "#/medicina/esp/" + e })) },
    (t.disciplinas || []).length && { t: "Disciplinas relacionadas", filhos: t.disciplinas.map(x => ({ t: x })) },
    { t: "Estudar", filhos: [
      { t: "Questões", sub: String(qs.length), href: `#/tema/${enc}/questoes`, cls: clsDesempenho(d) },
      { t: "Flashcards", sub: String(cs.length), href: `#/tema/${enc}/flashcards` },
      med && { t: "Casos clínicos", sub: String(casos.length), href: `#/tema/${enc}/casos`, filhos: casos.map(c => ({ t: c.titulo, href: "#/casos/" + c.id })) },
      nota && { t: "Minhas anotações", href: `#/tema/${enc}/notas` },
      mats.length && { t: "Materiais", sub: String(mats.length), href: `#/tema/${enc}/materiais` },
    ] },
    rel.length && { t: "Temas relacionados", filhos: rel },
  ] };
}

/* ============================================================
   14-questoes — banco de questões (filtros completos), página da questão
   com histórico de tentativas, e caderno de erros.

const FQ = { trilha: "", inst: "", periodo: "", disc: "", esp: "", tema: "", subtema: "", dif: "", fonte: "", ano: "", prova: "", status: [], texto: "" };
const STATUS_Q = [["nao", "Não respondida"], ["correta", "Correta"], ["incorreta", "Incorreta"], ["marcada", "Marcada"], ["revisar", "Revisar"]];

/** Temas presentes nas matrizes de uma instituição (opcionalmente só de um período). */
function temasDaInstituicao(instId, periodo) {
  const s = new Set();
  gradesDe(instId).forEach(g => itensGrade(g).filter(it => !periodo || String(it.periodo) === String(periodo)).forEach(it => temasDoItem(it).forEach(t => s.add(t))));
  return s;
}
function filtrarQuestoes(F) {
  const temasInst = F.inst ? temasDaInstituicao(F.inst, F.periodo) : null, txt = norm(F.texto);
  return questoes().filter(q => {
    if (F.trilha && (F.trilha === "med" ? TRILHAS[q.t]?.dominio !== "medicina" : q.t !== F.trilha)) return false;
    if (temasInst && !temasInst.has(q.tema)) return false;
    if (F.disc && q.disc !== F.disc) return false;
    if (F.esp && q.esp !== F.esp && !(TEMAS[q.tema]?.especialidades || []).includes(F.esp)) return false;
    if (F.tema && q.tema !== F.tema) return false;
    if (F.subtema && q.subtema !== F.subtema) return false;
    if (F.dif && String(q.dif) !== F.dif) return false;
    if (F.fonte && q.fonte !== F.fonte && q.src !== F.fonte) return false;
    if (F.ano && String(q.ano) !== F.ano) return false;
    if (F.prova && q.prova !== F.prova) return false;
    if (F.status?.length) { const s = statusQ(q); if (!F.status.some(k => k === s.chave || (k === "marcada" && s.marcada) || (k === "revisar" && s.revisar))) return false; }
    if (txt && !norm(q.q + " " + q.o.join(" ")).includes(txt)) return false;
    return true;
  });
}
function formFiltros(F, prefixo = "fq") {
  const base = questoes().filter(q => !F.trilha || (F.trilha === "med" ? TRILHAS[q.t]?.dominio === "medicina" : q.t === F.trilha));
  const discs = ordenarPt(unicos(base.map(q => q.disc))), temasL = ordenarPt(unicos(base.map(q => q.tema)).filter(t => TEMAS[t]), nomeTema);
  const espL = ordenarPt(unicos(base.flatMap(q => [q.esp, ...(TEMAS[q.tema]?.especialidades || [])])).filter(e => ESPECIALIDADES[e]), e => ESPECIALIDADES[e].nome);
  const anos = unicos(base.map(q => q.ano)).sort(), provas = unicos(base.map(q => q.prova)), fontes = unicos(base.map(q => q.fonte || q.src));
  const sel = (c, lab, itens, vazioTxt = "Todas") => `<label class="campo"><span class="lab">${lab}</span><select data-chg="${prefixo}" data-c="${c}">${opcoes(itens, F[c], vazioTxt)}</select></label>`;
  return `<div class="campos">
    ${sel("trilha", "Trilha", [["med", "Medicina (graduação + residência)"], ...Object.entries(TRILHAS).map(([k, v]) => [k, v.nome])])}
    ${sel("inst", "Instituição (via grade)", instituicoes().map(i => [i.id, i.sigla]))}
    ${sel("periodo", "Período", Array.from({ length: 12 }, (_, i) => [i + 1, i + 1 + "º"]), "Todos")}
    ${sel("disc", "Disciplina", discs.map(d => [d, d]))}
    ${sel("esp", "Especialidade", espL.map(e => [e, ESPECIALIDADES[e].nome]))}
    ${sel("tema", "Tema", temasL.map(t => [t, nomeTema(t)]), "Todos")}
    ${F.tema ? sel("subtema", "Subtema", (TEMAS[F.tema]?.subtemas || []).map(s => [s.id, s.nome]), "Todos") : ""}
    ${sel("dif", "Dificuldade", Object.entries(DIFICULDADE))}
    ${sel("fonte", "Fonte", fontes.map(f => [f, { autoral: "Autoral (banco do app)", ia: "Gerada por IA", minha: "Minhas" }[f] || f]))}
    ${anos.length ? sel("ano", "Ano", anos.map(a => [a, a]), "Todos") : ""}${provas.length ? sel("prova", "Prova", provas.map(p => [p, p])) : ""}
    <label class="campo"><span class="lab">Texto</span><input type="search" value="${esc(F.texto)}" data-inp="${prefixo}-txt" placeholder="Palavra no enunciado"></label></div>
    <div style="margin-top:10px"><span class="lab">Status</span><div class="chips">${STATUS_Q.map(([k, t]) => `<button class="chip" data-act="${prefixo}-st" data-v="${k}" aria-pressed="${F.status.includes(k)}">${t}</button>`).join("")}</div></div>
    ${F.inst && !temasDaInstituicao(F.inst).size ? `<p class="aviso" style="margin-top:10px">A instituição escolhida não tem matriz importada com temas vinculados (${PENDENTE}). Nenhuma questão pode ser associada a ela ainda.</p>` : ""}`;
}

const FC = { chave: null, fila: [], i: 0, mostrar: false, feitos: [] };

/** Seleção de questões para revisar um tema: erradas e não vistas primeiro, depois as mais antigas. */
function questoesParaRevisao(temaId, n = 10) {
  const qs = questoes().filter(q => q.tema === temaId);
  const peso = q => { const s = statusQ(q), p = progDe(q); return s.chave === "incorreta" ? 0 : s.chave === "nao" ? 1 : 2 + (p?.h?.at(-1)?.[0] || 0) / 1e13; };
  return qs.sort((a, b) => peso(a) - peso(b)).slice(0, n).map(q => q.id);
}
rota("/revisoes/tema/:id", ({ id }) => {
  const t = TEMAS[id]; if (!t) return paginaNaoEncontrada();
  const chave = "rev:" + id, srs = store.doc("revisoes").temas[id], ids = questoesParaRevisao(id);
  let corpo;
  if (playerAtivo(chave)) corpo = htmlPlayer();
  else corpo = `<section class="caixa"><h2 class="sec">1. Releia os pontos-chave</h2>${t.resumo ? `<p class="leitura">${esc(t.resumo)}</p>` : ""}${t.objetivos?.length ? `<ul>${t.objetivos.map(o => `<li>${esc(o)}</li>`).join("")}</ul>` : ""}${store.doc("notas").temas[id]?.texto ? `<details><summary>Suas anotações</summary><p class="leitura">${esc(store.doc("notas").temas[id].texto)}</p></details>` : ""}</section>
    <section class="caixa"><h2 class="sec">2. Teste-se</h2>${ids.length ? `<p>${ids.length} questões (erradas e não vistas primeiro). O resultado define a próxima revisão.</p><button class="btn" data-act="rev-iniciar" data-t="${esc(id)}">Começar</button>`
      : `<p>Sem questões deste tema. Avalie sua lembrança:</p><div class="notas">${[[0, "Não lembrei"], [1, "Com dificuldade"], [2, "Lembrei bem"], [3, "Fácil"]].map(([n, r]) => `<button class="btn ${n === 2 ? "azul" : "sec"}" data-act="rev-auto" data-t="${esc(id)}" data-n="${n}">${r}<small>${previaIntervalo(srs, n)} d</small></button>`).join("")}</div>`}</section>`;
  return { secao: "revisoes", crumbs: [["Revisões", "#/revisoes"]], titulo: "Revisar: " + t.nome, sub: srs ? `Etapa ${srs.etapa + 1} · agendada para ${dataBR(srs.prox)}` : "Primeira revisão", html: corpo, ctx: { tema: id } };

/* ---------- Erros em lote, agrupados por tema ---------- */
function lotesDeErros() {
  const abertos = Object.values(store.doc("erros").itens).filter(e => e.status === "aberto" && qPorId(e.qid));
  return Object.entries(porChave(abertos, e => e.tema || "_sem")).map(([tema, es]) => ({ tema, abertos: es, vencidos: es.filter(e => vencido(e.srs)) }))
    .sort((a, b) => b.vencidos.length - a.vencidos.length || b.abertos.length - a.abertos.length);
}

  const lotes = lotesDeErros(), venc = lotes.reduce((s, l) => s + l.vencidos.length, 0);
  return { secao: "revisoes", crumbs: [["Revisões", "#/revisoes"]], titulo: "Refazer erros por tema", sub: "Refazer os erros de um mesmo tema juntos ajuda a fechar a lacuna de conteúdo, não só a questão.",
    acoes: venc ? `<a class="btn" href="#/revisoes/erros/todos">Refazer todos os vencidos (${venc})</a>` : "",
    html: lotes.length ? tabela([{ t: "Tema" }, { t: "Vencidos", num: 1 }, { t: "Abertos", num: 1 }, { t: "Motivo mais comum" }, { t: "" }], lotes.map(l => {

      : vazio("Nenhum erro aberto. Quando você errar questões, elas aparecem aqui agrupadas por tema.", `<a class="btn sec" href="#/erros">Caderno de erros</a>`) };
});
rota("/revisoes/erros/:tema", ({ tema }) => {
  const chave = "erros:" + tema;

/* ============================================================
   18-simulados — formato de prova (pesos por área) ou personalizado
   (disciplina, tema, faculdade/período, dificuldade, erradas, não respondidas).
   ============================================================ */
// min = minutos por questão na prova real; pesos = participação aproximada de cada grupo.
const FORMATO = {
  enem: { min: 3, real: "180 questões em 2 dias", grupos: { "Linguagens": ["Português", "Literatura", "Inglês", "Espanhol", "Artes", "Educação Física", "Redação"], "Humanas": ["História", "Geografia", "Filosofia", "Sociologia"], "Natureza": ["Biologia", "Química", "Física"], "Matemática": ["Matemática"] }, pesos: { "Linguagens": 1, "Humanas": 1, "Natureza": 1, "Matemática": 1 } },
  medicina: { min: 2.5, real: "provas de disciplina da graduação" },
  residencia: { min: 2.4, real: "≈100 questões em 4 h (5 grandes áreas)", pesos: { "Clínica Médica": 1, "Cirurgia": 1, "Pediatria": 1, "Ginecologia e Obstetrícia": 1, "Medicina Preventiva": 1 }, porArea: true },
  direito: { min: 2.5, real: "provas de disciplina da graduação" },
  oab: { min: 3.75, corte: .5, real: "80 questões em 5 h; aprova com 40 acertos", pesos: { "Ética": 8, "Constitucional": 6, "Civil": 7, "Processo Civil": 6, "Penal": 6, "Processo Penal": 6, "Trabalho": 5, "Processo do Trabalho": 5, "Administrativo": 5, "Tributário": 5, "Empresarial": 5, "Direitos Humanos": 3, "ECA": 2, "Consumidor": 2, "Ambiental": 2, "Filosofia do Direito": 2 } },
};
const TAMANHOS = [10, 20, 45, 80];
const chaveGrupo = (t, q) => { const f = FORMATO[t] || {}; const k = f.porArea ? q.a : q.disc || q.a; for (const [g, as] of Object.entries(f.grupos || {})) if (as.includes(k)) return g; return k; };
/** Distribui n questões entre os grupos pelo peso (maiores restos), preferindo não respondidas. */
function montarProporcional(t, pool, n) {
  const f = FORMATO[t] || {}, porG = porChave(pool, q => chaveGrupo(t, q));
  const ordem = f.pesos ? Object.keys(f.pesos) : [], gs = Object.keys(porG).sort((a, b) => ((ordem.indexOf(a) + 1) || 99) - ((ordem.indexOf(b) + 1) || 99) || a.localeCompare(b, "pt"));
  const w = g => f.pesos ? (f.pesos[g] || 1) : porG[g].length, W = gs.reduce((s, g) => s + w(g), 0); n = Math.min(n, pool.length);
  const cota = gs.map(g => { const x = n * w(g) / W; return { g, x, k: Math.min(Math.floor(x), porG[g].length) }; });
  let falta = n - cota.reduce((s, o) => s + o.k, 0);
  const porResto = cota.slice().sort((a, b) => (b.x % 1) - (a.x % 1));
  while (falta > 0) { let andou = false; for (const o of porResto) if (falta && o.k < porG[o.g].length) { o.k++; falta--; andou = true; } if (!andou) break; }
  const escolhe = g => { const qs = embaralhar(porG[g]); return qs.filter(q => !progDe(q)?.n).concat(qs.filter(q => progDe(q)?.n)); };
  return cota.flatMap(o => embaralhar(escolhe(o.g).slice(0, o.k)));
}

const FS = { trilha: "", inst: "", periodo: "", disc: "", esp: "", tema: "", subtema: "", dif: "", fonte: "", ano: "", prova: "", status: [], texto: "", erradasAntes: false };

rota("/busca/:q", ({ q }) => {
  const n = norm(q), tem = s => norm(s).includes(n);
  const temas = Object.values(TEMAS).filter(t => tem(t.nome) || (t.sinonimos || []).some(tem) || (t.subtemas || []).some(s => tem(s.nome)))
    .sort((a, b) => (norm(b.nome).startsWith(n) - norm(a.nome).startsWith(n)) || a.nome.localeCompare(b.nome, "pt"));
  const esps = Object.values(ESPECIALIDADES).filter(e => tem(e.nome));
  const itens = grades().flatMap(g => itensGrade(g).filter(it => tem(it.nome) || (it.unidades || []).some(u => tem(u.nome))).map(it => ({ g, it })));
  const discRef = unicos(Object.values(TEMAS).flatMap(t => t.disciplinas || []).filter(tem));
  const qs = questoes().filter(x => tem(x.q) || tem(x.o.join(" ")));
  const cs = cards().filter(c => tem(c.frente) || tem(c.verso));
  const casos = todosCasos().filter(c => tem(c.titulo) || tem(c.tema || "") || tem(c.hda || ""));
  const notas = Object.entries(store.doc("notas").temas).filter(([, v]) => tem(v.texto || ""));
  const mats = Object.values(store.doc("materiais").itens).filter(m => tem(m.titulo) || tem(m.texto || ""));
  const reps = (REDACAO.repertorios || []).filter(r => tem(r.titulo) || tem(r.ideia));
  const total = temas.length + esps.length + itens.length + qs.length + cs.length + casos.length + notas.length + mats.length + reps.length + discRef.length;
  const sec = (titulo, n, html) => n ? `<section><h2 class="sec">${titulo} <span class="small muted">${n}</span></h2>${html}</section>` : "";
  return {
    secao: "", titulo: `Busca: “${q}”`, sub: `${total} resultado(s)`,
    html: total ? [
      sec("Temas", temas.length, tabela([{ t: "Tema" }, { t: "Especialidade / área" }, { t: "Disciplinas relacionadas" }, { t: "Questões", num: 1 }], temas.slice(0, 30).map(t => [linkTema(t.id), esc(t.dominio === "enem" ? "ENEM · " + t.areaNome : (t.especialidades || []).map(e => ESPECIALIDADES[e]?.nome).filter(Boolean).join(", ")), `<span class="small">${(t.disciplinas || []).map(esc).join(", ")}</span>`, questoes().filter(x => x.tema === t.id).length]))),
      sec("Especialidades", esps.length, `<div class="chips">${esps.map(e => `<a class="chip" href="#/medicina/esp/${esc(e.id)}">${esc(e.nome)}</a>`).join("")}</div>`),
      sec("Nas matrizes das faculdades", itens.length, tabela([{ t: "Disciplina/módulo" }, { t: "Instituição" }, { t: "Período", num: 1 }], itens.slice(0, 30).map(({ g, it }) => [`<a href="#/medicina/grade/${esc(g.id)}/item/${esc(it.id)}">${esc(it.nome)}</a>`, esc(nomeInst(g.instituicao)), it.periodo + "º"]))),
      sec("Disciplinas de referência", discRef.length, `<p class="small">${discRef.map(d => `<a href="#/questoes" data-act="busca-disc" data-v="${esc(d)}">${esc(d)}</a>`).join(" · ")}</p>`),
      sec("Questões", qs.length, listaQuestoes(qs, 20)),
      sec("Flashcards", cs.length, tabelaCards(cs.slice(0, 20))),
      sec("Casos clínicos", casos.length, tabelaCasos(casos)),
      sec("Suas anotações", notas.length, tabela([{ t: "Tema" }, { t: "Trecho" }], notas.map(([t, v]) => { const i = norm(v.texto).indexOf(n); return [linkTema(t), `<span class="small">…${esc(v.texto.slice(Math.max(0, i - 60), i + 90))}…</span>`]; }))),
      sec("Materiais", mats.length, listaMateriais(mats)),
      sec("Repertórios de redação", reps.length, tabela([{ t: "Repertório" }, { t: "Ideia" }], reps.map(r => [esc(r.titulo), esc(r.ideia)]))),
    ].join("") : vazio(`Nada encontrado para “${esc(q)}”. Tente um termo mais curto ou um sinônimo (ex.: “IC” ou “insuficiência”).`),
  };
});
ACOES["busca-disc"] = el => { Object.assign(FQ, { trilha: "", disc: el.dataset.v, tema: "", subtema: "", status: [] }); ir("#/questoes"); };

/* ---- 24-backup.js ---- */
/* ============================================================
   24-backup — backup automático semanal.
   Na conta: cada semana grava um arquivo JSON no armazenamento do app (assets)
   e registra no documento "backups". Sem conta: guarda a última cópia no navegador
   e lembra de baixar. Arquivos antigos só são apagados por ação do usuário.
   ============================================================ */
const SEMANA = 7 * DIA, LS_BACKUP = "gab2:backup-auto";
const temDados = () => Object.keys(TRILHAS).some(t => Object.keys(store.doc(docProg(t)).q).length) || cards().length || Object.keys(store.doc("grades").itens).length || Object.keys(store.doc("notas").temas).length;
const backups = () => (store.doc("backups").itens || []).slice().sort((a, b) => b.ts - a.ts);
let _backupRodando = false;
async function fazerBackup(motivo = "semanal") {
  if (_backupRodando) return null; _backupRodando = true;
  try {
    const json = JSON.stringify(store.exportar());
    let reg = { ts: Date.now(), bytes: json.length, motivo, onde: "navegador" };
    if (ASSETS) { try { const r = await ASSETS.upload(new Blob([json], { type: "application/json" })); reg = { ...reg, id: r.id, onde: "conta" }; } catch (e) { reg.falhaConta = e?.code || "erro"; } }
    if (reg.onde === "navegador") { try { localStorage.setItem(LS_BACKUP, json); } catch (e) { return null; } }
    const B = store.doc("backups"); B.itens = (B.itens || []).filter(x => x.onde === "conta").concat([reg]).slice(-60); store.mudou("backups");
    const P = store.doc("perfil"); P.ultimoBackup = reg.ts; store.mudou("perfil");
    return reg;
  } finally { _backupRodando = false; }
}
/** Chamado na abertura do app: faz o backup se a última cópia tiver mais de 7 dias. */
async function backupAutomatico() {
  const P = store.doc("perfil");
  if (P.backupAuto === false || !temDados() || Date.now() - (P.ultimoBackup || 0) < SEMANA) return;
  const r = await fazerBackup("semanal"); if (r) { toast("Backup semanal feito"); if (/biblioteca\/dados/.test(caminhoAtual())) atualizar(); }
}
async function textoDoBackup(reg) {
  if (reg.id) { const r = await fetch("/_blob/" + reg.id); if (!r.ok) throw new Error("arquivo indisponível"); return r.text(); }
  const t = localStorage.getItem(LS_BACKUP); if (!t) throw new Error("cópia local não encontrada"); return t;
}
function blocoBackups() {
  const P = store.doc("perfil"), lista = backups(), prox = P.ultimoBackup ? diaISO(new Date(P.ultimoBackup + SEMANA)) : null;
  return `<section class="caixa"><h2 class="sec">Backup automático semanal</h2>
    <label class="check"><input type="checkbox" data-chg="bk-auto" ${P.backupAuto === false ? "" : "checked"}><span>Ligado — ${ASSETS ? "uma cópia por semana guardada junto com o app, na sua conta" : "uma cópia por semana neste navegador (baixe um backup para ter uma cópia fora dele)"}</span></label>
    <p class="small muted">Último: ${P.ultimoBackup ? new Date(P.ultimoBackup).toLocaleString("pt-BR") : "nunca"}${prox && P.backupAuto !== false ? ` · próximo a partir de ${dataBR(prox)}` : ""}</p>
    <div class="linha"><button class="btn sec" data-act="bk-agora">Fazer backup agora</button>${lista.filter(b => b.onde === "conta").length > 4 && ASSETS ? `<button class="btn sec" data-act="bk-limpar">Apagar antigos (manter 4)</button>` : ""}</div>
    ${lista.length ? tabela([{ t: "Data" }, { t: "Tamanho", num: 1 }, { t: "Onde" }, { t: "" }], lista.slice(0, 12).map(b => [new Date(b.ts).toLocaleString("pt-BR") + (b.motivo !== "semanal" ? ` <span class="small muted">(${esc(b.motivo)})</span>` : ""), Math.max(1, Math.round(b.bytes / 1024)) + " KB", b.onde === "conta" ? "conta" : "este navegador",
      `<span class="linha" style="flex-wrap:nowrap"><button class="btn mini sec" data-act="bk-restaurar" data-ts="${b.ts}">Restaurar</button>${DOWNLOADS ? `<button class="btn mini sec" data-act="bk-baixar-um" data-ts="${b.ts}">Baixar</button>` : ""}</span>`]), { resp: true }) : ""}</section>`;
}
MUDANCAS["bk-auto"] = el => { const P = store.doc("perfil"); P.backupAuto = el.checked; store.mudou("perfil"); atualizar(); };
ACOES["bk-agora"] = async el => { el.disabled = true; const r = await fazerBackup("manual"); toast(r ? "Backup feito" : "Não foi possível fazer o backup"); atualizar(); };
const regPorTs = ts => backups().find(b => String(b.ts) === String(ts));
ACOES["bk-restaurar"] = el => { const b = regPorTs(el.dataset.ts); abrirFolha(`<h2 class="sec">Restaurar backup de ${new Date(b.ts).toLocaleString("pt-BR")}?</h2><p>Seus dados atuais serão substituídos pelos do backup. Antes disso, o app guarda uma cópia do estado atual (aparece na lista como "antes de restaurar").</p><button class="btn perigo" data-act="bk-restaurar-ok" data-ts="${b.ts}">Restaurar</button>`); };
ACOES["bk-restaurar-ok"] = async el => {
  const b = regPorTs(el.dataset.ts); el.disabled = true;
  try { const txt = await textoDoBackup(b); await fazerBackup("antes de restaurar"); store.importar(JSON.parse(txt)); invalidarQuestoes(); fecharFolha(); toast("Backup restaurado"); ir("#/"); }
  catch (e) { el.disabled = false; toast("Não foi possível restaurar: " + (e.message || "erro")); }
};
ACOES["bk-baixar-um"] = async el => { const b = regPorTs(el.dataset.ts);
  try { await DOWNLOADS.save({ filename: `gabarito-am-backup-${diaISO(new Date(b.ts))}.json`, data: await textoDoBackup(b) }); const P = store.doc("perfil"); P.ultimoDownload = Date.now(); store.mudou("perfil"); }
  catch (e) { if (!["cancelled", "declined"].includes(e?.code)) toast("Não foi possível baixar"); } };
ACOES["bk-limpar"] = async el => {
  el.disabled = true; const B = store.doc("backups"), conta = backups().filter(b => b.onde === "conta"), apagar = conta.slice(4);
  for (const b of apagar) { try { await ASSETS.delete(b.id); } catch (e) { } }
  B.itens = B.itens.filter(x => !apagar.includes(x)); store.mudou("backups"); toast(`${apagar.length} backups antigos apagados`); atualizar();
};
/** Aviso no Início quando os dados só existem neste navegador e não há download recente. */
function avisoBackup() {
  const P = store.doc("perfil");
  if (store.naConta || !temDados() || Date.now() - (P.ultimoDownload || P.migradoEm || 0) < 2 * SEMANA) return "";
  return `<div class="aviso">Seus dados estão só neste navegador. <a href="#/biblioteca/dados">Baixe ou copie um backup</a> para não perdê-los.</div>`;
}

/* ---- 99-main.js ---- */
/* ============================================================
   99-main — inicialização: dados locais primeiro (tela imediata),
   depois conta, assistente e arquivos; contagem do tempo de estudo.
   ============================================================ */
(function iniciar() {
  // Lista global de temas para os campos com autocompletar
  const dl = document.createElement("datalist"); dl.id = "dl-temas";
  dl.innerHTML = ordenarPt(Object.values(TEMAS), t => t.nome).map(t => `<option value="${esc(t.nome)}">${esc(t.dominio === "enem" ? "ENEM · " + (ENEM_DISC[t.disciplinaId]?.nome || "") : (t.especialidades || []).map(e => ESPECIALIDADES[e]?.nome).filter(Boolean).join(", "))}</option>`).join("");
  document.body.appendChild(dl);

  store.aoRemoto(() => { invalidarQuestoes(); render(); });
  const conta = store.conectar().then(() => { invalidarQuestoes(); render(); });
  render();
  IA.iniciar();
  const arquivos = iniciarArquivos().then(() => { if (/biblioteca/.test(caminhoAtual())) render(); });
  // Backup semanal: só depois de carregar a conta e o armazenamento de arquivos
  Promise.all([conta, arquivos]).then(() => setTimeout(backupAutomatico, 4000));

  // Tempo de estudo: conta blocos de 15 s com a página visível e interação nos últimos 3 min.
  let ultimaAcao = Date.now(), acumulado = 0;
  ["click", "keydown", "scroll", "touchstart", "input"].forEach(ev => document.addEventListener(ev, () => { ultimaAcao = Date.now(); }, { passive: true }));
  setInterval(() => {
    if (document.visibilityState !== "visible" || Date.now() - ultimaAcao > 180000 || /biblioteca\/dados/.test(caminhoAtual())) return;
    acumulado += 15;
    if (acumulado >= 60) { registrarTempo(acumulado); acumulado = 0; }
  }, 15000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && acumulado) { registrarTempo(acumulado); acumulado = 0; } });
})();

</script>
