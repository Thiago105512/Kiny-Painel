const QUESTOES_BASE = BANCO.map((q,i)=>({id:"b"+i,t:q[0],a:q[1],q:q[2],o:q[3],c:q[4],e:q[5],src:"banco"}));

/* ---------- Estado e persistência ---------- */
let estado = {r:{}, g:{}, dias:{}};   // r: qid -> [acertos, erros, ultimaOk(0/1), ts]; g: item estudado; dias: AAAA-MM-DD -> respondidas
let extras = [];                        // questões próprias / geradas por IA
let db=null, uid=null, sample=null, docEstado=null;
const LS="gabarito-am-v1";

function lsLer(){try{const v=JSON.parse(localStorage.getItem(LS)||"null");if(v){estado=Object.assign(estado,v.estado||{});extras=v.extras||[];}}catch(e){}}
function lsGravar(){try{localStorage.setItem(LS,JSON.stringify({estado,extras}))}catch(e){}}

let timer=null, gravando=false, pendente=false;
function salvar(){ lsGravar(); if(!docEstado) return; clearTimeout(timer); timer=setTimeout(flush,1200); setSync("salvando…"); }
async function flush(){
  if(gravando){pendente=true;return}
  gravando=true;
  try{ await docEstado.set(JSON.parse(JSON.stringify(estado))); setSync("salvo na sua conta"); }
  catch(e){ setSync("não salvou na conta — guardado neste aparelho"); }
  gravando=false; if(pendente){pendente=false;flush()}
}
function setSync(t){document.getElementById("sync").textContent=t}

async function conectar(){
  const use = window.claude && window.claude.use;
  if(!use) return;
  try{
    const [u,d,s] = await Promise.all([use("user"),use("db"),use("sample")]);
    sample = s;
    if(u && d){ uid = await u.id(); if(uid){ db=d; } }
    if(db){
      docEstado = db.doc("data/users/"+uid+"/estado");
      const snap = await docEstado.get();
      if(snap.exists){ const v=snap.data(); estado={r:{...(v.r||{})},g:{...(v.g||{})},dias:{...(v.dias||{})}}; }
      else if(Object.keys(estado.r).length||Object.keys(estado.g).length){ flush(); }
      const col = docEstado.collection("questoes");
      const qs = await col.get();
      const remotas = qs.docs.map(x=>({...x.data(),id:x.id}));
      // envia para a conta as questões que só existiam neste aparelho
      const ids = new Set(remotas.map(x=>x.id));
      for(const x of extras){ if(!ids.has(x.id)){ const {id,...corpo}=x; try{await col.doc(id).set(corpo);remotas.push(x)}catch(e){} } }
      extras = remotas; lsGravar();
      setSync("salvo na sua conta");
    }
  }catch(e){ setSync("salvando neste aparelho"); }
  render();
}
async function gravarExtra(x){ extras.push(x); lsGravar(); if(docEstado){ const {id,...corpo}=x; try{await docEstado.collection("questoes").doc(id).set(corpo)}catch(e){} } }
async function apagarExtra(id){ extras=extras.filter(x=>x.id!==id); lsGravar(); if(docEstado){ try{await docEstado.collection("questoes").doc(id).delete()}catch(e){} } }

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LETRAS="ABCDE";
const hoje=()=>new Date().toISOString().slice(0,10);
const novoId=()=>"q"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const todas=()=>QUESTOES_BASE.concat(extras);
function areasDe(t){return [...new Set(todas().filter(q=>q.t===t).map(q=>q.a))].sort((a,b)=>a.localeCompare(b,"pt"))}
function lembrar(k,v){try{v===undefined?0:localStorage.setItem("gab-ui-"+k,v);return localStorage.getItem("gab-ui-"+k)}catch(e){return null}}

/* ---------- Praticar ---------- */
const P = {t: lembrar("t")||"enem", a:"", modo:"novas", q:null, esc:null, resp:false, ia:"", iaMsg:"", gerando:false};

function sortear(){
  const pool = todas().filter(q=>q.t===P.t && (!P.a||q.a===P.a));
  let cand = pool;
  if(P.modo==="erros") cand = pool.filter(q=>estado.r[q.id] && estado.r[q.id][2]===0);
  else if(P.modo==="novas"){ const n=pool.filter(q=>!estado.r[q.id]); cand = n.length?n:pool; }
  if(P.q && cand.length>1) cand = cand.filter(q=>q.id!==P.q.id);
  P.q = cand.length ? cand[Math.floor(Math.random()*cand.length)] : null;
  P.esc=null; P.resp=false; P.ia=""; P.iaMsg="";
  // embaralha as alternativas a cada exibição (P.esc guarda o índice original)
  P.ordem=[0,1,2,3,4].sort(()=>Math.random()-.5);
}
const letraDe=i=>LETRAS[P.ordem.indexOf(i)];

function responder(){
  if(P.esc===null||P.resp) return;
  P.resp=true;
  const ok = P.esc===P.q.c;
  const r = estado.r[P.q.id] || [0,0,0,0];
  estado.r[P.q.id] = [r[0]+(ok?1:0), r[1]+(ok?0:1), ok?1:0, Date.now()];
  estado.dias[hoje()] = (estado.dias[hoje()]||0)+1;
  salvar(); render();
}

async function explicarIA(){
  if(!sample) return;
  const q=P.q; P.ia="Pensando…"; P.iaMsg=""; render();
  const prompt = `Você é professor de cursinho no Brasil. Explique de forma didática e curta (até 180 palavras), em português, por que a alternativa correta está certa e por que cada errada está errada. Cite a base (lei, artigo, conceito) quando houver. Sem markdown pesado.\n\nQuestão (${TRILHAS[q.t].nome} – ${q.a}): ${q.q}\n${P.ordem.map((j,k)=>LETRAS[k]+") "+q.o[j]).join("\n")}\nGabarito: ${letraDe(q.c)}\nAluno marcou: ${letraDe(P.esc)}`;
  try{ await sample(prompt,{onText:({text})=>{P.ia=text;const el=$("#ia-txt");if(el)el.textContent=text}}); }
  catch(e){ P.ia=""; P.iaMsg = e.code==="not_granted"?"A explicação com IA não foi autorizada nesta visualização.":e.code==="rate_limited"?"Muitos pedidos seguidos. Tente de novo em alguns minutos.":"Não foi possível gerar a explicação agora."; }
  render();
}

async function gerarIA(){
  if(!sample||P.gerando) return;
  P.gerando=true; P.iaMsg=""; render();
  const area = P.a || areasDe(P.t).join(", ");
  const prompt = `Crie 5 questões de múltipla escolha INÉDITAS, nível ${P.t==="enem"?"ENEM/vestibulares (UFAM PSC, UEA SIS, FUVEST)":P.t==="residencia"?"prova de residência médica (ENARE, SUS-SP)":P.t==="oab"?"1ª fase do Exame da OAB":"graduação em "+TRILHAS[P.t].nome}, sobre: ${area}. Quando couber, use contexto do Amazonas. Cada questão com 5 alternativas, só uma correta, e explicação curta citando a base (lei/artigo/conceito). Evite temas cuja resposta dependa de norma alterada recentemente.\nResponda SOMENTE com JSON: [{"area":"...","enunciado":"...","alternativas":["","","","",""],"correta":0,"explicacao":"..."}] (correta = índice 0-4, varie a posição).`;
  try{
    const arr = await sample.json(prompt,{modelTier:"default"});
    let n=0;
    for(const x of (Array.isArray(arr)?arr:[])){
      if(!x||typeof x.enunciado!=="string"||!Array.isArray(x.alternativas)||x.alternativas.length!==5||!(x.correta>=0&&x.correta<5)) continue;
      await gravarExtra({id:novoId(),t:P.t,a:String(x.area||P.a||"Geral").slice(0,60),q:x.enunciado,o:x.alternativas.map(String),c:Number(x.correta),e:String(x.explicacao||""),src:"ia"});
      n++;
    }
    P.iaMsg = n ? `${n} questões novas adicionadas a ${TRILHAS[P.t].nome}. Elas aparecem em "Minhas questões".` : "A IA não devolveu questões válidas. Tente de novo.";
    if(n && P.modo==="novas") sortear();
  }catch(e){ P.iaMsg = e.code==="not_granted"?"A geração com IA não foi autorizada nesta visualização.":e.code==="rate_limited"?"Muitos pedidos seguidos. Tente de novo em alguns minutos.":"Não foi possível gerar questões agora."; }
  P.gerando=false; render();
}

function vPraticar(){
  if(!P.q || P.q.t!==P.t) sortear();
  const areas = areasDe(P.t);
  const q=P.q;
  let corpo;
  if(!q){
    corpo = `<div class="sheet"><p class="empty">${P.modo==="erros"?"Nenhum erro para revisar aqui. Boa!":"Nenhuma questão neste filtro."}</p></div>`;
  }else{
    const r=estado.r[q.id];
    corpo = `<article class="sheet">
      <div class="meta"><span>${esc(TRILHAS[q.t].nome)}</span><span>${esc(q.a)}</span>${q.src==="ia"?"<span>gerada por IA</span>":q.src==="minha"?"<span>minha</span>":""}${r?`<span>já respondida ${r[0]+r[1]}× · ${r[0]} acerto(s)</span>`:""}</div>
      <p class="q">${esc(q.q)}</p>
      <ol class="alts">${P.ordem.map((i,pos)=>{const o=q.o[i];
        let s=""; if(P.resp){ if(i===q.c) s="ok"; else if(i===P.esc) s="bad"; } else if(i===P.esc) s="sel";
        return `<li><button class="alt" data-i="${i}" data-s="${s}" ${P.resp?"disabled":""}><span class="bubble">${LETRAS[pos]}</span><span>${esc(o)}</span></button></li>`}).join("")}</ol>
      ${P.resp?`<div class="fb"><p class="verdict ${P.esc===q.c?"ok":"bad"}">${P.esc===q.c?"Certo":"Errado — gabarito "+letraDe(q.c)}</p><p class="exp">${esc(q.e||"Sem explicação cadastrada.")}</p>
        ${P.ia?`<p class="lab" style="margin-top:14px">Explicação da IA</p><p class="exp" id="ia-txt">${esc(P.ia)}</p>`:""}</div>`:""}
      <div class="actions">
        <div class="row">${P.resp?`<button class="btn" id="prox">Próxima</button>${sample?`<button class="btn ghost" id="explicar">Explicar melhor com IA</button>`:""}`:`<button class="btn" id="confirmar" ${P.esc===null?"disabled":""}>Confirmar</button><button class="btn ghost" id="pular">Pular</button>`}</div>
      </div>
    </article>`;
  }
  return `<div class="toolbar">
    <div><label class="lab">Trilha</label><div class="chips">${Object.entries(TRILHAS).map(([k,v])=>`<button class="chip" data-t="${k}" aria-pressed="${k===P.t}">${v.nome}</button>`).join("")}</div></div>
    <div class="row">
      <div><label class="lab" for="f-area">Área</label><select id="f-area"><option value="">Todas</option>${areas.map(a=>`<option ${a===P.a?"selected":""}>${esc(a)}</option>`).join("")}</select></div>
      <div><label class="lab" for="f-modo">Modo</label><select id="f-modo">
        <option value="novas" ${P.modo==="novas"?"selected":""}>Não respondidas primeiro</option>
        <option value="todas" ${P.modo==="todas"?"selected":""}>Aleatório</option>
        <option value="erros" ${P.modo==="erros"?"selected":""}>Revisar meus erros</option></select></div>
    </div>
  </div>
  ${corpo}
  ${sample?`<div class="actions"><button class="btn ghost" id="gerar" ${P.gerando?"disabled":""}>${P.gerando?"Gerando questões…":"Gerar 5 questões novas com IA"}</button></div>`:""}
  ${P.iaMsg?`<p class="note">${esc(P.iaMsg)}</p>`:""}
  <p class="note">Atalhos: teclas A–E escolhem, Enter confirma / avança.</p>`;
}

/* ---------- Grade ---------- */
const G = {t: lembrar("gt")||"enem"};
function chaveG(sec,sub,i){return sec+"|"+sub+"|"+i}
function progressoSec(sec){let tot=0,f=0;for(const [sub,it] of Object.entries(GRADE[sec]))it.forEach((_,i)=>{tot++;if(estado.g[chaveG(sec,sub,i)])f++});return [f,tot]}
function vGrade(){
  return `<div class="toolbar"><div class="chips">${Object.entries(TRILHAS).map(([k,v])=>`<button class="chip" data-gt="${k}" aria-pressed="${k===G.t}">${v.nome}</button>`).join("")}</div></div>
  ${TRILHAS[G.t].grade.map(sec=>{const [f,t]=progressoSec(sec);return `<section class="sec">
    <h2>${NOME_SEC[sec]} <span class="pct">${f}/${t} · ${t?Math.round(f/t*100):0}%</span></h2>
    <div class="meter" role="img" aria-label="${f} de ${t} itens estudados"><i style="width:${t?f/t*100:0}%"></i></div>
    ${Object.entries(GRADE[sec]).map(([sub,it])=>`<h3>${esc(sub)}</h3>${it.map((x,i)=>{const k=chaveG(sec,sub,i);return `<label class="check"><input type="checkbox" data-g="${esc(k)}" ${estado.g[k]?"checked":""}><span>${esc(x)}</span></label>`}).join("")}`).join("")}
  </section>`}).join("")}
  <p class="note">Resumo de referência. Editais e PPCs mudam: confira no site oficial de cada instituição.</p>`;
}

/* ---------- Desempenho ---------- */
function vDesempenho(){
  const qs=todas(); let ac=0,er=0,resp=0;
  const porArea={};
  for(const q of qs){const r=estado.r[q.id];if(!r)continue;resp++;ac+=r[0];er+=r[1];
    const k=TRILHAS[q.t].nome+" · "+q.a;(porArea[k]=porArea[k]||[0,0,q.t]);porArea[k][0]+=r[0];porArea[k][1]+=r[1];}
  let seq=0;{const d=new Date();for(;;){const k=d.toISOString().slice(0,10);if(estado.dias[k]){seq++;d.setDate(d.getDate()-1)}else if(seq===0&&k===hoje()){d.setDate(d.getDate()-1)}else break}}
  const linhas=Object.entries(porArea).map(([k,[a,e]])=>({k,a,e,p:a/(a+e)})).sort((x,y)=>x.p-y.p);
  const tot=ac+er;
  return `<div class="tiles">
    <div class="tile"><b>${tot?Math.round(ac/tot*100):0}%</b><span>acerto geral</span></div>
    <div class="tile"><b>${tot}</b><span>respostas dadas</span></div>
    <div class="tile"><b>${resp}/${qs.length}</b><span>questões vistas</span></div>
    <div class="tile"><b>${seq}</b><span>dia(s) seguidos · ${estado.dias[hoje()]||0} hoje</span></div>
  </div>
  <section class="sec"><h2>Por área <span class="pct">piores primeiro</span></h2>
  ${linhas.length?`<div class="bars">${linhas.map(l=>`<div class="bar"><span>${esc(l.k)}</span><small>${Math.round(l.p*100)}% · ${l.a}/${l.a+l.e}</small><div class="meter" role="img" aria-label="${Math.round(l.p*100)}% de acerto"><i style="width:${l.p*100}%"></i></div></div>`).join("")}</div>`:`<p class="empty">Responda algumas questões para ver seu desempenho por área.</p>`}
  </section>
  <section class="sec"><h2>Grade estudada</h2><div class="bars">${Object.keys(GRADE).map(sec=>{const [f,t]=progressoSec(sec);return `<div class="bar"><span>${NOME_SEC[sec]}</span><small>${f}/${t}</small><div class="meter"><i style="width:${t?f/t*100:0}%"></i></div></div>`}).join("")}</div></section>
  <section class="sec"><h2>Zerar progresso</h2>${M.zerar?`<div class="confirm">Apagar todas as respostas e marcações? Isso não tem volta. <button class="btn" id="zerar-sim">Apagar</button><button class="btn ghost" id="zerar-nao">Cancelar</button></div>`:`<button class="btn ghost" id="zerar">Zerar respostas e grade</button>`}</section>`;
}

/* ---------- Minhas questões ---------- */
const M = {msg:"", zerar:false, apagar:null, imp:""};
function vMinhas(){
  const minhas = extras.slice().reverse();
  return `<form class="sheet stack" id="form-q">
    <div class="grid2">
      <div><label class="lab" for="n-t">Trilha</label><select id="n-t">${Object.entries(TRILHAS).map(([k,v])=>`<option value="${k}" ${k===P.t?"selected":""}>${v.nome}</option>`).join("")}</select></div>
      <div><label class="lab" for="n-a">Área</label><input type="text" id="n-a" placeholder="ex.: Farmacologia" required></div>
    </div>
    <div><label class="lab" for="n-q">Enunciado</label><textarea id="n-q" rows="3" required></textarea></div>
    ${[0,1,2,3,4].map(i=>`<div class="row"><label class="check" style="padding:0"><input type="radio" name="n-c" value="${i}" ${i===0?"checked":""}><span>${LETRAS[i]}</span></label><input type="text" id="n-o${i}" required style="flex:1" placeholder="Alternativa ${LETRAS[i]} (marque a correta)"></div>`).join("")}
    <div><label class="lab" for="n-e">Explicação / fundamento</label><textarea id="n-e" rows="2"></textarea></div>
    <div class="row"><button class="btn" type="submit">Adicionar questão</button></div>
    ${M.msg?`<p class="note">${esc(M.msg)}</p>`:""}
  </form>
  <section class="sec" style="margin-top:22px"><h2>Salvas <span class="pct">${extras.length}</span></h2>
  ${minhas.length?`<div class="list">${minhas.map(x=>`<div class="item"><div><span class="tag">${esc(TRILHAS[x.t]?.nome||x.t)} · ${esc(x.a)} · ${x.src==="ia"?"IA":"minha"}</span><p>${esc(x.q.length>160?x.q.slice(0,160)+"…":x.q)}</p></div>
    ${M.apagar===x.id?`<div class="row"><button class="btn" data-del-ok="${x.id}">Apagar</button><button class="btn ghost" data-del-no>Não</button></div>`:`<button class="btn ghost" data-del="${x.id}">Apagar</button>`}</div>`).join("")}</div>`:`<p class="empty">Nenhuma questão sua ainda. Adicione acima ou gere com IA na aba Praticar.</p>`}
  </section>
  <section class="sec"><h2>Backup</h2>
    <p class="note" style="margin-top:0">Copie o backup para guardar ou levar a outro aparelho; cole aqui para restaurar.</p>
    <textarea id="imp" rows="4" placeholder='Cole aqui um backup ({"estado":…,"extras":[…]})'>${esc(M.imp)}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="copiar">Copiar backup</button><button class="btn ghost" id="importar">Restaurar do texto colado</button></div>
  </section>`;
}

/* ---------- Render e eventos ---------- */
let aba = (location.hash||"").slice(1) || lembrar("aba") || "praticar";
function render(){
  if(!["praticar","grade","desempenho","minhas"].includes(aba)) aba="praticar";
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===aba));
  $("#view").innerHTML = aba==="praticar"?vPraticar():aba==="grade"?vGrade():aba==="desempenho"?vDesempenho():vMinhas();
}

document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;aba=b.dataset.tab;lembrar("aba",aba);render();window.scrollTo(0,0)});

document.getElementById("view").addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.t){P.t=b.dataset.t;P.a="";lembrar("t",P.t);sortear();return render()}
  if(b.dataset.gt){G.t=b.dataset.gt;lembrar("gt",G.t);return render()}
  if(b.classList.contains("alt")&&!P.resp){P.esc=+b.dataset.i;return render()}
  if(b.id==="confirmar") return responder();
  if(b.id==="prox"||b.id==="pular"){sortear();render();return window.scrollTo(0,0)}
  if(b.id==="explicar") return explicarIA();
  if(b.id==="gerar") return gerarIA();
  if(b.id==="zerar"){M.zerar=true;return render()}
  if(b.id==="zerar-nao"){M.zerar=false;return render()}
  if(b.id==="zerar-sim"){estado={r:{},g:{},dias:{}};M.zerar=false;salvar();return render()}
  if(b.dataset.del){M.apagar=b.dataset.del;return render()}
  if(b.hasAttribute("data-del-no")){M.apagar=null;return render()}
  if(b.dataset.delOk){await apagarExtra(b.dataset.delOk);M.apagar=null;if(P.q&&P.q.id===b.dataset.delOk)P.q=null;return render()}
  if(b.id==="copiar"){const txt=JSON.stringify({estado,extras});const ta=$("#imp");
    try{await navigator.clipboard.writeText(txt);M.msg="";b.textContent="Copiado"}catch(err){ta.value=txt;ta.select();b.textContent="Selecionado — copie com Ctrl+C"}return}
  if(b.id==="importar"){try{const v=JSON.parse($("#imp").value);if(!v||typeof v!=="object")throw 0;
      if(v.estado){estado={r:{...(v.estado.r||{})},g:{...(v.estado.g||{})},dias:{...(v.estado.dias||{})}};salvar()}
      const ids=new Set(extras.map(x=>x.id));for(const x of (v.extras||[]))if(x&&x.id&&!ids.has(x.id)&&Array.isArray(x.o))await gravarExtra(x);
      M.imp="";M.msg="Backup restaurado.";}catch(err){M.imp=$("#imp").value;M.msg="Texto inválido: cole exatamente o conteúdo copiado pelo botão \"Copiar backup\"."}
    aba="minhas";return render()}
});

document.getElementById("view").addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="f-area"){P.a=el.value;sortear();render()}
  else if(el.id==="f-modo"){P.modo=el.value;sortear();render()}
  else if(el.dataset.g){ if(el.checked) estado.g[el.dataset.g]=1; else delete estado.g[el.dataset.g]; salvar();
    const sec=el.dataset.g.split("|")[0];const [f,t]=progressoSec(sec);const s=el.closest(".sec");
    s.querySelector(".pct").textContent=`${f}/${t} · ${Math.round(f/t*100)}%`;s.querySelector(".meter i").style.width=(f/t*100)+"%"; }
});

document.getElementById("view").addEventListener("submit",async e=>{
  e.preventDefault();
  const o=[0,1,2,3,4].map(i=>$("#n-o"+i).value.trim());
  const x={id:novoId(),t:$("#n-t").value,a:$("#n-a").value.trim()||"Geral",q:$("#n-q").value.trim(),o,
    c:+document.querySelector('input[name="n-c"]:checked').value,e:$("#n-e").value.trim(),src:"minha"};
  if(!x.q||o.some(v=>!v)){M.msg="Preencha o enunciado e as 5 alternativas.";return render()}
  await gravarExtra(x); M.msg="Questão adicionada. Ela já entra no sorteio da aba Praticar."; render();
});

document.addEventListener("keydown",e=>{
  if(aba!=="praticar"||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey) return;
  const i=LETRAS.indexOf(e.key.toUpperCase());
  if(i>=0&&P.q&&!P.resp){P.esc=P.ordem[i];render()}
  else if(e.key==="Enter"&&P.q){ if(!P.resp) responder(); else {sortear();render()} e.preventDefault(); }
});

lsLer(); render(); conectar();
</script>
