do","Está impedida apenas de advogar em causas trabalhistas","Deve licenciar-se da OAB enquanto ocupar o cargo","Está impedida de advogar contra a Fazenda Pública que a remunera"],"correta":4,"explicacao":"Art. 30, I, do Estatuto da Advocacia: os servidores da administração direta, indireta e fundacional são impedidos de exercer a advocacia contra a Fazenda Pública que os remunere ou à qual seja vinculada a entidade empregadora.","disciplina":"Ética","dificuldade":3,"fonte":"autoral"},{"id":"oab-656d73b7","area":"Ética","enunciado":"A sociedade de advogados Silva & Souza pretende divulgar seus serviços por meio de um outdoor em avenida movimentada, com o nome dos sócios e as áreas de atuação. Segundo o Código de Ética e Disciplina da OAB, essa publicidade:","alternativas":["É permitida, desde que contenha apenas informações objetivas","É permitida mediante prévia autorização do Conselho Seccional","É permitida, desde que não mencione valores de honorários","É vedada apenas se contiver fotografia dos sócios","É vedada, pois o Código proíbe publicidade por meio de outdoors"],"correta":4,"explicacao":"Art. 40, II, do Código de Ética e Disciplina da OAB: é vedado o uso de outdoors, painéis luminosos ou formas assemelhadas de publicidade.","disciplina":"Ética","dificuldade":2,"fonte":"autoral"},{"id":"oab-5ad7c482","area":"Ética","enunciado":"Ana, advogada, firmou contrato escrito de honorários com seu cliente, que deixou de pagar as parcelas após a conclusão do serviço. Segundo o Estatuto da Advocacia, o contrato escrito de honorários:","alternativas":["Exige prévio ajuizamento de ação de conhecimento para cobrança","Só vale como título executivo se homologado pela OAB","Só pode ser cobrado por meio de ação monitória","Não tem força executiva, servindo apenas como prova escrita","Constitui título executivo, permitindo a execução direta do crédito"],"correta":4,"explicacao":"Art. 24 do Estatuto da Advocacia: a decisão judicial que fixar ou arbitrar honorários e o contrato escrito que os estipular são títulos executivos e constituem crédito privilegiado na falência, concordata, concurso de credores, insolvência civil e liquidação extrajudicial.","disciplina":"Ética","dificuldade":2,"fonte":"autoral"},{"id":"oab-255411d8","area":"Ética","enunciado":"Pedro, advogado, é sócio de uma sociedade de advogados com sede em Belo Horizonte. Ele foi convidado a ingressar como sócio em outra sociedade de advogados, também sediada em Belo Horizonte. Segundo o Estatuto da Advocacia, Pedro:","alternativas":["Não pode integrar a segunda, por terem sede na área do mesmo Conselho Seccional","Pode integrar ambas, desde que comunique o fato ao Conselho Seccional","Pode integrar ambas, desde que as sociedades atuem em áreas distintas","Pode integrar ambas, desde que tenha participação minoritária em uma delas","Só pode integrar a segunda sociedade se ela for unipessoal"],"correta":0,"explicacao":"Art. 15, § 4º, do Estatuto da Advocacia: nenhum advogado pode integrar mais de uma sociedade de advogados com sede ou filial na mesma área territorial do respectivo Conselho Seccional.","disciplina":"Ética","dificuldade":3,"fonte":"autoral"},{"id":"oab-14c81919","area":"Constitucional","enunciado":"Roberto deseja conhecer as informações a seu respeito constantes de um banco de dados de caráter público mantido por órgão federal, que se recusou a fornecê-las. A ação constitucional adequada é:","alternativas":["Habeas data","Mandado de segurança","Habeas corpus","Mandado de injunção","Ação popular"],"correta":0,"explicacao":"Art. 5º, LXXII, a, da Constituição: conceder-se-á habeas data para assegurar o conhecimento de informações relativas à pessoa do impetrante, constantes de registros ou bancos de dados de entidades governamentais ou de caráter público.","disciplina":"Constitucional","dificuldade":2,"fonte":"autoral"},{"id":"oab-2886890b","area":"Constitucional","enunciado":"O Presidente da República editou medida provisória criando um novo tipo penal para punir fraudes em licitações. Essa medida provisória é:","alternativas":["Constitucional, desde que convertida em lei no prazo de 60 dias","Constitucional, por se tratar de caso de relevância e urgência","Constitucional, se aprovada por maioria absoluta do Congresso","Inconstitucional apenas se previr pena de reclusão","Inconstitucional, pois é vedada a edição de medida provisória sobre direito penal"],"correta":4,"explicacao":"Art. 62, § 1º, I, b, da Constituição: é vedada a edição de medidas provisórias sobre matéria relativa a direito penal, processual penal e processual civil.","disciplina":"Constitucional","dificuldade":2,"fonte":"autoral"},{"id":"oab-80975d76","area":"Constitucional","enunciado":"Um grupo de cidadãos pretende apresentar, mediante coleta de assinaturas, proposta de emenda à Constituição Federal. Considerando o texto constitucional, entre os legitimados à propositura de emenda está(ão):","alternativas":["Os cidadãos, por iniciativa popular subscrita por 1% do eleitorado nacional","Qualquer Governador de Estado","O Supremo Tribunal Federal","Um décimo dos membros da Câmara dos Deputados","Mais da metade das Assembleias Legislativas das unidades da Federação"],"correta":4,"explicacao":"Art. 60, I a III, da Constituição: a Constituição pode ser emendada mediante proposta de um terço dos membros da Câmara ou do Senado, do Presidente da República ou de mais da metade das Assembleias Legislativas, cada uma pela maioria relativa de seus membros.","disciplina":"Constitucional","dificuldade":2,"fonte":"autoral"},{"id":"oab-cc61cf3d","area":"Constitucional","enunciado":"Paula, com 32 anos de idade, filiada a partido político e em pleno gozo dos direitos políticos, pretende se candidatar nas próximas eleições. Pelo critério da idade mínima, Paula NÃO pode concorrer ao cargo de:","alternativas":["Governadora","Deputada Federal","Senadora","Prefeita","Vereadora"],"correta":2,"explicacao":"Art. 14, § 3º, VI, da Constituição: a idade mínima é de 35 anos para Presidente, Vice-Presidente e Senador; 30 para Governador; 21 para Deputado e Prefeito; 18 para Vereador.","disciplina":"Constitucional","dificuldade":2,"fonte":"autoral"},{"id":"oab-b2f5b9ec","area":"Civil","enunciado":"Em janeiro de 2023, o carro de Fábio foi atingido por veículo conduzido por Gustavo, que agiu com culpa. Fábio pretende ajuizar ação de reparação civil. Pela regra geral do Código Civil, o prazo prescricional dessa pretensão é de:","alternativas":["1 ano","5 anos","10 anos","2 anos","3 anos"],"correta":4,"explicacao":"Art. 206, § 3º, V, do Código Civil: prescreve em três anos a pretensão de reparação civil.","disciplina":"Civil","dificuldade":2,"fonte":"autoral"},{"id":"oab-b20158c8","area":"Civil","enunciado":"Segundo o Código Civil, com a redação dada pelo Estatuto da Pessoa com Deficiência (Lei 13.146/2015), é absolutamente incapaz de exercer pessoalmente os atos da vida civil:","alternativas":["O pródigo","O ébrio habitual","O menor de 16 anos","A pessoa com deficiência mental","O maior de 16 e menor de 18 anos"],"correta":2,"explicacao":"Art. 3º do Código Civil: são absolutamente incapazes apenas os menores de 16 anos; pródigos, ébrios habituais e maiores de 16 e menores de 18 são relativamente incapazes (art. 4º).","disciplina":"Civil","dificuldade":1,"fonte":"autoral"},{"id":"oab-122e164d","area":"Civil","enunciado":"Lúcia comprou um automóvel usado de um particular e, logo após a entrega, constatou um defeito oculto no motor que torna o bem impróprio ao uso. Pela regra geral do Código Civil (sem considerar vícios que só podem ser conhecidos mais tarde), o prazo decadencial para Lúcia obter a redibição é de:","alternativas":["7 dias, contados da entrega efetiva","90 dias, contados da descoberta do vício","1 ano, contado da entrega efetiva","3 anos, contados da celebração do contrato","30 dias, contados da entrega efetiva"],"correta":4,"explicacao":"Art. 445 do Código Civil: o adquirente decai do direito de obter a redibição ou abatimento no preço no prazo de 30 dias se a coisa for móvel, e de um ano se for imóvel, contado da entrega efetiva.","disciplina":"Civil","dificuldade":3,"fonte":"autoral"},{"id":"oab-921f649c","area":"Civil","enunciado":"José, viúvo, tem dois filhos e deseja deixar, por testamento, todo o seu patrimônio a um amigo de infância. Segundo o Código Civil, José:","alternativas":["Só pode dispor de metade dos bens, reservada a legítima dos filhos","Pode dispor livremente de todo o patrimônio, por ser viúvo","Pode dispor de dois terços de seus bens","Não pode fazer testamento enquanto tiver descendentes","Pode dispor de todo o patrimônio, desde que os filhos sejam maiores"],"correta":0,"explicacao":"Arts. 1.845, 1.846 e 1.789 do Código Civil: descendentes são herdeiros necessários, e pertence a eles, de pleno direito, a metade dos bens da herança; havendo herdeiros necessários, o testador só pode dispor da metade.","disciplina":"Civil","dificuldade":2,"fonte":"autoral"},{"id":"oab-fb8fc796","area":"Processo Civil","enunciado":"Proferida sentença, o réu opôs embargos de declaração alegando omissão. Quanto ao prazo para interposição de apelação pelas partes, a oposição dos embargos de declaração:","alternativas":["Suspende o prazo, que volta a correr pelo saldo restante","Não produz qualquer efeito sobre o prazo recursal","Interrompe o prazo para a interposição de recurso","Interrompe o prazo apenas para a parte que opôs os embargos","Suspende o prazo apenas se os embargos forem acolhidos"],"correta":2,"explicacao":"Art. 1.026 do CPC: os embargos de declaração não possuem efeito suspensivo e interrompem o prazo para a interposição de recurso.","disciplina":"Processo Civil","dificuldade":2,"fonte":"autoral"},{"id":"oab-d7ef213c","area":"Processo Civil","enunciado":"Em ação de obrigação de fazer, o juiz indeferiu o pedido de tutela provisória de urgência formulado pela autora. O recurso cabível contra essa decisão interlocutória é:","alternativas":["Apelação","Agravo interno","Recurso ordinário","Embargos infringentes","Agravo de instrumento"],"correta":4,"explicacao":"Art. 1.015, I, do CPC: cabe agravo de instrumento contra as decisões interlocutórias que versarem sobre tutelas provisórias.","disciplina":"Processo Civil","dificuldade":2,"fonte":"autoral"},{"id":"oab-099cbebb","area":"Processo Civil","enunciado":"Em ação de cobrança movida contra dois devedores solidários, apenas um deles contestou, impugnando a existência da dívida, fato comum a ambos. O outro réu foi revel. Quanto ao efeito material da revelia, é correto afirmar que:","alternativas":["Presumem-se verdadeiras as alegações do autor em relação ao réu revel","Não se presumem verdadeiras, pois um dos litisconsortes contestou","O processo deve ser extinto em relação ao réu revel","O juiz deve julgar antecipadamente o pedido apenas contra o revel","O réu revel será condenado automaticamente, sem produção de provas"],"correta":1,"explicacao":"Art. 345, I, do CPC: a revelia não produz o efeito de presunção de veracidade se, havendo pluralidade de réus, algum deles contestar a ação.","disciplina":"Processo Civil","dificuldade":3,"fonte":"autoral"},{"id":"oab-942d0685","area":"Processo Civil","enunciado":"Transitou em julgado decisão de mérito proferida por juiz absolutamente incompetente. A parte prejudicada pretende ajuizar ação rescisória. Pela regra geral do CPC, o prazo para tanto é de:","alternativas":["1 ano, contado do trânsito em julgado","2 anos, contados do trânsito em julgado da última decisão","5 anos, contados da prolação da decisão","2 anos, contados da ciência do vício pela parte","90 dias, contados do trânsito em julgado"],"correta":1,"explicacao":"Art. 975 do CPC: o direito à rescisão se extingue em dois anos contados do trânsito em julgado da última decisão proferida no processo; a incompetência absoluta é hipótese de rescisória (art. 966, II).","disciplina":"Processo Civil","dificuldade":3,"fonte":"autoral"},{"id":"oab-50b1a0b7","area":"Penal","enunciado":"Tiago furtou um celular e, arrependido, devolveu-o voluntariamente à vítima antes do recebimento da denúncia. Segundo o Código Penal, Tiago:","alternativas":["Terá direito à redução da pena de um a dois terços, pelo arrependimento posterior","Terá extinta a punibilidade","Responderá apenas pelos atos já praticados, pela desistência voluntária","Não será punido, pelo arrependimento eficaz","Não terá qualquer benefício, pois o crime já se consumou"],"correta":0,"explicacao":"Art. 16 do Código Penal: nos crimes cometidos sem violência ou grave ameaça, reparado o dano ou restituída a coisa até o recebimento da denúncia, por ato voluntário do agente, a pena será reduzida de um a dois terços.","disciplina":"Penal","dificuldade":2,"fonte":"autoral"},{"id":"oab-cdbbb050","area":"Penal","enunciado":"Rafael, pretendendo matar Bruno, disparou uma vez contra ele, errando o alvo. Embora tivesse outras munições e nada o impedisse, decidiu por vontade própria não prosseguir. Bruno não sofreu lesões. Rafael:","alternativas":["Responde por tentativa de homicídio","Responde apenas pelos atos já praticados, em razão da desistência voluntária","Responde por homicídio consumado com pena reduzida","Tem a pena reduzida de um a dois terços pelo arrependimento posterior","Não responde por crime algum, por se tratar de crime impossível"],"correta":1,"explicacao":"Art. 15 do Código Penal: o agente que voluntariamente desiste de prosseguir na execução só responde pelos atos já praticados (no caso, eventualmente, disparo de arma de fogo ou perigo para a vida).","disciplina":"Penal","dificuldade":2,"fonte":"autoral"},{"id":"oab-8fd049ba","area":"Penal","enunciado":"Durante uma caçada, Célio atirou contra um vulto na mata acreditando tratar-se de um animal, mas atingiu e matou um colega. O erro era evitável, se Célio tivesse agido com a cautela devida. Nesse caso:","alternativas":["Há erro de proibição, que isenta de pena","Há erro de tipo invencível, que exclui dolo e culpa","Há erro de tipo vencível, punível a título de culpa","Responde por homicídio doloso, pois assumiu o risco","Há legítima defesa putativa, que exclui a ilicitude"],"correta":2,"explicacao":"Art. 20, caput, do Código Penal: o erro sobre elemento constitutivo do tipo legal exclui o dolo, mas permite a punição por crime culposo, se previsto em lei.","disciplina":"Penal","dificuldade":3,"fonte":"autoral"},{"id":"oab-50c34185","area":"Penal","enunciado":"Marcos tinha 20 anos na data do crime e 23 anos na data da sentença. Quanto aos prazos prescricionais aplicáveis a ele:","alternativas":["São reduzidos de metade, pois era menor de 21 anos ao tempo do crime","São reduzidos de um terço, pois era menor de 21 anos ao tempo do crime","Não há redução, pois era maior de 21 anos na data da sentença","São reduzidos de metade apenas se ele for maior de 70 anos na sentença","São contados em dobro, por se tratar de réu jovem"],"correta":0,"explicacao":"Art. 115 do Código Penal: são reduzidos de metade os prazos de prescrição quando o criminoso era, ao tempo do crime, menor de 21 anos, ou, na data da sentença, maior de 70 anos.","disciplina":"Penal","dificuldade":3,"fonte":"autoral"},{"id":"oab-d0abd164","area":"Processo Penal","enunciado":"Laura foi vítima de crime de ação penal privada e descobriu quem era o autor do fato em 10 de março. Salvo disposição em contrário, o prazo para oferecer queixa-crime é de:","alternativas":["6 meses, contados da data do fato","30 dias, contados da conclusão do inquérito policial","6 meses, contados do conhecimento da autoria","1 ano, contado do dia em que soube quem é o autor","15 dias, contados do conhecimento da autoria"],"correta":2,"explicacao":"Art. 38 do CPP: o ofendido decai do direito de queixa se não o exercer dentro de seis meses, contados do dia em que vier a saber quem é o autor do crime.","disciplina":"Processo Penal","dificuldade":2,"fonte":"autoral"},{"id":"oab-8f008e4c","area":"Processo Penal","enunciado":"Em processo pelo procedimento comum ordinário, o juiz rejeitou a denúncia oferecida pelo Ministério Público por falta de justa causa. O recurso cabível é:","alternativas":["Recurso em sentido estrito","Apelação","Agravo em execução","Carta testemunhável","Embargos infringentes"],"correta":0,"explicacao":"Art. 581, I, do CPP: cabe recurso em sentido estrito da decisão que não receber a denúncia ou a queixa.","disciplina":"Processo Penal","dificuldade":2,"fonte":"autoral"},{"id":"oab-02647e6d","area":"Processo Penal","enunciado":"Douglas foi denunciado por latrocínio (roubo seguido de morte). O órgão competente para julgá-lo é:","alternativas":["O Tribunal do Júri, por haver resultado morte","O juízo criminal singular, pois o latrocínio é crime contra o patrimônio","O Tribunal do Júri, por se tratar de crime hediondo","O Juizado Especial Criminal","O juízo singular apenas se a morte resultar de culpa"],"correta":1,"explicacao":"Súmula 603 do STF: a competência para o processo e julgamento de latrocínio é do juiz singular e não do Tribunal do Júri, que julga os crimes dolosos contra a vida (art. 5º, XXXVIII, d, da Constituição; art. 74, § 1º, do CPP).","disciplina":"Processo Penal","dificuldade":2,"fonte":"autoral"},{"id":"oab-846a8377","area":"Trabalho","enunciado":"Sandra completou seu período aquisitivo de férias, mas o empregador não as concedeu nos 12 meses subsequentes. Segundo a CLT, Sandra:","alternativas":["Tem direito ao pagamento das férias em dobro","Perde o direito às férias, que prescrevem","Tem direito às férias simples, sem acréscimo","Tem direito a férias de 60 dias corridos, sem remuneração dobrada","Tem direito apenas a indenização de um terço da remuneração"],"correta":0,"explicacao":"Art. 137 da CLT: sempre que as férias forem concedidas após o prazo do art. 134 (12 meses subsequentes ao período aquisitivo), o empregador pagará em dobro a respectiva remuneração.","disciplina":"Trabalho","dificuldade":2,"fonte":"autoral"},{"id":"oab-7bf63d39","area":"Trabalho","enunciado":"Juliana, empregada com contrato por prazo indeterminado, teve a gravidez confirmada e foi dispensada sem justa causa. Segundo a Constituição, a estabilidade provisória da gestante vai:","alternativas":["Da confirmação da gravidez até cinco meses após o parto","Da confirmação da gravidez até o parto","Da confirmação da gravidez até 120 dias após o parto","Da comunicação ao empregador até seis meses após o parto","Do parto até um ano após o parto"],"correta":0,"explicacao":"Art. 10, II, b, do ADCT: fica vedada a dispensa arbitrária ou sem justa causa da empregada gestante, desde a confirmação da gravidez até cinco meses após o parto.","disciplina":"Trabalho","dificuldade":2,"fonte":"autoral"},{"id":"oab-52b96464","area":"Trabalho","enunciado":"Rogério, empregado urbano, trabalha habitualmente das 23h às 4h. Segundo a CLT, o trabalho noturno urbano é aquele realizado:","alternativas":["Entre as 21h de um dia e as 5h do dia seguinte, com adicional de 25%","Entre as 22h de um dia e as 6h do dia seguinte, com adicional de 50%","Entre as 20h de um dia e as 4h do dia seguinte, com adicional de 20%","Entre as 22h de um dia e as 5h do dia seguinte, sem adicional se houver acordo individual","Entre as 22h de um dia e as 5h do dia seguinte, com adicional de pelo menos 20% sobre a hora diurna"],"correta":4,"explicacao":"Art. 73, caput e § 2º, da CLT: considera-se noturno o trabalho urbano executado entre as 22h de um dia e as 5h do dia seguinte, com remuneração acrescida de pelo menos 20% sobre a hora diurna.","disciplina":"Trabalho","dificuldade":1,"fonte":"autoral"},{"id":"oab-7ec7fda0","area":"Processo do Trabalho","enunciado":"Em reclamação trabalhista pelo rito ordinário, a sentença julgou improcedentes os pedidos do reclamante. O prazo para interposição de recurso ordinário é de:","alternativas":["5 dias","8 dias","10 dias","15 dias","30 dias"],"correta":1,"explicacao":"Art. 895, I, da CLT e art. 6º da Lei 5.584/1970: o recurso ordinário é cabível no prazo de oito dias, prazo que é a regra geral dos recursos trabalhistas.","disciplina":"Processo do Trabalho","dificuldade":1,"fonte":"autoral"},{"id":"oab-d6ec5e46","area":"Processo do Trabalho","enunciado":"Em reclamação trabalhista submetida ao procedimento sumaríssimo, cada parte pode indicar, no máximo:","alternativas":["3 testemunhas","6 testemunhas","1 testemunha","2 testemunhas","5 testemunhas"],"correta":3,"explicacao":"Art. 852-H, § 2º, da CLT: no procedimento sumaríssimo, as testemunhas, até o máximo de duas para cada parte, comparecerão independentemente de intimação; no rito ordinário, o limite é de três (art. 821).","disciplina":"Processo do Trabalho","dificuldade":1,"fonte":"autoral"},{"id":"oab-c599afc2","area":"Administrativo","enunciado":"Um município concedeu licença a um particular e, posteriormente, constatou que o ato foi praticado com vício de legalidade. Segundo o entendimento sumulado do STF, a Administração:","alternativas":["Deve revogar o ato, por conveniência e oportunidade","Só pode desfazer o ato mediante decisão judicial","Não pode desfazer o ato, pois gerou direito adquirido","Pode anular o ato, pois de atos ilegais não se originam direitos","Deve convalidar obrigatoriamente o ato, qualquer que seja o vício"],"correta":3,"explicacao":"Súmula 473 do STF: a Administração pode anular seus próprios atos, quando eivados de vícios que os tornem ilegais, porque deles não se originam direitos; ou revogá-los por motivo de conveniência ou oportunidade (no mesmo sentido, art. 53 da Lei 9.784/1999).","disciplina":"Administrativo","dificuldade":2,"fonte":"autoral"},{"id":"oab-d12b825c","area":"Administrativo","enunciado":"Um motorista de ambulância de hospital público estadual, em serviço, causou acidente que feriu o pedestre Nilo. Quanto à responsabilidade civil, é correto afirmar que:","alternativas":["O Estado responde apenas se Nilo provar a culpa do motorista","Apenas o motorista responde, de forma subjetiva","O Estado responde objetivamente, com direito de regresso contra o agente","O Estado e o motorista respondem objetivamente e de forma solidária","O Estado responde subjetivamente, com base na culpa do serviço"],"correta":2,"explicacao":"Art. 37, § 6º, da Constituição: as pessoas jurídicas de direito público responderão pelos danos que seus agentes, nessa qualidade, causarem a terceiros, assegurado o direito de regresso contra o responsável nos casos de dolo ou culpa.","disciplina":"Administrativo","dificuldade":2,"fonte":"autoral"},{"id":"oab-1ec7c178","area":"Administrativo","enunciado":"Em 2016, um órgão federal concedeu vantagem a um servidor que estava de boa-fé. Em 2024, constatou-se que o ato era ilegal. Segundo a Lei 9.784/1999, a Administração:","alternativas":["Pode anular o ato a qualquer tempo, pois atos ilegais não se convalidam","Pode anular o ato em até dez anos da sua prática","Deve revogar o ato, com efeitos retroativos","Não pode mais anular o ato, pois decaiu o direito após cinco anos","Pode anular o ato em até vinte anos, por se tratar de verba pública"],"correta":3,"explicacao":"Art. 54 da Lei 9.784/1999: o direito da Administração de anular atos de que decorram efeitos favoráveis para os destinatários decai em cinco anos, contados da data em que foram praticados, salvo comprovada má-fé.","disciplina":"Administrativo","dificuldade":3,"fonte":"autoral"},{"id":"oab-4230a631","area":"Tributário","enunciado":"Uma empresa declarou e pagou antecipadamente determinado tributo sujeito a lançamento por homologação, sem dolo, fraude ou simulação. A Fazenda não se manifestou. Segundo o CTN, o prazo para a Fazenda homologar ou lançar diferenças é de:","alternativas":["5 anos, contados do primeiro dia do exercício seguinte à declaração","10 anos, contados da ocorrência do fato gerador","5 anos, contados da ocorrência do fato gerador","2 anos, contados do pagamento","3 anos, contados da entrega da declaração"],"correta":2,"explicacao":"Art. 150, § 4º, do CTN: se a lei não fixar prazo, a homologação ocorre em cinco anos a contar da ocorrência do fato gerador; expirado esse prazo sem pronunciamento, considera-se homologado o lançamento, salvo dolo, fraude ou simulação.","disciplina":"Tributário","dificuldade":3,"fonte":"autoral"},{"id":"oab-293524fb","area":"Tributário","enunciado":"Um município lançou IPTU sobre o imóvel onde funciona o templo de uma igreja e realizou as celebrações religiosas. Segundo a Constituição, essa cobrança é:","alternativas":["Devida, pois a imunidade dos templos abrange apenas taxas","Indevida, pois há imunidade tributária dos templos de qualquer culto quanto a impostos","Devida, pois a imunidade alcança apenas tributos federais","Indevida apenas se a entidade religiosa comprovar ausência de patrimônio","Devida, pois IPTU é tributo real e não se sujeita a imunidades"],"correta":1,"explicacao":"Art. 150, VI, b, da Constituição: é vedado aos entes federativos instituir impostos sobre entidades religiosas e templos de qualquer culto; a imunidade abrange o imóvel onde se realizam os cultos.","disciplina":"Tributário","dificuldade":2,"fonte":"autoral"},{"id":"oab-1de2028f","area":"Tributário","enunciado":"A empresa Beta, antes de qualquer procedimento de fiscalização, percebeu que deixara de declarar e de recolher um tributo, confessou a infração e pagou integralmente o tributo devido com juros de mora. Segundo o CTN, Beta:","alternativas":["Deve pagar a multa punitiva, reduzida à metade","Deve pagar a multa, pois o tributo foi recolhido em atraso","Tem direito à restituição dos juros pagos","Tem a responsabilidade pela infração excluída, pela denúncia espontânea","Tem a responsabilidade excluída apenas se o débito for parcelado"],"correta":3,"explicacao":"Art. 138 do CTN: a responsabilidade é excluída pela denúncia espontânea da infração, acompanhada do pagamento do tributo devido e dos juros de mora, antes do início de qualquer procedimento administrativo ou medida de fiscalização.","disciplina":"Tributário","dificuldade":2,"fonte":"autoral"},{"id":"oab-4d3c2249","area":"Empresarial","enunciado":"Vânia recebeu um cheque emitido na mesma praça em que deve ser pago. Segundo a Lei do Cheque (Lei 7.357/1985), o prazo de apresentação desse cheque é de:","alternativas":["60 dias, contados da data de emissão","30 dias, contados da data de emissão","6 meses, contados da data de emissão","15 dias, contados da data de emissão","90 dias, contados da data de emissão"],"correta":1,"explicacao":"Art. 33 da Lei 7.357/1985: o cheque deve ser apresentado para pagamento em 30 dias, quando emitido no lugar onde houver de ser pago, e em 60 dias, quando emitido em outro lugar.","disciplina":"Empresarial","dificuldade":1,"fonte":"autoral"},{"id":"oab-8030f13d","area":"Empresarial","enunciado":"A sociedade empresária Alfa Ltda., constituída e registrada há um ano, enfrenta crise financeira e pretende requerer recuperação judicial. Segundo a Lei 11.101/2005, esse pedido:","alternativas":["Pode ser deferido, pois não há exigência de tempo mínimo de atividade","Não preenche requisito legal, pois exige-se atividade regular há mais de 2 anos","Exige apenas a apresentação do plano de recuperação na petição inicial","Pode ser deferido se houver concordância prévia de metade dos credores","Não preenche requisito legal, pois exige-se atividade regular há mais de 5 anos"],"correta":1,"explicacao":"Art. 48, caput, da Lei 11.101/2005: poderá requerer recuperação judicial o devedor que, no momento do pedido, exerça regularmente suas atividades há mais de 2 anos, atendidos os demais requisitos.","disciplina":"Empresarial","dificuldade":2,"fonte":"autoral"},{"id":"oab-42996f65","area":"Consumidor","enunciado":"Heitor comprou um aparelho de ginástica pela internet e, ao recebê-lo, desistiu da compra, embora o produto não tivesse defeito. Segundo o CDC, Heitor:","alternativas":["Não pode desistir, pois o produto não apresenta vício","Pode desistir em 30 dias, com retenção de multa de 10%","Pode desistir em 7 dias, mas deve arcar com o frete de devolução","Pode desistir em 7 dias do recebimento, com devolução imediata do valor pago","Pode desistir em 90 dias, por se tratar de produto durável"],"correta":3,"explicacao":"Art. 49 do CDC: o consumidor pode desistir do contrato no prazo de 7 dias a contar de sua assinatura ou do recebimento do produto, sempre que a contratação ocorrer fora do estabelecimento comercial, com devolução imediata dos valores pagos, monetariamente atualizados.","disciplina":"Consumidor","dificuldade":1,"fonte":"autoral"},{"id":"oab-3cc601e6","area":"ECA","enunciado":"Um adolescente recebeu a medida socioeducativa de internação. Segundo o ECA, essa medida:","alternativas":["Tem prazo fixo de dois anos, sem necessidade de reavaliação","Deve ser reavaliada a cada ano e pode durar até cinco anos","Não pode exceder um ano, prorrogável uma vez","Não comporta prazo determinado e não pode exceder três anos","Tem prazo indeterminado, cessando apenas aos 18 anos"],"correta":3,"explicacao":"Art. 121, §§ 2º e 3º, do ECA: a internação não comporta prazo determinado, sua manutenção deve ser reavaliada no máximo a cada seis meses e o período máximo não excederá três anos; a liberação é compulsória aos 21 anos (§ 5º).","disciplina":"ECA","dificuldade":2,"fonte":"autoral"},{"id":"oab-cb839b1c","area":"Direitos Humanos","enunciado":"Uma vítima de violação de direitos humanos no Brasil pretende que seu caso seja julgado pela Corte Interamericana de Direitos Humanos. Segundo a Convenção Americana (Pacto de San José da Costa Rica), têm direito de submeter um caso à decisão da Corte:","alternativas":["Qualquer pessoa, diretamente, após esgotados os recursos internos","Apenas as organizações não governamentais reconhecidas","Somente a vítima, representada por advogado","Somente os Estados Partes e a Comissão Interamericana de Direitos Humanos","Qualquer Estado membro da ONU"],"correta":3,"explicacao":"Art. 61.1 da Convenção Americana sobre Direitos Humanos: somente os Estados Partes e a Comissão têm direito de submeter caso à decisão da Corte; o indivíduo apresenta petição à Comissão (art. 44).","disciplina":"Direitos Humanos","dificuldade":3,"fonte":"autoral"},{"id":"oab-51092f8a","area":"Filosofia do Direito","enunciado":"Na Teoria Pura do Direito, Hans Kelsen explica que o fundamento último de validade de uma ordem jurídica reside:","alternativas":["Na norma fundamental (Grundnorm), pressuposta e não posta","Na vontade soberana do povo, expressa pela Constituição","Nos princípios morais universais do direito natural","Na regra de reconhecimento aceita pelas autoridades","Na eficácia social das normas perante os destinatários"],"correta":0,"explicacao":"Para Kelsen, a validade de cada norma decorre de uma norma superior, até a norma fundamental, que é pressuposta pelo pensamento jurídico; a regra de reconhecimento, que é uma prática social, é conceito de Hart.","disciplina":"Filosofia do Direito","dificuldade":2,"fonte":"autoral"},{"id":"oab-bc76875a","area":"Ambiental","enunciado":"Uma indústria, operando com todas as licenças ambientais, causou vazamento acidental de produtos químicos que contaminou um rio. Quanto à obrigação de reparar o dano ambiental, a indústria:","alternativas":["Responde apenas se comprovada sua culpa","Não responde, pois possuía licença ambiental válida","Responde objetivamente, independentemente da existência de culpa","Responde apenas se o dano atingir área de preservação permanente","Responde subsidiariamente ao Poder Público que concedeu a licença"],"correta":2,"explicacao":"Art. 14, § 1º, da Lei 6.938/1981 (Política Nacional do Meio Ambiente): o poluidor é obrigado, independentemente da existência de culpa, a indenizar ou reparar os danos causados ao meio ambiente e a terceiros; a licença não afasta essa obrigação (art. 225, § 3º, da Constituição).","disciplina":"Ambiental","dificuldade":2,"fonte":"autoral"}]},"mapa":{"areas":[{"id":"ciencias-basicas","nome":"Ciências Básicas","especialidades":[{"id":"anatomia","nome":"Anatomia"},{"id":"fisiologia","nome":"Fisiologia"},{"id":"bioquimica","nome":"Bioquímica"},{"id":"histologia-embriologia","nome":"Histologia e Embriologia"},{"id":"genetica","nome":"Genética"},{"id":"imunologia","nome":"Imunologia"},{"id":"microbiologia","nome":"Microbiologia"},{"id":"parasitologia","nome":"Parasitologia"},{"id":"patologia","nome":"Patologia"},{"id":"farmacologia","nome":"Farmacologia"},{"id":"semiologia","nome":"Semiologia"}]},{"id":"clinica-medica","nome":"Clínica Médica","especialidades":[{"id":"cardiologia","nome":"Cardiologia"},{"id":"pneumologia","nome":"Pneumologia"},{"id":"endocrinologia","nome":"Endocrinologia"},{"id":"nefrologia","nome":"Nefrologia"},{"id":"gastroenterologia","nome":"Gastroenterologia"},{"id":"hematologia","nome":"Hematologia"},{"id":"reumatologia","nome":"Reumatologia"},{"id":"infectologia","nome":"Infectologia"},{"id":"neurologia","nome":"Neurologia"},{"id":"dermatologia","nome":"Dermatologia"},{"id":"oncologia","nome":"Oncologia"},{"id":"medicina-de-urgencia","nome":"Medicina de Urgência"}]},{"id":"cirurgia","nome":"Cirurgia","especialidades":[{"id":"cirurgia-geral","nome":"Cirurgia Geral"},{"id":"trauma","nome":"Trauma"},{"id":"urologia","nome":"Urologia"},{"id":"ortopedia","nome":"Ortopedia e Traumatologia"},{"id":"anestesiologia","nome":"Anestesiologia"}]},{"id":"pediatria","nome":"Pediatria","especialidades":[{"id":"pediatria-geral","nome":"Pediatria Geral"},{"id":"neonatologia","nome":"Neonatologia"}]},{"id":"ginecologia-obstetricia","nome":"Ginecologia e Obstetrícia","especialidades":[{"id":"ginecologia","nome":"Ginecologia"},{"id":"obstetricia","nome":"Obstetrícia"}]},{"id":"medicina-preventiva","nome":"Medicina Preventiva e Social","especialidades":[{"id":"epidemiologia","nome":"Epidemiologia"},{"id":"saude-publica-sus","nome":"Saúde Pública e SUS"},{"id":"medicina-de-familia","nome":"Medicina de Família e Comunidade"}]},{"id":"saude-mental","nome":"Saúde Mental","especialidades":[{"id":"psiquiatria","nome":"Psiquiatria"}]},{"id":"etica-medicina-legal","nome":"Ética Médica e Medicina Legal","especialidades":[{"id":"etica-medica","nome":"Ética Médica"},{"id":"medicina-legal","nome":"Medicina Legal"}]}],"temas":[{"id":"plexo-braquial","nome":"Plexo braquial e nervos do membro superior","sinonimos":["lesão do nervo radial","lesões de nervos periféricos do membro superior"],"especialidades":["anatomia","ortopedia","neurologia"],"disciplinas":["Anatomia","Ortopedia e Traumatologia","Neurologia"],"subtemas":[{"id":"plexo-braquial.formacao-e-raizes","nome":"Formação e raízes"},{"id":"plexo-braquial.nervo-radial","nome":"Nervo radial"},{"id":"plexo-braquial.nervo-mediano","nome":"Nervo mediano"},{"id":"plexo-braquial.nervo-ulnar","nome":"Nervo ulnar"},{"id":"plexo-braquial.lesoes-do-plexo","nome":"Lesões do plexo"}],"objetivos":["Descrever a organização do plexo braquial a partir das raízes C5–T1","Relacionar a lesão de cada nervo terminal ao déficit motor e sensitivo correspondente","Correlacionar fraturas do membro superior com os nervos em risco"],"resumo":"O plexo braquial origina-se dos ramos ventrais de C5 a T1 e organiza-se em raízes, troncos, divisões, fascículos e ramos terminais. O nervo radial percorre o sulco do nervo radial no úmero, e sua lesão em fraturas da diáfise causa queda do punho. Lesões dos nervos mediano e ulnar produzem padrões característicos de déficit na mão."},{"id":"nervos-cranianos","nome":"Nervos cranianos","sinonimos":["pares cranianos"],"especialidades":["anatomia","neurologia","semiologia"],"disciplinas":["Anatomia","Neuroanatomia","Semiologia","Neurologia"],"subtemas":[{"id":"nervos-cranianos.forames-da-base-do-cranio","nome":"Forames da base do crânio"},{"id":"nervos-cranianos.nervo-trigemeo","nome":"Nervo trigêmeo"},{"id":"nervos-cranianos.nervo-facial","nome":"Nervo facial"},{"id":"nervos-cranianos.nervo-vago-e-nervos-laringeos","nome":"Nervo vago e nervos laríngeos"},{"id":"nervos-cranianos.exame-dos-nervos-cranianos","nome":"Exame dos nervos cranianos"}],"objetivos":["Identificar os forames por onde cada nervo craniano deixa o crânio","Descrever o trajeto e as relações dos nervos laríngeos","Correlacionar lesões de nervos cranianos com os achados do exame físico"],"resumo":"São doze pares de nervos que emergem do encéfalo e do tronco encefálico e deixam o crânio por forames específicos, como o forame oval (nervo mandibular). O nervo vago origina o nervo laríngeo recorrente, que à esquerda contorna o arco da aorta e à direita a artéria subclávia. Lesões dos nervos cranianos produzem déficits que ajudam a localizar a lesão neurológica."},{"id":"anatomia-do-torax","nome":"Anatomia do tórax e do diafragma","sinonimos":["mediastino","nervo frênico"],"especialidades":["anatomia","cirurgia-geral"],"disciplinas":["Anatomia","Cirurgia"],"subtemas":[{"id":"anatomia-do-torax.diafragma-e-nervo-frenico","nome":"Diafragma e nervo frênico"},{"id":"anatomia-do-torax.mediastino","nome":"Mediastino"},{"id":"anatomia-do-torax.grandes-vasos","nome":"Grandes vasos"},{"id":"anatomia-do-torax.pleuras-e-pulmoes","nome":"Pleuras e pulmões"}],"objetivos":["Descrever a inervação e a função do diafragma","Identificar o conteúdo dos compartimentos do mediastino","Relacionar a anatomia torácica com procedimentos e traumas"],"resumo":"O diafragma é o principal músculo da inspiração e recebe inervação motora do nervo frênico, formado principalmente pelas raízes C3 a C5. O mediastino contém coração, grandes vasos, traqueia, esôfago e os nervos vago e frênico. Essas relações são essenciais para interpretar traumas, imagens e procedimentos torácicos."},{"id":"anatomia-da-pelve","nome":"Anatomia da pelve e do períneo","sinonimos":["pelve feminina"],"especialidades":["anatomia","ginecologia","urologia"],"disciplinas":["Anatomia","Ginecologia e Obstetrícia","Urologia","Cirurgia"],"subtemas":[{"id":"anatomia-da-pelve.vascularizacao-pelvica","nome":"Vascularização pélvica"},{"id":"anatomia-da-pelve.ureter-pelvico","nome":"Ureter pélvico"},{"id":"anatomia-da-pelve.orgaos-genitais-internos","nome":"Órgãos genitais internos"},{"id":"anatomia-da-pelve.assoalho-pelvico","nome":"Assoalho pélvico"}],"objetivos":["Descrever a vascularização dos órgãos pélvicos","Explicar a relação entre o ureter e a artéria uterina","Reconhecer estruturas em risco em cirurgias pélvicas"],"resumo":"Os órgãos pélvicos são irrigados principalmente por ramos da artéria ilíaca interna. Próximo ao colo uterino, o ureter passa inferiormente à artéria uterina, o que o torna vulnerável durante a histerectomia. O assoalho pélvico, formado sobretudo pelo músculo levantador do ânus, sustenta as vísceras pélvicas."},{"id":"potencial-de-acao","nome":"Potencial de membrana e potencial de ação","sinonimos":["excitabilidade celular"],"especialidades":["fisiologia","neurologia"],"disciplinas":["Fisiologia","Biofísica","Farmacologia","Neurologia"],"subtemas":[{"id":"potencial-de-acao.potencial-de-repouso","nome":"Potencial de repouso"},{"id":"potencial-de-acao.canais-ionicos-voltagem-dependentes","nome":"Canais iônicos voltagem-dependentes"},{"id":"potencial-de-acao.fases-do-potencial-de-acao","nome":"Fases do potencial de ação"},{"id":"potencial-de-acao.conducao-e-sinapse","nome":"Condução e sinapse"}],"objetivos":["Explicar a gênese do potencial de repouso","Descrever as fases do potencial de ação e os íons envolvidos","Relacionar a mielinização com a velocidade de condução"],"resumo":"O potencial de repouso depende principalmente do gradiente de potássio e é mantido pela bomba Na⁺/K⁺-ATPase. No potencial de ação neuronal, a despolarização rápida decorre da entrada de sódio por canais voltagem-dependentes, e a repolarização, da saída de potássio. A mielina permite a condução saltatória, aumentando a velocidade de propagação."},{"id":"sistema-nervoso-autonomo","nome":"Sistema nervoso autônomo","sinonimos":["SNA","simpático e parassimpático"],"especialidades":["fisiologia","farmacologia","anatomia"],"disciplinas":["Fisiologia","Farmacologia","Anatomia"],"subtemas":[{"id":"sistema-nervoso-autonomo.divisoes-simpatica-e-parassimpatica","nome":"Divisões simpática e parassimpática"},{"id":"sistema-nervoso-autonomo.receptores-adrenergicos","nome":"Receptores adrenérgicos"},{"id":"sistema-nervoso-autonomo.receptores-colinergicos","nome":"Receptores colinérgicos"},{"id":"sistema-nervoso-autonomo.farmacos-autonomicos","nome":"Fármacos autonômicos"}],"objetivos":["Comparar a organização das divisões simpática e parassimpática","Relacionar os receptores autonômicos aos seus efeitos nos órgãos","Prever os efeitos de agonistas e antagonistas autonômicos"],"resumo":"O sistema nervoso autônomo regula funções viscerais por meio das divisões simpática e parassimpática. A acetilcolina atua em receptores nicotínicos e muscarínicos, e a noradrenalina e a adrenalina, em receptores alfa e beta-adrenérgicos. Muitos fármacos e toxinas, como os inibidores da colinesterase, agem sobre essas vias e produzem síndromes previsíveis."},{"id":"fisiologia-cardiovascular","nome":"Fisiologia cardiovascular","sinonimos":["hemodinâmica"],"especialidades":["fisiologia","cardiologia"],"disciplinas":["Fisiologia","Cardiologia","Semiologia"],"subtemas":[{"id":"fisiologia-cardiovascular.ciclo-cardiaco","nome":"Ciclo cardíaco"},{"id":"fisiologia-cardiovascular.debito-cardiaco-e-lei-de-frank-starling","nome":"Débito cardíaco e lei de Frank-Starling"},{"id":"fisiologia-cardiovascular.controle-da-pressao-arterial","nome":"Controle da pressão arterial"},{"id":"fisiologia-cardiovascular.eletrofisiologia-cardiaca","nome":"Eletrofisiologia cardíaca"}],"objetivos":["Descrever os eventos do ciclo cardíaco","Explicar os determinantes do débito cardíaco","Explicar o barorreflexo e o controle da pressão arterial"],"resumo":"O débito cardíaco é o produto da frequência cardíaca pelo volume sistólico, que depende de pré-carga, pós-carga e contratilidade. Pela lei de Frank-Starling, maior volume diastólico final aumenta a força de contração, dentro de limites fisiológicos. Os barorreceptores carotídeos e aórticos ajustam rapidamente a pressão arterial por meio do sistema nervoso autônomo."},{"id":"fisiologia-respiratoria","nome":"Fisiologia respiratória","sinonimos":[],"especialidades":["fisiologia","pneumologia"],"disciplinas":["Fisiologia","Pneumologia"],"subtemas":[{"id":"fisiologia-respiratoria.mecanica-respiratoria","nome":"Mecânica respiratória"},{"id":"fisiologia-respiratoria.trocas-gasosas","nome":"Trocas gasosas"},{"id":"fisiologia-respiratoria.transporte-de-oxigenio","nome":"Transporte de oxigênio"},{"id":"fisiologia-respiratoria.controle-da-ventilacao","nome":"Controle da ventilação"}],"objetivos":["Descrever a mecânica da ventilação","Explicar os fatores que deslocam a curva de dissociação da oxi-hemoglobina","Descrever o controle neural e químico da respiração"],"resumo":"As trocas gasosas ocorrem por difusão através da membrana alvéolo-capilar. A curva de dissociação da oxi-hemoglobina desloca-se para a direita com aumento de temperatura, CO₂, H⁺ e 2,3-bifosfoglicerato, facilitando a liberação de O₂ aos tecidos. A ventilação é controlada por centros bulbares e por quimiorreceptores centrais e periféricos."},{"id":"fisiologia-renal","nome":"Fisiologia renal","sinonimos":[],"especialidades":["fisiologia","nefrologia"],"disciplinas":["Fisiologia","Nefrologia"],"subtemas":[{"id":"fisiologia-renal.filtracao-glomerular","nome":"Filtração glomerular"},{"id":"fisiologia-renal.transporte-tubular","nome":"Transporte tubular"},{"id":"fisiologia-renal.concentracao-urinaria-e-adh","nome":"Concentração urinária e ADH"},{"id":"fisiologia-renal.sistema-renina-angiotensina-aldosterona","nome":"Sistema renina-angiotensina-aldosterona"}],"objetivos":["Descrever os determinantes da filtração glomerular","Explicar o mecanismo de concentração urinária e a ação do ADH","Descrever o papel do sistema renina-angiotensina-aldosterona"],"resumo":"O rim regula volume, osmolaridade, eletrólitos e equilíbrio ácido-base por meio de filtração glomerular, reabsorção e secreção tubular. O hormônio antidiurético atua no ducto coletor, inserindo aquaporinas-2 na membrana apical e aumentando a reabsorção de água. O sistema renina-angiotensina-aldosterona participa do controle da volemia e da pressão arterial."},{"id":"fisiologia-gastrointestinal","nome":"Fisiologia e histologia do trato gastrointestinal","sinonimos":["secreção gástrica","hormônios gastrointestinais"],"especialidades":["fisiologia","histologia-embriologia","gastroenterologia"],"disciplinas":["Fisiologia","Histologia","Gastroenterologia"],"subtemas":[{"id":"fisiologia-gastrointestinal.secrecao-gastrica","nome":"Secreção gástrica"},{"id":"fisiologia-gastrointestinal.hormonios-gastrointestinais","nome":"Hormônios gastrointestinais"},{"id":"fisiologia-gastrointestinal.secrecao-pancreatica-e-biliar","nome":"Secreção pancreática e biliar"},{"id":"fisiologia-gastrointestinal.digestao-e-absorcao","nome":"Digestão e absorção"}],"objetivos":["Identificar as células da mucosa gástrica e seus produtos","Descrever as ações dos principais hormônios gastrointestinais","Explicar a digestão e a absorção dos nutrientes"],"resumo":"As células parietais do estômago secretam ácido clorídrico e fator intrínseco, e as células principais secretam pepsinogênio. A secretina, liberada pelas células S do duodeno em resposta ao quimo ácido, estimula secreção pancreática rica em bicarbonato, enquanto a colecistocinina estimula enzimas pancreáticas e a contração da vesícula. A absorção de nutrientes ocorre principalmente no intestino delgado."},{"id":"metabolismo-dos-carboidratos","nome":"Glicólise e metabolismo dos carboidratos","sinonimos":["glicólise","metabolismo energético"],"especialidades":["bioquimica","endocrinologia"],"disciplinas":["Bioquímica","Fisiologia","Endocrinologia"],"subtemas":[{"id":"metabolismo-dos-carboidratos.glicolise","nome":"Glicólise"},{"id":"metabolismo-dos-carboidratos.ciclo-de-krebs-e-cadeia-respiratoria","nome":"Ciclo de Krebs e cadeia respiratória"},{"id":"metabolismo-dos-carboidratos.gliconeogenese-e-glicogenio","nome":"Gliconeogênese e glicogênio"},{"id":"metabolismo-dos-carboidratos.via-das-pentoses-fosfato","nome":"Via das pentoses-fosfato"}],"objetivos":["Descrever as etapas e o saldo energético da glicólise","Explicar a integração entre glicólise, ciclo de Krebs e cadeia respiratória","Relacionar a via das pentoses-fosfato à produção de NADPH"],"resumo":"Na glicólise, uma molécula de glicose é convertida em duas de piruvato, com saldo líquido de 2 ATP e 2 NADH. Em aerobiose, o piruvato é oxidado no ciclo de Krebs e a cadeia respiratória gera a maior parte do ATP. A via das pentoses-fosfato produz NADPH, essencial para proteger a hemácia contra o estresse oxidativo."},{"id":"metabolismo-dos-lipidios","nome":"Metabolismo dos lipídios e dislipidemias","sinonimos":["colesterol","dislipidemia","hipercolesterolemia"],"especialidades":["bioquimica","cardiologia","endocrinologia"],"disciplinas":["Bioquímica","Farmacologia","Cardiologia","Clínica Médica"],"subtemas":[{"id":"metabolismo-dos-lipidios.sintese-de-colesterol","nome":"Síntese de colesterol"},{"id":"metabolismo-dos-lipidios.lipoproteinas","nome":"Lipoproteínas"},{"id":"metabolismo-dos-lipidios.beta-oxidacao-e-corpos-cetonicos","nome":"Beta-oxidação e corpos cetônicos"},{"id":"metabolismo-dos-lipidios.dislipidemias","nome":"Dislipidemias"}],"objetivos":["Descrever a síntese do colesterol e sua regulação","Caracterizar as lipoproteínas plasmáticas","Relacionar dislipidemias ao risco cardiovascular"],"resumo":"A HMG-CoA redutase é a enzima limitante da síntese de colesterol e é inibida pelas estatinas. Lipoproteínas como quilomícrons, VLDL, LDL e HDL transportam lipídios no plasma, e a elevação do LDL é fator de risco para aterosclerose. A beta-oxidação de ácidos graxos gera acetil-CoA, que no jejum prolongado origina corpos cetônicos no fígado."},{"id":"metabolismo-dos-aminoacidos","nome":"Metabolismo dos aminoácidos e ciclo da ureia","sinonimos":["ciclo da ureia"],"especialidades":["bioquimica"],"disciplinas":["Bioquímica","Pediatria"],"subtemas":[{"id":"metabolismo-dos-aminoacidos.transaminacao-e-desaminacao","nome":"Transaminação e desaminação"},{"id":"metabolismo-dos-aminoacidos.ciclo-da-ureia","nome":"Ciclo da ureia"},{"id":"metabolismo-dos-aminoacidos.erros-inatos-do-metabolismo","nome":"Erros inatos do metabolismo"}],"objetivos":["Descrever o destino do nitrogênio dos aminoácidos","Identificar as etapas e a regulação do ciclo da ureia","Reconhecer as consequências clínicas dos defeitos do ciclo da ureia"],"resumo":"O nitrogênio dos aminoácidos é eliminado principalmente como ureia, sintetizada no fígado. A carbamoil-fosfato sintetase I, ativada alostericamente pelo N-acetilglutamato, é a enzima limitante do ciclo da ureia. Defeitos enzimáticos nesse ciclo causam hiperamonemia."},{"id":"vitaminas","nome":"Vitaminas e deficiências nutricionais","sinonimos":["hipovitaminoses","escorbuto"],"especialidades":["bioquimica","pediatria-geral","medicina-de-familia"],"disciplinas":["Bioquímica","Nutrição","Pediatria","Clínica Médica"],"subtemas":[{"id":"vitaminas.vitaminas-hidrossoluveis","nome":"Vitaminas hidrossolúveis"},{"id":"vitaminas.vitaminas-lipossoluveis","nome":"Vitaminas lipossolúveis"},{"id":"vitaminas.escorbuto","nome":"Escorbuto"},{"id":"vitaminas.desnutricao","nome":"Desnutrição"}],"objetivos":["Relacionar cada vitamina à sua função bioquímica","Reconhecer os quadros clínicos das principais hipovitaminoses"],"resumo":"Vitaminas atuam como cofatores de reações enzimáticas, e suas deficiências geram quadros clínicos característicos. A vitamina C é necessária à hidroxilação de prolina e lisina na síntese do colágeno, e sua falta causa escorbuto, com sangramento gengival e fragilidade capilar. Deficiências de vitaminas A, D, B12 e folato também têm grande relevância clínica."},{"id":"tecido-epitelial","nome":"Tecido epitelial e membrana basal","sinonimos":["epitélios"],"especialidades":["histologia-embriologia","dermatologia"],"disciplinas":["Histologia","Patologia","Dermatologia"],"subtemas":[{"id":"tecido-epitelial.classificacao-dos-epitelios","nome":"Classificação dos epitélios"},{"id":"tecido-epitelial.membrana-basal","nome":"Membrana basal"},{"id":"tecido-epitelial.pele","nome":"Pele"}],"objetivos":["Classificar os epitélios quanto a camadas e forma celular","Descrever a composição da membrana basal","Descrever as camadas da pele"],"resumo":"Os epitélios são classificados pelo número de camadas e pela forma das células superficiais. A epiderme é um epitélio estratificado pavimentoso queratinizado. A lâmina basal, rica em colágeno tipo IV e laminina, separa o epitélio do tecido conjuntivo."},{"id":"tecido-nervoso","nome":"Tecido nervoso","sinonimos":["glia","mielina"],"especialidades":["histologia-embriologia","neurologia"],"disciplinas":["Histologia","Neuroanatomia","Neurologia"],"subtemas":[{"id":"tecido-nervoso.neuronios","nome":"Neurônios"},{"id":"tecido-nervoso.celulas-da-glia","nome":"Células da glia"},{"id":"tecido-nervoso.mielinizacao","nome":"Mielinização"}],"objetivos":["Descrever os componentes do tecido nervoso","Diferenciar as células da glia do sistema nervoso central e periférico"],"resumo":"O tecido nervoso é formado por neurônios e células da glia. No sistema nervoso central, a mielina é produzida pelos oligodendrócitos e, no periférico, pelas células de Schwann. Astrócitos, micróglia e células ependimárias completam a glia central."},{"id":"embriologia-geral","nome":"Folhetos embrionários e organogênese","sinonimos":["gastrulação","neurulação"],"especialidades":["histologia-embriologia","genetica"],"disciplinas":["Embriologia","Genética","Pediatria"],"subtemas":[{"id":"embriologia-geral.gastrulacao-e-folhetos-embrionarios","nome":"Gastrulação e folhetos embrionários"},{"id":"embriologia-geral.neurulacao","nome":"Neurulação"},{"id":"embriologia-geral.malformacoes-congenitas","nome":"Malformações congênitas"}],"objetivos":["Relacionar cada folheto embrionário aos órgãos que origina","Descrever a neurulação e os defeitos do tubo neural"],"resumo":"Na gastrulação formam-se ectoderma, mesoderma e endoderma. O sistema nervoso central origina-se do neuroectoderma pela neurulação, e falhas no fechamento do tubo neural causam defeitos como a espinha bífida. A suplementação periconcepcional de ácido fólico reduz o risco desses defeitos."},{"id":"circulacao-fetal","nome":"Circulação fetal e transição neonatal","sinonimos":[],"especialidades":["histologia-embriologia","neonatologia","cardiologia"],"disciplinas":["Embriologia","Fisiologia","Pediatria"],"subtemas":[{"id":"circulacao-fetal.shunts-fetais","nome":"Shunts fetais"},{"id":"circulacao-fetal.adaptacao-ao-nascimento","nome":"Adaptação ao nascimento"},{"id":"circulacao-fetal.estruturas-remanescentes","nome":"Estruturas remanescentes"}],"objetivos":["Descrever o trajeto do sangue na circulação fetal","Explicar as mudanças circulatórias ao nascimento","Identificar as estruturas remanescentes da circulação fetal"],"resumo":"Na circulação fetal, o sangue oxigenado chega pela veia umbilical e desvia do fígado e dos pulmões pelo ducto venoso, forame oval e canal arterial. Após o nascimento, esses desvios se fecham com a expansão pulmonar. A veia umbilical origina o ligamento redondo do fígado, e o ducto venoso, o ligamento venoso."},{"id":"cromossomopatias","nome":"Cromossomopatias","sinonimos":["síndrome de Down","trissomias"],"especialidades":["genetica","pediatria-geral"],"disciplinas":["Genética","Pediatria","Obstetrícia"],"subtemas":[{"id":"cromossomopatias.sindrome-de-down","nome":"Síndrome de Down"},{"id":"cromossomopatias.outras-trissomias","nome":"Outras trissomias"},{"id":"cromossomopatias.sindromes-de-turner-e-klinefelter","nome":"Síndromes de Turner e Klinefelter"},{"id":"cromossomopatias.rastreamento-pre-natal","nome":"Rastreamento pré-natal"}],"objetivos":["Explicar os mecanismos de alterações cromossômicas numéricas e estruturais","Reconhecer o quadro clínico das principais cromossomopatias"],"resumo":"Cromossomopatias resultam de alterações numéricas ou estruturais dos cromossomos. A síndrome de Down decorre, na maioria dos casos, de trissomia livre do cromossomo 21 por não disjunção na meiose materna, com risco crescente com a idade materna. Translocações robertsonianas e mosaicismo respondem por uma minoria dos casos."},{"id":"padroes-de-heranca","nome":"Padrões de herança mendeliana","sinonimos":["heredograma"],"especialidades":["genetica"],"disciplinas":["Genética","Pediatria"],"subtemas":[{"id":"padroes-de-heranca.heranca-autossomica","nome":"Herança autossômica"},{"id":"padroes-de-heranca.heranca-ligada-ao-x","nome":"Herança ligada ao X"},{"id":"padroes-de-heranca.heredograma","nome":"Heredograma"}],"objetivos":["Diferenciar os padrões de herança monogênica","Calcular riscos de recorrência a partir de heredogramas"],"resumo":"Doenças monogênicas seguem padrões autossômicos dominantes, autossômicos recessivos ou ligados ao X. Na herança recessiva ligada ao X, como na hemofilia A, um homem afetado transmite o alelo a todas as filhas, que serão portadoras, e a nenhum dos filhos. A análise do heredograma permite estimar riscos de recorrência."},{"id":"imunoglobulinas","nome":"Imunoglobulinas e resposta humoral","sinonimos":["anticorpos"],"especialidades":["imunologia"],"disciplinas":["Imunologia","Pediatria","Obstetrícia"],"subtemas":[{"id":"imunoglobulinas.classes-de-imunoglobulinas","nome":"Classes de imunoglobulinas"},{"id":"imunoglobulinas.resposta-primaria-e-secundaria","nome":"Resposta primária e secundária"},{"id":"imunoglobulinas.imunidade-passiva-materna","nome":"Imunidade passiva materna"}],"objetivos":["Diferenciar as classes de imunoglobulinas quanto a estrutura e função","Comparar as respostas humorais primária e secundária"],"resumo":"A IgM é a primeira imunoglobulina produzida na resposta primária e é um pentâmero eficiente na ativação do complemento. A IgG é a mais abundante no soro e a única que atravessa a placenta, conferindo imunidade passiva ao recém-nascido. A IgA predomina nas mucosas e no leite materno, e a IgE participa de reações alérgicas e da defesa contra helmintos."},{"id":"hipersensibilidade","nome":"Reações de hipersensibilidade e anafilaxia","sinonimos":["anafilaxia","alergia","Gell e Coombs"],"especialidades":["imunologia","medicina-de-urgencia"],"disciplinas":["Imunologia","Clínica Médica","Urgência e Emergência"],"subtemas":[{"id":"hipersensibilidade.tipo-i-imediata","nome":"Tipo I (imediata)"},{"id":"hipersensibilidade.tipo-ii","nome":"Tipo II"},{"id":"hipersensibilidade.tipo-iii","nome":"Tipo III"},{"id":"hipersensibilidade.tipo-iv","nome":"Tipo IV"},{"id":"hipersensibilidade.anafilaxia","nome":"Anafilaxia"}],"objetivos":["Classificar as reações de hipersensibilidade segundo Gell e Coombs","Explicar a fisiopatologia da anafilaxia","Reconhecer a anafilaxia como emergência"],"resumo":"A classificação de Gell e Coombs divide as reações de hipersensibilidade em quatro tipos. O tipo I é mediado por IgE ligada a mastócitos e basófilos e inclui a anafilaxia; o tipo II envolve anticorpos contra antígenos celulares; o tipo III, imunocomplexos; e o tipo IV, linfócitos T. A anafilaxia é uma emergência cujo tratamento de primeira linha é a adrenalina."},{"id":"imunidade-celular-e-mhc","nome":"Imunidade celular e MHC","sinonimos":["apresentação de antígenos","HLA"],"especialidades":["imunologia"],"disciplinas":["Imunologia"],"subtemas":[{"id":"imunidade-celular-e-mhc.mhc-classe-i-e-ii","nome":"MHC classe I e II"},{"id":"imunidade-celular-e-mhc.linfocitos-t-cd4-e-cd8","nome":"Linfócitos T CD4 e CD8"},{"id":"imunidade-celular-e-mhc.imunidade-inata","nome":"Imunidade inata"}],"objetivos":["Diferenciar a apresentação de antígenos por MHC de classe I e II","Descrever as funções dos linfócitos T CD4⁺ e CD8⁺"],"resumo":"Moléculas do MHC de classe I, presentes em quase todas as células nucleadas, apresentam peptídeos endógenos a linfócitos T CD8⁺. O MHC de classe II, expresso em células apresentadoras de antígeno, apresenta peptídeos a linfócitos T CD4⁺. Essa distinção explica a resposta contra vírus e tumores e a coordenação da resposta imune adaptativa."},{"id":"estafilococos-e-estreptococos","nome":"Cocos gram-positivos: estafilococos e estreptococos","sinonimos":["Staphylococcus aureus","Streptococcus"],"especialidades":["microbiologia","infectologia"],"disciplinas":["Microbiologia","Infectologia"],"subtemas":[{"id":"estafilococos-e-estreptococos.staphylococcus-aureus","nome":"Staphylococcus aureus"},{"id":"estafilococos-e-estreptococos.estafilococos-coagulase-negativos","nome":"Estafilococos coagulase-negativos"},{"id":"estafilococos-e-estreptococos.estreptococos","nome":"Estreptococos"},{"id":"estafilococos-e-estreptococos.provas-laboratoriais","nome":"Provas laboratoriais"}],"objetivos":["Diferenciar estafilococos e estreptococos por provas laboratoriais","Relacionar os principais cocos gram-positivos às doenças que causam"],"resumo":"Estafilococos são catalase-positivos e estreptococos, catalase-negativos. A coagulase diferencia Staphylococcus aureus dos estafilococos coagulase-negativos. S. aureus causa infecções de pele, osteomielite, endocardite e doenças mediadas por toxinas."},{"id":"tetano","nome":"Tétano","sinonimos":["Clostridium tetani"],"especialidades":["microbiologia","infectologia"],"disciplinas":["Microbiologia","Infectologia","Medicina de Família e Comunidade"],"subtemas":[{"id":"tetano.patogenese","nome":"Patogênese"},{"id":"tetano.quadro-clinico","nome":"Quadro clínico"},{"id":"tetano.prevencao-e-vacinacao","nome":"Prevenção e vacinação"}],"objetivos":["Explicar o mecanismo de ação da tetanospasmina","Reconhecer o quadro clínico do tétano","Descrever as medidas de prevenção"],"resumo":"O tétano é causado pela toxina do Clostridium tetani, cujos esporos penetram por ferimentos contaminados. A tetanospasmina bloqueia a liberação de glicina e GABA por interneurônios inibitórios da medula, gerando rigidez e espasmos musculares. A doença é prevenível por vacinação."},{"id":"antimicrobianos","nome":"Antimicrobianos","sinonimos":["antibióticos","penicilinas"],"especialidades":["farmacologia","infectologia"],"disciplinas":["Farmacologia","Microbiologia","Infectologia"],"subtemas":[{"id":"antimicrobianos.betalactamicos","nome":"Betalactâmicos"},{"id":"antimicrobianos.mecanismos-de-acao","nome":"Mecanismos de ação"},{"id":"antimicrobianos.resistencia-bacteriana","nome":"Resistência bacteriana"},{"id":"antimicrobianos.uso-racional","nome":"Uso racional"}],"objetivos":["Classificar os antimicrobianos pelo mecanismo de ação","Explicar os principais mecanismos de resistência bacteriana"],"resumo":"Antimicrobianos são classificados pelo mecanismo de ação: inibição da parede celular, da síntese proteica, dos ácidos nucleicos ou de vias metabólicas. Os betalactâmicos, como as penicilinas, ligam-se às proteínas ligadoras de penicilina e inibem a síntese do peptidoglicano, sendo bactericidas. O uso racional é fundamental para conter a resistência bacteriana."},{"id":"lesao-celular","nome":"Lesão celular, adaptação e necrose","sinonimos":["necrose","metaplasia","apoptose"],"especialidades":["patologia"],"disciplinas":["Patologia"],"subtemas":[{"id":"lesao-celular.adaptacoes-celulares","nome":"Adaptações celulares"},{"id":"lesao-celular.tipos-de-necrose","nome":"Tipos de necrose"},{"id":"lesao-celular.apoptose","nome":"Apoptose"},{"id":"lesao-celular.inflamacao","nome":"Inflamação"}],"objetivos":["Diferenciar as adaptações celulares","Relacionar os tipos de necrose aos tecidos e às causas","Diferenciar necrose de apoptose"],"resumo":"Diante de estímulos, as células podem adaptar-se por hipertrofia, hiperplasia, atrofia ou metaplasia, como no esôfago de Barrett. Quando a lesão é irreversível, ocorre necrose, cujos padrões incluem a coagulativa, a liquefativa (típica do infarto encefálico), a caseosa (tuberculose) e a gordurosa. A apoptose é uma morte celular programada, sem inflamação significativa."},{"id":"intoxicacoes-exogenas","nome":"Intoxicações exógenas e antídotos","sinonimos":["envenenamentos","toxicologia","síndromes toxicológicas"],"especialidades":["farmacologia","medicina-de-urgencia"],"disciplinas":["Farmacologia","Toxicologia","Urgência e Emergência"],"subtemas":[{"id":"intoxicacoes-exogenas.paracetamol","nome":"Paracetamol"},{"id":"intoxicacoes-exogenas.benzodiazepinicos-e-opioides","nome":"Benzodiazepínicos e opioides"},{"id":"intoxicacoes-exogenas.organofosforados-e-carbamatos","nome":"Organofosforados e carbamatos"},{"id":"intoxicacoes-exogenas.sindromes-toxicologicas","nome":"Síndromes toxicológicas"}],"objetivos":["Reconhecer as principais síndromes toxicológicas","Relacionar agentes tóxicos aos seus antídotos específicos"],"resumo":"O reconhecimento das síndromes toxicológicas (colinérgica, anticolinérgica, simpaticomimética, opioide e sedativo-hipnótica) orienta a abordagem inicial. Alguns agentes têm antídotos específicos: N-acetilcisteína para o paracetamol, flumazenil para benzodiazepínicos, naloxona para opioides e atropina para os efeitos muscarínicos dos organofosforados. A estabilização clínica precede e acompanha o uso de antídotos."},{"id":"antiagregantes-e-anticoagulantes","nome":"Antiagregantes plaquetários e anticoagulantes","sinonimos":["AAS","heparina","varfarina"],"especialidades":["farmacologia","hematologia","cardiologia"],"disciplinas":["Farmacologia","Hematologia","Cardiologia"],"subtemas":[{"id":"antiagregantes-e-anticoagulantes.acido-acetilsalicilico","nome":"Ácido acetilsalicílico"},{"id":"antiagregantes-e-anticoagulantes.inibidores-de-p2y12","nome":"Inibidores de P2Y12"},{"id":"antiagregantes-e-anticoagulantes.heparinas","nome":"Heparinas"},{"id":"antiagregantes-e-anticoagulantes.anticoagulantes-orais","nome":"Anticoagulantes orais"}],"objetivos":["Explicar o mecanismo de ação dos antiagregantes plaquetários","Comparar os mecanismos dos anticoagulantes parenterais e orais"],"resumo":"O ácido acetilsalicílico inibe irreversivelmente a COX-1 plaquetária, reduzindo a síntese de tromboxano A2 durante toda a vida da plaqueta. Inibidores de P2Y12 bloqueiam a ativação plaquetária pelo ADP. As heparinas potencializam a antitrombina, e os anticoagulantes orais atuam sobre os fatores dependentes de vitamina K ou inibem diretamente fatores da coagulação."},{"id":"exame-neurologico","nome":"Semiologia neurológica","sinonimos":["exame neurológico","sinal de Romberg"],"especialidades":["semiologia","neurologia"],"disciplinas":["Semiologia","Neurologia"],"subtemas":[{"id":"exame-neurologico.marcha-e-equilibrio","nome":"Marcha e equilíbrio"},{"id":"exame-neurologico.forca-e-reflexos","nome":"Força e reflexos"},{"id":"exame-neurologico.sensibilidade","nome":"Sensibilidade"},{"id":"exame-neurologico.coordenacao","nome":"Coordenação"}],"objetivos":["Executar as etapas do exame neurológico","Interpretar sinais semiológicos na localização de lesões"],"resumo":"O exame neurológico avalia estado mental, nervos cranianos, motricidade, reflexos, sensibilidade, coordenação e marcha. O sinal de Romberg é positivo quando o paciente mantém o equilíbrio de olhos abertos e oscila ou cai ao fechá-los, indicando ataxia sensitiva por déficit proprioceptivo. Na ataxia cerebelar, a instabilidade não depende significativamente da visão."},{"id":"hipertensao-arterial","nome":"Hipertensão arterial","sinonimos":["HAS","pressão alta","hipertensão arterial sistêmica"],"especialidades":["cardiologia","medicina-de-familia","nefrologia"],"disciplinas":["Fisiologia","Farmacologia","Clínica Médica","Cardiologia","Medicina de Família e Comunidade"],"subtemas":[{"id":"hipertensao-arterial.diagnostico","nome":"Diagnóstico"},{"id":"hipertensao-arterial.estratificacao-de-risco","nome":"Estratificação de risco"},{"id":"hipertensao-arterial.tratamento-nao-farmacologico","nome":"Tratamento não farmacológico"},{"id":"hipertensao-arterial.tratamento-farmacologico","nome":"Tratamento farmacológico"},{"id":"hipertensao-arterial.emergencias-hipertensivas","nome":"Emergências hipertensivas"}],"objetivos":["Definir hipertensão arterial e seus critérios diagnósticos","Explicar a fisiopatologia e as lesões de órgãos-alvo","Descrever as classes de anti-hipertensivos, seus mecanismos e efeitos adversos"],"resumo":"A hipertensão arterial é uma condição crônica multifatorial caracterizada por elevação sustentada da pressão arterial, confirmada por medidas repetidas. É importante fator de risco para AVC, doença coronariana, insuficiência cardíaca e doença renal crônica. O tratamento combina mudanças no estilo de vida e fármacos como IECA, BRA, diuréticos tiazídicos e bloqueadores dos canais de cálcio; os IECA podem causar tosse seca por acúmulo de bradicinina."},{"id":"insuficiencia-cardiaca","nome":"Insuficiência cardíaca","sinonimos":["IC","ICC"],"especialidades":["cardiologia"],"disciplinas":["Fisiologia","Farmacologia","Clínica Médica","Cardiologia"],"subtemas":[{"id":"insuficiencia-cardiaca.fisiopatologia","nome":"Fisiopatologia"},{"id":"insuficiencia-cardiaca.diagnostico-e-classificacao","nome":"Diagnóstico e classificação"},{"id":"insuficiencia-cardiaca.tratamento-cronico","nome":"Tratamento crônico"},{"id":"insuficiencia-cardiaca.insuficiencia-cardiaca-descompensada","nome":"Insuficiência cardíaca descompensada"}],"objetivos":["Explicar a fisiopatologia e os mecanismos compensatórios da insuficiência cardíaca","Classificar a insuficiência cardíaca pela fração de ejeção e pela classe funcional","Descrever as classes de fármacos que modificam o prognóstico"],"resumo":"A insuficiência cardíaca é uma síndrome em que o coração não mantém débito adequado ou o faz à custa de pressões de enchimento elevadas. Classifica-se pela fração de ejeção e pela classe funcional da NYHA. A ativação neuro-hormonal é central na fisiopatologia e é alvo das terapias que reduzem a mortalidade."},{"id":"sindrome-coronariana-aguda","nome":"Síndrome coronariana aguda","sinonimos":["SCA","infarto agudo do miocárdio","IAM","angina instável"],"especialidades":["cardiologia","medicina-de-urgencia"],"disciplinas":["Fisiologia","Patologia","Clínica Médica","Cardiologia","Urgência e Emergência"],"subtemas":[{"id":"sindrome-coronariana-aguda.angina-instavel-e-iam-sem-supra-de-st","nome":"Angina instável e IAM sem supra de ST"},{"id":"sindrome-coronariana-aguda.iam-com-supra-de-st","nome":"IAM com supra de ST"},{"id":"sindrome-coronariana-aguda.eletrocardiograma-e-localizacao","nome":"Eletrocardiograma e localização"},{"id":"sindrome-coronariana-aguda.marcadores-de-necrose","nome":"Marcadores de necrose"},{"id":"sindrome-coronariana-aguda.doenca-coronariana-cronica","nome":"Doença coronariana crônica"}],"objetivos":["Diferenciar as apresentações da síndrome coronariana aguda","Localizar a parede acometida pelo eletrocardiograma","Descrever os princípios da reperfusão e da terapia antitrombótica"],"resumo":"A síndrome coronariana aguda resulta geralmente da ruptura de placa aterosclerótica com trombose coronariana. Divide-se em IAM com supradesnivelamento de ST e síndromes sem supra (angina instável e IAM sem supra), diferenciadas pelo ECG e pelos marcadores de necrose miocárdica. Supradesnivelamento em DII, DIII e aVF indica acometimento da parede inferior."},{"id":"arritmias-cardiacas","nome":"Arritmias cardíacas","sinonimos":["fibrilação atrial","taquicardia","bradicardia"],"especialidades":["cardiologia","medicina-de-urgencia"],"disciplinas":["Fisiologia","Clínica Médica","Cardiologia","Urgência e Emergência"],"subtemas":[{"id":"arritmias-cardiacas.fibrilacao-atrial","nome":"Fibrilação atrial"},{"id":"arritmias-cardiacas.taquiarritmias","nome":"Taquiarritmias"},{"id":"arritmias-cardiacas.bradiarritmias","nome":"Bradiarritmias"},{"id":"arritmias-cardiacas.eletrocardiograma","nome":"Eletrocardiograma"}],"objetivos":["Reconhecer as principais arritmias no eletrocardiograma","Identificar sinais de instabilidade hemodinâmica","Explicar o risco tromboembólico da fibrilação atrial"],"resumo":"A fibrilação atrial é a arritmia sustentada mais comum e caracteriza-se no ECG por ausência de ondas P e intervalos RR irregulares. Aumenta o risco de eventos tromboembólicos, especialmente AVC. A presença de instabilidade hemodinâmica orienta a urgência do tratamento das arritmias."},{"id":"valvopatias","nome":"Valvopatias","sinonimos":["estenose aórtica","estenose mitral","febre reumática"],"especialidades":["cardiologia","semiologia"],"disciplinas":["Semiologia","Clínica Médica","Cardiologia"],"subtemas":[{"id":"valvopatias.estenose-aortica","nome":"Estenose aórtica"},{"id":"valvopatias.insuficiencia-aortica","nome":"Insuficiência aórtica"},{"id":"valvopatias.estenose-mitral","nome":"Estenose mitral"},{"id":"valvopatias.insuficiencia-mitral","nome":"Insuficiência mitral"},{"id":"valvopatias.febre-reumatica","nome":"Febre reumática"}],"objetivos":["Reconhecer os sopros das principais valvopatias","Relacionar etiologia, fisiopatologia e manifestações de cada valvopatia"],"resumo":"As valvopatias são reconhecidas pelas características dos sopros e confirmadas pelo ecocardiograma. A estenose aórtica produz sopro sistólico ejetivo, em diamante, no foco aórtico, irradiado para as carótidas. A febre reumática é causa importante de valvopatia mitral em países em desenvolvimento."},{"id":"endocardite-infecciosa","nome":"Endocardite infecciosa","sinonimos":[],"especialidades":["cardiologia","infectologia"],"disciplinas":["Clínica Médica","Cardiologia","Infectologia"],"subtemas":[{"id":"endocardite-infecciosa.etiologia","nome":"Etiologia"},{"id":"endocardite-infecciosa.criterios-diagnosticos","nome":"Critérios diagnósticos"},{"id":"endocardite-infecciosa.complicacoes","nome":"Complicações"}],"objetivos":["Identificar os principais agentes e fatores predisponentes","Descrever os critérios diagnósticos de Duke"],"resumo":"A endocardite infecciosa é a infecção do endocárdio, geralmente valvar, com formação de vegetações. Estafilococos, estreptococos e enterococos são os principais agentes. O diagnóstico baseia-se em hemoculturas, ecocardiograma e nos critérios de Duke."},{"id":"tromboembolismo-venoso","nome":"Tromboembolismo venoso","sinonimos":["TVP","TEP","embolia pulmonar","trombose venosa profunda"],"especialidades":["pneumologia","hematologia","cardiologia"],"disciplinas":["Clínica Médica","Pneumologia","Hematologia","Cirurgia"],"subtemas":[{"id":"tromboembolismo-venoso.fatores-de-risco","nome":"Fatores de risco"},{"id":"tromboembolismo-venoso.trombose-venosa-profunda","nome":"Trombose venosa profunda"},{"id":"tromboembolismo-venoso.tromboembolismo-pulmonar","nome":"Tromboembolismo pulmonar"},{"id":"tromboembolismo-venoso.profilaxia","nome":"Profilaxia"}],"objetivos":["Identificar os fatores de risco pela tríade de Virchow","Descrever a abordagem diagnóstica baseada na probabilidade clínica"],"resumo":"O tromboembolismo venoso engloba a trombose venosa profunda e o tromboembolismo pulmonar. Os fatores de risco seguem a tríade de Virchow: estase, lesão endotelial e hipercoagulabilidade. A avaliação diagnóstica combina probabilidade clínica pré-teste, D-dímero e exames de imagem."},{"id":"asma","nome":"Asma","sinonimos":["broncoespasmo"],"especialidades":["pneumologia","pediatria-geral"],"disciplinas":["Fisiologia","Farmacologia","Clínica Médica","Pneumologia","Pediatria"],"subtemas":[{"id":"asma.fisiopatologia","nome":"Fisiopatologia"},{"id":"asma.diagnostico","nome":"Diagnóstico"},{"id":"asma.tratamento-de-manutencao","nome":"Tratamento de manutenção"},{"id":"asma.crise-asmatica","nome":"Crise asmática"}],"objetivos":["Explicar a fisiopatologia inflamatória da asma","Diferenciar asma de DPOC pela espirometria","Reconhecer sinais de gravidade na crise"],"resumo":"A asma é uma doença inflamatória crônica das vias aéreas, com hiper-responsividade brônquica e obstrução variável ao fluxo aéreo. A espirometria demonstra obstrução com resposta ao broncodilatador. Os corticoides inalatórios são a base do controle da inflamação."},{"id":"dpoc","nome":"Doença pulmonar obstrutiva crônica","sinonimos":["DPOC","enfisema","bronquite crônica"],"especialidades":["pneumologia","medicina-de-familia"],"disciplinas":["Fisiologia","Clínica Médica","Pneumologia","Medicina de Família e Comunidade"],"subtemas":[{"id":"dpoc.fatores-de-risco","nome":"Fatores de risco"},{"id":"dpoc.diagnostico-e-espirometria","nome":"Diagnóstico e espirometria"},{"id":"dpoc.tratamento-estavel","nome":"Tratamento estável"},{"id":"dpoc.exacerbacoes","nome":"Exacerbações"}],"objetivos":["Relacionar o tabagismo à fisiopatologia da DPOC","Interpretar a espirometria no diagnóstico","Descrever a abordagem das exacerbações"],"resumo":"A DPOC caracteriza-se por limitação persistente ao fluxo aéreo, geralmente progressiva, associada principalmente ao tabagismo. O diagnóstico exige espirometria com relação VEF1/CVF menor que 0,70 após broncodilatador. A cessação do tabagismo é a intervenção que mais altera sua evolução."},{"id":"pneumonia","nome":"Pneumonia adquirida na comunidade","sinonimos":["PAC","pneumonia comunitária"],"especialidades":["pneumologia","infectologia","semiologia","pediatria-geral"],"disciplinas":["Semiologia","Microbiologia","Clínica Médica","Pneumologia","Pediatria"],"subtemas":[{"id":"pneumonia.sindrome-de-consolidacao","nome":"Síndrome de consolidação"},{"id":"pneumonia.etiologia","nome":"Etiologia"},{"id":"pneumonia.estratificacao-de-gravidade","nome":"Estratificação de gravidade"},{"id":"pneumonia.tratamento","nome":"Tratamento"},{"id":"pneumonia.pneumonia-na-infancia","nome":"Pneumonia na infância"}],"objetivos":["Reconhecer a síndrome de consolidação ao exame físico","Identificar os principais agentes etiológicos","Aplicar escores de gravidade como o CURB-65"],"resumo":"A pneumonia adquirida na comunidade é infecção do parênquima pulmonar, tendo o Streptococcus pneumoniae como principal agente bacteriano. A consolidação produz frêmito toracovocal aumentado, macicez e sopro tubário. Escores como o CURB-65 (confusão, ureia, frequência respiratória, pressão arterial e idade ≥ 65 anos) ajudam a definir o local de tratamento."},{"id":"tuberculose","nome":"Tuberculose","sinonimos":["TB","Mycobacterium tuberculosis","BAAR"],"especialidades":["infectologia","pneumologia","microbiologia","saude-publica-sus"],"disciplinas":["Microbiologia","Patologia","Clínica Médica","Infectologia","Pneumologia","Saúde Coletiva"],"subtemas":[{"id":"tuberculose.etiologia-e-diagnostico-microbiologico","nome":"Etiologia e diagnóstico microbiológico"},{"id":"tuberculose.patologia-e-granuloma","nome":"Patologia e granuloma"},{"id":"tuberculose.tratamento","nome":"Tratamento"},{"id":"tuberculose.infeccao-latente-e-contatos","nome":"Infecção latente e contatos"}],"objetivos":["Descrever a transmissão e a patogenia da tuberculose","Interpretar os exames diagnósticos (baciloscopia, cultura e teste molecular)","Descrever as fases do esquema básico de tratamento"],"resumo":"A tuberculose é causada pelo Mycobacterium tuberculosis, bacilo álcool-ácido resistente identificado pela coloração de Ziehl-Neelsen. A lesão característica é o granuloma com necrose caseosa. O esquema básico no Brasil tem fase intensiva com quatro fármacos (rifampicina, isoniazida, pirazinamida e etambutol) seguida de fase de manutenção."},{"id":"derrame-pleural","nome":"Derrame pleural","sinonimos":[],"especialidades":["pneumologia"],"disciplinas":["Semiologia","Clínica Médica","Pneumologia"],"subtemas":[{"id":"derrame-pleural.semiologia-do-derrame","nome":"Semiologia do derrame"},{"id":"derrame-pleural.criterios-de-light","nome":"Critérios de Light"},{"id":"derrame-pleural.causas-de-transudato-e-exsudato","nome":"Causas de transudato e exsudato"},{"id":"derrame-pleural.derrame-parapneumonico-e-empiema","nome":"Derrame parapneumônico e empiema"}],"objetivos":["Reconhecer o derrame pleural ao exame físico e na imagem","Aplicar os critérios de Light para diferenciar transudato de exsudato"],"resumo":"O derrame pleural é o acúmulo anormal de líquido no espaço pleural. Pelos critérios de Light, é exsudato quando há relação proteína pleural/sérica > 0,5, relação LDH pleural/sérica > 0,6 ou LDH pleural acima de dois terços do limite superior sérico. Transudatos sugerem causas sistêmicas, como insuficiência cardíaca, e exsudatos, causas locais, como infecção e neoplasia."},{"id":"diabetes-mellitus","nome":"Diabetes mellitus","sinonimos":["DM","diabetes","hiperglicemia"],"especialidades":["endocrinologia","medicina-de-familia"],"disciplinas":["Bioquímica","Fisiologia","Farmacologia","Clínica Médica","Endocrinologia","Medicina de Família e Comunidade"],"subtemas":[{"id":"diabetes-mellitus.diagnostico","nome":"Diagnóstico"},{"id":"diabetes-mellitus.tratamento","nome":"Tratamento"},{"id":"diabetes-mellitus.complicacoes-agudas","nome":"Complicações agudas"},{"id":"diabetes-mellitus.complicacoes-cronicas","nome":"Complicações crônicas"}],"objetivos":["Aplicar os critérios diagnósticos de diabetes","Diferenciar diabetes tipo 1 e tipo 2","Reconhecer e descrever a abordagem inicial das complicações agudas"],"resumo":"O diabetes mellitus é um grupo de distúrbios metabólicos caracterizados por hiperglicemia resultante de defeitos na secreção e/ou na ação da insulina. O diagnóstico usa glicemia de jejum, hemoglobina glicada ou teste oral de tolerância, confirmados em nova amostra na ausência de hiperglicemia inequívoca. A cetoacidose diabética tem como pilares a reposição volêmica, a insulinoterapia e a correção eletrolítica."},{"id":"doencas-da-tireoide","nome":"Doenças da tireoide","sinonimos":["hipotireoidismo","hipertireoidismo","tireoidite"],"especialidades":["endocrinologia"],"disciplinas":["Fisiologia","Clínica Médica","Endocrinologia"],"subtemas":[{"id":"doencas-da-tireoide.hipotireoidismo","nome":"Hipotireoidismo"},{"id":"doencas-da-tireoide.hipertireoidismo","nome":"Hipertireoidismo"},{"id":"doencas-da-tireoide.nodulos-tireoidianos","nome":"Nódulos tireoidianos"}],"objetivos":["Interpretar TSH e T4 livre nas disfunções tireoidianas","Reconhecer as manife
