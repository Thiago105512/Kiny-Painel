<style>
/* Tokens: papel de caderno, tinta de caneta azul, verde/vermelho de correção. */
:root{
  --paper:#F4F6F3; --sheet:#FFFFFF; --ink:#1A1E24; --ink2:#4A515C; --muted:#6B737E;
  --line:#DCE1DA; --line2:#EAEDE8; --pen:#2340B8; --pen-soft:#E4E8F8; --ok:#1C7C4A; --ok-soft:#E1F1E7;
  --bad:#B42318; --bad-soft:#FBE6E3; --warn:#8A5A00; --warn-soft:#FBF0D9; --track:#E6EAE4;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --read:"Source Serif 4",Georgia,"Times New Roman",serif;

  --r:8px; --nav-w:220px; --bar-h:60px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--paper:#13161B;--sheet:#1B1F26;--ink:#E8EAEE;--ink2:#B4BAC4;--muted:#8A919C;
  --line:#2C323B;--line2:#242932;--pen:#8FA3F5;--pen-soft:#232B4A;--ok:#5CC48A;--ok-soft:#173226;
  --bad:#F08A7E;--bad-soft:#3A1E1B;--warn:#E5B85C;--warn-soft:#352A14;--track:#2A2F37;}}
:root[data-theme="dark"]{
  color-scheme:dark;--paper:#13161B;--sheet:#1B1F26;--ink:#E8EAEE;--ink2:#B4BAC4;--muted:#8A919C;
  --line:#2C323B;--line2:#242932;--pen:#8FA3F5;--pen-soft:#232B4A;--ok:#5CC48A;--ok-soft:#173226;
  --bad:#F08A7E;--bad-soft:#3A1E1B;--warn:#E5B85C;--warn-soft:#352A14;--track:#2A2F37;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--display)}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--pen)}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
h1,h2,h3{text-wrap:balance}

/* ---------- Layout: barra superior + navegação lateral (desktop) / inferior (celular) ---------- */
.topo{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topo-in{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:1180px;margin:0 auto}
.marca{font:700 18px/1 var(--display);text-decoration:none;color:var(--ink);white-space:nowrap}
.marca span{color:var(--pen)}
.busca-topo{flex:1;min-width:0;display:flex}
.busca-topo input{width:100%;max-width:420px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.sync{font:11px var(--mono);color:var(--muted);white-space:nowrap}
.corpo{display:flex;max-width:1180px;margin:0 auto}
.lateral{width:var(--nav-w);flex:none;position:sticky;top:57px;align-self:flex-start;max-height:calc(100vh - 57px);overflow:auto;padding:14px 10px 30px}
.lateral a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;color:var(--ink2);text-decoration:none;font-weight:600;font-size:14px}
.lateral a[aria-current="page"]{background:var(--pen-soft);color:var(--pen)}
.lateral a:hover{background:var(--line2)}
.lateral .grupo{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.lateral .n{margin-left:auto;font:600 11px var(--mono);background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:1px 7px}
main{flex:1;min-width:0;padding-inline:16px;padding-block:14px 90px}
.inferior{display:none}
@media (max-width:860px){
  .lateral{display:none}
  .sync{display:none}
  .inferior{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .inferior a,.inferior button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--bar-h);background:none;border:0;color:var(--muted);text-decoration:none;font:600 11px var(--display);cursor:pointer;position:relative}
  .inferior [aria-current="page"]{color:var(--pen)}
  .inferior svg{width:22px;height:22px}
  .inferior .n{position:absolute;top:6px;right:calc(50% - 20px);font:600 10px var(--mono);background:var(--bad);color:var(--sheet);border-radius:999px;padding:0 5px}
  .busca-topo input{max-width:none}
  main{padding-block-end:calc(var(--bar-h) + 96px + env(safe-area-inset-bottom,0px))}
}
.icone{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Menu "Mais" (folha inferior no celular) */
.folha-fundo{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:40}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--sheet);border-radius:14px 14px 0 0;max-height:85vh;overflow:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.folha-lista{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.folha-lista a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink);font-weight:600;font-size:13px;text-align:center}
@media (min-width:861px){.folha{left:auto;right:16px;bottom:16px;width:min(480px,calc(100vw - 32px));border-radius:14px;border:1px solid var(--line)}}

/* ---------- Tipografia e blocos ---------- */
.crumbs{display:flex;flex-wrap:wrap;gap:4px;font:12px var(--mono);color:var(--muted);margin-bottom:8px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--pen);text-decoration:underline}
.crumbs span[aria-hidden]{opacity:.6}
.titulo{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin:0 0 14px}
.titulo h1{font:700 24px/1.15 var(--display);margin:0;letter-spacing:-.01em}
.titulo .sub{color:var(--muted);font-size:13px;width:100%}
h2.sec{font:700 17px var(--display);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
h2.sec:first-child{margin-top:0}
h3{font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px}
.muted{color:var(--muted)} .small{font-size:13px}
.leitura{font:400 16px/1.6 var(--read);max-width:68ch;white-space:pre-wrap}
.lab{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:4px}
.caixa{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px}
.caixa+.caixa{margin-top:12px}
.aviso{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:6px;padding:10px 12px;font-size:13px;color:var(--ink);margin-bottom:12px}
.aviso.info{border-left-color:var(--pen);background:var(--pen-soft)}
.vazio{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--ink2);display:grid;gap:10px;justify-items:start}
.vazio p{margin:0;font:400 15px/1.5 var(--read)}
.grid{display:grid;gap:12px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.entre{justify-content:space-between}
.pilha{display:grid;gap:12px}

/* ---------- Controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.azul{background:var(--pen);border-color:var(--pen);color:#fff}
.btn.perigo{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.mini{min-height:32px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;min-height:34px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
select,input[type=text],input[type=search],input[type=number],input[type=date],input[type=url],textarea{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;max-width:100%;min-height:40px}
textarea{width:100%;resize:vertical}
.campo{display:grid;gap:4px;min-width:0}
.campos{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--pen);width:18px;height:18px;flex:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.tabs button,.tabs a{font:600 14px var(--display);background:none;border:0;color:var(--ink2);padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;text-decoration:none}
.tabs [aria-selected="true"]{color:var(--pen);border-bottom-color:var(--pen)}
details.filtros{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px}
details.filtros summary{cursor:pointer;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--mono);border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.pill.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.pill.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.pill.azul{color:var(--pen);border-color:var(--pen);background:var(--pen-soft)}

/* ---------- Tabelas (rolam dentro do próprio contêiner) ---------- */
.tabela-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sheet)}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px;white-space:nowrap}
tr.clic{cursor:pointer} tr.clic:hover td{background:var(--line2)}
td a{text-decoration:none;font-weight:600}
@media (max-width:560px){table.resp thead{display:none} table.resp tr{display:block;border-bottom:1px solid var(--line2);padding:6px 0} table.resp td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 12px} table.resp td::before{content:attr(data-l);font:600 11px var(--mono);color:var(--muted);text-transform:uppercase} table.resp td.num{text-align:right}}

/* ---------- Números e barras ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:6px}
.kpi{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi b{display:block;font:700 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font:12px var(--mono);color:var(--muted)}
.kpi a{text-decoration:none;color:inherit}
.meter{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--pen);border-radius:3px}
.meter.ok i{background:var(--ok)} .meter.bad i{background:var(--bad)}
.barras{display:grid;gap:10px}
.barra{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:baseline}
.barra .meter{grid-column:1/-1}
.barra small{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.colunas{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);align-items:end;gap:6px;height:120px;padding-top:18px}
.colunas .col{min-width:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;position:relative}
.colunas .col i{display:block;width:100%;max-width:28px;background:var(--pen);border-radius:4px 4px 0 0;min-height:2px}
.colunas .col.hoje i{background:var(--ink)}
.colunas .col em{font:600 10px var(--mono);font-style:normal;color:var(--ink2);font-variant-numeric:tabular-nums}
.colunas .col small{font:10px var(--mono);color:var(--muted)}
@media (max-width:560px){.colunas{gap:2px}.colunas .col em,.colunas .col small{font-size:8px}}

/* ---------- Questão ---------- */
.questao .meta{font:12px var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:10px}
.enunciado{font:400 18px/1.55 var(--read);margin:0 0 16px;white-space:pre-wrap}
.alts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.alt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer;font:400 16px/1.45 var(--read);min-height:48px}
.alt:hover:not(:disabled){border-color:var(--pen)}
.bolha{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink2);display:grid;place-items:center;font:600 12px var(--mono);color:var(--ink2)}
.alt[data-s="sel"]{border-color:var(--pen);background:var(--pen-soft)}
.alt[data-s="sel"] .bolha{background:var(--pen);border-color:var(--pen);color:var(--sheet)}
.alt[data-s="ok"]{border-color:var(--ok);background:var(--ok-soft)}
.alt[data-s="ok"] .bolha{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.alt[data-s="bad"]{border-color:var(--bad);background:var(--bad-soft)}
.alt[data-s="bad"] .bolha{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.alt:disabled{cursor:default}
.retorno{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.veredito{font:700 15px var(--display);margin:0 0 6px}
.veredito.ok{color:var(--ok)} .veredito.bad{color:var(--bad)}
.acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.acoes .dir{margin-left:auto}
.cartao{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.cartao button{font:600 12px var(--mono);border:1px solid var(--line);background:var(--sheet);border-radius:6px;min-height:36px;cursor:pointer;font-variant-numeric:tabular-nums}
.cartao button[data-f="1"]{background:var(--pen-soft);border-color:var(--pen);color:var(--pen)}
.cartao button[aria-current="true"]{outline:2px solid var(--ink);outline-offset:1px}
.provabar{position:sticky;top:57px;z-index:5;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;margin-bottom:10px;border-bottom:1px dashed var(--line)}
.relogio{font:600 18px var(--mono);font-variant-numeric:tabular-nums}
.relogio.pouco{color:var(--bad)}

/* ---------- Flashcard ---------- */
.fc{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px;min-height:180px;display:grid;align-content:start;gap:12px}
.fc .frente{font:400 19px/1.5 var(--read);white-space:pre-wrap}
.fc .verso{font:400 17px/1.55 var(--read);white-space:pre-wrap;border-top:1px dashed var(--line);padding-top:12px}
.notas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.notas .btn{flex-direction:column;gap:0;min-height:52px}
.notas small{font:11px var(--mono);opacity:.8}

/* ---------- Caso clínico ---------- */
.caso-sec{border-top:1px solid var(--line2);padding-block:12px}
.caso-sec h3{margin-top:0}

/* ---------- Assistente ---------- */
.ia-txt{font:400 15px/1.55 var(--read);white-space:pre-wrap;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:50vh;overflow:auto}
.ia-ctx{font:12px var(--mono);color:var(--muted)}
.fab{position:fixed;right:16px;bottom:calc(var(--bar-h) + 14px + env(safe-area-inset-bottom,0px));z-index:19;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
@media (min-width:861px){.fab{bottom:20px}}

/* ---------- Calendário do planejador ---------- */
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mes .dia{min-height:62px;border:1px solid var(--line2);border-radius:6px;padding:4px;font:12px var(--mono);background:var(--sheet);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.mes .dia.fora{opacity:.4}
.mes .dia.hoje{border-color:var(--pen)}
.mes .dia b{font-weight:600}
.mes .dia i{font-style:normal;font-size:10px;color:var(--pen);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mes .dow{font:600 10px var(--mono);color:var(--muted);text-align:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar-h) + 20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;z-index:50;font-size:14px;max-width:calc(100vw - 32px)}
@media (min-width:861px){.toast{bottom:24px}}
.mm{font:13px/1.6 var(--mono);white-space:pre;overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .3s ease}}

/* Ajustes finos */
main:focus{outline:none}
.grid>.caixa+.caixa,.grid>.caixa{margin-top:0}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis .kpi:last-child:nth-child(odd){grid-column:1/-1}}
@media (max-width:860px){.fab{width:52px;height:52px;padding:0;font-size:0;gap:0}.fab .icone{width:22px;height:22px}}

/* Mapa mental (árvore) */
.arvore,.arvore ul{list-style:none;margin:0;padding:0}
.arvore ul{padding-left:16px}
.arvore li{position:relative;padding:4px 0 4px 16px}
.arvore li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1.5px solid var(--line)}
.arvore li::after{content:"";position:absolute;left:0;top:18px;width:12px;border-top:1.5px solid var(--line)}
.arvore li:last-child::before{bottom:auto;height:18px}
.arvore>li{padding-left:0}.arvore>li::before,.arvore>li::after{display:none}
.arvore summary{cursor:pointer;list-style:none;display:inline}
.arvore summary::-webkit-details-marker{display:none}
.arvore .no{display:inline-block;max-width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 9px;background:var(--sheet);font-size:14px;line-height:1.35;vertical-align:top}
.arvore .no a{text-decoration:none;font-weight:600}
.arvore .no small{color:var(--muted);font:11px var(--mono)}
.arvore>li>details>summary .no{font-weight:700;font-size:16px;border-color:var(--pen);color:var(--pen);background:var(--pen-soft)}
.arvore .no.ok{border-color:var(--ok);background:var(--ok-soft)}
.arvore .no.bad{border-color:var(--bad);background:var(--bad-soft)}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0 0 10px}

</style>

rkheim","subtema":"Fato social","disciplina":"Sociologia","areaEnem":"humanas","dificuldade":1,"fonte":"autoral"},{"id":"ene-0853b5d1","area":"Português","enunciado":"Em \"Aquele rapaz é uma fera no xadrez\", a figura de linguagem é:","alternativas":["Metonímia","Hipérbole","Metáfora","Antítese","Eufemismo"],"correta":2,"explicacao":"Comparação implícita (sem \"como\"): o rapaz é associado a uma fera pela habilidade.","tema":"enem-figuras-de-linguagem","subtema":"Metáfora","disciplina":"Português","areaEnem":"linguagens","dificuldade":1,"fonte":"autoral"},{"id":"ene-3b7c9ac5","area":"Literatura","enunciado":"Macunaíma, \"o herói sem nenhum caráter\", é obra de qual autor modernista?","alternativas":["Oswald de Andrade","Mário de Andrade","Carlos Drummond","Graciliano Ramos","Manuel Bandeira"],"correta":1,"explicacao":"Mário de Andrade (1928), rapsódia que mistura lendas indígenas, folclore e crítica à identidade nacional.","tema":"enem-lit-modernismo-primeira-fase","subtema":"Mário de Andrade","disciplina":"Literatura","areaEnem":"linguagens","dificuldade":1,"fonte":"autoral"},{"id":"ene-79ffec4b","area":"Redação","enunciado":"Na redação do ENEM, a competência 5 avalia:","alternativas":["Domínio da norma culta","Coesão textual","Proposta de intervenção","Compreensão do tema","Organização dos argumentos"],"correta":2,"explicacao":"C5: proposta com agente, ação, meio/modo, finalidade e detalhamento, respeitando os direitos humanos.","tema":"enem-redacao-competencias","subtema":"Competência 5","disciplina":"Redação","areaEnem":"redacao","dificuldade":1,"fonte":"autoral"},{"id":"ene-0b187b51","area":"Matemática","enunciado":"Uma progressão aritmética tem primeiro termo 3 e razão 4. Qual é o seu 20º termo?","alternativas":["79","83","80","76","75"],"correta":0,"explicacao":"aₙ = a₁ + (n − 1)r = 3 + 19 × 4 = 79. Usar 20 × 4 + 3 = 83 é o erro clássico de esquecer o (n − 1).","tema":"enem-mat-progressoes","subtema":"Progressão aritmética (PA)","disciplina":"Matemática","areaEnem":"matematica","dificuldade":1,"fonte":"autoral"},{"id":"ene-cd805bd1","area":"Matemática","enunciado":"A altura, em metros, de um objeto lançado é dada por h(t) = −t² + 6t + 5, com t em segundos. Qual a altura máxima atingida?","alternativas":["5 m","14 m","3 m","9 m","23 m"],"correta":1,"explicacao":"O vértice ocorre em t = −b/2a = 3 s; h(3) = −9 + 18 + 5 = 14 m. O valor 3 é o instante do máximo, não a altura.","tema":"enem-mat-funcoes","subtema":"Função quadrática","disciplina":"Matemática","areaEnem":"matematica","dificuldade":2,"fonte":"autoral"},{"id":"ene-c50ec98e","area":"Matemática","enunciado":"Uma caixa-d'água cilíndrica tem raio interno de 2 m e altura de 3 m. Usando π = 3, sua capacidade é de:","alternativas":["18.000 litros","12.000 litros","36.000 litros","108.000 litros","3.600 litros"],"correta":2,"explicacao":"V = πr²h = 3 × 2² × 3 = 36 m³. Como 1 m³ = 1.000 L, a capacidade é de 36.000 litros.","tema":"enem-mat-geometria-espacial","subtema":"Cilindro","disciplina":"Matemática","areaEnem":"matematica","dificuldade":2,"fonte":"autoral"},{"id":"ene-50243a22","area":"Matemática","enunciado":"De um grupo de 6 estudantes, deseja-se formar uma comissão de 3 membros, sem cargos distintos. Quantas comissões diferentes são possíveis?","alternativas":["120","18","216","20","60"],"correta":3,"explicacao":"A ordem não importa, então é combinação: C(6,3) = 6!/(3!·3!) = 20. O valor 120 seria arranjo (ordem importando).","tema":"enem-mat-analise-combinatoria","subtema":"Combinação","disciplina":"Matemática","areaEnem":"matematica","dificuldade":2,"fonte":"autoral"},{"id":"ene-0745e142","area":"Matemática","enunciado":"Em um mapa na escala 1:250.000, a distância entre duas comunidades ribeirinhas é de 4 cm. A distância real é de:","alternativas":["1 km","100 km","25 km","62,5 km","10 km"],"correta":4,"explicacao":"4 cm × 250.000 = 1.000.000 cm = 10.000 m = 10 km.","tema":"enem-mat-razao-proporcao","subtema":"Escalas","disciplina":"Matemática","areaEnem":"matematica","dificuldade":2,"fonte":"autoral"},{"id":"ene-71bd5a67","area":"Matemática","enunciado":"Uma rampa de acessibilidade vence uma altura de 6 m ao longo de uma distância horizontal de 8 m. Qual o comprimento da rampa?","alternativas":["10 m","14 m","12 m","7 m","9 m"],"correta":0,"explicacao":"Pelo teorema de Pitágoras: c² = 6² + 8² = 36 + 64 = 100, logo c = 10 m. Somar os catetos (14 m) é a pegadinha.","tema":"enem-mat-geometria-plana","subtema":"Teorema de Pitágoras","disciplina":"Matemática","areaEnem":"matematica","dificuldade":1,"fonte":"autoral"},{"id":"ene-147e590d","area":"Matemática","enunciado":"Uma cultura começa com 500 bactérias, e a população dobra a cada 3 horas. Quantas bactérias haverá após 12 horas?","alternativas":["4.000","8.000","2.000","16.000","6.000"],"correta":1,"explicacao":"Em 12 h ocorrem 12/3 = 4 duplicações: 500 × 2⁴ = 500 × 16 = 8.000. Multiplicar 500 por 12 trata o crescimento como linear.","tema":"enem-mat-funcoes","subtema":"Função exponencial","disciplina":"Matemática","areaEnem":"matematica","dificuldade":2,"fonte":"autoral"},{"id":"ene-45cbc305","area":"Matemática","enunciado":"Um aluno tirou 7 na prova de peso 2, 8 na prova de peso 3 e 4 no trabalho de peso 1. Sua média ponderada é:","alternativas":["6,33","6,5","7,0","7,5","8,0"],"correta":2,"explicacao":"Média ponderada = (7·2 + 8·3 + 4·1)/(2 + 3 + 1) = (14 + 24 + 4)/6 = 42/6 = 7,0. O valor 6,33 é a média aritmética simples.","tema":"enem-mat-estatistica","subtema":"Média aritmética e ponderada","disciplina":"Matemática","areaEnem":"matematica","dificuldade":2,"fonte":"autoral"},{"id":"ene-d6755292","area":"Matemática","enunciado":"Um empréstimo de R$ 2.000,00 foi feito a juros simples de 3% ao mês, por 5 meses. O montante a pagar é:","alternativas":["R$ 2.318,55","R$ 2.030,00","R$ 2.150,00","R$ 2.300,00","R$ 2.600,00"],"correta":3,"explicacao":"J = C·i·t = 2000 × 0,03 × 5 = 300; M = 2.300. O valor R$ 2.318,55 corresponderia a juros compostos (2000 × 1,03⁵).","tema":"enem-mat-matematica-financeira","subtema":"Juros simples","disciplina":"Matemática","areaEnem":"matematica","dificuldade":1,"fonte":"autoral"},{"id":"ene-72ded741","area":"Matemática","enunciado":"Uma urna tem 4 bolas azuis e 6 vermelhas. Retiram-se 2 bolas, sem reposição. Qual a probabilidade de ambas serem azuis?","alternativas":["4/25","1/5","2/5","1/15","2/15"],"correta":4,"explicacao":"P = 4/10 × 3/9 = 12/90 = 2/15. O valor 4/25 seria com reposição (4/10 × 4/10).","tema":"enem-mat-probabilidade","subtema":"Eventos sucessivos e independentes","disciplina":"Matemática","areaEnem":"matematica","dificuldade":3,"fonte":"autoral"},{"id":"ene-75f308b7","area":"Física","enunciado":"Um chuveiro de 5.500 W é usado 20 minutos por dia durante 30 dias. O consumo mensal de energia é de:","alternativas":["55 kWh","165 kWh","110 kWh","5,5 kWh","3.300 kWh"],"correta":0,"explicacao":"E = P·t = 5,5 kW × (1/3 h) × 30 = 55 kWh. Usar 20 h em vez de 20 min, ou esquecer de converter minutos em horas, gera os valores distorcidos.","tema":"enem-fis-eletrodinamica","subtema":"Potência e consumo de energia elétrica","disciplina":"Física","areaEnem":"natureza","dificuldade":3,"fonte":"autoral"},{"id":"ene-0465f4cd","area":"Física","enunciado":"Um objeto é abandonado do repouso a 45 m de altura. Desprezando a resistência do ar e adotando g = 10 m/s², o tempo de queda é:","alternativas":["4,5 s","3 s","9 s","2 s","1,5 s"],"correta":1,"explicacao":"h = gt²/2 ⇒ 45 = 5t² ⇒ t² = 9 ⇒ t = 3 s.","tema":"enem-fis-cinematica","subtema":"Queda livre","disciplina":"Física","areaEnem":"natureza","dificuldade":2,"fonte":"autoral"},{"id":"ene-f9c6222f","area":"Física","enunciado":"Uma rádio FM transmite na frequência de 100 MHz. Sabendo que as ondas de rádio se propagam a 3 × 10⁸ m/s, o comprimento de onda é:","alternativas":["0,3 m","30 m","3 m","3,3 m","300 m"],"correta":2,"explicacao":"v = λf ⇒ λ = 3 × 10⁸ / 1 × 10⁸ = 3 m (lembrando que 100 MHz = 10⁸ Hz).","tema":"enem-fis-ondulatoria","subtema":"Equação fundamental (v = λ·f)","disciplina":"Física","areaEnem":"natureza","dificuldade":2,"fonte":"autoral"},{"id":"ene-45b6e2fd","area":"Física","enunciado":"Quanto calor é necessário para aquecer 500 g de água de 20 °C até 80 °C? (calor específico da água: 1 cal/g·°C)","alternativas":["40.000 cal","10.000 cal","3.000 cal","30.000 cal","60.000 cal"],"correta":3,"explicacao":"Q = m·c·ΔT = 500 × 1 × (80 − 20) = 30.000 cal. Usar a temperatura final (80) em vez da variação dá 40.000 cal.","tema":"enem-fis-termologia","subtema":"Calorimetria","disciplina":"Física","areaEnem":"natureza","dificuldade":1,"fonte":"autoral"},{"id":"ene-7bb80274","area":"Física","enunciado":"Um canudo mergulhado parcialmente num copo com água parece 'quebrado' na superfície do líquido. Esse efeito se deve à:","alternativas":["reflexão total da luz","difração da luz","polarização da luz","interferência da luz","refração da luz"],"correta":4,"explicacao":"Ao passar da água para o ar, a luz muda de velocidade e de direção (refração), e o observador vê a parte submersa numa posição aparente diferente.","tema":"enem-fis-optica","subtema":"Refração da luz","disciplina":"Física","areaEnem":"natureza","dificuldade":2,"fonte":"autoral"},{"id":"ene-640e27a3","area":"Física","enunciado":"Considere que cada 10 m de profundidade na água acrescentam cerca de 1 atm de pressão. A pressão total (absoluta) sobre um mergulhador a 20 m de profundidade, ao nível do mar, é de aproximadamente:","alternativas":["3 atm","2 atm","1 atm","20 atm","4 atm"],"correta":0,"explicacao":"Pressão absoluta = pressão atmosférica + pressão da coluna d'água = 1 atm + 2 atm = 3 atm. Os 2 atm seriam só a pressão hidrostática (manométrica).","tema":"enem-fis-hidrostatica","subtema":"Teorema de Stevin","disciplina":"Física","areaEnem":"natureza","dificuldade":2,"fonte":"autoral"},{"id":"ene-f7a2d82d","area":"Química","enunciado":"Na equação da combustão completa do metano, CH₄ + O₂ → CO₂ + H₂O, balanceada com os menores coeficientes inteiros, a soma dos coeficientes é:","alternativas":["4","6","5","7","8"],"correta":1,"explicacao":"Balanceando: CH₄ + 2 O₂ → CO₂ + 2 H₂O. Soma = 1 + 2 + 1 + 2 = 6.","tema":"enem-qui-estequiometria","subtema":"Balanceamento de equações","disciplina":"Química","areaEnem":"natureza","dificuldade":2,"fonte":"autoral"},{"id":"ene-173f5b26","area":"Química","enunciado":"Dissolvem-se 20 g de cloreto de sódio em água até completar 500 mL de solução. A concentração comum é de:","alternativas":["10 g/L","20 g/L","40 g/L","0,04 g/L","4 g/L"],"correta":2,"explicacao":"C = m/V = 20 g / 0,5 L = 40 g/L. Dividir por 500 sem converter mL em L leva a 0,04 g/L.","tema":"enem-qui-solucoes","subtema":"Concentração comum","disciplina":"Química","areaEnem":"natureza","dificuldade":1,"fonte":"autoral"},{"id":"ene-2141df2e","area":"Química","enunciado":"100 mL de uma solução de HCl 2 mol/L são diluídos com água até 500 mL. A nova concentração é:","alternativas":["1 mol/L","0,2 mol/L","10 mol/L","0,4 mol/L","0,5 mol/L"],"correta":3,"explicacao":"Na diluição o número de mols se conserva: C₁V₁ = C₂V₂ ⇒ 2 × 100 = C₂ × 500 ⇒ C₂ = 0,4 mol/L.","tema":"enem-qui-solucoes","subtema":"Diluição e mistura","disciplina":"Química","areaEnem":"natureza","dificuldade":2,"fonte":"autoral"},{"id":"ene-7b70b230","area":"Química","enunciado":"O etanol (CH₃CH₂OH), combustível produzido a partir da cana-de-açúcar, pertence à função orgânica:","alternativas":["fenol","ácido carboxílico","aldeído","éter","álcool"],"correta":4,"explicacao":"O etanol possui hidroxila (−OH) ligada a carbono saturado, característica dos álcoois. No fenol a hidroxila está ligada a anel aromático.","tema":"enem-qui-organica","subtema":"Funções oxigenadas","disciplina":"Química","areaEnem":"natureza","dificuldade":1,"fonte":"autoral"},{"id":"ene-98b047cc","area":"Química","enunciado":"Na reação 2 H₂ + O₂ → 2 H₂O, qual a massa de água formada a partir de 4 g de hidrogênio, com oxigênio em excesso? (H = 1; O = 16)","alternativas":["36 g","18 g","72 g","32 g","4 g"],"correta":0,"explicacao":"4 g de H₂ (2 g/mol) = 2 mol; a proporção H₂ : H₂O é 1 : 1, logo formam-se 2 mol de água = 2 × 18 g = 36 g.","tema":"enem-qui-estequiometria","subtema":"Cálculo estequiométrico","disciplina":"Química","areaEnem":"natureza","dificuldade":2,"fonte":"autoral"},{"id":"ene-6801db77","area":"Química","enunciado":"Um isótopo radioativo tem meia-vida de 5 anos. Partindo de 80 g dessa amostra, quanto dela restará após 15 anos?","alternativas":["20 g","10 g","40 g","5 g","26,7 g"],"correta":1,"explicacao":"15 anos correspondem a 3 meias-vidas: 80 → 40 → 20 → 10 g. Dividir 80 por 3 (26,7 g) trata o decaimento como linear.","tema":"enem-qui-radioatividade","subtema":"Meia-vida","disciplina":"Química","areaEnem":"natureza","dificuldade":2,"fonte":"autoral"},{"id":"ene-a4a44250","area":"Biologia","enunciado":"Uma mulher de sangue tipo O tem filhos com um homem de sangue tipo AB. Quais tipos sanguíneos (sistema ABO) os filhos podem ter?","alternativas":["apenas O","A, B ou AB","A ou B","A, B, AB ou O","apenas AB"],"correta":2,"explicacao":"A mãe é ii e o pai IᴬIᴮ; os filhos serão Iᴬi (tipo A) ou Iᴮi (tipo B). Nenhum pode ser O nem AB.","tema":"enem-bio-genetica","subtema":"Grupos sanguíneos (ABO e Rh)","disciplina":"Biologia","areaEnem":"natureza","dificuldade":2,"fonte":"autoral"},{"id":"ene-a37fda44","area":"Biologia","enunciado":"Na fotossíntese, o gás oxigênio liberado pelas plantas é proveniente:","alternativas":["do gás carbônico absorvido","da degradação da glicose","da decomposição da clorofila","da quebra das moléculas de água","da síntese de ATP"],"correta":3,"explicacao":"O O₂ vem da fotólise da água na fase clara (dependente de luz). O carbono do CO₂ é incorporado à glicose, não liberado como O₂.","tema":"enem-bio-bioenergetica","subtema":"Fotossíntese","disciplina":"Biologia","areaEnem":"natureza","dificuldade":3,"fonte":"autoral"},{"id":"ene-3079253c","area":"Biologia","enunciado":"A pirâmide de energia de um ecossistema nunca é invertida. Isso ocorre porque:","alternativas":["os consumidores produzem mais energia que os produtores","a energia é reciclada pelos decompositores e volta aos produtores","o número de indivíduos sempre diminui nos níveis superiores","os produtores armazenam toda a energia que recebem do Sol","a cada nível trófico parte da energia é perdida, sobretudo como calor"],"correta":4,"explicacao":"O fluxo de energia é unidirecional e, em cada nível, grande parte é dissipada na respiração como calor; por isso cada nível tem menos energia que o anterior. Diferente da matéria, a energia não é reciclada.","tema":"enem-bio-ecologia","subtema":"Pirâmides ecológicas","disciplina":"Biologia","areaEnem":"natureza","dificuldade":2,"fonte":"autoral"},{"id":"ene-5536f0ff","area":"Biologia","enunciado":"O uso indiscriminado de antibióticos tem aumentado a frequência de bactérias resistentes. A explicação evolutiva mais adequada é que:","alternativas":["o antibiótico seleciona bactérias que já eram resistentes, que sobrevivem e se reproduzem","o antibiótico induz as bactérias a desenvolverem resistência por necessidade","as bactérias se acostumam ao remédio e transmitem esse hábito","o uso frequente fortalece as bactérias, como um músculo exercitado","o antibiótico transforma bactérias em vírus resistentes"],"correta":0,"explicacao":"Pela seleção natural (darwinismo), as variantes resistentes já existiam por mutação ao acaso; o antibiótico elimina as sensíveis e favorece as resistentes. A ideia de adquirir resistência por necessidade é lamarckista.","tema":"enem-bio-evolucao","subtema":"Darwinismo e seleção natural","disciplina":"Biologia","areaEnem":"natureza","dificuldade":2,"fonte":"autoral"},{"id":"ene-e39bef34","area":"Biologia","enunciado":"Antibióticos não são indicados para tratar a gripe comum porque:","alternativas":["a gripe é causada por bactérias muito resistentes","a gripe é causada por vírus, e não por bactérias","os antibióticos só atuam contra fungos","o vírus da gripe possui parede celular muito espessa","a gripe é uma doença genética"],"correta":1,"explicacao":"Antibióticos atuam em estruturas e processos de bactérias (como parede celular e ribossomos bacterianos). Vírus são acelulares e se replicam dentro das células do hospedeiro.","tema":"enem-bio-microbiologia","subtema":"Antibióticos","disciplina":"Biologia","areaEnem":"natureza","dificuldade":1,"fonte":"autoral"},{"id":"ene-a83e11fc","area":"Biologia","enunciado":"A Floresta Amazônica é exuberante, embora grande parte de seus solos de terra firme seja pobre em nutrientes. Isso se explica principalmente:","alternativas":["pela alta fertilidade das rochas profundas","pelo uso de fertilizantes naturais trazidos pelos rios","pela rápida reciclagem de nutrientes pela própria floresta","pela ausência de chuvas, que evita a lixiviação","pelas baixas temperaturas, que conservam a matéria orgânica"],"correta":2,"explicacao":"Com calor e umidade elevados, fungos e bactérias decompõem rapidamente folhas e galhos, e as raízes reabsorvem os nutrientes; o estoque fica na biomassa, não no solo. Por isso o desmatamento tende a empobrecer o solo rapidamente.","tema":"enem-bio-ecossistemas-amazonicos","subtema":"Ciclagem de nutrientes","disciplina":"Biologia","areaEnem":"natureza","dificuldade":3,"fonte":"autoral"},{"id":"ene-da34228a","area":"Biologia","enunciado":"A malária, ainda presente na região amazônica, é causada e transmitida, respectivamente, por:","alternativas":["vírus e mosquito Aedes aegypti","bactéria e caramujo","protozoário Trypanosoma cruzi e barbeiro","protozoário Plasmodium e mosquito Anopheles","verme e água contaminada"],"correta":3,"explicacao":"O agente da malária é o protozoário Plasmodium, transmitido pela picada da fêmea do mosquito Anopheles. Aedes transmite dengue; o barbeiro transmite a doença de Chagas.","tema":"enem-bio-parasitologia","subtema":"Malária","disciplina":"Biologia","areaEnem":"natureza","dificuldade":2,"fonte":"autoral"},{"id":"ene-c5996c33","area":"Biologia","enunciado":"Após ser picada por uma cobra peçonhenta, uma pessoa recebe soro antiofídico. Esse tratamento é um exemplo de:","alternativas":["imunização ativa, com produção de memória","vacinação preventiva","uso de antibiótico contra o veneno","transplante de células de defesa","imunização passiva, com anticorpos prontos"],"correta":4,"explicacao":"O soro contém anticorpos já produzidos (em geral por cavalos), de ação imediata e sem memória imunológica: imunização passiva. A vacina, ao contrário, estimula o próprio organismo (imunização ativa).","tema":"enem-bio-imunologia","subtema":"Soros (imunização passiva)","disciplina":"Biologia","areaEnem":"natureza","dificuldade":2,"fonte":"autoral"},{"id":"ene-04d874b4","area":"História","enunciado":"A Cabanagem (1835–1840), revolta que envolveu amplas camadas populares no Grão-Pará, território que então incluía a área do atual Amazonas, ocorreu durante qual período da história do Brasil?","alternativas":["Período Regencial","Primeiro Reinado","Segundo Reinado já consolidado","República Velha","Período Joanino"],"correta":0,"explicacao":"Entre a abdicação de D. Pedro I (1831) e o Golpe da Maioridade (1840), o Brasil viveu o Período Regencial, marcado por revoltas provinciais como a Cabanagem, a Balaiada, a Sabinada e a Farroupilha.","tema":"enem-hist-amazonas","subtema":"Cabanagem","disciplina":"História","areaEnem":"humanas","dificuldade":2,"fonte":"autoral"},{"id":"ene-cc27b83e","area":"História","enunciado":"A Zona Franca de Manaus, reformulada em 1967 durante o regime militar, teve como objetivo principal:","alternativas":["retomar a exportação de borracha como principal atividade econômica","criar um polo industrial com incentivos fiscais para integrar a Amazônia","transformar Manaus na capital federal do Brasil","proibir a entrada de produtos estrangeiros na região","promover a reforma agrária nas várzeas do Amazonas"],"correta":1,"explicacao":"O Decreto-Lei nº 288/1967 concedeu isenções e incentivos fiscais para atrair indústrias e comércio a Manaus, dentro de uma estratégia de ocupação e integração da Amazônia.","tema":"enem-hist-amazonas","subtema":"Zona Franca de Manaus","disciplina":"História","areaEnem":"humanas","dificuldade":1,"fonte":"autoral"},{"id":"ene-12286e30","area":"História","enunciado":"Entre os fatores que explicam o pioneirismo da Inglaterra na Revolução Industrial, no século XVIII, está:","alternativas":["a ausência de colônias e de comércio exterior","a proibição do uso de carvão mineral","o acúmulo de capitais e a mão de obra liberada pelos cercamentos dos campos","o fortalecimento do regime feudal no campo","a falta de interesse da burguesia por inovações técnicas"],"correta":2,"explicacao":"A Inglaterra reunia capitais do comércio colonial, reservas de carvão e ferro e mão de obra barata formada por camponeses expulsos das terras pelos cercamentos (enclosures).","tema":"enem-hist-revolucoes","subtema":"Revolução Industrial","disciplina":"História","areaEnem":"humanas","dificuldade":2,"fonte":"autoral"},{"id":"ene-7297b9e1","area":"História","enunciado":"A Consolidação das Leis do Trabalho (CLT), de 1943, foi criada:","alternativas":["no governo de Juscelino Kubitschek","durante a ditadura militar","no Império, por D. Pedro II","durante o Estado Novo de Getúlio Vargas","na República da Espada"],"correta":3,"explicacao":"A CLT reuniu a legislação trabalhista em 1943, no Estado Novo (1937–1945), dentro da política varguista de controle e aproximação com os trabalhadores urbanos.","tema":"enem-hist-era-vargas","subtema":"Legislação trabalhista","disciplina":"História","areaEnem":"humanas","dificuldade":1,"fonte":"autoral"},{"id":"ene-072ab839","area":"História","enunciado":"O Ato Institucional nº 5 (AI-5), de 1968, é considerado o marco do endurecimento da ditadura militar brasileira porque, entre outras medidas:","alternativas":["convocou eleições diretas para presidente","extinguiu a censura prévia à imprensa","anistiou todos os presos políticos","restabeleceu o pluripartidarismo","autorizou o fechamento do Congresso Nacional"],"correta":4,"explicacao":"O AI-5 deu ao presidente poderes para fechar o Legislativo, cassar mandatos e suspender direitos políticos, além de suspender o habeas corpus em crimes políticos. Anistia (1979) e pluripartidarismo vieram na abertura.","tema":"enem-hist-ditadura-militar","subtema":"Atos Institucionais","disciplina":"História","areaEnem":"humanas","dificuldade":1,"fonte":"autoral"},{"id":"ene-68818d6c","area":"História","enunciado":"A queda do Muro de Berlim, em 1989, é um marco simbólico:","alternativas":["do fim da Guerra Fria","do início da Primeira Guerra Mundial","da criação da ONU","da ascensão do nazismo na Alemanha","da Revolução Russa"],"correta":0,"explicacao":"O muro, erguido em 1961, separava Berlim Ocidental e Oriental. Sua queda antecipou a reunificação alemã (1990) e o colapso da URSS (1991), encerrando a bipolaridade e a divisão da Europa entre os blocos capitalista e socialista.","tema":"enem-hist-guerra-fria","subtema":"Queda do Muro de Berlim","disciplina":"História","areaEnem":"humanas","dificuldade":1,"fonte":"autoral"},{"id":"ene-69674aa4","area":"História","enunciado":"A economia açucareira do Brasil colonial, nos séculos XVI e XVII, organizou-se predominantemente com base em:","alternativas":["pequenas propriedades familiares e mão de obra assalariada","latifúndio, monocultura, trabalho escravizado e produção voltada à exportação","policultura para abastecer o mercado interno","extração de ouro em Minas Gerais","indústrias têxteis mecanizadas"],"correta":1,"explicacao":"O sistema de plantation colonial combinava grandes propriedades, um único produto de exportação e mão de obra escravizada, atendendo aos interesses mercantilistas da metrópole.","tema":"enem-hist-brasil-colonia","subtema":"Economia açucareira","disciplina":"História","areaEnem":"humanas","dificuldade":1,"fonte":"autoral"},{"id":"ene-aa9253a0","area":"Geografia","enunciado":"Os chamados 'rios voadores' são importantes para o regime de chuvas de parte do Centro-Oeste e do Sudeste brasileiros. Eles correspondem a:","alternativas":["rios subterrâneos que ligam a Amazônia ao Sudeste","canais artificiais de transposição de água","fluxos de umidade na atmosfera vindos da Floresta Amazônica","nuvens formadas exclusivamente sobre o oceano Pacífico","correntes marítimas frias do litoral sul"],"correta":2,"explicacao":"A floresta devolve à atmosfera grande quantidade de vapor d'água pela evapotranspiração; esse vapor é transportado pelos ventos e barrado pelos Andes, desviando-se para o centro-sul. O desmatamento ameaça esse mecanismo.","tema":"enem-geo-amazonas","subtema":"Rios voadores","disciplina":"Geografia","areaEnem":"humanas","dificuldade":2,"fonte":"autoral"},{"id":"ene-65d41fb6","area":"Geografia","enunciado":"Na Amazônia, as áreas de várzea diferenciam-se das de terra firme por:","alternativas":["nunca serem alagadas, por estarem em terrenos mais altos","terem clima frio e seco","não permitirem nenhum tipo de agricultura","serem inundadas periodicamente pelas cheias dos rios","serem cobertas por vegetação de cerrado"],"correta":3,"explicacao":"As várzeas margeiam principalmente rios de água branca (como o Solimões-Amazonas) e são alagadas nas cheias; a deposição de sedimentos as torna férteis para a agricultura de vazante. A terra firme não alaga.","tema":"enem-geo-amazonas","subtema":"Várzea e terra firme","disciplina":"Geografia","areaEnem":"humanas","dificuldade":2,"fonte":"autoral"},{"id":"ene-2cb859ea","area":"Geografia","enunciado":"A cidade A está a 45° de longitude oeste e a cidade B, a 75° de longitude oeste. Considerando apenas os fusos teóricos, quando são 12 h em A, em B são:","alternativas":["14 h","11 h","13 h","9 h","10 h"],"correta":4,"explicacao":"Cada 15° equivalem a 1 hora. A diferença é de 30°, ou seja, 2 horas; como B está mais a oeste, seu horário é atrasado: 12 − 2 = 10 h.","tema":"enem-geo-cartografia","subtema":"Fusos horários","disciplina":"Geografia","areaEnem":"humanas","dificuldade":2,"fonte":"autoral"},{"id":"ene-0dcf2167","area":"Geografia","enunciado":"Quando o crescimento urbano faz duas ou mais cidades vizinhas se unirem fisicamente, formando uma mancha urbana contínua, ocorre o fenômeno de:","alternativas":["conurbação","êxodo rural","gentrificação","megalópole isolada","desmetropolização"],"correta":0,"explicacao":"Conurbação é a junção física de malhas urbanas de municípios diferentes. Gentrificação é a valorização de uma área que expulsa moradores de menor renda.","tema":"enem-geo-urbanizacao","subtema":"Conurbação e metropolização","disciplina":"Geografia","areaEnem":"humanas","dificuldade":1,"fonte":"autoral"},{"id":"ene-5f9b1cf2","area":"Geografia","enunciado":"Nas últimas décadas, a pirâmide etária brasileira tem apresentado base mais estreita e topo mais largo. Esse processo reflete principalmente:","alternativas":["o aumento da mortalidade infantil","a queda da natalidade e o aumento da longevidade","a elevação da taxa de fecundidade","a chegada em massa de imigrantes jovens","a redução da expectativa de vida"],"correta":1,"explicacao":"Menos nascimentos estreitam a base, e a maior longevidade alarga o topo: é o envelhecimento populacional típico da transição demográfica.","tema":"enem-geo-populacao","subtema":"Pirâmides etárias","disciplina":"Geografia","areaEnem":"humanas","dificuldade":2,"fonte":"autoral"},{"id":"ene-7df379a3","area":"Geografia","enunciado":"Na geração de energia elétrica do Brasil, a fonte com maior participação é:","alternativas":["o carvão mineral","a nuclear","a hidrelétrica","o petróleo","a geotérmica"],"correta":2,"explicacao":"A matriz elétrica brasileira é majoritariamente renovável, com predomínio da hidreletricidade, favorecida por rios caudalosos de planalto. Eólica e solar crescem, mas a hidráulica continua sendo a maior.","tema":"enem-geo-industria-energia","subtema":"Matriz elétrica","disciplina":"Geografia","areaEnem":"humanas","dificuldade":1,"fonte":"autoral"},{"id":"ene-f065425f","area":"Geografia","enunciado":"O Brasil não possui vulcões ativos e registra poucos terremotos de grande intensidade. A principal explicação é que o território brasileiro:","alternativas":["localiza-se sobre o encontro de duas placas convergentes","fica no Círculo de Fogo do Pacífico","está sobre uma dorsal oceânica ativa","está situado na porção central da Placa Sul-Americana, longe de suas bordas","não está sobre nenhuma placa tectônica"],"correta":3,"explicacao":"Vulcanismo e grandes sismos concentram-se nas bordas das placas; o Brasil está no interior da Placa Sul-Americana, região de relativa estabilidade. Os Andes, na borda oeste, são área de alta atividade.","tema":"enem-geo-geologia-relevo","subtema":"Tectônica de placas","disciplina":"Geografia","areaEnem":"humanas","dificuldade":2,"fonte":"autoral"},{"id":"ene-be12df20","area":"Filosofia","enunciado":"Na Alegoria da Caverna, de Platão, os prisioneiros que veem apenas sombras na parede representam:","alternativas":["os filósofos que alcançaram o conhecimento das Ideias","os governantes justos da cidade","os deuses que controlam o destino humano","os sofistas que dominam a matemática","os que tomam as aparências do mundo sensível pela verdade"],"correta":4,"explicacao":"Para Platão, as sombras simbolizam a opinião (doxa) baseada nos sentidos; sair da caverna representa o caminho do conhecimento rumo ao mundo inteligível das Ideias.","tema":"enem-filo-socrates-platao","subtema":"Alegoria da Caverna","disciplina":"Filosofia","areaEnem":"humanas","dificuldade":1,"fonte":"autoral"},{"id":"ene-d2b5125a","area":"Filosofia","enunciado":"'Age apenas segundo uma máxima tal que possas ao mesmo tempo querer que ela se torne lei universal.' Essa formulação corresponde:","alternativas":["ao imperativo categórico de Kant","ao princípio da utilidade de Stuart Mill","ao contrato social de Rousseau","à vontade de potência de Nietzsche","à dúvida metódica de Descartes"],"correta":0,"explicacao":"Para Kant, a ação moral é incondicionada e deve poder ser universalizada, independentemente de suas consequências, ao contrário do utilitarismo, que julga pelos resultados.","tema":"enem-filo-etica","subtema":"Imperativo categórico (Kant)","disciplina":"Filosofia","areaEnem":"humanas","dificuldade":2,"fonte":"autoral"},{"id":"ene-6145f4c0","area":"Filosofia","enunciado":"Para Aristóteles, a virtude moral consiste, em geral, em:","alternativas":["seguir cegamente as leis divinas","um justo meio entre dois vícios","eliminar todas as paixões humanas","buscar o máximo de prazer possível","obedecer ao governante mais forte"],"correta":1,"explicacao":"Na Ética a Nicômaco, a virtude é uma disposição adquirida pelo hábito e situada no meio-termo: a coragem, por exemplo, está entre a covardia (falta) e a temeridade (excesso).","tema":"enem-filo-aristoteles","subtema":"Ética das virtudes e justa medida","disciplina":"Filosofia","areaEnem":"humanas","dificuldade":1,"fonte":"autoral"},{"id":"ene-56fe51c0","area":"Sociologia","enunciado":"Um servidor público é obedecido não por sua personalidade nem por tradição, mas porque ocupa um cargo definido por normas impessoais. Segundo Max Weber, esse é um exemplo de dominação:","alternativas":["carismática","tradicional","racional-legal","patriarcal","teocrática"],"correta":2,"explicacao":"Weber distingue três tipos puros de dominação legítima: tradicional, carismática e racional-legal. Esta última se baseia em regras formais e é típica da burocracia moderna.","tema":"enem-socio-weber","subtema":"Tipos de dominação legítima","disciplina":"Sociologia","areaEnem":"humanas","dificuldade":2,"fonte":"autoral"},{"id":"ene-508ff7af","area":"Sociologia","enunciado":"Para Karl Marx, a diferença entre o valor produzido pelo trabalhador e o valor que ele recebe como salário, apropriada pelo capitalista, é chamada de:","alternativas":["alienação","fetichismo da mercadoria","ideologia","mais-valia","luta de classes"],"correta":3,"explicacao":"A mais-valia é o trabalho excedente não pago, base da acumulação capitalista. Alienação e fetichismo são conceitos relacionados, mas descrevem outros aspectos da relação de trabalho.","tema":"enem-socio-marx","subtema":"Mais-valia","disciplina":"Sociologia","areaEnem":"humanas","dificuldade":1,"fonte":"autoral"},{"id":"ene-8abc118c","area":"Sociologia","enunciado":"Um turista considera 'atrasados' os hábitos alimentares de uma comunidade ribeirinha apenas por serem diferentes dos seus. Essa atitude exemplifica:","alternativas":["relativismo cultural","aculturação","alteridade","multiculturalismo","etnocentrismo"],"correta":4,"explicacao":"Etnocentrismo é julgar outras culturas tomando a própria como padrão superior. O relativismo cultural, ao contrário, busca compreender cada cultura em seu próprio contexto.","tema":"enem-socio-cultura","subtema":"Etnocentrismo","disciplina":"Sociologia","areaEnem":"humanas","dificuldade":1,"fonte":"autoral"},{"id":"ene-ed2b772c","area":"Português","enunciado":"Em qual frase o acento grave indicativo de crase está empregado corretamente?","alternativas":["Entreguei o documento à diretora.","Ela começou à estudar cedo.","Fomos à pé até o porto.","Enviei a carta à você.","Ficamos frente à frente."],"correta":0,"explicacao":"Há crase quando a preposição 'a' (entregar algo a alguém) se funde ao artigo feminino 'a' (a diretora). Não ocorre crase antes de verbo, de palavra masculina, de pronome de tratamento como 'você' nem entre palavras repetidas.","tema":"enem-crase-e-regencia","subtema":"Crase","disciplina":"Português","areaEnem":"linguagens","dificuldade":2,"fonte":"autoral"},{"id":"ene-8c1866b7","area":"Português","enunciado":"Um poema traz a fala de um personagem nordestino: 'Oxente, visse? Vou arretado pra feira.' O uso dessas expressões exemplifica principalmente a variação linguística:","alternativas":["histórica (diacrônica)","regional (diatópica)","situacional, por ser um texto formal","social ligada a jargão profissional","decorrente de erro gramatical"],"correta":1,"explicacao":"'Oxente', 'visse' e 'arretado' são marcas associadas a falares do Nordeste, caracterizando variação geográfica. Variação não é erro, mas diversidade legítima da língua.","tema":"enem-variacao-linguistica","subtema":"Regional (diatópica)","disciplina":"Português","areaEnem":"linguagens","dificuldade":1,"fonte":"autoral"},{"id":"ene-40499f0e","area":"Português","enunciado":"Um verbete de dicionário que explica o significado da palavra 'palavra' tem como função da linguagem predominante a:","alternativas":["referencial","emotiva","metalinguística","conativa","fática"],"correta":2,"explicacao":"A função metalinguística ocorre quando o código explica o próprio código, como em dicionários e gramáticas. A referencial foca em informar sobre um assunto externo à língua.","tema":"enem-funcoes-da-linguagem","subtema":"Metalinguística","disciplina":"Português","areaEnem":"linguagens","dificuldade":2,"fonte":"autoral"},{"id":"ene-686272c1","area":"Português","enunciado":"Em 'Embora estivesse cansado, o estudante terminou a prova', a oração introduzida por 'embora' expressa ideia de:","alternativas":["causa","condição","finalidade","concessão","consequência"],"correta":3,"explicacao":"'Embora' é conjunção concessiva: apresenta um obstáculo (o cansaço) que não impede o fato principal (terminar a prova).","tema":"enem-sintaxe-oracoes","subtema":"Orações subordinadas adverbiais","disciplina":"Português","areaEnem":"linguagens","dificuldade":2,"fonte":"autoral"},{"id":"ene-0d11b644","area":"Literatura","enunciado":"Em Dom Casmurro, de Machado de Assis, um dos aspectos centrais da obra é:","alternativas":["a idealização romântica do indígena como herói nacional","a descrição objetiva da seca no sertão nordestino","a crítica à escravidão feita por um narrador abolicionista","a exaltação da natureza brasileira em versos parnasianos","a ambiguidade sobre a suposta traição de Capitu"],"correta":4,"explicacao":"Bento Santiago (Bentinho) narra a própria história em primeira pessoa, a partir de seu ponto de vista, e a traição nunca é comprovada; essa ambiguidade é uma marca do Realismo machadiano.","tema":"enem-lit-realismo-naturalismo","subtema":"Machado de Assis","disciplina":"Literatura","areaEnem":"linguagens","dificuldade":1,"fonte":"autoral"},{"id":"ene-9a5b9431","area":"Literatura","enunciado":"Vidas Secas (1938), de Graciliano Ramos, que acompanha a família de Fabiano pelo sertão, é representativo:","alternativas":["do romance regionalista de 30","do Romantismo indianista","do Arcadismo mineiro","da poesia concreta","do Realismo de Machado de Assis"],"correta":0,"explicacao":"A obra integra o romance de 30, da segunda fase do Modernismo, que denunciava problemas sociais como a seca, a miséria e a opressão, com linguagem seca e enxuta.","tema":"enem-lit-romance-de-30","subtema":"Graciliano Ramos","disciplina":"Literatura","areaEnem":"linguagens","dificuldade":1,"fonte":"autoral"},{"id":"ene-bf1da4ca","area":"Literatura","enunciado":"O romance Dois Irmãos, do escritor amazonense Milton Hatoum, ambientado em Manaus, tem como eixo:","alternativas":["a vida de um seringueiro no Acre durante a Revolução Acreana","a rivalidade entre os gêmeos Yaqub e Omar, numa família de origem libanesa","a viagem de um herói indígena a São Paulo","a trajetória de um retirante nordestino no sertão","a vida da corte portuguesa no Rio de Janeiro"],"correta":1,"explicacao":"Hatoum, nascido em Manaus, narra em Dois Irmãos o conflito entre os gêmeos Yaqub e Omar, filhos de Halim e Zana, tendo a cidade de Manaus e suas transformações como pano de fundo.","tema":"enem-lit-amazonense","subtema":"Milton Hatoum","disciplina":"Literatura","areaEnem":"linguagens","dificuldade":2,"fonte":"autoral"},{"id":"ene-7f818000","area":"Inglês","enunciado":"Leia: 'Deforestation in the Amazon releases carbon stored in trees, which contributes to climate change. However, protected areas and Indigenous lands have shown lower deforestation rates.' Segundo o texto, as áreas protegidas e as terras indígenas:","alternativas":["são as principais responsáveis pelas emissões de carbono","impedem totalmente as mudanças climáticas","têm apresentado taxas menores de desmatamento","têm árvores que não armazenam carbono","registram as maiores taxas de desmatamento"],"correta":2,"explicacao":"O trecho 'have shown lower deforestation rates' significa 'têm mostrado taxas de desmatamento menores'. O conectivo 'However' introduz o contraste com o problema descrito na primeira frase.","tema":"enem-ingles-estrategias-de-leitura","subtema":"Scanning (informação específica)","disciplina":"Inglês","areaEnem":"linguagens","dificuldade":1,"fonte":"autoral"},{"id":"ene-fbfb9938","area":"Inglês","enunciado":"Leia: 'Many people pretend to understand the terms of service, but few actually read them.' No trecho, a palavra 'pretend' significa:","alternativas":["pretender","entender","ignorar","fingir","prometer"],"correta":3,"explicacao":"'Pretend' é falso cognato: significa 'fingir', não 'pretender' (que em inglês seria 'intend'). Também 'actually' significa 'na verdade', e não 'atualmente'.","tema":"enem-ingles-vocabulario","subtema":"Falsos cognatos","disciplina":"Inglês","areaEnem":"linguagens","dificuldade":1,"fonte":"autoral"},{"id":"ene-dd8fc321","area":"Redação","enunciado":"Na redação do ENEM, qual das situações abaixo leva o texto a receber nota zero?","alternativas":["Não colocar título","Escrever um texto com 20 linhas","Não citar nenhum filósofo","Cometer alguns desvios de ortografia","Fugir totalmente ao tema proposto"],"correta":4,"explicacao":"A fuga total ao tema zera a redação, assim como não atender ao tipo dissertativo-argumentativo ou ter até 7 linhas. Título é opcional, e desvios gramaticais apenas reduzem a nota na competência 1.","tema":"enem-redacao-competencias","subtema":"Situações de nota zero","disciplina":"Redação","areaEnem":"redacao","dificuldade":1,"fonte":"autoral"},{"id":"ene-3a283e8b","area":"Espanhol","enunciado":"Leia: «En muchas ciudades latinoamericanas, las ferias de barrio siguen siendo el lugar donde los vecinos compran frutas y verduras frescas. Además de precios más bajos, ofrecen algo que los supermercados no tienen: la conversación con el productor, que explica de dónde viene cada alimento.» Segundo o texto, um diferencial das feiras de bairro em relação aos supermercados é:","alternativas":["a venda exclusiva de produtos importados","o funcionamento vinte e quatro horas por dia","a entrega gratuita de compras na casa dos clientes","o contato direto com quem produz os alimentos","a oferta de produtos industrializados mais variados"],"correta":3,"explicacao":"O texto afirma que as feiras oferecem 'la conversación con el productor', algo que os supermercados não têm. Nada é dito sobre importados, horários ou entregas.","tema":"enem-espanhol-leitura","subtema":"Ideia central","disciplina":"Espanhol","areaEnem":"linguagens","dificuldade":1,"fonte":"autoral"},{"id":"ene-c3b701e5","area":"Espanhol","enunciado":"Leia: «Después de la reunión, Marta se dio cuenta de que había dejado su carpeta con todos los documentos en la oficina. Tuvo que volver a buscarla, pero llegó a tiempo para la entrevista.» No texto, a palavra «carpeta» refere-se a:","alternativas":["uma pasta para guardar papéis","um tapete que cobre o chão","um caderno de desenho escolar","uma mala de viagem pequena","um crachá de identificação"],"correta":0,"explicacao":"Em espanhol, 'carpeta' é a pasta em que se guardam documentos; o tapete é 'alfombra'. Trata-se de um heterossemântico, palavra parecida com o português, mas de sentido diferente.","tema":"enem-espanhol-falsos-amigos","subtema":"Heterossemânticos (falsos amigos)","disciplina":"Espanhol","areaEnem":"linguagens","dificuldade":2,"fonte":"autoral"},{"id":"ene-ce59102a","area":"Espanhol","enunciado":"Leia: «La abuela preparó un guiso exquisito para toda la familia; al final de la cena, nadie había dejado nada en el plato.» O termo «exquisito», no contexto, indica que o prato estava:","alternativas":["estranho, de sabor esquisito","frio, servido sem aquecer","salgado demais para comer","exótico, feito com ingredientes raros","delicioso, muito saboroso"],"correta":4,"explicacao":"'Exquisito' significa delicioso, de sabor excelente, o que combina com o fato de ninguém ter deixado comida no prato. O 'esquisito' do português corresponde a 'raro' ou 'extraño' em espanhol.","tema":"enem-espanhol-falsos-amigos","subtema":"Heterossemânticos (falsos amigos)","disciplina":"Espanhol","areaEnem":"linguagens","dificuldade":1,"fonte":"autoral"},{"id":"ene-ff7b69c5","area":"Espanhol","enunciado":"Leia: «El pueblo tiene pocos habitantes y queda lejos de la capital. Sin embargo, cada verano recibe miles de turistas atraídos por sus playas.» O conector «sin embargo» estabelece entre as frases uma relação de:","alternativas":["causa, equivalente a 'porque'","oposição, equivalente a 'no entanto'","conclusão, equivalente a 'portanto'","adição, equivalente a 'além disso'","tempo, equivalente a 'enquanto isso'"],"correta":1,"explicacao":"'Sin embargo' é um conector adversativo: apesar de pequeno e distante, o povoado recebe muitos turistas. Equivale a 'no entanto' ou 'contudo' em português.","tema":"enem-espanhol-gramatica-contextual","subtema":"Conectores (sin embargo, aunque)","disciplina":"Espanhol","areaEnem":"linguagens","dificuldade":1,"fonte":"autoral"},{"id":"ene-5fade1c4","area":"Espanhol","enunciado":"Leia: «Se buscan voluntarios para limpiar la playa este sábado a las 9 h. Trae guantes, gorra y una botella de agua. ¡Juntos cuidamos nuestro mar!» A finalidade principal desse texto é:","alternativas":["vender equipamentos de proteção solar","informar a previsão do tempo para o sábado","convocar pessoas para uma ação de limpeza","proibir a entrada de banhistas na praia","divulgar um campeonato de esportes aquáticos"],"correta":2,"explicacao":"'Se buscan voluntarios para limpiar la playa' mostra que o texto chama voluntários para um mutirão. As instruções sobre luvas, boné e água orientam os participantes.","tema":"enem-espanhol-leitura","subtema":"Finalidade do texto","disciplina":"Espanhol","areaEnem":"linguagens","dificuldade":1,"fonte":"autoral"},{"id":"ene-21ef9359","area":"Espanhol","enunciado":"Leia: «En Buenos Aires y en Montevideo es común oír frases como ‘¿Vos querés un café?’ en lugar de ‘¿Tú quieres un café?’. Esa forma de tratamiento no es un error: forma parte del habla cotidiana de millones de personas.» O texto trata de um fenômeno que exemplifica:","alternativas":["um erro gramatical a ser corrigido","o uso formal reservado a autoridades","uma influência direta do inglês","a variação regional do espanhol","a forma do espanhol medieval extinto"],"correta":3,"explicacao":"O texto descreve o 'voseo', uso de 'vos' no lugar de 'tú', típico da região do Rio da Prata. Ele afirma que não se trata de erro, mas de variedade da língua usada no dia a dia.","tema":"enem-espanhol-cultura","subtema":"Variedades do espanhol","disciplina":"Espanhol","areaEnem":"linguagens","dificuldade":2,"fonte":"autoral"},{"id":"ene-1656dfc2","area":"Artes","enunciado":"Obras como Les Demoiselles d'Avignon (1907), de Pablo Picasso, e as pinturas de Georges Braque do mesmo período são associadas a uma vanguarda europeia caracterizada por:","alternativas":["imitar fielmente a aparência da natureza","exaltar a velocidade e as máquinas modernas","reproduzir imagens de sonhos e do inconsciente","valorizar a luz natural e as pinceladas soltas","decompor as figuras em formas geométricas"],"correta":4,"explicacao":"O Cubismo, de Picasso e Braque, fragmenta os objetos em planos geométricos e mostra vários pontos de vista ao mesmo tempo. A exaltação da máquina é do Futurismo, e o universo dos sonhos é do Surrealismo.","tema":"enem-artes-vanguardas","subtema":"Cubismo","disciplina":"Artes","areaEnem":"linguagens","dificuldade":2,"fonte":"autoral"},{"id":"ene-02926cbe","area":"Artes","enunciado":"O quadro Abaporu (1928), de Tarsila do Amaral, inspirou um importante manifesto do Modernismo brasileiro. Trata-se do:","alternativas":["Manifesto Antropófago, de Oswald de Andrade","Manifesto Futurista, de Filippo Marinetti","Manifesto Surrealista, de André Breton","Manifesto Regionalista, de Gilberto Freyre","Manifesto Dadá, de Tristan Tzara"],"correta":0,"explicacao":"Abaporu, presente de Tarsila a Oswald de Andrade, inspirou o Manifesto Antropófago (1928). A proposta era 'devorar' a cultura estrangeira e transformá-la em algo brasileiro.","tema":"enem-artes-arte-brasileira","subtema":"Modernismo nas artes visuais (Tarsila do Amaral, Anita Malfatti)","disciplina":"Artes","areaEnem":"linguagens","dificuldade":1,"fonte":"autoral"},{"id":"ene-059def78","area":"Artes","enunciado":"Os Doze Profetas esculpidos em pedra-sabão no adro do Santuário do Bom Jesus de Matosinhos, em Congonhas (MG), são obras de:","alternativas":["Candido Portinari, no Modernismo","Victor Meirelles, no Academicismo","Aleijadinho, no Barroco mineiro","Di Cavalcanti, na Semana de 22","Mestre Vitalino, na arte popular"],"correta":2,"explicacao":"Antônio Francisco Lisboa, o Aleijadinho, esculpiu os profetas de Congonhas no início do século XIX. A obra é um dos principais marcos do Barroco mineiro.","tema":"enem-artes-arte-brasileira","subtema":"Barroco mineiro (Aleijadinho)","disciplina":"Artes","areaEnem":"linguagens","dificuldade":2,"fonte":"autoral"},{"id":"ene-19fe508c","area":"Artes","enunciado":"O Festival Folclórico de Parintins, no Amazonas, realizado no Bumbódromo, tem como ponto central a disputa entre dois bois-bumbás. Esses bois são:","alternativas":["Estrela (verde) e Tira-Teima (amarelo)","Garantido (vermelho) e Caprichoso (azul)","Mina de Ouro (preto) e Diamante (branco)","Garantido (azul) e Caprichoso (vermelho)","Boi Bumbá (roxo) e Boi Pintadinho (laranja)"],"correta":1,"explicacao":"A festa gira em torno da disputa entre o Garantido, de cor vermelha, e o Caprichoso, de cor azul. As apresentações unem música, dança, alegorias e elementos da cultura amazônica.","tema":"enem-artes-patrimonio-cultural","subtema":"Festival Folclórico de Parintins","disciplina":"Artes","areaEnem":"linguagens","dificuldade":1,"fonte":"autoral"},{"id":"ene-1d19d4f5","area":"Artes","enunciado":"O patrimônio cultural imaterial reúne práticas, saberes, celebrações e formas de expressão transmitidas entre gerações. É exemplo de bem imaterial registrado no Brasil:","alternativas":["o Teatro Amazonas, em Manaus","o centro histórico de Ouro Preto","a igreja de São Francisco, em Salvador","o frevo, de Pernambuco","o conjunto arquitetônico da Pampulha"],"correta":3,"explicacao":"O frevo é uma forma de expressão musical e coreográfica registrada pelo IPHAN como patrimônio imaterial. As demais opções são edificações ou conjuntos urbanos, ou seja, patrimônio material.","tema":"enem-artes-patrimonio-cultural","subtema":"Patrimônio material e imaterial","disciplina":"Artes","areaEnem":"linguagens","dificuldade":2,"fonte":"autoral"},{"id":"ene-2ce3cee1","area":"Educação Física","enunciado":"Segundo as diretrizes de 2020 da Organização Mundial da Saúde, para obter benefícios à saúde, adultos devem praticar semanalmente:","alternativas":["pelo menos 30 minutos de atividade leve","no máximo 60 minutos de qualquer atividade","exatamente 10 horas de musculação intensa","apenas uma sessão longa de exercício aeróbico","de 150 a 300 minutos de atividade moderada"],"correta":4,"explicacao":"A OMS recomenda a adultos de 150 a 300 minutos semanais de atividade aeróbica moderada, ou de 75 a 150 minutos de atividade vigorosa. Somar atividades ao longo da semana já traz benefícios.","tema":"enem-edfisica-corpo-e-saude","subtema":"Atividade física e saúde","disciplina":"Educação Física","areaEnem":"linguagens","dificuldade":2,"fonte":"autoral"},{"id":"ene-426e4e45","area":"Educação Física","enunciado":"A capoeira, prática de origem afro-brasileira cuja roda foi reconhecida como patrimônio cultural imaterial, caracteriza-se por:","alternativas":["unir luta, jogo, dança e música com berimbau","ter regras criadas por federações europeias","ser praticada apenas em competições oficiais","dispensar música para evitar distrações","ser uma luta de agarre em tatame fechado"],"correta":0,"explicacao":"A capoeira combina movimentos de luta e de jogo com ginga, cantos e instrumentos como o berimbau e o atabaque. Nasceu entre africanos escravizados e seus descendentes no Brasil.","tema":"enem-edfisica-praticas-corporais","subtema":"Lutas e capoeira","disciplina":"Educação Física","areaEnem":"linguagens","dificuldade":1,"fonte":"autoral"},{"id":"ene-86ea4a33","area":"Educação Física","enunciado":"Aos domingos, um grupo de vizinhos joga futebol num campo de terra, sem árbitro nem placar oficial, adaptando as regras ao número de pessoas presentes. Essa prática exemplifica o esporte:","alternativas":["de rendimento, voltado a recordes e títulos","de lazer, voltado à diversão e à convivência","profissional, regido por contratos de trabalho","olímpico, que segue regras internacionais fixas","escolar, organizado como conteúdo das aulas"],"correta":1,"explicacao":"O esporte de lazer (ou participação) busca prazer, saúde e integração, e permite adaptar regras. O esporte de rendimento, ao contrário, visa resultados e segue regras oficiais.","tema":"enem-edfisica-esporte-e-sociedade","subtema":"Esporte de rendimento, escolar e de lazer","disciplina":"Educação Física","areaEnem":"linguagens","dificuldade":1,"fonte":"autoral"},{"id":"ene-cded7f4a","area":"Educação Física","enunciado":"No goalball, modalidade paralímpica, os atletas usam vendas nos olhos e tentam marcar gols arremessando uma bola que contém guizos. Essa modalidade foi criada para pessoas com:","alternativas":["deficiência auditiva","amputação de membros","deficiência visual","paralisia cerebral","lesão na medula"],"correta":2,"explicacao":"O goalball foi desenvolvido para pessoas com deficiência visual: o som dos guizos orienta os jogadores. As vendas igualam as condições entre atletas com diferentes graus de visão.","tema":"enem-edfisica-esporte-e-sociedade","subtema":"Inclusão e esporte adaptado","disciplina":"Educação Física","areaEnem":"linguagens","dificuldade":2,"fonte":"autoral"},{"id":"ene-7d4403ba","area":"Inglês","enunciado":"Leia: 'Many people think the tomato is a vegetable, but it is actually a fruit, since it grows from the flower of the plant and contains seeds.' No texto, a palavra 'actually' tem o sentido de:","alternativas":["atualmente","raramente","finalmente","na verdade","geralmente"],"correta":3,"explicacao":"'Actually' é falso cognato e significa 'na verdade', 'de fato'. 'Atualmente' em inglês se diz 'currently' ou 'nowadays'.","tema":"enem-ingles-vocabulario","subtema":"Falsos cognatos","disciplina":"Inglês","areaEnem":"linguagens","dificuldade":1,"fonte":"autoral"},{"id":"ene-d1719871","area":"Inglês","enunciado":"Leia o texto de uma campanha: 'Save water! Turn off the tap while you brush your teeth. Every drop counts.' O objetivo principal da campanha é:","alternativas":["incentivar a economia de água no dia a dia","vender um novo modelo de escova de dentes","explicar como tratar a água de rios poluídos","informar o preço da conta de água da cidade","ensinar a técnica correta de escovação dental"],"correta":0,"explicacao":"O imperativo 'Save water' e a instrução de fechar a torneira ('turn off the tap') ao escovar os dentes mostram que a campanha estimula economizar água. 'Every drop counts' reforça que cada gota importa.","tema":"enem-ingles-generos","subtema":"Anúncios e campanhas","disciplina":"Inglês","areaEnem":"linguagens","dificuldade":1,"fonte":"autoral"},{"id":"ene-7416d850","area":"Inglês","enunciado":"Leia o aviso de um zoológico: 'Visitors must not feed the animals. Children under 12 may enter free of charge on Sundays.' De acordo com o aviso:","alternativas":["crianças só podem entrar aos domingos","o zoológico fecha aos domingos para visitas","os animais são alimentados pelos visitantes","crianças pagam meia-entrada todos os dias","alimentar os animais é proibido aos visitantes"],"correta":4,"explicacao":"'Must not' expressa proibição, e 'may' indica permissão: crianças de até 12 anos podem entrar de graça aos domingos. O aviso não diz que elas só podem entrar nesse dia.","tema":"enem-ingles-gramatica-contextual","subtema":"Verbos modais","disciplina":"Inglês","areaEnem":"linguagens","dificuldade":2,"fonte":"autoral"},{"id":"ene-3cc09be5","area":"Inglês","enunciado":"Leia: 'A small town has turned an old railway line into a 5-kilometer park for walking and cycling. Residents say the area, which used to be empty and dangerous at night, is now full of families in the evenings.' Pode-se inferir que a transformação do espaço:","alternativas":["fez a ferrovia voltar a transportar passageiros","aumentou o uso e a sensação de segurança no local","afastou as famílias da região durante a noite","proibiu a circulação de bicicletas na cidade","reduziu o tamanho da área verde disponível"],"correta":1,"explicacao":"O texto contrasta o passado ('used to be empty and dangerous') com o presente ('now full of families'). Isso permite inferir que o parque tornou o lugar mais frequentado e percebido como seguro.","tema":"enem-ingles-estrategias-de-leitura","subtema":"Inferência","disciplina":"Inglês","areaEnem":"linguagens","dificuldade":2,"fonte":"autoral"},{"id":"ene-dcd18b5c","area":"Literatura","enunciado":"Na 'Canção do Exílio' (1843), de Gonçalves Dias, o eu lírico afirma: 'Minha terra tem palmeiras, / Onde canta o Sabiá'. Esses versos expressam uma marca da primeira geração romântica, que é:","alternativas":["a crítica irônica aos costumes da burguesia","o culto à forma perfeita e à arte pela arte","a exaltação saudosa da pátria e da natureza","a denúncia das condições dos escravizados","o pessimismo diante da morte e do tédio"],"correta":2,"explicacao":"Escrito em Portugal, o poema idealiza a terra natal e sua natureza, traço do nacionalismo da primeira geração romântica. A denúncia da escravidão é marca de Castro Alves, e o culto à forma, do Parnasianismo.","tema":"enem-lit-romantismo","subtema":"Poesia indianista e nacionalista (Gonçalves Dias)","disciplina":"Literatura","areaEnem":"linguagens","dificuldade":1,"fonte":"autoral"},{"id":"ene-00f528c5","area":"Literatura","enunciado":"Castro Alves, autor de 'O Navio Negreiro', ficou conhecido como 'o poeta dos escravos'. Sua poesia, ligada à terceira geração romântica (condoreira), destaca-se por:","alternativas":["idealizar o indígena como herói nacional","evitar temas políticos e sociais","buscar a objetividade da ciência","denunciar a escravidão com tom grandioso","valorizar o soneto de forma rígida"],"correta":3,"explicacao":"A poesia condoreira de Castro Alves usa linguagem grandiloquente para defender causas sociais, como a abolição. Em 'O Navio Negreiro', ele denuncia o tráfico de africanos escravizados.","tema":"enem-lit-romantismo","subtema":"Poesia social (Castro Alves)","disciplina":"Literatura","areaEnem":"linguagens","dificuldade":1,"fonte":"autoral"},{"id":"ene-a372bdda","area":"Literatura","enunciado":"Em O Cortiço (1890), de Aluísio Azevedo, as personagens são frequentemente comparadas a animais, e seu comportamento aparece condicionado pelo ambiente em que vivem. Esses traços revelam a influência:","alternativas":["da idealização amorosa, típica do Romantismo","do subjetivismo místico, típico do Simbolismo","da fragmentação da linguagem, do Modernismo","do bucolismo pastoril, próprio do Arcadismo","do determinismo, próprio do Naturalismo"],"correta":4,"explicacao":"O Naturalismo, influenciado pelas ciências do século XIX, mostra o ser humano determinado pelo meio, pela raça e pelo momento. A zoomorfização das personagens reforça essa visão.","tema":"enem-lit-realismo-naturalismo","subtema":"Naturalismo (Aluísio Azevedo)","disciplina":"Literatura","areaEnem":"linguagens","dificuldade":2,"fonte":"autoral"}],"medicina":[{"id":"med-cc68d69f","area":"Anatomia","enunciado":"O principal nervo motor do diafragma é o:","alternativas":["Vago","Frênico","Intercostal","Glossofaríngeo","Acessório"],"correta":1,"explicacao":"Nervo frênico (C3–C5): \"C3, 4, 5 mantêm o diafragma vivo\".","tema":"anatomia-do-torax","subtema":"anatomia-do-torax.diafragma-e-nervo-frenico","especialidade":"anatomia","disciplina":"Anatomia","dificuldade":1,"fonte":"autoral"},{"id":"med-423796fc","area":"Fisiologia","enunciado":"A fase de despolarização rápida do potencial de ação neuronal se deve principalmente a:","alternativas":["Saída de K⁺","Entrada de Ca²⁺","Entrada de Na⁺","Entrada de Cl⁻","Bomba Na⁺/K⁺"],"correta":2,"explicacao":"Abertura de canais de Na⁺ voltagem-dependentes. A repolarização é por saída de K⁺.","tema":"potencial-de-acao","subtema":"potencial-de-acao.fases-do-potencial-de-acao","especialidade":"fisiologia","disciplina":"Fisiologia","dificuldade":1,"fonte":"autoral"},{"id":"med-942f20fc","area":"Bioquímica","enunciado":"O saldo líquido de ATP na glicólise, por molécula de glicose, é:","alternativas":["2","4","36","1","38"],"correta":0,"explicacao":"Gera 4 ATP, mas consome 2 na fase preparatória: saldo 2 ATP (+ 2 NADH).","tema":"metabolismo-dos-carboidratos","subtema":"metabolismo-dos-carboidratos.glicolise","especialidade":"bioquimica","disciplina":"Bioquímica","dificuldade":1,"fonte":"autoral"},{"id":"med-254a112e","area":"Histologia","enunciado":"A epiderme é formada por epitélio:","alternativas":["Simples cúbico","Pseudoestratificado ciliado","Estratificado pavimentoso queratinizado","Simples pavimentoso","De transição"],"correta":2,"explicacao":"Várias camadas, células superficiais achatadas e queratina para proteção.","tema":"tecido-epitelial","subtema":"tecido-epitelial.classificacao-dos-epitelios","especialidade":"histologia-embriologia","disciplina":"Histologia","dificuldade":1,"fonte":"autoral"},{"id":"med-7e102a2d","area":"Imunolog
