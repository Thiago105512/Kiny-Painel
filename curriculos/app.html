":"fisiologia","disciplina":"Fisiologia","dificuldade":1,"fonte":"autoral"},{"id":"med-5f97d882","area":"Fisiologia","enunciado":"O hormônio antidiurético (vasopressina) aumenta a reabsorção de água ao inserir aquaporinas-2 na membrana apical das células do:","alternativas":["Túbulo contorcido proximal","Ramo descendente fino da alça de Henle","Glomérulo","Ducto coletor","Mácula densa"],"correta":3,"explicacao":"O ADH atua via receptores V2 nas células principais do ducto coletor, levando aquaporinas-2 à membrana apical e concentrando a urina.","tema":"fisiologia-renal","subtema":"fisiologia-renal.concentracao-urinaria-e-adh","especialidade":"fisiologia","disciplina":"Fisiologia","dificuldade":2,"fonte":"autoral"},{"id":"med-7ce66bb7","area":"Fisiologia","enunciado":"Qual fator desvia a curva de dissociação da oxi-hemoglobina para a direita (menor afinidade pelo O₂)?","alternativas":["Alcalose","Aumento do 2,3-bifosfoglicerato","Hipotermia","Redução da PCO₂","Aumento da hemoglobina fetal"],"correta":1,"explicacao":"Aumento de 2,3-BPG, H⁺ (acidose), CO₂ e temperatura desviam a curva para a direita, facilitando a liberação de O₂ aos tecidos; a HbF desvia para a esquerda.","tema":"fisiologia-respiratoria","subtema":"fisiologia-respiratoria.transporte-de-oxigenio","especialidade":"fisiologia","disciplina":"Fisiologia","dificuldade":2,"fonte":"autoral"},{"id":"med-67c55cc1","area":"Fisiologia","enunciado":"O hormônio liberado pelas células S do duodeno em resposta ao quimo ácido, que estimula secreção pancreática rica em bicarbonato, é a:","alternativas":["Gastrina","Colecistocinina","Motilina","Grelina","Secretina"],"correta":4,"explicacao":"A secretina neutraliza a acidez duodenal estimulando bicarbonato pancreático; a colecistocinina estimula principalmente enzimas pancreáticas e contração da vesícula.","tema":"fisiologia-gastrointestinal","subtema":"fisiologia-gastrointestinal.hormonios-gastrointestinais","especialidade":"fisiologia","disciplina":"Fisiologia","dificuldade":2,"fonte":"autoral"},{"id":"med-2fd2fe07","area":"Fisiologia","enunciado":"Ao levantar-se bruscamente, a queda da pressão arterial é detectada pelos barorreceptores carotídeos. A resposta reflexa esperada é:","alternativas":["Bradicardia por aumento do tônus vagal","Vasodilatação periférica mediada pelo simpático","Taquicardia e vasoconstrição por ativação simpática","Redução da contratilidade miocárdica","Aumento da diurese por inibição do ADH"],"correta":2,"explicacao":"Menor estiramento reduz os disparos dos barorreceptores, o que diminui o tônus vagal e aumenta o simpático: taquicardia, maior contratilidade e vasoconstrição.","tema":"fisiologia-cardiovascular","subtema":"fisiologia-cardiovascular.controle-da-pressao-arterial","especialidade":"fisiologia","disciplina":"Fisiologia","dificuldade":2,"fonte":"autoral"},{"id":"med-e482e68b","area":"Bioquímica","enunciado":"A enzima limitante da síntese de colesterol, alvo das estatinas, é a:","alternativas":["HMG-CoA redutase","Acetil-CoA carboxilase","Carnitina palmitoiltransferase I","Fosfofrutocinase-1","Glicogênio sintase"],"correta":0,"explicacao":"A HMG-CoA redutase converte HMG-CoA em mevalonato, etapa limitante da colesterogênese; as estatinas a inibem competitivamente.","tema":"metabolismo-dos-lipidios","subtema":"metabolismo-dos-lipidios.sintese-de-colesterol","especialidade":"bioquimica","disciplina":"Bioquímica","dificuldade":1,"fonte":"autoral"},{"id":"med-ac0994bf","area":"Bioquímica","enunciado":"Paciente com malária por P. vivax apresenta hemólise aguda após iniciar primaquina. A deficiência enzimática mais provável e seu mecanismo são:","alternativas":["Piruvato-cinase, com falta de ATP na hemácia","Hexocinase, com bloqueio da entrada de glicose na glicólise","Lactato desidrogenase, com acúmulo de piruvato","Glicose-6-fosfato desidrogenase, com menor produção de NADPH","Glicocinase, com hipoglicemia grave"],"correta":3,"explicacao":"A G6PD inicia a via das pentoses, fonte de NADPH para manter a :"fisiologia-gastrointestinal","subtema":"fisiologia-gastrointestinal.secrecao-gastrica","especialidade":"histologia-embriologia","disciplina":"Histologia","dificuldade":1,"fonte":"autoral"},{"id":"med-64a55a8d","area":"Histologia","enunciado":"A célula responsável pela formação da bainha de mielina no sistema nervoso central é o:","alternativas":["Oligodendrócito","Célula de Schwann","Astrócito","Micróglia","Célula ependimária"],"correta":0,"explicacao":"No SNC a mielina é feita por oligodendrócitos (cada um mieliniza vários axônios); no SNP, pelas células de Schwann.","tema":"tecido-nervoso","subtema":"tecido-nervoso.celulas-da-glia","especialidade":"histologia-embriologia","disciplina":"Histologia","dificuldade":1,"fonte":"autoral"},{"id":"med-1b2cafc2","area":"Histologia","enunciado":"O principal tipo de colágeno da lâmina basal é o:","alternativas":["Tipo I","Tipo II","Tipo III","Tipo IV","Tipo X"],"correta":3,"explicacao":"O colágeno IV forma rede na lâmina basal. O tipo I predomina em osso e tendão, o II na cartilagem hialina e o III nas fibras reticulares.","tema":"tecido-epitelial","subtema":"tecido-epitelial.membrana-basal","especialidade":"histologia-embriologia","disciplina":"Histologia","dificuldade":2,"fonte":"autoral"},{"id":"med-9763bc7f","area":"Embriologia","enunciado":"O sistema nervoso central origina-se do(a):","alternativas":["Mesoderma paraxial","Ectoderma (neuroectoderma)","Endoderma","Mesoderma intermediário","Mesoderma da placa lateral"],"correta":1,"explicacao":"A notocorda induz o ectoderma a formar a placa neural, que se dobra em tubo neural, origem do encéfalo e da medula espinal.","tema":"embriologia-geral","subtema":"embriologia-geral.neurulacao","especialidade":"histologia-embriologia","disciplina":"Embriologia","dificuldade":1,"fonte":"autoral"},{"id":"med-7e609d00","area":"Embriologia","enunciado":"Após o nascimento, a veia umbilical oblitera-se e origina o(a):","alternativas":["Ligamento venoso","Ligamento arterioso","Ligamento um ada de abelha é exemplo de hipersensibilidade:","alternativas":["Tipo II, por anticorpos IgG contra antígenos de membrana","Tipo III, por deposição de imunocomplexos","Tipo IV, por linfócitos T sensibilizados","Tipo I, mediada por IgE ligada a mastócitos","Tipo I, mediada por IgG e complemento"],"correta":3,"explicacao":"Na hipersensibilidade imediata (tipo I), o antígeno liga IgE fixada a mastócitos e basófilos, liberando histamina e outros mediadores em minutos (Abbas).","tema":"hipersensibilidade","subtema":"hipersensibilidade.tipo-i-imediata","especialidade":"imunologia","disciplina":"Imunologia","dificuldade":1,"fonte":"autoral"},{"id":"med-d3fc06af","area":"Imunologia","enunciado":"Os linfócitos T CD8⁺ reconhecem peptídeos apresentados por:","alternativas":["Moléculas do MHC de classe II","Moléculas do MHC de classe I","Receptores do tipo Toll","Imunoglobulinas de superfície","Receptores de complemento (CR1)"],"correta":1,"explicacao":"O MHC I, presente em todas as células nucleadas, apresenta peptídeos citosólicos a T CD8⁺; o MHC II apresenta a T CD4⁺.","tema":"imunidade-celular-e-mhc","subtema":"imunidade-celular-e-mhc.mhc-classe-i-e-ii","especialidade":"imunologia","disciplina":"Imunologia","dificuldade":2,"fonte":"autoral"},{"id":"med-dd01423f","area":"Imunologia","enunciado":"A primeira imunoglobulina produzida em uma resposta humoral primária é a:","alternativas":["IgG","IgA","IgE","IgD","IgM"],"correta":4,"explicacao":"A IgM pentamérica surge primeiro; depois a mudança de classe gera IgG, de maior afinidade. IgM específica indica infecção recente.","tema":"imunoglobulinas","subtema":"imunoglobulinas.resposta-primaria-e-secundaria","especialidade":"imunologia","disciplina":"Imunologia","dificuldade":1,"fonte":"autoral"},{"id":"med-0e26b9ac","area":"Microbiologia","enunciado":"Adolescente com febre, rigidez de nuca e petéquias tem, no liquor, diplococos gram-negativos. O agente mais provável é:","alternativas":["Streptococcus pneumoniae","Haemophilus influenzae","Neisseria meningitidis","Listeria monocytogenes","Streptococcus agalactiae"],"correta":2,"explicacao":"Meningococo: diplococo gram-negativo associado a petéquias/púrpura. O pneumococo é diplococo gram-positivo; H. influenzae, cocobacilo gram-negativo; Listeria, bacilo gram-positivo.","tema":"meningites","subtema":"meningites.etiologia","especialidade":"microbiologia","disciplina":"Microbiologia","dificuldade":2,"fonte":"autoral"},{"id":"med-65c43e0b","area":"Microbiologia","enunciado":"A tetanospasmina causa espasmos musculares porque:","alternativas":["Bloqueia a liberação de glicina e GABA pelos interneurônios inibitórios","Bloqueia a liberação de acetilcolina na junção neuromuscular","Inativa o fator de alongamento 2 por ADP-ribosilação","Ativa a adenilato ciclase dos enterócitos","Lisa diretamente as fibras musculares esqueléticas"],"correta":0,"explicacao":"A toxina tetânica cliva sinaptobrevina nos interneurônios inibitórios da medula, gerando paralisia espástica; a botulínica atua na junção neuromuscular, causando paralisia flácida.","tema":"tetano","subtema":"tetano.patogenese","especialidade":"microbiologia","disciplina":"Microbiologia","dificuldade":2,"fonte":"autoral"},{"id":"med-c18d8de0","area":"Microbiologia","enunciado":"A prova que diferencia Staphylococcus aureus dos demais estafilococos é a:","alternativas":["Catalase","Optoquina","Bacitracina","Coagulase","Teste CAMP"],"correta":3,"explicacao":"S. aureus é coagulase-positivo. A catalase separa estafilococos de estreptococos; optoquina identifica pneumococo; bacitracina, S. pyogenes; CAMP, S. agalactiae.","tema":"estafilococos-e-estreptococos","subtema":"estafilococos-e-estreptococos.provas-laboratoriais","especialidade":"microbiologia","disciplina":"Microbiologia","dificuldade":1,"fonte":"autoral"},{"id":"med-8c36fda8","area":"Parasitologia","enunciado":"Surtos de doença de Chagas aguda na Amazônia têm sido associados principalmente a:","alternativas":["Picada de flebotomíneos","Ingestão de alimentos contaminados, como o açaí","Ingestão de carne suína malcozida","Contato da pele com água de igarapés","Picada de Aedes aegypti"],"correta":1,"explicacao":"A transmissão oral de Trypanosoma cruzi, por alimentos processados com triatomíneos infectados, é a principal forma na Amazônia e causa surtos familiares de casos agudos.","tema":"doenca-de-chagas","subtema":"doenca-de-chagas.transmissao","especialidade":"parasitologia","disciplina":"Parasitologia","dificuldade":2,"fonte":"autoral"},{"id":"med-7c6f0939","area":"Parasitologia","enunciado":"As recaídas tardias da malária por Plasmodium vivax devem-se a:","alternativas":["Gametócitos persistentes no sangue","Esporozoítos retidos nas glândulas salivares","Merozoítos sequestrados no baço","Oocistos no intestino humano","Hipnozoítos latentes nos hepatócitos"],"correta":4,"explicacao":"P. vivax (e P. ovale) formam hipnozoítos hepáticos que podem ser reativados meses depois; por isso a cura radical exige droga esquizonticida tecidual, como a primaquina.","tema":"malaria","subtema":"malaria.transmissao-e-ciclo-biologico","especialidade":"parasitologia","disciplina":"Parasitologia","dificuldade":2,"fonte":"autoral"},{"id":"med-1b8e14c0","area":"Parasitologia","enunciado":"No hospedeiro humano, a Leishmania é encontrada principalmente na forma:","alternativas":["Promastigota, livre no sangue","Tripomastigota, no sangue periférico","Amastigota, no interior de macrófagos","Epimastigota, no tubo digestivo","Esporozoíto, nos hepatócitos"],"correta":2,"explicacao":"No vertebrado a Leishmania vive como amastigota intracelular em macrófagos; a forma promastigota ocorre no flebotomíneo e é a inoculada na picada.","tema":"leishmaniose","subtema":"leishmaniose.ciclo-biologico-e-vetor","especialidade":"parasitologia","disciplina":"Parasitologia","dificuldade":1,"fonte":"autoral"},{"id":"med-a2239c8d","area":"Parasitologia","enunciado":"O método de referência para o diagnóstico laboratorial de rotina da malária no Brasil é:","alternativas":["Gota espessa corada","Método de Kato-Katz","Método de Baermann-Moraes","Método da fita adesiva (Graham)","Método de Knott"],"correta":0,"explicacao":"A gota espessa concentra o sangue e permite detectar, identificar a espécie e estimar a parasitemia. Os demais métodos são usados para helmintos.","tema":"malaria","subtema":"malaria.diagnostico","especialidade":"parasitologia","disciplina":"Parasitologia","dificuldade":1,"fonte":"autoral"},{"id":"med-fbbc43ba","area":"Patologia","enunciado":"O esôfago de Barrett, com substituição do epitélio escamoso por epitélio colunar com células caliciformes, é exemplo de:","alternativas":["Hiperplasia","Displasia","Hipertrofia","Metaplasia","Anaplasia"],"correta":3,"explicacao":"Metaplasia é a troca reversível de um tipo celular adulto por outro, mais resistente ao agressor (refluxo ácido); pode evoluir para displasia e adenocarcinoma.","tema":"lesao-celular","subtema":"lesao-celular.adaptacoes-celulares","especialidade":"patologia","disciplina":"Patologia","dificuldade":1,"fonte":"autoral"},{"id":"med-5174c334","area":"Patologia","enunciado":"O infarto isquêmico do encéfalo evolui caracteristicamente com necrose:","alternativas":["De coagulação","Liquefativa","Caseosa","Gordurosa","Fibrinoide"],"correta":1,"explicacao":"No SNC, a isquemia produz necrose liquefativa, com formação de cavidade; nos demais órgãos sólidos predomina a necrose de coagulação (Robbins).","tema":"lesao-celular","subtema":"lesao-celular.tipos-de-necrose","especialidade":"patologia","disciplina":"Patologia","dificuldade":1,"fonte":"autoral"},{"id":"med-0022ef01","area":"Patologia","enunciado":"A célula característica do linfoma de Hodgkin clássico é a célula de:","alternativas":["Langhans","Anitschkow","Kupffer","Schwann","Reed-Sternberg"],"correta":4,"explicacao":"A célula de Reed-Sternberg, grande e binucleada em 'olhos de coruja', é a célula neoplásica do linfoma de Hodgkin clássico. Células de Langhans aparecem em granulomas.","tema":"linfomas","subtema":"linfomas.linfoma-de-hodgkin","especialidade":"patologia","disciplina":"Patologia","dificuldade":1,"fonte":"autoral"},{"id":"med-8739ae62","area":"Farmacologia","enunciado":"A tosse seca associada ao uso de captopril deve-se a:","alternativas":["Bloqueio de receptores AT1 da angiotensina II","Aumento da secreção de aldosterona","Acúmulo de bradicinina por inibição de sua degradação pela ECA","Bloqueio de receptores β₂ brônquicos","Liberação de histamina por mastócitos pulmonares"],"correta":2,"explicacao":"A ECA (cininase II) também degrada bradicinina; com IECA ela se acumula e causa tosse e angioedema. Bloqueadores de AT1 raramente causam tosse.","tema":"hipertensao-arterial","subtema":"hipertensao-arterial.tratamento-farmacologico","especialidade":"farmacologia","disciplina":"Farmacologia","dificuldade":2,"fonte":"autoral"},{"id":"med-add4d965","area":"Farmacologia","enunciado":"O efeito antiagregante do ácido acetilsalicílico decorre de:","alternativas":["Inibição irreversível da COX-1 plaquetária","Bloqueio do receptor P2Y12 de ADP","Bloqueio da glicoproteína IIb/IIIa","Inibição da vitamina K epóxido redutase","Potencialização da antitrombina"],"correta":0,"explicacao":"O AAS acetila irreversivelmente a COX-1, reduzindo a síntese de tromboxano A₂; a plaqueta, sem núcleo, não sintetiza nova enzima, e o efeito dura a vida da plaqueta (Goodman).","tema":"antiagregantes-e-anticoagulantes","subtema":"antiagregantes-e-anticoagulantes.acido-acetilsalicilico","especialidade":"farmacologia","disciplina":"Farmacologia","dificuldade":1,"fonte":"autoral"},{"id":"med-2109d92b","area":"Farmacologia","enunciado":"Agricultor com miose, sialorreia, broncorreia e bradicardia após aplicar inseticida organofosforado. O fármaco que antagoniza esses efeitos muscarínicos é a:","alternativas":["Neostigmina","Fisostigmina","Pilocarpina","Atropina","Naloxona"],"correta":3,"explicacao":"Organofosforados inibem a acetilcolinesterase, acumulando acetilcolina; a atropina bloqueia receptores muscarínicos. Neostigmina e fisostigmina são anticolinesterásicos e piorariam o quadro.","tema":"intoxicacoes-exogenas","subtema":"intoxicacoes-exogenas.organofosforados-e-carbamatos","especialidade":"farmacologia","disciplina":"Farmacologia","dificuldade":2,"fonte":"autoral"},{"id":"med-f6f86b34","area":"Farmacologia","enunciado":"As penicilinas exercem ação bactericida por:","alternativas":["Ligação à subunidade ribossomal 30S","Ligação às proteínas ligadoras de penicilina","Ligação à subunidade ribossomal 50S","Inibição da DNA-girase","Inibição da síntese de folato"],"correta":1,"explicacao":"Os β-lactâmicos inibem as PBPs e impedem as ligações cruzadas do peptidoglicano. Aminoglicosídeos atuam na 30S, macrolídeos na 50S, quinolonas na DNA-girase e sulfas no folato.","tema":"antimicrobianos","subtema":"antimicrobianos.betalactamicos","especialidade":"farmacologia","disciplina":"Farmacologia","dificuldade":1,"fonte":"autoral"},{"id":"med-d7497f8d","area":"Semiologia","enunciado":"O sinal de Blumberg (dor à descompressão brusca do abdome) indica:","alternativas":["Pielonefrite aguda","Colecistite aguda","Hemorragia retroperitoneal","Irritação meníngea","Irritação peritoneal, como na apendicite aguda"],"correta":4,"explicacao":"A dor à descompressão brusca reflete inflamação do peritônio parietal; no ponto de McBurney, sugere apendicite. Giordano sugere comprometimento renal.","tema":"abdome-agudo","subtema":"abdome-agudo.sinais-de-irritacao-peritoneal","especialidade":"semiologia","disciplina":"Semiologia","dificuldade":1,"fonte":"autoral"},{"id":"med-628cbce9","area":"Semiologia","enunciado":"Sopro sistólico ejetivo, em diamante, no foco aórtico e irradiado para as carótidas sugere:","alternativas":["Insuficiência mitral","Insuficiência aórtica","Estenose aórtica","Estenose mitral","Insuficiência tricúspide"],"correta":2,"explicacao":"A estenose aórtica gera sopro mesossistólico em crescendo-decrescendo com irradiação para o pescoço; a insuficiência mitral é holossistólica e irradia para a axila; insuficiência aórtica e estenose mitral são diastólicas.","tema":"valvopatias","subtema":"valvopatias.estenose-aortica","especialidade":"semiologia","disciplina":"Semiologia","dificuldade":2,"fonte":"autoral"},{"id":"med-800cb33a","area":"Semiologia","enunciado":"No hemitórax direito há frêmito toracovocal aumentado, macicez à percussão e sopro tubário. O achado é compatível com:","alternativas":["Consolidação pulmonar (pneumonia)","Derrame pleural volumoso","Pneumotórax","Enfisema pulmonar","Atelectasia por obstrução brônquica"],"correta":0,"explicacao":"O parênquima condensado com brônquio pérvio transmite melhor as vibrações (frêmito aumentado e sopro tubário). No derrame, pneumotórax e atelectasia obstrutiva o frêmito diminui (Porto).","tema":"pneumonia","subtema":"pneumonia.sindrome-de-consolidacao","especialidade":"semiologia","disciplina":"Semiologia","dificuldade":2,"fonte":"autoral"},{"id":"med-2ac65fe6","area":"Semiologia","enunciado":"O sinal de Romberg positivo (paciente estável de olhos abertos que oscila e cai ao fechá-los) indica principalmente:","alternativas":["Lesão do hemisfério cerebelar","Lesão do trato corticoespinal","Irritação meníngea","Ataxia sensitiva por déficit proprioceptivo","Lesão do nervo facial"],"correta":3,"explicacao":"Sem a visão, o equilíbrio depende da propriocepção (cordões posteriores/nervos periféricos). Na ataxia cerebelar, a instabilidade existe mesmo de olhos abertos.","tema":"exame-neurologico","subtema":"exame-neurologico.marcha-e-equilibrio","especialidade":"semiologia","disciplina":"Semiologia","dificuldade":2,"fonte":"autoral"},{"id":"med-fce0f741","area":"Cardiologia","enunciado":"O eletrocardiograma típico da fibrilação atrial mostra:","alternativas":["Ondas F em 'dente de serra' com condução regular","Ausência de ondas P e intervalos RR irregulares","Dissociação completa entre ondas P e QRS","QRS alargados, regulares e de alta frequência","Ondas P precedendo cada QRS com intervalo PR constante"],"correta":1,"explicacao":"Na FA a atividade atrial desorganizada substitui a onda P por ondas f irregulares e a condução ao ventrículo é irregularmente irregular. 'Dente de serra' é do flutter.","tema":"arritmias-cardiacas","subtema":"arritmias-cardiacas.fibrilacao-atrial","especialidade":"cardiologia","disciplina":"Cardiologia","dificuldade":1,"fonte":"autoral"},{"id":"med-a600992f","area":"Cardiologia","enunciado":"A alteração eletrocardiográfica mais precoce e característica da hipercalemia é:","alternativas":["Onda U proeminente","Encurtamento do intervalo QT","Onda delta","Onda J de Osborn","Onda T apiculada e simétrica (em tenda)"],"correta":4,"explicacao":"A hipercalemia acelera a repolarização e gera T em tenda; com a piora, alarga QRS e some a onda P. Onda U sugere hipocalemia; QT curto, hipercalcemia; delta, pré-excitação; Osborn, hipotermia.","tema":"disturbios-hidroeletroliticos","subtema":"disturbios-hidroeletroliticos.disturbios-do-potassio","especialidade":"cardiologia","disciplina":"Cardiologia","dificuldade":2,"fonte":"autoral"},{"id":"med-5cbfc6a5","area":"Infectologia","enunciado":"Na dengue, a fase crítica, em que podem surgir sinais de alarme e extravasamento plasmático, ocorre tipicamente:","alternativas":["Nas primeiras 24 horas de febre","No pico febril do primeiro dia","Com a defervescência, entre o 3º e o 7º dia","Após três semanas do início dos sintomas","Apenas na fase de convalescença"],"correta":2,"explicacao":"A queda da febre coincide com o aumento da permeabilidade capilar; é quando o paciente deve ser vigiado para sinais de alarme e choque.","tema":"dengue","subtema":"dengue.fases-clinicas","especialidade":"infectologia","disciplina":"Infectologia","dificuldade":2,"fonte":"autoral"},{"id":"med-dfded720","area":"Infectologia","enunciado":"Após enchente em Manaus, homem apresenta febre, mialgia intensa em panturrilhas, sufusão conjuntival, icterícia rubínica e insuficiência renal aguda. A hipótese mais provável é:","alternativas":["Leptospirose","Hepatite A","Malária por P. vivax","Dengue","Doença de Chagas aguda"],"correta":0,"explicacao":"Exposição a água contaminada por urina de roedores, dor em panturrilhas e sufusão conjuntival sugerem leptospirose; a forma icterohemorrágica (síndrome de Weil) cursa com icterícia rubínica e lesão renal.","tema":"leptospirose","subtema":"leptospirose.quadro-clinico","especialidade":"infectologia","disciplina":"Infectologia","dificuldade":2,"fonte":"autoral"},{"id":"med-b75bf021","area":"Infectologia","enunciado":"Na Amazônia, o ciclo silvestre da febre amarela envolve primatas não humanos e mosquitos dos gêneros:","alternativas":["Anopheles e Culex","Lutzomyia e Psychodopygus","Triatoma e Rhodnius","Haemagogus e Sabethes","Simulium e Culicoides"],"correta":3,"explicacao":"Haemagogus e Sabethes mantêm o ciclo silvestre; o Aedes aegypti é o vetor do ciclo urbano. Anopheles transmite malária; Lutzomyia, leishmanioses; triatomíneos, Chagas.","tema":"febre-amarela","subtema":"febre-amarela.ciclos-de-transmissao","especialidade":"infectologia","disciplina":"Infectologia","dificuldade":2,"fonte":"autoral"},{"id":"med-1d06ecbd","area":"Ética Médica","enunciado":"Segundo o Código de Ética Médica, em relação ao sigilo profissional, o médico:","alternativas":["Fica liberado do sigilo após o falecimento do paciente","Pode revelar fato sigiloso por motivo justo, dever legal ou consentimento escrito","Fica liberado do sigilo quando o fato já é de conhecimento público","Deve informar o diagnóstico do trabalhador ao empregador sempre que solicitado","Deve revelar o fato sigiloso ao depor como testemunha sempre que intimado"],"correta":1,"explicacao":"O CEM veda revelar fato conhecido pela profissão salvo motivo justo, dever legal ou consentimento escrito; a proibição persiste mesmo se o fato for público ou o paciente falecido, e, como testemunha, o médico declara seu impedimento.","tema":"codigo-de-etica-medica","subtema":"codigo-de-etica-medica.sigilo-profissional","especialidade":"etica-medica","disciplina":"Ética Médica","dificuldade":1,"fonte":"autoral"},{"id":"med-b2475dd8","area":"Epidemiologia","enunciado":"A sensibilidade de um teste diagnóstico corresponde à:","alternativas":["Proporção de não doentes que apresentam resultado negativo","Probabilidade de ter a doença dado um resultado positivo","Probabilidade de não ter a doença dado um resultado negativo","Proporção de resultados corretos entre todos os testados","Proporção de doentes que apresentam resultado positivo"],"correta":4,"explicacao":"Sensibilidade = VP/(VP+FN). A proporção de não doentes com teste negativo é a especificidade; as probabilidades pós-teste são os valores preditivos; os acertos totais, a acurácia.","tema":"testes-diagnosticos","subtema":"testes-diagnosticos.sensibilidade-e-especificidade","especialidade":"epidemiologia","disciplina":"Epidemiologia","dificuldade":1,"fonte":"autoral"},{"id":"med-6cbb53a6","area":"Epidemiologia","enunciado":"Um estudo seleciona indivíduos expostos e não expostos a um fator e os acompanha ao longo do tempo para observar o surgimento da doença. Trata-se de estudo:","alternativas":["Caso-controle","Transversal","De coorte","Ecológico","Série de casos"],"correta":2,"explicacao":"A coorte parte da exposição para o desfecho, permitindo calcular incidência e risco relativo; o caso-controle parte da doença e investiga exposições passadas.","tema":"estudos-epidemiologicos","subtema":"estudos-epidemiologicos.estudos-de-coorte","especialidade":"epidemiologia","disciplina":"Epidemiologia","dificuldade":1,"fonte":"autoral"},{"id":"med-cef46338","area":"Anestesiologia","enunciado":"Na avaliação pré-anestésica, um paciente de 50 anos com hipertensão arterial bem controlada, sem outras doenças e sem limitação funcional, é classificado pela ASA como:","alternativas":["ASA II","ASA I","ASA III","ASA IV","ASA V"],"correta":0,"explicacao":"ASA II corresponde a doença sistêmica leve, sem limitação funcional, como hipertensão controlada. ASA I é o paciente saudável, e ASA III envolve doença sistêmica grave com limitação funcional.","tema":"anestesia-principios","subtema":"anestesia-principios.avaliacao-pre-anestesica","especialidade":"anestesiologia","disciplina":"Anestesiologia","dificuldade":1,"fonte":"autoral"},{"id":"med-e3bf9e02","area":"Anestesiologia","enunciado":"Durante bloqueio periférico com grande volume de anestésico local, o paciente relata gosto metálico, dormência perioral e zumbido. Esses sinais indicam:","alternativas":["Reação alérgica mediada por IgE","Bloqueio simpático extenso","Toxicidade cardíaca isolada, sem risco neurológico","Efeito esperado do bloqueio, sem significado","Toxicidade sistêmica inicial no sistema nervoso central"],"correta":4,"explicacao":"Na intoxicação por anestésico local, os sinais do SNC (gosto metálico, parestesia perioral, zumbido, agitação) geralmente precedem convulsões e colapso cardiovascular. Deve-se interromper a injeção e preparar suporte, incluindo emulsão lipídica.","tema":"anestesia-principios","subtema":"anestesia-principios.anestesicos-locais","especialidade":"anestesiologia","disciplina":"Anestesiologia","dificuldade":2,"fonte":"autoral"},{"id":"med-a7b67c04","area":"Anestesiologia","enunciado":"Após indução com succinilcolina e manutenção com sevoflurano, paciente apresenta rigidez do masseter, aumento rápido do CO₂ expirado, taquicardia e hipertermia. A droga específica para esse quadro é:","alternativas":["Neostigmina","Dantroleno","Sugamadex","Naloxona","Flumazenil"],"correta":1,"explicacao":"Rigidez muscular, hipercapnia, taquicardia e hipertermia após halogenado ou succinilcolina indicam hipertermia maligna, ligada a mutações do receptor rianodina (RYR1). O dantroleno reduz a liberação de cálcio do retículo sarcoplasmático, e o agente desencadeante deve ser suspenso.","tema":"anestesia-principios","subtema":"anestesia-principios.anestesia-geral","especialidade":"anestesiologia","disciplina":"Anestesiologia","dificuldade":2,"fonte":"autoral"},{"id":"med-15a0fd04","area":"Anestesiologia","enunciado":"Dois dias após raquianestesia, paciente refere cefaleia frontoccipital que surge ao sentar ou ficar de pé e melhora ao deitar. A característica e a causa mais prováveis são:","alternativas":["Cefaleia em salvas desencadeada pela liberação de histamina","Cefaleia por uso excessivo de analgésicos no pós-operatório","Hematoma epidural com compressão medular","Cefaleia postural por perda de líquor pelo orifício dural","Meningite bacteriana pela punção"],"correta":3,"explicacao":"A cefaleia pós-punção dural é tipicamente postural, piorando em pé e aliviando deitado, por hipotensão liquórica após extravasamento de líquor. Se persistir apesar de medidas clínicas, o tampão sanguíneo peridural é o tratamento definitivo.","tema":"anestesia-principios","subtema":"anestesia-principios.bloqueios-do-neuroeixo","especialidade":"anestesiologia","disciplina":"Anestesiologia","dificuldade":1,"fonte":"autoral"},{"id":"med-5cda0ef5","area":"Ética Médica","enunciado":"Homem de 60 anos, lúcido e capaz, recusa uma cirurgia eletiva indicada para sua doença, após ser esclarecido sobre riscos e benefícios. Não há risco iminente de morte. Segundo o Código de Ética Médica, o médico deve:","alternativas":["Operar mesmo assim, pois sabe o que é melhor","Pedir autorização judicial para operar","Respeitar a decisão e registrá-la no prontuário","Transferir a decisão à família","Encerrar o acompanhamento do paciente"],"correta":2,"explicacao":"O Código de Ética Médica veda desrespeitar o direito do paciente de decidir livremente sobre práticas diagnósticas ou terapêuticas, salvo em iminente risco de morte. A recusa esclarecida deve ser respeitada e documentada, mantendo-se a assistência.","tema":"codigo-de-etica-medica","subtema":"codigo-de-etica-medica.autonomia-e-consentimento","especialidade":"etica-medica","disciplina":"Ética Médica","dificuldade":1,"fonte":"autoral"},{"id":"med-fc70025a","area":"Ética Médica","enunciado":"Adolescente de 16 anos, com capacidade de discernimento, procura consulta para orientação sobre anticoncepção e pede que os pais não sejam informados. Não há situação de risco ou dano. Segundo o Código de Ética Médica, o médico deve:","alternativas":["Manter o sigilo, inclusive em relação aos pais","Informar os pais, por ser menor de idade","Recusar o atendimento sem os responsáveis","Comunicar o caso ao Conselho Tutelar","Informar os pais só se for prescrever algo"],"correta":0,"explicacao":"O Código veda revelar sigilo de paciente menor de idade, inclusive a seus pais, desde que ele tenha capacidade de discernimento, salvo quando a não revelação puder acarretar dano ao paciente. Não havendo dano, o sigilo prevalece.","tema":"codigo-de-etica-medica","subtema":"codigo-de-etica-medica.sigilo-profissional","especialidade":"etica-medica","disciplina":"Ética Médica","dificuldade":2,"fonte":"autoral"},{"id":"med-f11c2770","area":"Ética Médica","enunciado":"Segundo o Código de Ética Médica, é vedado ao médico:","alternativas":["Informar nome, CRM e endereço em anúncio","Participar de campanha educativa na imprensa","Atender clínica geral sem título de especialista","Divulgar os horários de atendimento do consultório","Anunciar especialidade sem registro no CRM"],"correta":4,"explicacao":"O Código veda anunciar títulos científicos que não possa comprovar e especialidade ou área de atuação para a qual não esteja qualificado e registrado no Conselho Regional de Medicina. Divulgar dados de identificação e participar de ações educativas são permitidos.","tema":"codigo-de-etica-medica","subtema":"codigo-de-etica-medica.publicidade-e-responsabilidade","especialidade":"etica-medica","disciplina":"Ética Médica","dificuldade":1,"fonte":"autoral"},{"id":"med-0822577e","area":"Ética Médica","enunciado":"Um médico percebe que a relação com um paciente em acompanhamento crônico ficou seriamente prejudicada, comprometendo o tratamento. Segundo o Código de Ética Médica, ele pode deixar de atendê-lo desde que:","alternativas":["Apenas registre o motivo no prontuário, sem necessidade de aviso","Comunique antes ao paciente e assegure a continuidade do cuidado","O paciente esteja sem comparecer às consultas há mais de um ano","Obtenha autorização prévia do Conselho Regional de Medicina","Devolva os honorários já recebidos"],"correta":1,"explicacao":"O Código veda abandonar o paciente, mas permite renunciar ao atendimento quando fatos prejudiquem a relação ou o desempenho profissional, desde que o médico comunique previamente ao paciente ou responsável, assegure a continuidade dos cuidados e forneça as informações ao sucessor.","tema":"codigo-de-etica-medica","subtema":"codigo-de-etica-medica.relacao-medico-paciente","especialidade":"etica-medica","disciplina":"Ética Médica","dificuldade":2,"fonte":"autoral"},{"id":"med-c8acb231","area":"Ética Médica","enunciado":"Mulher de 80 anos com câncer avançado, acompanhada regularmente por seu médico de família, falece em casa de causa natural relacionada à doença, sem indícios de violência. A declaração de óbito deve ser emitida:","alternativas":["Pelo Instituto Médico Legal","Obrigatoriamente pelo Serviço de Verificação de Óbitos","Pelo cartório, com duas testemunhas","Pelo médico que vinha prestando assistência","Pela autoridade policial"],"correta":3,"explicacao":"Em morte natural de paciente em acompanhamento, cabe ao médico assistente emitir a declaração de óbito, sendo-lhe vedado deixar de atestá-la sem motivo, conforme o Código de Ética Médica. O IML fica para mortes violentas ou suspeitas, e o SVO para mortes naturais sem assistência ou de causa mal definida.","tema":"tanatologia-e-declaracao-de-obito","subtema":"tanatologia-e-declaracao-de-obito.declaracao-de-obito","especialidade":"etica-medica","disciplina":"Ética Médica","dificuldade":1,"fonte":"autoral"},{"id":"med-2dc9eba3","area":"Medicina Legal","enunciado":"Segundo a lei de Nysten, a rigidez cadavérica instala-se de forma progressiva, iniciando-se tipicamente:","alternativas":["Nos pés, em sentido caudocranial","Nos membros superiores e depois no tronco","Na mandíbula e na nuca, em sentido craniocaudal","De forma simultânea em todo o corpo","No tronco e depois nos membros"],"correta":2,"explicacao":"A rigidez cadavérica, pela lei de Nysten, começa na mandíbula e na nuca e progride em sentido craniocaudal, desfazendo-se depois na mesma ordem. É um dos fenômenos cadavéricos consecutivos usados na estimativa do tempo de morte.","tema":"tanatologia-e-declaracao-de-obito","subtema":"tanatologia-e-declaracao-de-obito.sinais-de-morte","especialidade":"medicina-legal","disciplina":"Medicina Legal","dificuldade":1,"fonte":"autoral"},{"id":"med-937c5ee4","area":"Medicina Legal","enunciado":"O primeiro sinal da fase cromática da putrefação costuma ser a mancha verde abdominal, que surge mais comumente na:","alternativas":["Fossa ilíaca direita","Fossa ilíaca esquerda","Região epigástrica","Região lombar","Região periumbilical"],"correta":0,"explicacao":"A mancha verde abdominal aparece em geral na fossa ilíaca direita, onde o ceco, rico em bactérias e gases, está próximo da parede. Resulta da sulfometa-hemoglobina formada pelo gás sulfídrico da decomposição.","tema":"tanatologia-e-declaracao-de-obito","subtema":"tanatologia-e-declaracao-de-obito.sinais-de-morte","especialidade":"medicina-legal","disciplina":"Medicina Legal","dificuldade":1,"fonte":"autoral"},{"id":"med-ca6ee0a0","area":"Medicina Legal","enunciado":"Os livores cadavéricos formam-se nas regiões de declive e, após certo tempo, deixam de mudar de posição quando o corpo é movimentado. Essa fixação ocorre, em geral, por volta de:","alternativas":["30 minutos após a morte","1 a 2 horas após a morte","48 horas após a morte","72 horas após a morte","8 a 12 horas após a morte"],"correta":4,"explicacao":"Os livores surgem nas primeiras horas e, até cerca de 8 a 12 horas, ainda podem migrar com a mudança de posição do corpo; depois, com a hemólise e o extravasamento de sangue, fixam-se. Livores em regiões incompatíveis com a posição encontrada sugerem que o corpo foi movido.","tema":"tanatologia-e-declaracao-de-obito","subtema":"tanatologia-e-declaracao-de-obito.sinais-de-morte","especialidade":"medicina-legal","disciplina":"Medicina Legal","dificuldade":2,"fonte":"autoral"},{"id":"med-2ab9f80d","area":"Medicina Legal","enunciado":"Uma faca de ponta e gume, ao penetrar no tórax de uma vítima, atua como instrumento perfurocortante. A lesão produzida é classificada como:","alternativas":["Incisa","Perfuroincisa","Punctória","Cortocontusa","Perfurocontusa"],"correta":1,"explicacao":"Instrumentos perfurocortantes, como faca e punhal, agem por ponta e gume e produzem ferida perfuroincisa. A lesão incisa é própria do instrumento cortante, a punctória do perfurante, a cortocontusa do cortocontundente e a perfurocontusa do projétil de arma de fogo.","tema":"traumatologia-forense","subtema":"traumatologia-forense.instrumentos-e-lesoes","especialidade":"medicina-legal","disciplina":"Medicina Legal","dificuldade":1,"fonte":"autoral"},{"id":"med-9b16ff47","area":"Medicina Legal","enunciado":"Em disparo de arma de fogo com o cano encostado na pele da região frontal, os gases penetram e se expandem entre a pele e o osso, formando ferida de entrada ampla, irregular e com bordas lacerais. Esse achado clássico é denominado:","alternativas":["Zona de tatuagem","Orla de enxugo","Sinal de funil de Bonnet","Câmara de mina de Hoffmann","Zona de esfumaçamento"],"correta":3,"explicacao":"A câmara de mina de Hoffmann ocorre em tiro encostado sobre plano ósseo, quando os gases descolam e rompem a pele, originando lesão estrelada. Tatuagem e esfumaçamento indicam tiro a curta distância, a orla de enxugo é a limpeza do projétil na pele e o funil de Bonnet é o bisel no osso.","tema":"traumatologia-forense","subtema":"traumatologia-forense.instrumentos-e-lesoes","especialidade":"medicina-legal","disciplina":"Medicina Legal","dificuldade":2,"fonte":"autoral"},{"id":"med-93144b36","area":"Medicina Legal","enunciado":"Após agressão, a vítima fica incapacitada para suas ocupações habituais por 40 dias, sem sequelas permanentes. Pelo artigo 129 do Código Penal, a lesão corporal é classificada como:","alternativas":["Leve","Gravíssima","Grave","Seguida de morte","Culposa"],"correta":2,"explicacao":"O §1º do artigo 129 define como grave a lesão que causa incapacidade para as ocupações habituais por mais de 30 dias, perigo de vida, debilidade permanente de membro, sentido ou função ou aceleração de parto. A gravíssima (§2º) envolve, por exemplo, incapacidade permanente para o trabalho, perda de membro ou deformidade permanente.","tema":"traumatologia-forense","subtema":"traumatologia-forense.lesoes-corporais-no-codigo-penal","especialidade":"medicina-legal","disciplina":"Medicina Legal","dificuldade":2,"fonte":"autoral"},{"id":"med-230bd68a","area":"Medicina Legal","enunciado":"Na perícia de uma equimose, a sequência habitual de cores ao longo dos dias (espectro equimótico de Legrand du Saulle) ajuda a estimar a idade da lesão. A ordem é:","alternativas":["Vermelha, violácea, azulada, esverdeada, amarelada","Amarelada, esverdeada, azulada, violácea, vermelha","Esverdeada, vermelha, amarelada, azulada, violácea","Azulada, amarelada, vermelha, esverdeada, violácea","Violácea, amarelada, vermelha, azulada, esverdeada"],"correta":0,"explicacao":"A degradação da hemoglobina extravasada faz a equimose passar de vermelha a violácea, azulada, esverdeada (biliverdina) e amarelada (bilirrubina) até desaparecer. A estimativa é aproximada, pois varia com a profundidade, o local e a extensão da lesão.","tema":"traumatologia-forense","subtema":"traumatologia-forense.instrumentos-e-lesoes","especialidade":"medicina-legal","disciplina":"Medicina Legal","dificuldade":2,"fonte":"autoral"}],"residencia":[{"id":"res-1c7e9f5c","area":"Clínica Médica","enunciado":"Critério diagnóstico de diabetes mellitus (em duas ocasiões, sem hiperglicemia inequívoca):","alternativas":["Glicemia de jejum ≥ 100 mg/dL","Glicemia de jejum ≥ 126 mg/dL","HbA1c ≥ 5,7%","Glicemia casual ≥ 140 mg/dL","TOTG 2 h ≥ 140 mg/dL"],"correta":1,"explicacao":"Jejum ≥ 126, HbA1c ≥ 6,5%, TOTG 2 h ≥ 200 ou casual ≥ 200 com sintomas. 100–125 é pré-diabetes.","tema":"diabetes-mellitus","subtema":"diabetes-mellitus.diagnostico","especialidade":"endocrinologia","disciplina":"Clínica Médica","dificuldade":1,"fonte":"autoral"},{"id":"res-f757fbd2","area":"Clínica Médica","enunciado":"A primeira medida terapêutica na cetoacidose diabética é:","alternativas":["Insulina regular em bolus","Bicarbonato de sódio","Hidratação venosa com SF 0,9%","Reposição de fósforo","Glicose a 5%"],"correta":2,"explicacao":"Hidratação vem primeiro. Insulina só após checar K⁺ (se < 3,3 mEq/L, repor potássio antes).","tema":"diabetes-mellitus","subtema":"diabetes-mellitus.complicacoes-agudas","especialidade":"endocrinologia","disciplina":"Clínica Médica","dificuldade":2,"fonte":"autoral"},{"id":"res-630b1f2d","area":"Cirurgia","enunciado":"No ABCDE do trauma, a letra A corresponde a:","alternativas":["Avaliação neurológica","Via aérea e proteção cervical","Controle de hemorragia","Exposição","Respiração"],"correta":1,"explicacao":"A: via aérea + proteção cervical; B: respiração; C: circulação e hemorragia; D: neurológico; E: exposição/ambiente.","tema":"atendimento-inicial-ao-politraumatizado","subtema":"atendimento-inicial-ao-politraumatizado.avaliacao-primaria-abcde","especialidade":"trauma","disciplina":"Cirurgia","dificuldade":1,"fonte":"autoral"},{"id":"res-c570bc3a","area":"Cirurgia","enunciado":"Dor à descompressão brusca da fossa ilíaca direita (sinal de Blumberg) sugere:","alternativas":["Colecistite","Apendicite aguda","Diverticulite","Pancreatite","Litíase renal"],"correta":1,"explicacao":"Blumberg indica irritação peritoneal, classicamente no ponto de McBurney na apendicite.","tema":"apendicite-aguda","subtema":"apendicite-aguda.diagnostico","especialidade":"cirurgia-geral","disciplina":"Cirurgia","dificuldade":1,"fonte":"autoral"},{"id":"res-7576a2af","area":"Pediatria","enunciado":"A vacina BCG, pelo calendário do PNI, é aplicada:","alternativas":["Aos 2 meses","Ao nascer","Aos 12 meses","Aos 4 anos","Aos 6 meses"],"correta":1,"explicacao":"Dose única ao nascer (ou o mais cedo possível), protege contra formas graves de tuberculose.","tema":"imunizacoes","subtema":"imunizacoes.calendario-vacinal","especialidade":"pediatria-geral","disciplina":"Pediatria","dificuldade":1,"fonte":"autoral"},{"id":"res-a2ba5aa5","area":"Pediatria","enunciado":"Um marco do desenvolvimento esperado por volta dos 2 meses é:","alternativas":["Sentar sem apoio","Sorriso social","Andar com apoio","Pinça fina","Falar frases"],"correta":1,"explicacao":"Sorriso social ~2 meses; sentar sem apoio ~6 meses; pinça ~9–10 meses; andar ~12 meses.","tema":"puericultura","subtema":"puericultura.desenvolvimento-neuropsicomotor","especialidade":"pediatria-geral","disciplina":"Pediatria","dificuldade":1,"fonte":"autoral"},{"id":"res-44bd0d73","area":"Ginecologia e Obstetrícia","enunciado":"A droga de escolha para prevenir e tratar convulsões na pré-eclâmpsia grave/eclâmpsia é:","alternativas":["Diazepam","Fenitoína","Sulfato de magnésio","Hidralazina","Nifedipino"],"correta":2,"explicacao":"Sulfato de magnésio (esquemas de Pritchard ou Zuspan). Hidralazina/nifedipino tratam a pressão.","tema":"sindromes-hipertensivas-da-gestacao","subtema":"sindromes-hipertensivas-da-gestacao.eclampsia-e-prevencao-de-convulsoes","especialidade":"obstetricia","disciplina":"Ginecologia e Obstetrícia","dificuldade":1,"fonte":"autoral"},{"id":"res-a15d620b","area":"Ginecologia e Obstetrícia","enunciado":"Gestação a termo corresponde à idade gestacional de:","alternativas":["34 a 36s6d","37 a 41s6d","36 a 40 semanas","38 a 42 semanas","≥ 42 semanas"],"correta":1,"explicacao":"Pré-termo < 37 semanas; termo 37 a 41s6d; pós-termo ≥ 42 semanas.","tema":"pre-natal","subtema":"pre-natal.idade-gestacional-e-datacao","especialidade":"obstetricia","disciplina":"Ginecologia e Obstetrícia","dificuldade":1,"fonte":"autoral"},{"id":"res-ea256408","area":"Medicina Preventiva","enunciado":"Sensibilidade de um teste diagnóstico é:","alternativas":["Proporção de doentes com teste positivo","Proporção de sadios com teste negativo","Probabilidade de doença dado teste positivo","Proporção de positivos na população","Taxa de falsos positivos"],"correta":0,"explicacao":"Sensibilidade = VP/(VP+FN). Especificidade = VN/(VN+FP). A probabilidade de doença dado teste positivo é o valor preditivo positivo.","tema":"testes-diagnosticos","subtema":"testes-diagnosticos.sensibilidade-e-especificidade","especialidade":"epidemiologia","disciplina":"Epidemiologia","dificuldade":1,"fonte":"autoral"},{"id":"res-2ecf9576","area":"Medicina Preventiva","enunciado":"A Lei Orgânica da Saúde, que regula o SUS, é a:","alternativas":["Lei 8.142/1990","Lei 8.080/1990","Lei 9.656/1998","Lei 13.979/2020","Constituição, art. 5º"],"correta":1,"explicacao":"Lei 8.080/1990. A 8.142/1990 trata de participação social e financiamento; a 9.656/1998, de planos de saúde.","tema":"sus-principios-e-legislacao","subtema":"sus-principios-e-legislacao.lei-8-080-1990","especialidade":"saude-publica-sus","disciplina":"Saúde Coletiva","dificuldade":1,"fonte":"autoral"},{"id":"res-72daf190","area":"Medicina Preventiva","enunciado":"São princípios doutrinários do SUS:","alternativas":["Universalidade, integralidade e equidade","Descentralização, regionalização e hierarquização","Lucro, eficiência e mercado","Privatização e seletividade","Participação popular e cofinanciamento"],"correta":0,"explicacao":"Doutrinários: universalidade, integralidade, equidade. Descentralização, regionalização e hierarquização são princípios organizativos.","tema":"sus-principios-e-legislacao","subtema":"sus-principios-e-legislacao.principios-e-diretrizes","especialidade":"saude-publica-sus","disciplina":"Saúde Coletiva","dificuldade":1,"fonte":"autoral"},{"id":"res-53920861","area":"Clínica Médica","enunciado":"Mulher de 70 anos com hiponatremia crônica (Na⁺ 112 mEq/L) recebe correção rápida do sódio e, dois dias depois, evolui com disartria, disfagia e tetraparesia. A complicação mais provável é:","alternativas":["Síndrome de desmielinização osmótica","Edema cerebral por hiponatremia persistente","Acidente vascular cerebral isquêmico de tronco","Encefalopatia de Wernicke","Síndrome de Guillain-Barré"],"correta":0,"explicacao":"A correção rápida da hiponatremia crônica causa desmielinização osmótica (mielinólise pontina), com quadro bifásico de disartria, disfagia e tetraparesia; por isso a velocidade de correção deve ser limitada.","tema":"disturbios-hidroeletroliticos","subtema":"disturbios-hidroeletroliticos.disturbios-do-sodio","especialidade":"nefrologia","disciplina":"Clínica Médica","dificuldade":2,"fonte":"autoral"},{"id":"res-8c625d79","area":"Clínica Médica","enunciado":"Paciente renal crônico chega com K⁺ de 7,8 mEq/L e ECG com ondas T apiculadas e alargamento do QRS. A primeira medida, visando proteger o miocárdio, é:","alternativas":["Poliestirenossulfonato de cálcio por via oral","Gluconato de cálcio endovenoso","Furosemida endovenosa","Hemodiálise imediata como única medida","Bicarbonato de sódio como primeira escolha"],"correta":1,"explicacao":"Com alteração eletrocardiográfica, o cálcio EV estabiliza a membrana do cardiomiócito em minutos, sem reduzir o potássio; em seguida vêm as medidas que deslocam o K⁺ para dentro da célula (insulina com glicose, beta-2 agonista) e as que o removem.","tema":"disturbios-hidroeletroliticos","subtema":"disturbios-hidroeletroliticos.disturbios-do-potassio","especialidade":"nefrologia","disciplina":"Clínica Médica","dificuldade":2,"fonte":"autoral"},{"id":"res-a2cbe9d5","area":"Clínica Médica","enunciado":"Toracocentese: proteína pleural 4,0 g/dL (sérica 6,0 g/dL); LDH pleural 300 U/L (sérica 250 U/L; limite superior 240 U/L). Pelos critérios de Light, o derrame é:","alternativas":["Transudato, pois a relação de proteínas é menor que 1","Transudato, típico de insuficiência cardíaca","Exsudato, pois preenche os três critérios de Light","Exsudato apenas pelo critério da LDH pleural","Indeterminado, sendo obrigatório dosar o gradiente de albumina"],"correta":2,"explicacao":"Light: exsudato se proteína pleural/sérica > 0,5 (aqui 0,67), LDH pleural/sérica > 0,6 (aqui 1,2) ou LDH pleural > 2/3 do limite superior sérico (300 > 160). Basta um critério; este caso preenche os três.","tema":"derrame-pleural","subtema":"derrame-pleural.criterios-de-light","especialidade":"pneumologia","disciplina":"Clínica Médica","dificuldade":3,"fonte":"autoral"},{"id":"res-938bf64a","area":"Clínica Médica","enunciado":"Homem de 68 anos com pneumonia comunitária, confuso, FR 34 irpm, PA 110/70 mmHg e ureia 30 mg/dL. Seu escore CURB-65 é:","alternativas":["1","2","4","3","5"],"correta":3,"explicacao":"CURB-65: Confusão (1), Ureia > 50 mg/dL (0), FR ≥ 30 (1), PAS < 90 ou PAD ≤ 60 (0), idade ≥ 65 (1) = 3, o que indica pneumonia grave com indicação de internação.","tema":"pneumonia","subtema":"pneumonia.estratificacao-de-gravidade","especialidade":"pneumologia","disciplina":"Clínica Médica","dificuldade":2,"fonte":"autoral"},{"id":"res-47c52df8","area":"Clínica Médica","enunciado":"Mulher de 35 anos com menorragia, fadiga e anemia microcítica e hipocrômica. O perfil laboratorial esperado na anemia ferropriva é:","alternativas":["Ferritina elevada e capacidade total de ligação do ferro baixa","Ferritina normal e saturação de transferrina elevada","Ferro sérico elevado e ferritina elevada","Ferritina baixa e capacidade total de ligação do ferro baixa","Ferritina baixa e capacidade total de ligação do ferro elevada"],"correta":4,"explicacao":"Na ferropenia os estoques caem (ferritina baixa) e a transferrina aumenta (CTLF alta, saturação baixa). Ferritina alta com CTLF baixa sugere anemia de doença crônica.","tema":"anemias","subtema":"anemias.anemia-ferropriva","especialidade":"hematologia","disciplina":"Clínica Médica","dificuldade":2,"fonte":"autoral"},{"id":"res-d4b2f7e4","area":"Clínica Médica","enunciado":"Mulher de 40 anos, assintomática, apresenta TSH 8,5 mUI/L (referência 0,4–4,5) e T4 livre normal, confirmados em nova dosagem. O diagnóstico é:","alternativas":["Hipotireoidismo subclínico","Hipotireoidismo primário franco","Hipotireoidismo central","Hipertireoidismo subclínico","Síndrome do eutireoidiano doente"],"correta":0,"explicacao":"TSH elevado com T4 livre normal define hipotireoidismo subclínico; TSH alto com T4 livre baixo é hipotireoidismo primário franco; TSH baixo/normal com T4 livre baixo sugere causa central.","tema":"doencas-da-tireoide","subtema":"doencas-da-tireoide.hipotireoidismo","especialidade":"endocrinologia","disciplina":"Clínica Médica","dificuldade":2,"fonte":"autoral"},{"id":"res-23e6a1e9","area":"Clínica Médica","enunciado":"Adulto com edema generalizado, albumina sérica de 2,0 g/dL e colesterol elevado. Qual achado urinário completa a definição de síndrome nefrótica?","alternativas":["Hematúria dismórfica com cilindros hemáticos","Proteinúria acima de 3,5 g/24 h","Proteinúria entre 150 e 300 mg/24 h","Leucocitúria com cilindros leucocitários","Glicosúria com glicemia normal"],"correta":1,"explicacao":"Síndrome nefrótica: proteinúria > 3,5 g/24 h (no adulto), hipoalbuminemia, edema e dislipidemia. Hematúria dismórfica com cilindros hemáticos caracteriza síndrome nefrítica.","tema":"sindromes-glomerulares","subtema":"sindromes-glomerulares.sindrome-nefrotica","especialidade":"nefrologia","disciplina":"Clínica Médica","dificuldade":1,"fonte":"autoral"},{"id":"res-fea5e4d7","area":"Clínica Médica","enunciado":"Homem de 58 anos com dor torácica há 1 hora. O ECG mostra supradesnivelamento do segmento ST em DII, DIII e aVF. A parede acometida é a:","alternativas":["Anterior extensa","Lateral alta","Inferior","Septal","Posterior isolada"],"correta":2,"explicacao":"DII, DIII e aVF exploram a parede inferior, geralmente irrigada pela coronária direita. V1–V4 correspondem à parede anterosseptal e DI/aVL à lateral alta.","tema":"sindrome-coronariana-aguda","subtema":"sindrome-coronariana-aguda.eletrocardiograma-e-localizacao","especialidade":"cardiologia","disciplina":"Clínica Médica","dificuldade":1,"fonte":"autoral"},{"id":"res-b3ec8e48","area":"Clínica Médica","enunciado":"Jovem com febre, cefaleia e rigidez de nuca. Líquor turvo com 2.500 células/mm³ (90% neutrófilos), glicose de 20 mg/dL (glicemia 100 mg/dL) e proteína de 250 mg/dL. O padrão é mais compatível com meningite:","alternativas":["Viral","Tuberculosa","Fúngica criptocócica","Bacteriana","Carcinomatosa"],"correta":3,"explicacao":"Pleocitose neutrofílica intensa, glicose baixa (relação líquor/sangue < 0,4) e proteína alta caracterizam meningite bacteriana. A viral tem predomínio linfocitário e glicose normal; a tuberculosa, linfócitos com glicose baixa e evolução subaguda.","tema":"meningites","subtema":"meningites.analise-do-liquor","especialidade":"infectologia","disciplina":"Clínica Médica","dificuldade":2,"fonte":"autoral"},{"id":"res-7eb4f1dd","area":"Clínica Médica","enunciado":"Adulto com diagnóstico novo de tuberculose pulmonar, sem tratamento prévio. Pelo Manual de Recomendações para o Controle da Tuberculose do Ministério da Saúde, o esquema básico é:","alternativas":["2 meses de rifampicina, isoniazida e pirazinamida, seguidos de 4 meses de isoniazida isolada","2 meses de rifampicina e isoniazida, seguidos de 4 meses de etambutol","9 meses de isoniazida isolada","12 meses de rifampicina, isoniazida, pirazinamida e etambutol","2 meses de rifampicina, isoniazida, pirazinamida e etambutol, seguidos de 4 meses de rifampicina e isoniazida"],"correta":4,"explicacao":"O esquema básico brasileiro para adultos é 2RHZE/4RH: fase intensiva de 2 meses com quatro fármacos e fase de manutenção de 4 meses com rifampicina e isoniazida.","tema":"tuberculose","subtema":"tuberculose.tratamento","especialidade":"infectologia","disciplina":"Clínica Médica","dificuldade":2,"fonte":"autoral"},{"id":"res-bb2bc86e","area":"Clínica Médica","enunciado":"Gasometria: pH 7,25; pCO₂ 29 mmHg; HCO₃⁻ 14 mEq/L. Na⁺ 140, Cl⁻ 104 mEq/L. A interpretação correta é:","alternativas":["Acidose metabólica com ânion gap aumentado e compensação respiratória adequada","Acidose metabólica hiperclorêmica com ânion gap normal","Acidose respiratória aguda","Acidose metabólica com ânion gap aumentado e acidose respiratória associada","Alcalose respiratória com compensação metabólica"],"correta":0,"explicacao":"Ânion gap = 140 − (104 + 14) = 22 (aumentado). Pela fórmula de Winters, pCO₂ esperada = 1,5 × 14 + 8 = 29 ± 2; a pCO₂ medida (29) indica compensação respiratória adequada.","tema":"disturbios-acido-base","subtema":"disturbios-acido-base.acidose-metabolica-e-anion-gap","especialidade":"nefrologia","disciplina":"Clínica Médica","dificuldade":3,"fonte":"autoral"},{"id":"res-9c606336","area":"Clínica Médica","enunciado":"Tabagista de 60 anos com dispneia progressiva e tosse crônica. Qual achado espirométrico confirma limitação persistente ao fluxo aéreo compatível com DPOC?","alternativas":["Relação VEF1/CVF < 0,70 apenas antes do broncodilatador","Relação VEF1/CVF < 0,70 após broncodilatador","Aumento do VEF1 de 20% após broncodilatador","CVF reduzida com relação VEF1/CVF aumentada","Capacidade de difusão do CO aumentada"],"correta":1,"explicacao":"Segundo a GOLD, o diagnóstico exige VEF1/CVF < 0,70 pós-broncodilatador. CVF reduzida com relação preservada ou aumentada sugere distúrbio restritivo.","tema":"dpoc","subtema":"dpoc.diagnostico-e-espirometria","especialidade":"pneumologia","disciplina":"Clínica Médica","dificuldade":2,"fonte":"autoral"},{"id":"res-5523c7de","area":"Cirurgia","enunciado":"Homem de 70 kg sofre queimadura de 2º e 3º graus em 30% da superfície corporal, além de 10% de queimadura de 1º grau. Pela fórmula de Parkland (4 mL × kg × %SCQ), o volume de cristaloide a infundir nas primeiras 8 horas após a queimadura é:","alternativas":["8.400 mL","5.600 mL","4.200 mL","2.800 mL","11.200 mL"],"correta":2,"explicacao":"Considera-se só a área de 2º e 3º graus: 4 × 70 × 30 = 8.400 mL em 24 h, metade (4.200 mL) nas primeiras 8 h a partir do momento da queimadura. A 10ª edição do ATLS propõe iniciar com 2 mL/kg/%SCQ em adultos, ajustando pela diurese.","tema":"queimaduras","subtema":"queimaduras.reposicao-volemica","especialidade":"trauma","disciplina":"Cirurgia","dificuldade":3,"fonte":"autoral"},{"id":"res-6873edc4","area":"Cirurgia","enunciado":"Vítima de trauma craniano abre os olhos apenas à pressão/estímulo doloroso, fala palavras inapropriadas e localiza o estímulo doloroso. Sua pontuação na Escala de Coma de Glasgow é:","alternativas":["8","9","11","10","12"],"correta":3,"explicacao":"Abertura ocular à pressão = 2; resposta verbal com palavras inapropriadas = 3; resposta motora que localiza = 5. Total: 10.","tema":"traumatismo-cranioencefalico","subtema":"traumatismo-cranioencefalico.escala-de-coma-de-glasgow","especialidade":"trauma","disciplina":"Cirurgia","dificuldade":2,"fonte":"autoral"},{"id":"res-41922d8e","area":"Cirurgia","enunciado":"Politraumatizado com taquicardia importante, hipotensão, pulso fino, ansiedade, confusão e débito urinário reduzido. Pela classificação do choque hemorrágico do ATLS, a perda volêmica estimada é de:","alternativas":["Até 15% (classe I)","15% a 30% (classe II)","Mais de 40% (classe IV)","Menos de 5%, sem repercussão clínica","30% a 40% (classe III)"],"correta":4,"explicacao":"A classe III (30–40%) é a primeira com queda da pressão arterial, além de taquicardia acentuada, confusão e oligúria. Na classe II a PA ainda está preservada; na classe IV há hipotensão grave, letargia e diurese mínima.","tema":"atendimento-inicial-ao-politraumatizado","subtema":"atendimento-inicial-ao-politraumatizado.choque-hemorragico","especialidade":"trauma","disciplina":"Cirurgia","dificuldade":2,"fonte":"autoral"},{"id":"res-c0790836","area":"Cirurgia","enunciado":"Após ferimento no tórax, paciente evolui com dispneia intensa, hipotensão, turgência jugular, desvio da traqueia para a esquerda e murmúrio vesicular abolido à direita. A conduta imediata é:","alternativas":["Descompressão torácica imediata do lado direito, sem aguardar exame de imagem","Radiografia de tórax para confirmar o diagnóstico","Pericardiocentese","Intubação orotraqueal e ventilação com pressão positiva antes de qualquer outra medida","Toracotomia de reanimação no centro cirúrgico"],"correta":0,"explicacao":"O quadro é de pneumotórax hipertensivo, cujo diagnóstico é clínico. O ATLS recomenda descompressão imediata (agulha ou digital) seguida de drenagem em selo d'água; aguardar imagem ou ventilar com pressão positiva antes piora o quadro.","tema":"trauma-toracico","subtema":"trauma-toracico.pneumotorax-hipertensivo","especialidade":"trauma","disciplina":"Cirurgia","dificuldade":2,"fonte":"autoral"},{"id":"res-3303de46","area":"Cirurgia","enunciado":"Durante herniorrafia inguinal, o cirurgião encontra saco herniário que emerge lateralmente aos vasos epigástricos inferiores, através do anel inguinal profundo. Trata-se de hérnia:","alternativas":["Inguinal direta","Inguinal indireta","Femoral","Umbilical","De Spiegel"],"correta":1,"explicacao":"A hérnia indireta passa pelo anel inguinal profundo, lateral aos vasos epigástricos inferiores. A direta protrui pelo triângulo de Hesselbach, medial a esses vasos; a femoral fica abaixo do ligamento inguinal.","tema":"hernias-da-parede-abdominal","subtema":"hernias-da-parede-abdominal.hernias-inguinais","especialidade":"cirurgia-geral","disciplina":"Cirurgia","dificuldade":2,"fonte":"autoral"},{"id":"res-85bf277a","area":"Cirurgia","enunciado":"Mulher de 45 anos com dor em hipocôndrio direito há 2 dias, febre e parada da inspiração à palpação profunda do hipocôndrio direito. O exame de imagem inicial de escolha é:","alternativas":["Tomografia computadorizada de abdome com contraste","Colangiorressonância","Ultrassonografia de abdome","Colangiopancreatografia retrógrada endoscópica","Radiografia simples de abdome"],"correta":2,"explicacao":"O sinal de Murphy sugere colecistite aguda. A ultrassonografia é o exame inicial (Diretrizes de Tóquio): barata, sem radiação e sensível para cálculos, espessamento da parede e líquido perivesicular.","tema":"doencas-biliares","subtema":"doencas-biliares.colecistite-aguda","especialidade":"cirurgia-geral","disciplina":"Cirurgia","dificuldade":1,"fonte":"autoral"},{"id":"res-0ff88a16","area":"Cirurgia","enunciado":"Homem de 55 anos com antecedente de colectomia há 5 anos apresenta dor abdominal em cólica, vômitos, distensão e parada de eliminação de gases e fezes. A causa mais provável da obstrução é:","alternativas":["Neoplasia de intestino delgado","Hérnia interna congênita","Íleo biliar","Aderências (bridas) pós-operatórias","Volvo de sigmoide"],"correta":3,"explicacao":"As aderências pós-operatórias são a principal causa de obstrução de intestino delgado em adultos com cirurgia abdominal prévia; hérnias e neoplasias vêm em seguida.","tema":"obstrucao-intestinal","subtema":"obstrucao-intestinal.etiologia","especialidade":"cirurgia-geral","disciplina":"Cirurgia","dificuldade":2,"fonte":"autoral"},{"id":"res-b3d648ff","area":"Cirurgia","enunciado":"Paciente com coledocolitíase conhecida apresenta febre com calafrios, icterícia e dor em hipocôndrio direito, evoluindo com hipotensão e confusão mental. O diagnóstico é:","alternativas":["Colecistite aguda não complicada","Pancreatite aguda leve","Hepatite viral aguda","Abscesso hepático amebiano","Colangite aguda grave (pêntade de Reynolds)"],"correta":4,"explicacao":"Febre, icterícia e dor em hipocôndrio direito formam a tríade de Charcot da colangite; somadas a hipotensão e alteração do estado mental formam a pêntade de Reynolds, que indica colangite grave com necessidade de drenagem biliar urgente.","tema":"doencas-biliares","subtema":"doencas-biliares.colangite-aguda","especialidade":"cirurgia-geral","disciplina":"Cirurgia","dificuldade":2,"fonte":"autoral"},{"id":"res-f7a696e7","area":"Cirurgia","enunciado":"Vítima de ferimento por arma branca em região precordial apresenta hipotensão, turgência jugular e bulhas cardíacas abafadas, com murmúrio vesicular presente e simétrico. A principal hipótese é:","alternativas":["Tamponamento cardíaco","Pneumotórax hipertensivo","Hemotórax maciço","Contusão pulmonar","Choque neurogênico"],"correta":0,"explicacao":"Hipotensão, turgência jugular e abafamento de bulhas compõem a tríade de Beck. Murmúrio simétrico afasta pneumotórax hipertensivo e hemotórax maciço, que causariam murmúrio abolido de um lado.","tema":"trauma-toracico","subtema":"trauma-toracico.tamponamento-cardiaco","especialidade":"trauma","disciplina":"Cirurgia","dificuldade":2,"fonte":"autoral"},{"id":"res-162b9bc1","area":"Cirurgia","enunciado":"Pela classificação de Atlanta revisada (2012), o diagnóstico de pancreatite aguda exige:","alternativas":["Obrigatoriamente tomografia com necrose pancreática","Pelo menos dois de três critérios clínicos, laboratoriais e de imagem","Lipase acima de 10 vezes o limite superior, isoladamente","Presença de sinal de Cullen ou de Grey-Turner","Três ou mais critérios de Ranson na admissão"],"correta":1,"explicacao":"Atlanta revisada: dois de três critérios (dor típica; amilase/lipase ≥ 3× o limite superior; imagem compatível). Ranson avalia gravidade, não diagnóstico, e os sinais de Cullen e Grey-Turner são raros e inespecíficos.","tema":"pancreatite-aguda","subtema":"pancreatite-aguda.diagnostico-e-classificacao","especialidade":"cirurgia-geral","disciplina":"Cirurgia","dificuldade":2,"fonte":"autoral"},{"id":"res-0e8a6af8","area":"Pediatria","enunciado":"Lactente de 4 meses, no inverno, com coriza há 3 dias, seguida de taquipneia, tiragem subcostal, sibilos e crepitações difusas. O agente etiológico mais provável é:","alternativas":["Streptococcus pneumoniae","Mycoplasma pneumoniae","Vírus sincicial respiratório","Adenovírus","Bordetella pertussis"],"correta":2,"explicacao":"O quadro é de bronquiolite viral aguda, primeiro episódio de sibilância no lactente, cujo principal agente é o vírus sincicial respiratório, com pico no outono e inverno.","tema":"bronquiolite-viral-aguda","subtema":"bronquiolite-viral-aguda.etiologia","especialidade":"pediatria-geral","disciplina":"Pediatria","dificuldade":1,"fonte":"autoral"},{"id":"res-7c1e8d52","area":"Pediatria","enunciado":"Criança de 2 anos com diarreia aguda, irritada, com sede intensa, olhos fundos e sinal da prega que desaparece lentamente, sem sinais de gravidade, aceitando líquidos pela boca. Pelo manejo do Ministério da Saúde, a conduta é:","alternativas":["Plano A: tratamento domiciliar com aumento da oferta de líquidos","Plano C: hidratação venosa imediata","Jejum e hidratação venosa de manutenção","Plano B: reidratação oral com SRO na unidade de saúde","Antibiótico empírico e antidiarreico"],"correta":3,"explicacao":"Dois ou mais sinais (irritabilidade, sede, olhos fundos, prega que desaparece lentamente) indicam desidratação, tratada com o Plano B (SRO sob supervisão na unidade). O Plano C é para desidratação grave (letargia, prega muito lenta, incapacidade de beber).","tema":"diarreia-aguda-e-desidratacao","subtema":"diarreia-aguda-e-desidratacao.planos-de-hidratacao","especialidade":"pediatria-geral","disciplina":"Pediatria","dificuldade":2,"fonte":"autoral"},{"id":"res-2ee0c524","area":"Pediatria","enunciado":"Recém-nascido a termo apresenta icterícia visível com 18 horas de vida. A conduta mais adequada é:","alternativas":["Tranquilizar a mãe, pois se trata de icterícia fisiológica","Suspender o aleitamento materno por 48 horas","Expor o recém-nascido ao sol em casa","Aguardar a alta e reavaliar na consulta da primeira semana","Considerar a icterícia patológica e investigar hemólise"],"correta":4,"explicacao":"Icterícia nas primeiras 24 horas de vida é sempre patológica, geralmente por hemólise (incompatibilidade ABO/Rh), e exige investigação com dosagem de bilirrubinas. A fisiológica surge após 24 horas.","tema":"ictericia-neonatal","subtema":"ictericia-neonatal.ictericia-patologica","especialidade":"neonatologia","disciplina":"Pediatria","dificuldade":2,"fonte":"autoral"},{"id":"res-061df4bc","area":"Pediatria","enunciado":"No 5º minuto de vida, um recém-nascido tem frequência cardíaca de 120 bpm, choro forte, flexão ativa dos membros, careta ao estímulo da sonda nasal e extremidades cianóticas com corpo róseo. O boletim de Apgar é:","alternativas":["8","6","7","9","10"],"correta":0,"explicacao":"FC > 100 = 2; choro forte = 2; flexão ativa = 2; careta = 1; acrocianose = 1. Total: 8.","tema":"assistencia-ao-recem-nascido","subtema":"assistencia-ao-recem-nascido.boletim-de-apgar","especialidade":"neonatologia","disciplina":"Pediatria","dificuldade":2,"fonte":"autoral"},{"id":"res-65c66e7f","area":"Pediatria","enunciado":"Menino de 4 anos com edema palpebral e de membros inferiores, proteinúria maciça, albumina de 1,8 g/dL, PA normal e sem hematúria. A causa mais provável é:","alternativas":["Glomerulonefrite pós-estreptocócica","Doença de lesões mínimas","Nefropatia membranosa","Glomerulonefrite membranoproliferativa","Nefropatia por IgA"],"correta":1,"explicacao":"A doença de lesões mínimas responde pela maioria das síndromes nefróticas entre 1 e 10 anos e costuma ser corticossensível. A pós-estreptocócica e a nefropatia por IgA são nefríticas, com hematúria.","tema":"sindromes-glomerulares","subtema":"sindromes-glomerulares.doenca-de-lesoes-minimas","especialidade":"pediatria-geral","disciplina":"Pediatria","dificuldade":2,"fonte":"autoral"},{"id":"res-a71a87fe","area":"Pediatria","enunciado":"Criança de 2 anos com coriza há 2 dias acorda à noite com tosse ladrante, rouquidão e estridor inspiratório. O agente mais frequentemente envolvido é:","alternativas":["Haemophilus influenzae tipo b","Staphylococcus aureus","Vírus parainfluenza","Vírus sincicial respiratório","Streptococcus pyogenes"],"correta":2,"explicacao":"O quadro é de laringotraqueíte viral (crupe), cuja principal causa é o parainfluenza. O Haemophilus influenzae tipo b causa epiglotite, com toxemia, sialorreia e sem tosse ladrante.","tema":"laringotraqueobronquite-viral","subtema":"laringotraqueobronquite-viral.etiologia","especialidade":"pediatria-geral","disciplina":"Pediatria","dificuldade":1,"fonte":"autoral"},{"id":"res-af83c75f","area":"Pediatria","enunciado":"Criança de 3 anos com febre há 6 dias, conjuntivite não exsudativa bilateral, lábios fissurados, língua em framboesa, edema de mãos e pés e linfonodo cervical de 2 cm. A complicação mais temida dessa doença é:","alternativas":["Glomerulonefrite rapidamente progressiva","Encefalite","Insuficiência hepática aguda","Aneurisma de artérias coronárias","Artrite séptica"],"correta":3,"explicacao":"É a doença de Kawasaki, vasculite de médios vasos cuja complicação mais importante são os aneurismas coronarianos; o tratamento com imunoglobulina endovenosa e AAS reduz esse risco.","tema":"doenca-de-kawasaki","subtema":"doenca-de-kawasaki.complicacoes","especialidade":"pediatria-geral","disciplina":"Pediatria","dificuldade":2,"fonte":"autoral"},{"id":"res-66649a88","area":"Pediatria","enunciado":"Lactente de 4 semanas, do sexo masculino, com vômitos não biliosos em jato após as mamadas, fome logo após vomitar e perda de peso. O distúrbio metabólico esperado é:","alternativas":["Acidose metabólica hiperclorêmica","Acidose metabólica com ânion gap aumentado","Alcalose respiratória","Hipercalemia com acidose","Alcalose metabólica hipoclorêmica e hipocalêmica"],"correta":4,"explicacao":"Na estenose hipertrófica do piloro, a perda de ácido clorídrico pelos vômitos causa alcalose metabólica hipoclorêmica, e a hipocalemia decorre da perda renal de potássio por hiperaldosteronismo secundário.","tema":"estenose-hipertrofica-do-piloro","subtema":"estenose-hipertrofica-do-piloro.disturbios-metabolicos","especialidade":"pediatria-geral","disciplina":"Pediatria","dificuldade":2,"fonte":"autoral"},{"id":"res-98247263","area":"Pediatria","enunciado":"Lactente de 10 meses com febre alta há 3 dias, em bom estado geral. No dia em que a febre cessa, surge exantema maculopapular róseo em tronco. A principal hipótese é:","alternativas":["Exantema súbito (roséola), pelo herpesvírus humano 6","Sarampo","Escarlatina","Eritema infeccioso, pelo parvovírus B19","Rubéola"],"correta":0,"explicacao":"O exantema súbito caracteriza-se por febre alta por 3 a 5 dias com exantema que aparece após a defervescência, típico de lactentes, causado pelo HHV-6 (e HHV-7). No sarampo e na escarlatina o exantema surge com febre.","tema":"doencas-exantematicas","subtema":"doencas-exantematicas.exantema-subito","especialidade":"pediatria-geral","disciplina":"Pediatria","dificuldade":2,"fonte":"autoral"},{"id":"res-04a21f49","area":"Pediatria","enunciado":"Segundo a OMS e o Ministério da Saúde, o aleitamento materno deve ser:","alternativas":["Exclusivo até os 4 meses e complementado até 1 ano","Exclusivo até os 6 meses e complementado até 2 anos ou mais","Exclusivo até os 12 meses","Exclusivo até os 6 meses e interrompido com a introdução alimentar","Complementado com água e chás desde o 1º mês"],"correta":1,"explicacao":"Recomenda-se aleitamento materno exclusivo até os 6 meses, sem água ou chás, e mantido com alimentação complementar até 2 anos ou mais.","tema":"aleitamento-materno","subtema":"aleitamento-materno.recomendacoes","especialidade":"pediatria-geral","disciplina":"Pediatria","dificuldade":1,"fonte":"autoral"},{"id":"res-51600c9b","area":"Ginecologia e Obstetrícia","enunciado":"Gestante de 33 semanas com sangramento vaginal vermelho vivo, indolor, de início súbito, útero com tônus normal e BCF presentes. A principal hipótese e o cuidado ao exame são:","alternativas":["Descolamento prematuro de placenta; amniotomia imediata","Rotura uterina; laparotomia imediata","Placenta prévia; evitar toque vaginal até a ultrassonografia","Vasa prévia; toque vaginal para avaliar o colo","Trabalho de parto prematuro; tocólise e toque vaginal seriado"],"correta":2,"explicacao":"Sangramento vermelho vivo, indolor e com útero relaxado sugere placenta prévia. O toque vaginal pode provocar hemorragia grave e deve ser evitado até a ultrassonografia definir a posição da placenta.","tema":"hemorragias-da-segunda-metade-da-gestacao","subtema":"hemorragias-da-segunda-metade-da-gestacao.placenta-previa","especialidade":"obstetricia","disciplina":"Ginecologia e Obstetrícia","dificuldade":2,"fonte":"autoral"},{"id":"res-45b1eb4c","area":"Ginecologia e Obstetrícia","enunciado":"Gestante de 35 semanas, hipertensa crônica, com dor abdominal súbita e intensa, sangramento vaginal escuro, útero hipertônico e BCF de 100 bpm. O diagnóstico mais provável é:","alternativas":["Placenta prévia","Trabalho de parto fisiológico","Rotura prematura de membranas","Descolamento prematuro de placenta","Apendicite aguda na gestação"],"correta":3,"explicacao":"Dor súbita, hipertonia uterina, sangramento escuro e sofrimento fetal, com hipertensão como principal fator de risco, caracterizam o descolamento prematuro de placenta.","tema":"hemorragias-da-segunda-metade-da-gestacao","subtema":"hemorragias-da-segunda-metade-da-gestacao.descolamento-prematuro-de-placenta","especialidade":"obstetricia","disciplina":"Ginecologia e Obstetrícia","dificuldade":2,"fonte":"autoral"},{"id":"res-9b60b71a","area":"Ginecologia e Obstetrícia","enunciado":"Mulher de 28 anos com atraso menstrual de 7 semanas, dor pélvica intensa, hipotensão e taquicardia. β-hCG positivo, ultrassonografia sem saco gestacional intrauterino e grande quantidade de líquido livre na cavidade. A conduta é:","alternativas":["Metotrexato intramuscular","Conduta expectante com β-hCG seriado","Curetagem uterina","Repetir a ultrassonografia em 48 horas","Cirurgia imediata"],"correta":4,"explicacao":"É gravidez ectópica rota com instabilidade hemodinâmica, o que exige cirurgia imediata. Metotrexato e conduta expectante só cabem em pacientes estáveis, com massa íntegra.","tema":"hemorragias-da-primeira-metade-da-gestacao","subtema":"hemorragias-da-primeira-metade-da-gestacao.gravidez-ectopica","especialidade":"obstetricia","disciplina":"Ginecologia e Obstetrícia","dificuldade":2,"fonte":"autoral"},{"id":"res-d5c77329","area":"Ginecologia e Obstetrícia","enunciado":"Gestante com VDRL reagente e teste treponêmico positivo, sem alergia conhecida. O único tratamento considerado adequado para prevenir a sífilis congênita é:","alternativas":["Penicilina G benzatina","Ceftriaxona","Azitromicina","Doxiciclina","Eritromicina"],"correta":0,"explicacao":"Para o Ministério da Saúde, só a penicilina benzatina (iniciada até 30 dias antes do parto) trata adequadamente o feto. Outros antimicrobianos não previnem a sífilis congênita; em caso de alergia, faz-se dessensibilização.","tema":"sifilis","subtema":"sifilis.sifilis-na-gestacao-e-congenita","especialidade":"obstetricia","disciplina":"Ginecologia e Obstetrícia","dificuldade":1,"fonte":"autoral"},{"id":"res-4180a88b","area":"Ginecologia e Obstetrícia","enunciado":"Puérpera evolui com sangramento volumoso logo após a dequitação, com útero amolecido e acima da cicatriz umbilical. A causa mais comum de hemorragia pós-parto, compatível com o quadro, é:","alternativas":["Retenção de restos placentários","Atonia uterina","Laceração de trajeto","Coagulopatia","Inversão uterina"],"correta":1,"explicacao":"Dos \"4 T\" (tônus, trauma, tecido, trombina), o tônus, isto é, a atonia uterina, é a causa mais frequente. Útero amolecido e aumentado confirma o mecanismo; as primeiras medidas são massagem uterina e uterotônicos, com ocitocina como primeira escolha.","tema":"hemorragia-pos-parto","subtema":"hemorragia-pos-parto.causas-4-ts","especialidade":"obstetricia","disciplina":"Ginecologia e Obstetrícia","dificuldade":1,"fonte":"autoral"},{"id":"res-1a81202d","area":"Ginecologia e Obstetrícia","enunciado":"Mulher de 20 anos com 11 semanas de atraso menstrual, sangramento vaginal, útero maior que o esperado para a idade gestacional, β-hCG muito elevado e ultrassonografia com imagem em \"flocos de neve\", sem embrião. O diagnóstico e o seguimento são:","alternativas":["Abortamento retido; misoprostol e alta sem seguimento","Gestação gemelar; pré-natal de alto risco","Mola hidatiforme completa; esvaziamento e β-hCG seriado","Gravidez ectópica; metotrexato","Mioma uterino; miomectomia"],"correta":2,"explicacao":"Útero aumentado, β-hCG muito alto e imagem em flocos de neve sem embrião caracterizam mola completa. Trata-se com esvaziamento (preferencialmente por aspiração) e segue-se com β-hCG seriado até normalizar, para detectar neoplasia trofoblástica gestacional.","tema":"hemorragias-da-primeira-metade-da-gestacao","subtema":"hemorragias-da-primeira-metade-da-gestacao.doenca-trofoblastica-gestacional","especialidade":"obstetricia","disciplina":"Ginecologia e Obstetrícia","dificuldade":2,"fonte":"autoral"},{"id":"res-07e7fe47","area":"Ginecologia e Obstetrícia","enunciado":"Mulher de 24 anos com ciclos a cada 60–90 dias e hirsutismo, sem outras causas de hiperandrogenismo. Pelos critérios de Rotterdam, o diagnóstico de síndrome dos ovários policísticos:","alternativas":["Exige ultrassonografia com ovários policísticos, obrigatoriamente","Exige resistência insulínica comprovada","Exige obesidade associada","Já pode ser feito, pois há dois dos três critérios","Não pode ser feito sem LH/FSH maior que 2"],"correta":3,"explicacao":"Rotterdam: dois de três critérios (oligo/anovulação, hiperandrogenismo clínico ou laboratorial, morfologia policística à ultrassonografia), após excluir outras causas. Resistência insulínica, obesidade e relação LH/FSH não são critérios.","tema":"sindrome-dos-ovarios-policisticos","subtema":"sindrome-dos-ovarios-policisticos.criterios-diagnosticos","especialidade":"ginecologia","disciplina":"Ginecologia e Obstetrícia","dificuldade":2,"fonte":"autoral"},{"id":"res-31ff7aa0","area":"Ginecologia e Obstetrícia","enunciado":"Puérpera Rh negativo, com Coombs indireto negativo durante a gestação, tem recém-nascido Rh positivo. A conduta para prevenir aloimunização é:","alternativas":["Nenhuma, pois o Coombs indireto foi negativo","Imunoglobulina anti-D apenas se o Coombs direto do RN for positivo","Exsanguineotransfusão profilática do recém-nascido","Imunoglobulina anti-D somente na próxima gestação","Imunoglobulina anti-D até 72 horas após o parto"],"correta":4,"explicacao":"Mãe Rh negativo não sensibilizada (Coombs indireto negativo) com RN Rh positivo deve receber imunoglobulina anti-D em até 72 horas. Se já estiver sensibilizada, a imunoglobulina não tem mais efeito.","tema":"aloimunizacao-rh","subtema":"aloimunizacao-rh.profilaxia-com-imunoglobulina-anti-d","especialidade":"obstetricia","disciplina":"Ginecologia e Obstetrícia","dificuldade":2,"fonte":"autoral"},{"id":"res-4c7767b9","area":"Ginecologia e Obstetrícia","enunciado":"Mulher com corrimento acinzentado, homogêneo e com odor de peixe que piora após a relação sexual, pH vaginal de 5,0, teste das aminas positivo e clue cells à microscopia. O diagnóstico e o tratamento são:","alternativas":["Vaginose bacteriana; metronidazol","Candidíase vulvovaginal; fluconazol","Tricomoníase; tratamento apenas da parceria","Vaginite atrófica; estrogênio tópico","Cervicite gonocócica; ceftriaxona"],"correta":0,"explicacao":"Os critérios de Amsel (corrimento homogêneo, pH > 4,5, teste das aminas positivo, clue cells; três de quatro) confirmam vaginose bacteriana, tratada com metronidazol. A candidíase tem pH < 4,5 e corrimento grumoso.","tema":"vulvovaginites","subtema":"vulvovaginites.vaginose-bacteriana","especialidade":"ginecologia","disciplina":"Ginecologia e Obstetrícia","dificuldade":2,"fonte":"autoral"},{"id":"res-b63e3a89","area":"Medicina Preventiva","enunciado":"Um
