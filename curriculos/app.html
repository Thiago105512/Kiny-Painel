<style>
:root{
  --paper:#F4F6F3; --sheet:#FFFFFF; --ink:#1A1E24; --ink2:#4A515C; --muted:#737B86;
  --line:#DCE1DA; --pen:#2340B8; --pen-soft:#E4E8F8; --ok:#1C7C4A; --ok-soft:#E1F1E7;
  --bad:#B42318; --bad-soft:#FBE6E3; --track:#E6EAE4;

  --read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--paper:#13161B;--sheet:#1B1F26;--ink:#E8EAEE;--ink2:#B4BAC4;--muted:#8A919C;
  --line:#2C323B;--pen:#8FA3F5;--pen-soft:#232B4A;--ok:#5CC48A;--ok-soft:#173226;
  --bad:#F08A7E;--bad-soft:#3A1E1B;--track:#2A2F37;}}
:root[data-theme="dark"]{
  color-scheme:dark;--paper:#13161B;--sheet:#1B1F26;--ink:#E8EAEE;--ink2:#B4BAC4;--muted:#8A919C;
  --line:#2C323B;--pen:#8FA3F5;--pen-soft:#232B4A;--ok:#5CC48A;--ok-soft:#173226;
  --bad:#F08A7E;--bad-soft:#3A1E1B;--track:#2A2F37;}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--display);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;padding-block:20px 12px}
h1{font:700 26px/1.1 var(--display);margin:0;letter-spacing:-.01em}
h1 span{color:var(--pen)}
.sync{font:12px var(--mono);color:var(--muted)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:18px}
nav button{font:600 14px var(--display);background:none;border:0;color:var(--ink2);padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--pen);border-bottom-color:var(--pen)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label.lab{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:4px}
select,input[type=text],textarea{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
textarea{width:100%;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px}
.meta{font:12px var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:10px}
.q{font:400 18px/1.55 var(--read);margin:0 0 16px;white-space:pre-wrap}
.alts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.alt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font:400 16px/1.45 var(--read)}
.alt:hover:not(:disabled){border-color:var(--pen)}
.bubble{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink2);display:grid;place-items:center;font:600 12px var(--mono);color:var(--ink2);margin-top:-1px}
.alt[data-s="sel"]{border-color:var(--pen);background:var(--pen-soft)}
.alt[data-s="sel"] .bubble{background:var(--pen);border-color:var(--pen);color:var(--sheet)}
.alt[data-s="ok"]{border-color:var(--ok);background:var(--ok-soft)}
.alt[data-s="ok"] .bubble{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.alt[data-s="bad"]{border-color:var(--bad);background:var(--bad-soft)}
.alt[data-s="bad"] .bubble{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.alt:disabled{cursor:default}
.fb{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.verdict{font:700 15px var(--display);margin:0 0 6px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.exp{font:400 16px/1.55 var(--read);color:var(--ink2);margin:0;white-space:pre-wrap}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:space-between}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.stack{display:grid;gap:16px}
.toolbar{display:grid;gap:12px;margin-bottom:16px}
.sec{margin-bottom:22px}
.sec h2{font:700 19px var(--display);margin:0 0 10px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.sec h3{font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.check{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer;font:400 15px/1.45 var(--read)}
.check input{margin-top:4px;accent-color:var(--pen);width:16px;height:16px;flex:none}
.check input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.pct{font:600 13px var(--mono);color:var(--pen);font-variant-numeric:tabular-nums}
.meter{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--pen);border-radius:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:22px}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px}
.tile b{display:block;font:700 28px var(--display);font-variant-numeric:tabular-nums}
.tile span{font:12px var(--mono);color:var(--muted)}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.bar .meter{grid-column:1/-1}
.bar small{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:grid;gap:8px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--sheet);display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.item p{margin:0;font:400 15px/1.45 var(--read)}
.tag{font:11px var(--mono);color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.empty{color:var(--muted);font:400 16px/1.5 var(--read)}
.cartao{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.cartao button{font:600 12px var(--mono);border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:7px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.cartao button[data-f="1"]{background:var(--pen-soft);border-color:var(--pen);color:var(--pen)}
.cartao button[data-ok="1"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cartao button[data-ok="0"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cartao button[aria-current="true"]{outline:2px solid var(--ink);outline-offset:1px}
.provabar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 44px);z-index:4;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;margin-bottom:10px;border-bottom:1px dashed var(--line)}
.relogio{font:600 18px var(--mono);font-variant-numeric:tabular-nums}
.relogio.pouco{color:var(--bad)}
.rev{border-top:1px solid var(--line);padding-block:14px}
.rev .q{font-size:16px;margin-bottom:8px}
.rev p{margin:4px 0;font:400 15px/1.5 var(--read)}
.rev .sua.bad{color:var(--bad)} .rev .sua.ok{color:var(--ok)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .4s ease}}

egional)","Parceria com a Fundação de Medicina Tropical Dr. Heitor Vieira Dourado (FMT-HVD)","Forte em Medicina Tropical e interiorização do atendimento"],"Fametro (Manaus)":["Privada; metodologias ativas e integração ensino-serviço com a rede do SUS","Ingresso por vestibular próprio ou ENEM; FIES/ProUni"],"Nilton Lins (Manaus)":["Privada; possui hospital/clínicas-escola para prática","Ingresso por vestibular próprio ou ENEM; FIES/ProUni"],"Afya (unidade no Amazonas)":["Rede nacional focada em Medicina; modelo PBL, tutoria e laboratórios de simulação","Plataformas digitais próprias (ex.: Afya Whitebook/Medcel) no apoio ao estudo","Confirmar município/campus e PPC no site oficial da Afya"]},"residencia":{"Provas":["ENARE (Ebserh): exame nacional, inclui hospitais universitários como o HUGV/UFAM","SUS-SP, USP (FMUSP/HC), Unifesp, Unicamp, UFRJ, UERJ, Santa Casa-SP, Einstein","Amazonas: processos da UEA/FMT-HVD, SES-AM e hospitais conveniados"],"Conteúdo cobrado (acesso direto: 5 grandes áreas)":["Clínica Médica","Cirurgia Geral","Pediatria","Ginecologia e Obstetrícia","Medicina Preventiva e Social (SUS, epidemiologia, ética, legislação)"],"Especialidades de acesso direto mais concorridas":["Dermatologia","Oftalmologia","Radiologia","Ortopedia","Psiquiatria","Anestesiologia","Clínica Médica","Pediatria","Cirurgia Geral","Infectologia"],"Etapas comuns":["Prova objetiva (100-120 questões)","Prova prática/multimídia (em algumas)","Análise curricular (bônus PROVAB/Mais Médicos quando aplicável)"]},"direito":{"Base legal (DCN – Res. CNE/CES nº 5/2018, alt. nº 2/2021)":["5 anos (10 semestres), carga mínima 3.700 h","3 perspectivas: formação geral, técnico-jurídica e prático-profissional","Prática jurídica (NPJ), TCC e atividades complementares obrigatórios","Incentivo a formas consensuais de solução de conflitos"],"Formação geral (1º-2º ano)":["Introdução ao Estudo do Direito","Teoria Geral do Estado e Ciência Política","Filosofia e Filosofia do Direito","Sociologia Jurídica","Antropologia","História do Direito","Economia","Psicologia Jurídica","Ética","Metodologia da Pesquisa","Língua Portuguesa/Hermenêutica"],"Formação técnico-jurídica":["Direito Constitucional","Direito Administrativo","Direito Tributário e Financeiro","Direito Penal","Direito Civil (Geral, Obrigações, Contratos, Coisas, Família, Sucessões)","Direito Empresarial","Direito do Trabalho","Direito Internacional Público e Privado","Processo Civil","Processo Penal","Processo do Trabalho","Direito Previdenciário","Direito do Consumidor","Direito Ambiental","Direitos Humanos","ECA","Direito Digital (optativa em muitos cursos)"],"Formação prático-profissional (4º-5º ano)":["Núcleo de Prática Jurídica (NPJ) / escritório-modelo","Estágio supervisionado","Mediação, conciliação e arbitragem","Oficinas de peças processuais","TCC / monografia"],"Referências nacionais":["USP – Faculdade de Direito (Largo São Francisco)","UFMG","UERJ","UnB","UFPR","UFRJ (Faculdade Nacional)","UFPE","FGV Direito SP e Rio"],"UFAM – Faculdade de Direito (Manaus)":["Pública federal; herdeira da Escola Universitária Livre de Manáos (1909)","Ingresso via PSC e SISU; destaque em Direito Ambiental e Amazônico"],"UEA – Escola de Direito":["Pública estadual; ingresso via Vestibular e SIS","Linhas fortes: Direito Ambiental, Povos Tradicionais, Constitucional"],"Fametro (Manaus)":["Privada; NPJ com atendimento à comunidade; ingresso por vestibular ou ENEM"],"Nilton Lins (Manaus)":["Privada; NPJ e escritório-modelo; ingresso por vestibular ou ENEM"],"Afya":["Afya é focada em Medicina/Saúde; normalmente não oferta Direito (confirmar)"]},"oab":{"Exame da OAB – 1ª fase (80 questões, ~40 para passar)":["Ética/Estatuto da OAB (maior peso)","Constitucional","Civil","Processo Civil","Penal","Processo Penal","Trabalho","Processo do Trabalho","Administrativo","Tributário","Empresarial","Direitos Humanos","ECA","Consumidor","Ambiental","Internacional","Filosofia do Direito","Previdenciário"],"Exame da OAB – 2ª fase":["Esc const BANCO = /*BANCO*/{"enem":[{"id":"ene-6b707813","area":"Matemática","enunciado":"Um produto de R$ 200,00 teve aumento de 10% e, no mês seguinte, desconto de 10% sobre o novo preço. Qual o preço final?","alternativas":["R$ 200,00","R$ 202,00","R$ 198,00","R$ 180,00","R$ 220,00"],"correta":2,"explicacao":"200 × 1,10 = 220; 220 × 0,90 = 198. Aumento e desconto de mesma taxa não se anulam: o fator final é 1,1 × 0,9 = 0,99."},{"id":"ene-9b2c8fd6","area":"Matemática","enunciado":"Aplicando R$ 1.000,00 a juros compostos de 10% ao ano, qual o montante após 2 anos?","alternativas":["R$ 1.200,00","R$ 1.100,00","R$ 1.221,00","R$ 1.210,00","R$ 1.020,00"],"correta":3,"explicacao":"M = C(1 + i)^t = 1000 × 1,1² = 1210. R$ 1.200 seria juros simples."},{"id":"ene-02f0d6df","area":"Matemática","enunciado":"Qual a mediana do conjunto {3, 7, 2, 9, 5}?","alternativas":["5","5,2","7","3","9"],"correta":0,"explicacao":"Ordenando: 2, 3, 5, 7, 9. O termo central é 5. (5,2 é a média, pegadinha comum.)"},{"id":"ene-37e12bc4","area":"Matemática","enunciado":"Lançando dois dados comuns, qual a probabilidade de a soma ser 7?","alternativas":["1/12","7/36","1/36","1/3","1/6"],"correta":4,"explicacao":"Casos favoráveis: (1,6),(2,5),(3,4),(4,3),(5,2),(6,1) = 6. Total 36. 6/36 = 1/6."},{"id":"ene-96cf4d2a","area":"Biologia","enunciado":"A organela responsável pela maior parte da produção de ATP na respiração celular aeróbica é:","alternativas":["Ribossomo","Mitocôndria","Complexo golgiense","Lisossomo","Retículo endoplasmático liso"],"correta":1,"explicacao":"Ciclo de Krebs e cadeia respiratória ocorrem na mitocôndria, onde se forma a maior parte do ATP."},{"id":"ene-ae21eac1","area":"Biologia","enunciado":"No cruzamento Aa × Aa, com dominância completa, a proporção fenotípica esperada é:","alternativas":["1:2:1","1:1","3:1","9:3:3:1","Todos dominantes"],"correta":2,"explicacao":"Genótipos 1 AA : 2 Aa : 1 aa → fenótipos 3 dominantes : 1 recessivo. 1:2:1 é a proporção genotípica."},{"id":"ene-066d5a17","area":"Biologia","enunciado":"A associação entre fungos e algas que forma os liquens é exemplo de:","alternativas":["Parasitismo","Comensalismo","Predação","Mutualismo","Competição"],"correta":3,"explicacao":"Ambos se beneficiam e a relação é obrigatória: a alga faz fotossíntese, o fungo dá proteção e absorve água e sais."},{"id":"ene-2f8c7497","area":"Química","enunciado":"Uma solução tem [H⁺] = 10⁻³ mol/L a 25 °C. Seu pH é:","alternativas":["3","11","7","−3","0,001"],"correta":0,"explicacao":"pH = −log[H⁺] = −log 10⁻³ = 3 (solução ácida)."},{"id":"ene-14d7f2e2","area":"Química","enunciado":"Quantos mols há em 36 g de água (H₂O, massa molar 18 g/mol)?","alternativas":["0,5","1","18","2","36"],"correta":3,"explicacao":"n = m / M = 36 / 18 = 2 mol."},{"id":"ene-e3e12743","area":"Física","enunciado":"Um carro vai de 0 a 20 m/s em 5 s, em movimento uniformemente variado. Sua aceleração é:","alternativas":["100 m/s²","4 m/s²","0,25 m/s²","25 m/s²","15 m/s²"],"correta":1,"explicacao":"a = Δv/Δt = 20/5 = 4 m/s²."},{"id":"ene-0127e825","area":"Física","enunciado":"Dois resistores de 6 Ω e 3 Ω são ligados em paralelo. A resistência equivalente é:","alternativas":["9 Ω","4,5 Ω","2 Ω","18 Ω","0,5 Ω"],"correta":2,"explicacao":"Em paralelo: R = (6 × 3)/(6 + 3) = 18/9 = 2 Ω. A equivalente é sempre menor que o menor resistor."},{"id":"ene-2c673320","area":"História","enunciado":"O Teatro Amazonas, inaugurado em Manaus em 1896, é símbolo de qual período econômico?","alternativas":["Ciclo do ouro","Ciclo da cana-de-açúcar","Ciclo da borracha","Zona Franca de Manaus","Ciclo do café"],"correta":2,"explicacao":"A exportação do látex (fim do séc. XIX – início do XX) enriqueceu Manaus e Belém, financiando obras como o Teatro Amazonas. A Zona Franca é de 1967."},{"id":"ene-a1caa377","area":"História","enunciado":"A Lei Áurea, que aboliu a escravidão no Brasil, foi assinada em:","alternativas":["1822","1850","1871","1888","1889"],"correta":3,"explicacao":"13 de maio de 1888, pela Princesa Isabel. 1850: Lei Eusébio de Queirós; 1871: Ventre Livre; 1889: República."},{"id":"ene-3a4a948a","area":"Geografia","enunciado":"O Encontro das Águas, próximo a Manaus, é formado pelos rios:","alternativas":["Negro e Solimões","Madeira e Tapajós","Negro e Branco","Solimões e Purus","Amazonas e Xingu"],"correta":0,"explicacao":"As águas escuras do Negro e barrentas do Solimões correm lado a lado por quilômetros por diferenças de temperatura, velocidade e densidade."},{"id":"ene-5842196b","area":"Geografia","enunciado":"O clima predominante na Amazônia, quente e úmido o ano todo, é o:","alternativas":["Tropical de altitude","Semiárido","Subtropical","Equatorial","Tropical atlântico"],"correta":3,"explicacao":"Clima equatorial: temperaturas médias altas, pequena amplitude térmica anual e chuvas abundantes."},{"id":"ene-4dd1f9aa","area":"Filosofia","enunciado":"\"Penso, logo existo\" é uma formulação associada a:","alternativas":["Platão","Kant","Descartes","Nietzsche","Aristóteles"],"correta":2,"explicacao":"René Descartes, no Discurso do Método, marco do racionalismo moderno."},{"id":"ene-6033a7a6","area":"Sociologia","enunciado":"O conceito de \"fato social\", marcado por exterioridade, generalidade e coercitividade, é de:","alternativas":["Max Weber","Karl Marx","Émile Durkheim","Pierre Bourdieu","Auguste Comte"],"correta":2,"explicacao":"Durkheim, em As Regras do Método Sociológico. Weber trabalha com ação social; Marx, com luta de classes."},{"id":"ene-0853b5d1","area":"Português","enunciado":"Em \"Aquele rapaz é uma fera no xadrez\", a figura de linguagem é:","alternativas":["Metonímia","Hipérbole","Metáfora","Antítese","Eufemismo"],"correta":2,"explicacao":"Comparação implícita (sem \"como\"): o rapaz é associado a uma fera pela habilidade."},{"id":"ene-3b7c9ac5","area":"Literatura","enunciado":"Macunaíma, \"o herói sem nenhum caráter\", é obra de qual autor modernista?","alternativas":["Oswald de Andrade","Mário de Andrade","Carlos Drummond","Graciliano Ramos","Manuel Bandeira"],"correta":1,"explicacao":"Mário de Andrade (1928), rapsódia que mistura lendas indígenas, folclore e crítica à identidade nacional."},{"id":"ene-79ffec4b","area":"Redação","enunciado":"Na redação do ENEM, a competência 5 avalia:","alternativas":["Domínio da norma culta","Coesão textual","Proposta de intervenção","Compreensão do tema","Organização dos argumentos"],"correta":2,"explicacao":"C5: proposta com agente, ação, meio/modo, finalidade e detalhamento, respeitando os direitos humanos."},{"id":"ene-0b187b51","area":"Matemática","enunciado":"Uma progressão aritmética tem primeiro termo 3 e razão 4. Qual é o seu 20º termo?","alternativas":["79","83","80","76","75"],"correta":0,"explicacao":"aₙ = a₁ + (n − 1)r = 3 + 19 × 4 = 79. Usar 20 × 4 + 3 = 83 é o erro clássico de esquecer o (n − 1)."},{"id":"ene-cd805bd1","area":"Matemática","enunciado":"A altura, em metros, de um objeto lançado é dada por h(t) = −t² + 6t + 5, com t em segundos. Qual a altura máxima atingida?","alternativas":["5 m","14 m","3 m","9 m","23 m"],"correta":1,"explicacao":"O vértice ocorre em t = −b/2a = 3 s; h(3) = −9 + 18 + 5 = 14 m. O valor 3 é o instante do máximo, não a altura."},{"id":"ene-c50ec98e","area":"Matemática","enunciado":"Uma caixa-d'água cilíndrica tem raio interno de 2 m e altura de 3 m. Usando π = 3, sua capacidade é de:","alternativas":["18.000 litros","12.000 litros","36.000 litros","108.000 litros","3.600 litros"],"correta":2,"explicacao":"V = πr²h = 3 × 2² × 3 = 36 m³. Como 1 m³ = 1.000 L, a capacidade é de 36.000 litros."},{"id":"ene-50243a22","area":"Matemática","enunciado":"De um grupo de 6 estudantes, deseja-se formar uma comissão de 3 membros, sem cargos distintos. Quantas comissões diferentes são possíveis?","alternativas":["120","18","216","20","60"],"correta":3,"explicacao":"A ordem não importa, então é combinação: C(6,3) = 6!/(3!·3!) = 20. O valor 120 seria arranjo (ordem importando)."},{"id":"ene-0745e142","area":"Matemática","enunciado":"Em um mapa na escala 1:250.000, a distância entre duas comunidades ribeirinhas é de 4 cm. A distância real é de:","alternativas":["1 km","100 km","25 km","62,5 km","10 km"],"correta":4,"explicacao":"4 cm × 250.000 = 1.000.000 cm = 10.000 m = 10 km."},{"id":"ene-71bd5a67","area":"Matemática","enunciado":"Uma rampa de acessibilidade vence uma altura de 6 m ao longo de uma distância horizontal de 8 m. Qual o comprimento da rampa?","alternativas":["10 m","14 m","12 m","7 m","9 m"],"correta":0,"explicacao":"Pelo teorema de Pitágoras: c² = 6² + 8² = 36 + 64 = 100, logo c = 10 m. Somar os catetos (14 m) é a pegadinha."},{"id":"ene-147e590d","area":"Matemática","enunciado":"Uma cultura começa com 500 bactérias, e a população dobra a cada 3 horas. Quantas bactérias haverá após 12 horas?","alternativas":["4.000","8.000","2.000","16.000","6.000"],"correta":1,"explicacao":"Em 12 h ocorrem 12/3 = 4 duplicações: 500 × 2⁴ = 500 × 16 = 8.000. Multiplicar 500 por 12 trata o crescimento como linear."},{"id":"ene-45cbc305","area":"Matemática","enunciado":"Um aluno tirou 7 na prova de peso 2, 8 na prova de peso 3 e 4 no trabalho de peso 1. Sua média ponderada é:","alternativas":["6,33","6,5","7,0","7,5","8,0"],"correta":2,"explicacao":"Média ponderada = (7·2 + 8·3 + 4·1)/(2 + 3 + 1) = (14 + 24 + 4)/6 = 42/6 = 7,0. O valor 6,33 é a média aritmética simples."},{"id":"ene-d6755292","area":"Matemática","enunciado":"Um empréstimo de R$ 2.000,00 foi feito a juros simples de 3% ao mês, por 5 meses. O montante a pagar é:","alternativas":["R$ 2.318,55","R$ 2.030,00","R$ 2.150,00","R$ 2.300,00","R$ 2.600,00"],"correta":3,"explicacao":"J = C·i·t = 2000 × 0,03 × 5 = 300; M = 2.300. O valor R$ 2.318,55 corresponderia a juros compostos (2000 × 1,03⁵)."},{"id":"ene-72ded741","area":"Matemática","enunciado":"Uma urna tem 4 bolas azuis e 6 vermelhas. Retiram-se 2 bolas, sem reposição. Qual a probabilidade de ambas serem azuis?","alternativas":["4/25","1/5","2/5","1/15","2/15"],"correta":4,"explicacao":"P = 4/10 × 3/9 = 12/90 = 2/15. O valor 4/25 seria com reposição (4/10 × 4/10)."},{"id":"ene-75f308b7","area":"Física","enunciado":"Um chuveiro de 5.500 W é usado 20 minutos por dia durante 30 dias. O consumo mensal de energia é de:","alternativas":["55 kWh","165 kWh","110 kWh","5,5 kWh","3.300 kWh"],"correta":0,"explicacao":"E = P·t = 5,5 kW × (1/3 h) × 30 = 55 kWh. Usar 20 h em vez de 20 min, ou esquecer de converter minutos em horas, gera os valores distorcidos."},{"id":"ene-0465f4cd","area":"Física","enunciado":"Um objeto é abandonado do repouso a 45 m de altura. Desprezando a resistência do ar e adotando g = 10 m/s², o tempo de queda é:","alternativas":["4,5 s","3 s","9 s","2 s","1,5 s"],"correta":1,"explicacao":"h = gt²/2 ⇒ 45 = 5t² ⇒ t² = 9 ⇒ t = 3 s."},{"id":"ene-f9c6222f","area":"Física","enunciado":"Uma rádio FM transmite na frequência de 100 MHz. Sabendo que as ondas de rádio se propagam a 3 × 10⁸ m/s, o comprimento de onda é:","alternativas":["0,3 m","30 m","3 m","3,3 m","300 m"],"correta":2,"explicacao":"v = λf ⇒ λ = 3 × 10⁸ / 1 × 10⁸ = 3 m (lembrando que 100 MHz = 10⁸ Hz)."},{"id":"ene-45b6e2fd","area":"Física","enunciado":"Quanto calor é necessário para aquecer 500 g de água de 20 °C até 80 °C? (calor específico da água: 1 cal/g·°C)","alternativas":["40.000 cal","10.000 cal","3.000 cal","30.000 cal","60.000 cal"],"correta":3,"explicacao":"Q = m·c·ΔT = 500 × 1 × (80 − 20) = 30.000 cal. Usar a temperatura final (80) em vez da variação dá 40.000 cal."},{"id":"ene-7bb80274","area":"Física","enunciado":"Um canudo mergulhado parcialmente num copo com água parece 'quebrado' na superfície do líquido. Esse efeito se deve à:","alternativas":["reflexão total da luz","difração da luz","polarização da luz","interferência da luz","refração da luz"],"correta":4,"explicacao":"Ao passar da água para o ar, a luz muda de velocidade e de direção (refração), e o observador vê a parte submersa numa posição aparente diferente."},{"id":"ene-640e27a3","area":"Física","enunciado":"Considere que cada 10 m de profundidade na água acrescentam cerca de 1 atm de pressão. A pressão total (absoluta) sobre um mergulhador a 20 m de profundidade, ao nível do mar, é de aproximadamente:","alternativas":["3 atm","2 atm","1 atm","20 atm","4 atm"],"correta":0,"explicacao":"Pressão absoluta = pressão atmosférica + pressão da coluna d'água = 1 atm + 2 atm = 3 atm. Os 2 atm seriam só a pressão hidrostática (manométrica)."},{"id":"ene-f7a2d82d","area":"Química","enunciado":"Na equação da combustão completa do metano, CH₄ + O₂ → CO₂ + H₂O, balanceada com os menores coeficientes inteiros, a soma dos coeficientes é:","alternativas":["4","6","5","7","8"],"correta":1,"explicacao":"Balanceando: CH₄ + 2 O₂ → CO₂ + 2 H₂O. Soma = 1 + 2 + 1 + 2 = 6."},{"id":"ene-173f5b26","area":"Química","enunciado":"Dissolvem-se 20 g de cloreto de sódio em água até completar 500 mL de solução. A concentração comum é de:","alternativas":["10 g/L","20 g/L","40 g/L","0,04 g/L","4 g/L"],"correta":2,"explicacao":"C = m/V = 20 g / 0,5 L = 40 g/L. Dividir por 500 sem converter mL em L leva a 0,04 g/L."},{"id":"ene-2141df2e","area":"Química","enunciado":"100 mL de uma solução de HCl 2 mol/L são diluídos com água até 500 mL. A nova concentração é:","alternativas":["1 mol/L","0,2 mol/L","10 mol/L","0,4 mol/L","0,5 mol/L"],"correta":3,"explicacao":"Na diluição o número de mols se conserva: C₁V₁ = C₂V₂ ⇒ 2 × 100 = C₂ × 500 ⇒ C₂ = 0,4 mol/L."},{"id":"ene-7b70b230","area":"Química","enunciado":"O etanol (CH₃CH₂OH), combustível produzido a partir da cana-de-açúcar, pertence à função orgânica:","alternativas":["fenol","ácido carboxílico","aldeído","éter","álcool"],"correta":4,"explicacao":"O etanol possui hidroxila (−OH) ligada a carbono saturado, característica dos álcoois. No fenol a hidroxila está ligada a anel aromático."},{"id":"ene-98b047cc","area":"Química","enunciado":"Na reação 2 H₂ + O₂ → 2 H₂O, qual a massa de água formada a partir de 4 g de hidrogênio, com oxigênio em excesso? (H = 1; O = 16)","alternativas":["36 g","18 g","72 g","32 g","4 g"],"correta":0,"explicacao":"4 g de H₂ (2 g/mol) = 2 mol; a proporção H₂ : H₂O é 1 : 1, logo formam-se 2 mol de água = 2 × 18 g = 36 g."},{"id":"ene-6801db77","area":"Química","enunciado":"Um isótopo radioativo tem meia-vida de 5 anos. Partindo de 80 g dessa amostra, quanto dela restará após 15 anos?","alternativas":["20 g","10 g","40 g","5 g","26,7 g"],"correta":1,"explicacao":"15 anos correspondem a 3 meias-vidas: 80 → 40 → 20 → 10 g. Dividir 80 por 3 (26,7 g) trata o decaimento como linear."},{"id":"ene-a4a44250","area":"Biologia","enunciado":"Uma mulher de sangue tipo O tem filhos com um homem de sangue tipo AB. Quais tipos sanguíneos (sistema ABO) os filhos podem ter?","alternativas":["apenas O","A, B ou AB","A ou B","A, B, AB ou O","apenas AB"],"correta":2,"explicacao":"A mãe é ii e o pai IᴬIᴮ; os filhos serão Iᴬi (tipo A) ou Iᴮi (tipo B). Nenhum pode ser O nem AB."},{"id":"ene-a37fda44","area":"Biologia","enunciado":"Na fotossíntese, o gás oxigênio liberado pelas plantas é proveniente:","alternativas":["do gás carbônico absorvido","da degradação da glicose","da decomposição da clorofila","da quebra das moléculas de água","da síntese de ATP"],"correta":3,"explicacao":"O O₂ vem da fotólise da água na fase clara (dependente de luz). O carbono do CO₂ é incorporado à glicose, não liberado como O₂."},{"id":"ene-3079253c","area":"Biologia","enunciado":"A pirâmide de energia de um ecossistema nunca é invertida. Isso ocorre porque:","alternativas":["os consumidores produzem mais energia que os produtores","a energia é reciclada pelos decompositores e volta aos produtores","o número de indivíduos sempre diminui nos níveis superiores","os produtores armazenam toda a energia que recebem do Sol","a cada nível trófico parte da energia é perdida, sobretudo como calor"],"correta":4,"explicacao":"O fluxo de energia é unidirecional e, em cada nível, grande parte é dissipada na respiração como calor; por isso cada nível tem menos energia que o anterior. Diferente da matéria, a energia não é reciclada."},{"id":"ene-5536f0ff","area":"Biologia","enunciado":"O uso indiscriminado de antibióticos tem aumentado a frequência de bactérias resistentes. A explicação evolutiva mais adequada é que:","alternativas":["o antibiótico seleciona bactérias que já eram resistentes, que sobrevivem e se reproduzem","o antibiótico induz as bactérias a desenvolverem resistência por necessidade","as bactérias se acostumam ao remédio e transmitem esse hábito","o uso frequente fortalece as bactérias, como um músculo exercitado","o antibiótico transforma bactérias em vírus resistentes"],"correta":0,"explicacao":"Pela seleção natural (darwinismo), as variantes resistentes já existiam por mutação ao acaso; o antibiótico elimina as sensíveis e favorece as resistentes. A ideia de adquirir resistência por necessidade é lamarckista."},{"id":"ene-e39bef34","area":"Biologia","enunciado":"Antibióticos não são indicados para tratar a gripe comum porque:","alternativas":["a gripe é causada por bactérias muito resistentes","a gripe é causada por vírus, e não por bactérias","os antibióticos só atuam contra fungos","o vírus da gripe possui parede celular muito espessa","a gripe é uma doença genética"],"correta":1,"explicacao":"Antibióticos atuam em estruturas e processos de bactérias (como parede celular e ribossomos bacterianos). Vírus são acelulares e se replicam dentro das células do hospedeiro."},{"id":"ene-a83e11fc","area":"Biologia","enunciado":"A Floresta Amazônica é exuberante, embora grande parte de seus solos de terra firme seja pobre em nutrientes. Isso se explica principalmente:","alternativas":["pela alta fertilidade das rochas profundas","pelo uso de fertilizantes naturais trazidos pelos rios","pela rápida reciclagem de nutrientes pela própria floresta","pela ausência de chuvas, que evita a lixiviação","pelas baixas temperaturas, que conservam a matéria orgânica"],"correta":2,"explicacao":"Com calor e umidade elevados, fungos e bactérias decompõem rapidamente folhas e galhos, e as raízes reabsorvem os nutrientes; o estoque fica na biomassa, não no solo. Por isso o desmatamento tende a empobrecer o solo rapidamente."},{"id":"ene-da34228a","area":"Biologia","enunciado":"A malária, ainda presente na região amazônica, é causada e transmitida, respectivamente, por:","alternativas":["vírus e mosquito Aedes aegypti","bactéria e caramujo","protozoário Trypanosoma cruzi e barbeiro","protozoário Plasmodium e mosquito Anopheles","verme e água contaminada"],"correta":3,"explicacao":"O agente da malária é o protozoário Plasmodium, transmitido pela picada da fêmea do mosquito Anopheles. Aedes transmite dengue; o barbeiro transmite a doença de Chagas."},{"id":"ene-c5996c33","area":"Biologia","enunciado":"Após ser picada por uma cobra peçonhenta, uma pessoa recebe soro antiofídico. Esse tratamento é um exemplo de:","alternativas":["imunização ativa, com produção de memória","vacinação preventiva","uso de antibiótico contra o veneno","transplante de células de defesa","imunização passiva, com anticorpos prontos"],"correta":4,"explicacao":"O soro contém anticorpos já produzidos (em geral por cavalos), de ação imediata e sem memória imunológica: imunização passiva. A vacina, ao contrário, estimula o próprio organismo (imunização ativa)."},{"id":"ene-04d874b4","area":"História","enunciado":"A Cabanagem (1835–1840), revolta que envolveu amplas camadas populares no Grão-Pará, território que então incluía a área do atual Amazonas, ocorreu durante qual período da história do Brasil?","alternativas":["Período Regencial","Primeiro Reinado","Segundo Reinado já consolidado","República Velha","Período Joanino"],"correta":0,"explicacao":"Entre a abdicação de D. Pedro I (1831) e o Golpe da Maioridade (1840), o Brasil viveu o Período Regencial, marcado por revoltas provinciais como a Cabanagem, a Balaiada, a Sabinada e a Farroupilha."},{"id":"ene-cc27b83e","area":"História","enunciado":"A Zona Franca de Manaus, reformulada em 1967 durante o regime militar, teve como objetivo principal:","alternativas":["retomar a exportação de borracha como principal atividade econômica","criar um polo industrial com incentivos fiscais para integrar a Amazônia","transformar Manaus na capital federal do Brasil","proibir a entrada de produtos estrangeiros na região","promover a reforma agrária nas várzeas do Amazonas"],"correta":1,"explicacao":"O Decreto-Lei nº 288/1967 concedeu isenções e incentivos fiscais para atrair indústrias e comércio a Manaus, dentro de uma estratégia de ocupação e integração da Amazônia."},{"id":"ene-12286e30","area":"História","enunciado":"Entre os fatores que explicam o pioneirismo da Inglaterra na Revolução Industrial, no século XVIII, está:","alternativas":["a ausência de colônias e de comércio exterior","a proibição do uso de carvão mineral","o acúmulo de capitais e a mão de obra liberada pelos cercamentos dos campos","o fortalecimento do regime feudal no campo","a falta de interesse da burguesia por inovações técnicas"],"correta":2,"explicacao":"A Inglaterra reunia capitais do comércio colonial, reservas de carvão e ferro e mão de obra barata formada por camponeses expulsos das terras pelos cercamentos (enclosures)."},{"id":"ene-7297b9e1","area":"História","enunciado":"A Consolidação das Leis do Trabalho (CLT), de 1943, foi criada:","alternativas":["no governo de Juscelino Kubitschek","durante a ditadura militar","no Império, por D. Pedro II","durante o Estado Novo de Getúlio Vargas","na República da Espada"],"correta":3,"explicacao":"A CLT reuniu a legislação trabalhista em 1943, no Estado Novo (1937–1945), dentro da política varguista de controle e aproximação com os trabalhadores urbanos."},{"id":"ene-072ab839","area":"História","enunciado":"O Ato Institucional nº 5 (AI-5), de 1968, é considerado o marco do endurecimento da ditadura militar brasileira porque, entre outras medidas:","alternativas":["convocou eleições diretas para presidente","extinguiu a censura prévia à imprensa","anistiou todos os presos políticos","restabeleceu o pluripartidarismo","autorizou o fechamento do Congresso Nacional"],"correta":4,"explicacao":"O AI-5 deu ao presidente poderes para fechar o Legislativo, cassar mandatos e suspender direitos políticos, além de suspender o habeas corpus em crimes políticos. Anistia (1979) e pluripartidarismo vieram na abertura."},{"id":"ene-68818d6c","area":"História","enunciado":"A queda do Muro de Berlim, em 1989, é um marco simbólico:","alternativas":["do fim da Guerra Fria","do início da Primeira Guerra Mundial","da criação da ONU","da ascensão do nazismo na Alemanha","da Revolução Russa"],"correta":0,"explicacao":"O muro, erguido em 1961, separava Berlim Ocidental e Oriental. Sua queda antecipou a reunificação alemã (1990) e o colapso da URSS (1991), encerrando a bipolaridade e a divisão da Europa entre os blocos capitalista e socialista."},{"id":"ene-69674aa4","area":"História","enunciado":"A economia açucareira do Brasil colonial, nos séculos XVI e XVII, organizou-se predominantemente com base em:","alternativas":["pequenas propriedades familiares e mão de obra assalariada","latifúndio, monocultura, trabalho escravizado e produção voltada à exportação","policultura para abastecer o mercado interno","extração de ouro em Minas Gerais","indústrias têxteis mecanizadas"],"correta":1,"explicacao":"O sistema de plantation colonial combinava grandes propriedades, um único produto de exportação e mão de obra escravizada, atendendo aos interesses mercantilistas da metrópole."},{"id":"ene-aa9253a0","area":"Geografia","enunciado":"Os chamados 'rios voadores' são importantes para o regime de chuvas de parte do Centro-Oeste e do Sudeste brasileiros. Eles correspondem a:","alternativas":["rios subterrâneos que ligam a Amazônia ao Sudeste","canais artificiais de transposição de água","fluxos de umidade na atmosfera vindos da Floresta Amazônica","nuvens formadas exclusivamente sobre o oceano Pacífico","correntes marítimas frias do litoral sul"],"correta":2,"explicacao":"A floresta devolve à atmosfera grande quantidade de vapor d'água pela evapotranspiração; esse vapor é transportado pelos ventos e barrado pelos Andes, desviando-se para o centro-sul. O desmatamento ameaça esse mecanismo."},{"id":"ene-65d41fb6","area":"Geografia","enunciado":"Na Amazônia, as áreas de várzea diferenciam-se das de terra firme por:","alternativas":["nunca serem alagadas, por estarem em terrenos mais altos","terem clima frio e seco","não permitirem nenhum tipo de agricultura","serem inundadas periodicamente pelas cheias dos rios","serem cobertas por vegetação de cerrado"],"correta":3,"explicacao":"As várzeas margeiam principalmente rios de água branca (como o Solimões-Amazonas) e são alagadas nas cheias; a deposição de sedimentos as torna férteis para a agricultura de vazante. A terra firme não alaga."},{"id":"ene-2cb859ea","area":"Geografia","enunciado":"A cidade A está a 45° de longitude oeste e a cidade B, a 75° de longitude oeste. Considerando apenas os fusos teóricos, quando são 12 h em A, em B são:","alternativas":["14 h","11 h","13 h","9 h","10 h"],"correta":4,"explicacao":"Cada 15° equivalem a 1 hora. A diferença é de 30°, ou seja, 2 horas; como B está mais a oeste, seu horário é atrasado: 12 − 2 = 10 h."},{"id":"ene-0dcf2167","area":"Geografia","enunciado":"Quando o crescimento urbano faz duas ou mais cidades vizinhas se unirem fisicamente, formando uma mancha urbana contínua, ocorre o fenômeno de:","alternativas":["conurbação","êxodo rural","gentrificação","megalópole isolada","desmetropolização"],"correta":0,"explicacao":"Conurbação é a junção física de malhas urbanas de municípios diferentes. Gentrificação é a valorização de uma área que expulsa moradores de menor renda."},{"id":"ene-5f9b1cf2","area":"Geografia","enunciado":"Nas últimas décadas, a pirâmide etária brasileira tem apresentado base mais estreita e topo mais largo. Esse processo reflete principalmente:","alternativas":["o aumento da mortalidade infantil","a queda da natalidade e o aumento da longevidade","a elevação da taxa de fecundidade","a chegada em massa de imigrantes jovens","a redução da expectativa de vida"],"correta":1,"explicacao":"Menos nascimentos estreitam a base, e a maior longevidade alarga o topo: é o envelhecimento populacional típico da transição demográfica."},{"id":"ene-7df379a3","area":"Geografia","enunciado":"Na geração de energia elétrica do Brasil, a fonte com maior participação é:","alternativas":["o carvão mineral","a nuclear","a hidrelétrica","o petróleo","a geotérmica"],"correta":2,"explicacao":"A matriz elétrica brasileira é majoritariamente renovável, com predomínio da hidreletricidade, favorecida por rios caudalosos de planalto. Eólica e solar crescem, mas a hidráulica continua sendo a maior."},{"id":"ene-f065425f","area":"Geografia","enunciado":"O Brasil não possui vulcões ativos e registra poucos terremotos de grande intensidade. A principal explicação é que o território brasileiro:","alternativas":["localiza-se sobre o encontro de duas placas convergentes","fica no Círculo de Fogo do Pacífico","está sobre uma dorsal oceânica ativa","está situado na porção central da Placa Sul-Americana, longe de suas bordas","não está sobre nenhuma placa tectônica"],"correta":3,"explicacao":"Vulcanismo e grandes sismos concentram-se nas bordas das placas; o Brasil está no interior da Placa Sul-Americana, região de relativa estabilidade. Os Andes, na borda oeste, são área de alta atividade."},{"id":"ene-be12df20","area":"Filosofia","enunciado":"Na Alegoria da Caverna, de Platão, os prisioneiros que veem apenas sombras na parede representam:","alternativas":["os filósofos que alcançaram o conhecimento das Ideias","os governantes justos da cidade","os deuses que controlam o destino humano","os sofistas que dominam a matemática","os que tomam as aparências do mundo sensível pela verdade"],"correta":4,"explicacao":"Para Platão, as sombras simbolizam a opinião (doxa) baseada nos sentidos; sair da caverna representa o caminho do conhecimento rumo ao mundo inteligível das Ideias."},{"id":"ene-d2b5125a","area":"Filosofia","enunciado":"'Age apenas segundo uma máxima tal que possas ao mesmo tempo querer que ela se torne lei universal.' Essa formulação corresponde:","alternativas":["ao imperativo categórico de Kant","ao princípio da utilidade de Stuart Mill","ao contrato social de Rousseau","à vontade de potência de Nietzsche","à dúvida metódica de Descartes"],"correta":0,"explicacao":"Para Kant, a ação moral é incondicionada e deve poder ser universalizada, independentemente de suas consequências, ao contrário do utilitarismo, que julga pelos resultados."},{"id":"ene-6145f4c0","area":"Filosofia","enunciado":"Para Aristóteles, a virtude moral consiste, em geral, em:","alternativas":["seguir cegamente as leis divinas","um justo meio entre dois vícios","eliminar todas as paixões humanas","buscar o máximo de prazer possível","obedecer ao governante mais forte"],"correta":1,"explicacao":"Na Ética a Nicômaco, a virtude é uma disposição adquirida pelo hábito e situada no meio-termo: a coragem, por exemplo, está entre a covardia (falta) e a temeridade (excesso)."},{"id":"ene-56fe51c0","area":"Sociologia","enunciado":"Um servidor público é obedecido não por sua personalidade nem por tradição, mas porque ocupa um cargo definido por normas impessoais. Segundo Max Weber, esse é um exemplo de dominação:","alternativas":["carismática","tradicional","racional-legal","patriarcal","teocrática"],"correta":2,"explicacao":"Weber distingue três tipos puros de dominação legítima: tradicional, carismática e racional-legal. Esta última se baseia em regras formais e é típica da burocracia moderna."},{"id":"ene-508ff7af","area":"Sociologia","enunciado":"Para Karl Marx, a diferença entre o valor produzido pelo trabalhador e o valor que ele recebe como salário, apropriada pelo capitalista, é chamada de:","alternativas":["alienação","fetichismo da mercadoria","ideologia","mais-valia","luta de classes"],"correta":3,"explicacao":"A mais-valia é o trabalho excedente não pago, base da acumulação capitalista. Alienação e fetichismo são conceitos relacionados, mas descrevem outros aspectos da relação de trabalho."},{"id":"ene-8abc118c","area":"Sociologia","enunciado":"Um turista considera 'atrasados' os hábitos alimentares de uma comunidade ribeirinha apenas por serem diferentes dos seus. Essa atitude exemplifica:","alternativas":["relativismo cultural","aculturação","alteridade","multiculturalismo","etnocentrismo"],"correta":4,"explicacao":"Etnocentrismo é julgar outras culturas tomando a própria como padrão superior. O relativismo cultural, ao contrário, busca compreender cada cultura em seu próprio contexto."},{"id":"ene-ed2b772c","area":"Português","enunciado":"Em qual frase o acento grave indicativo de crase está empregado corretamente?","alternativas":["Entreguei o documento à diretora.","Ela começou à estudar cedo.","Fomos à pé até o porto.","Enviei a carta à você.","Ficamos frente à frente."],"correta":0,"explicacao":"Há crase quando a preposição 'a' (entregar algo a alguém) se funde ao artigo feminino 'a' (a diretora). Não ocorre crase antes de verbo, de palavra masculina, de pronome de tratamento como 'você' nem entre palavras repetidas."},{"id":"ene-8c1866b7","area":"Português","enunciado":"Um poema traz a fala de um personagem nordestino: 'Oxente, visse? Vou arretado pra feira.' O uso dessas expressões exemplifica principalmente a variação linguística:","alternativas":["histórica (diacrônica)","regional (diatópica)","situacional, por ser um texto formal","social ligada a jargão profissional","decorrente de erro gramatical"],"correta":1,"explicacao":"'Oxente', 'visse' e 'arretado' são marcas associadas a falares do Nordeste, caracterizando variação geográfica. Variação não é erro, mas diversidade legítima da língua."},{"id":"ene-40499f0e","area":"Português","enunciado":"Um verbete de dicionário que explica o significado da palavra 'palavra' tem como função da linguagem predominante a:","alternativas":["referencial","emotiva","metalinguística","conativa","fática"],"correta":2,"explicacao":"A função metalinguística ocorre quando o código explica o próprio código, como em dicionários e gramáticas. A referencial foca em informar sobre um assunto externo à língua."},{"id":"ene-686272c1","area":"Português","enunciado":"Em 'Embora estivesse cansado, o estudante terminou a prova', a oração introduzida por 'embora' expressa ideia de:","alternativas":["causa","condição","finalidade","concessão","consequência"],"correta":3,"explicacao":"'Embora' é conjunção concessiva: apresenta um obstáculo (o cansaço) que não impede o fato principal (terminar a prova)."},{"id":"ene-0d11b644","area":"Literatura","enunciado":"Em Dom Casmurro, de Machado de Assis, um dos aspectos centrais da obra é:","alternativas":["a idealização romântica do indígena como herói nacional","a descrição objetiva da seca no sertão nordestino","a crítica à escravidão feita por um narrador abolicionista","a exaltação da natureza brasileira em versos parnasianos","a ambiguidade sobre a suposta traição de Capitu"],"correta":4,"explicacao":"Bento Santiago (Bentinho) narra a própria história em primeira pessoa, a partir de seu ponto de vista, e a traição nunca é comprovada; essa ambiguidade é uma marca do Realismo machadiano."},{"id":"ene-9a5b9431","area":"Literatura","enunciado":"Vidas Secas (1938), de Graciliano Ramos, que acompanha a família de Fabiano pelo sertão, é representativo:","alternativas":["do romance regionalista de 30","do Romantismo indianista","do Arcadismo mineiro","da poesia concreta","do Realismo de Machado de Assis"],"correta":0,"explicacao":"A obra integra o romance de 30, da segunda fase do Modernismo, que denunciava problemas sociais como a seca, a miséria e a opressão, com linguagem seca e enxuta."},{"id":"ene-bf1da4ca","area":"Literatura","enunciado":"O romance Dois Irmãos, do escritor amazonense Milton Hatoum, ambientado em Manaus, tem como eixo:","alternativas":["a vida de um seringueiro no Acre durante a Revolução Acreana","a rivalidade entre os gêmeos Yaqub e Omar, numa família de origem libanesa","a viagem de um herói indígena a São Paulo","a trajetória de um retirante nordestino no sertão","a vida da corte portuguesa no Rio de Janeiro"],"correta":1,"explicacao":"Hatoum, nascido em Manaus, narra em Dois Irmãos o conflito entre os gêmeos Yaqub e Omar, filhos de Halim e Zana, tendo a cidade de Manaus e suas transformações como pano de fundo."},{"id":"ene-7f818000","area":"Inglês","enunciado":"Leia: 'Deforestation in the Amazon releases carbon stored in trees, which contributes to climate change. However, protected areas and Indigenous lands have shown lower deforestation rates.' Segundo o texto, as áreas protegidas e as terras indígenas:","alternativas":["são as principais responsáveis pelas emissões de carbono","impedem totalmente as mudanças climáticas","têm apresentado taxas menores de desmatamento","têm árvores que não armazenam carbono","registram as maiores taxas de desmatamento"],"correta":2,"explicacao":"O trecho 'have shown lower deforestation rates' significa 'têm mostrado taxas de desmatamento menores'. O conectivo 'However' introduz o contraste com o problema descrito na primeira frase."},{"id":"ene-fbfb9938","area":"Inglês","enunciado":"Leia: 'Many people pretend to understand the terms of service, but few actually read them.' No trecho, a palavra 'pretend' significa:","alternativas":["pretender","entender","ignorar","fingir","prometer"],"correta":3,"explicacao":"'Pretend' é falso cognato: significa 'fingir', não 'pretender' (que em inglês seria 'intend'). Também 'actually' significa 'na verdade', e não 'atualmente'."},{"id":"ene-dd8fc321","area":"Redação","enunciado":"Na redação do ENEM, qual das situações abaixo leva o texto a receber nota zero?","alternativas":["Não colocar título","Escrever um texto com 20 linhas","Não citar nenhum filósofo","Cometer alguns desvios de ortografia","Fugir totalmente ao tema proposto"],"correta":4,"explicacao":"A fuga total ao tema zera a redação, assim como não atender ao tipo dissertativo-argumentativo ou ter até 7 linhas. Título é opcional, e desvios gramaticais apenas reduzem a nota na competência 1."}],"medicina":[{"id":"med-cc68d69f","area":"Anatomia","enunciado":"O principal nervo motor do diafragma é o:","alternativas":["Vago","Frênico","Intercostal","Glossofaríngeo","Acessório"],"correta":1,"explicacao":"Nervo frênico (C3–C5): \"C3, 4, 5 mantêm o diafragma vivo\"."},{"id":"med-423796fc","area":"Fisiologia","enunciado":"A fase de despolarização rápida do potencial de ação neuronal se deve principalmente a:","alternativas":["Saída de K⁺","Entrada de Ca²⁺","Entrada de Na⁺","Entrada de Cl⁻","Bomba Na⁺/K⁺"],"correta":2,"explicacao":"Abertura de canais de Na⁺ voltagem-dependentes. A repolarização é por saída de K⁺."},{"id":"med-942f20fc","area":"Bioquímica","enunciado":"O saldo líquido de ATP na glicólise, por molécula de glicose, é:","alternativas":["2","4","36","1","38"],"correta":0,"explicacao":"Gera 4 ATP, mas consome 2 na fase preparatória: saldo 2 ATP (+ 2 NADH)."},{"id":"med-254a112e","area":"Histologia","enunciado":"A epiderme é formada por epitélio:","alternativas":["Simples cúbico","Pseudoestratificado ciliado","Estratificado pavimentoso queratinizado","Simples pavimentoso","De transição"],"correta":2,"explicacao":"Várias camadas, células superficiais achatadas e queratina para proteção."},{"id":"med-7e102a2d","area":"Imunologia","enunciado":"A imunoglobulina que atravessa a placenta é a:","alternativas":["IgM","IgA","IgE","IgG","IgD"],"correta":3,"explicacao":"IgG passa por transporte ativo (receptor FcRn), conferindo imunidade passiva ao feto."},{"id":"med-3ed4da34","area":"Microbiologia","enunciado":"A coloração usada para identificar bacilos álcool-ácido resistentes (BAAR), como o da tuberculose, é:","alternativas":["Gram","Ziehl-Neelsen","Giemsa","Tinta da China","Hematoxilina-eosina"],"correta":1,"explicacao":"Ziehl-Neelsen evidencia a parede rica em ácidos micólicos do Mycobacterium."},{"id":"med-9e30497d","area":"Parasitologia","enunciado":"O vetor da malária humana é a fêmea do mosquito do gênero:","alternativas":["Aedes","Culex","Lutzomyia","Anopheles","Triatoma"],"correta":3,"explicacao":"Anopheles (no Amazonas, principalmente A. darlingi). Aedes: dengue; Lutzomyia: leishmaniose; Triatoma: Chagas."},{"id":"med-adce296a","area":"Parasitologia","enunciado":"A leishmaniose tegumentar, endêmica no Amazonas, é transmitida por:","alternativas":["Flebotomíneos","Anopheles","Barbeiro","Carrapato","Caramujo"],"correta":0,"explicacao":"Flebotomíneos (mosquito-palha; Lutzomyia/Nyssomyia) transmitem Leishmania; comum em áreas de mata e desmatamento."},{"id":"med-23afa8df","area":"Farmacologia","enunciado":"O antídoto da intoxicação por paracetamol é:","alternativas":["Flumazenil","Naloxona","Atropina","N-acetilcisteína","Vitamina K"],"correta":3,"explicacao":"A N-acetilcisteína repõe glutationa e neutraliza o metabólito tóxico NAPQI."},{"id":"med-a29a0869","area":"Farmacologia","enunciado":"O antagonista usado na intoxicação por benzodiazepínicos é:","alternativas":["Naloxona","Flumazenil","Protamina","Fisostigmina","Glucagon"],"correta":1,"explicacao":"Flumazenil é antagonista competitivo do receptor benzodiazepínico (GABA-A). Naloxona é para opioides."},{"id":"med-b115c2eb","area":"Semiologia","enunciado":"Parada da inspiração à palpação do hipocôndrio direito (sinal de Murphy) sugere:","alternativas":["Apendicite","Pancreatite","Colecistite aguda","Úlcera péptica","Pielonefrite"],"correta":2,"explicacao":"Sinal de Murphy positivo: inflamação da vesícula biliar."},{"id":"med-f3825734","area":"Cardiologia","enunciado":"Supradesnivelamento de ST em DII, DIII e aVF sugere infarto de parede:","alternativas":["Anterior","Lateral","Septal","Inferior","Posterior isolada"],"correta":3,"explicacao":"DII, DIII e aVF olham a parede inferior (geralmente coronária direita)."},{"id":"med-20f0b586","area":"Patologia","enunciado":"A necrose típica da tuberculose é a:","alternativas":["Coagulativa","Liquefativa","Caseosa","Gordurosa","Fibrinoide"],"correta":2,"explicacao":"Necrose caseosa, de aspecto de queijo, dentro de granulomas."},{"id":"med-32be8f52","area":"Anatomia","enunciado":"Paciente com fratura da diáfise do úmero passa a não conseguir estender o punho e os dedos. O nervo mais provavelmente lesado é o:","alternativas":["Radial","Mediano","Ulnar","Musculocutâneo","Axilar"],"correta":0,"explicacao":"O nervo radial percorre o sulco do nervo radial na diáfise umeral e inerva os extensores do punho e dos dedos; sua lesão causa a 'mão caída'."},{"id":"med-e2399887","area":"Anatomia","enunciado":"Fratura na região do ptério seguida de intervalo lúcido e hematoma extradural (epidural) biconvexo sugere lesão da:","alternativas":["Veias-ponte corticais","Artéria cerebral média","Artéria carótida interna","Artéria meníngea média","Artéria basilar"],"correta":3,"explicacao":"A artéria meníngea média passa profundamente ao ptério; sua ruptura gera hematoma epidural. Veias-ponte associam-se ao hematoma subdural."},{"id":"med-7b46be61","area":"Anatomia","enunciado":"O nervo mandibular (V3) deixa o crânio pelo:","alternativas":["Forame redondo","Forame oval","Fissura orbital superior","Forame espinhoso","Forame jugular"],"correta":1,"explicacao":"V3 passa pelo forame oval; V2 pelo forame redondo e V1 pela fissura orbital superior. O forame espinhoso dá passagem à artéria meníngea média."},{"id":"med-e1e0e8a7","area":"Anatomia","enunciado":"Na histerectomia, ao ligar a artéria uterina junto ao colo, a estrutura em risco por passar imediatamente inferior a essa artéria é o:","alternativas":["Nervo obturatório","Ligamento redondo do útero","Artéria ilíaca externa","Nervo pudendo","Ureter"],"correta":4,"explicacao":"O ureter passa inferiormente à artéria uterina ('a água passa por baixo da ponte'), cerca de 2 cm lateral ao colo."},{"id":"med-8aac1302","area":"Anatomia","enunciado":"O nervo laríngeo recorrente esquerdo contorna, de anterior para posterior, o(a):","alternativas":["Artéria subclávia esquerda","Artéria carótida comum esquerda","Arco da aorta","Veia ázigo","Brônquio principal esquerdo"],"correta":2,"explicacao":"O laríngeo recorrente esquerdo curva-se sob o arco da aorta; o direito contorna a artéria subclávia direita. Por isso aneurismas do arco podem causar rouquidão."},{"id":"med-10337e37","area":"Fisiologia","enunciado":"A lei de Frank-Starling relaciona diretamente:","alternativas":["O volume diastólico final (pré-carga) e a força de contração ventricular","A pós-carga e a frequência cardíaca","A pressão arterial média e a resistência vascular periférica","A concentração de catecolaminas e a velocidade de condução","O débito cardíaco e a resistência vascular pulmonar"],"correta":0,"explicacao":"Quanto maior o enchimento diastólico, maior o estiramento das fibras e a força de contração, dentro de limites fisiológicos (Guyton)."},{"id":"med-5f97d882","area":"Fisiologia","enunciado":"O hormônio antidiurético (vasopressina) aumenta a reabsorção de água ao inserir aquaporinas-2 na membrana apical das células do:","alternativas":["Túbulo contorcido proximal","Ramo descendente fino da alça de Henle","Glomérulo","Ducto coletor","Mácula densa"],"correta":3,"explicacao":"O ADH atua via receptores V2 nas células principais do ducto coletor, levando aquaporinas-2 à membrana apical e concentrando a urina."},{"id":"med-7ce66bb7","area":"Fisiologia","enunciado":"Qual fator desvia a curva de dissociação da oxi-hemoglobina para a direita (menor afinidade pelo O₂)?","alternativas":["Alcalose","Aumento do 2,3-bifosfoglicerato","Hipotermia","Redução da PCO₂","Aumento da hemoglobina fetal"],"correta":1,"explicacao":"Aumento de 2,3-BPG, H⁺ (acidose), CO₂ e temperatura desviam a curva para a direita, facilitando a liberação de O₂ aos tecidos; a HbF desvia para a esquerda."},{"id":"med-67c55cc1","area":"Fisiologia","enunciado":"O hormônio liberado pelas células S do duodeno em resposta ao quimo ácido, que estimula secreção pancreática rica em bicarbonato, é a:","alternativas":["Gastrina","Colecistocinina","Motilina","Grelina","Secretina"],"correta":4,"explicacao":"A secretina neutraliza a acidez duodenal estimulando bicarbonato pancreático; a colecistocinina estimula principalmente enzimas pancreáticas e contração da vesícula."},{"id":"med-2fd2fe07","area":"Fisiologia","enunciado":"Ao levantar-se bruscamente, a queda da pressão arterial é detectada pelos barorreceptores carotídeos. A resposta reflexa esperada é:","alternativas":["Bradicardia por aumento do tônus vagal","Vasodilatação periférica mediada pelo simpático","Taquicardia e vasoconstrição por ativação simpática","Redução da contratilidade miocárdica","Aumento da diurese por inibição do ADH"],"correta":2,"explicacao":"Menor estiramento reduz os disparos dos barorreceptores, o que diminui o tônus vagal e aumenta o simpático: taquicardia, maior contratilidade e vasoconstrição."},{"id":"med-e482e68b","area":"Bioquímica","enunciado":"A enzima limitante da síntese de colesterol, alvo das estatinas, é a:","alternativas":["HMG-CoA redutase","Acetil-CoA carboxilase","Carnitina palmitoiltransferase I","Fosfofrutocinase-1","Glicogênio sintase"],"correta":0,"explicacao":"A HMG-CoA redutase converte HMG-CoA em mevalonato, etapa limitante da colesterogênese; as estatinas a inibem competitivamente."},{"id":"med-ac0994bf","area":"Bioquímica","enunciado":"Paciente com malária por P. vivax apresenta hemólise aguda após iniciar primaquina. A deficiência enzimática mais provável e seu mecanismo são:","alternativas":["Piruvato-cinase, com falta de ATP na hemácia","Hexocinase, com bloqueio da entrada de glicose na glicólise","Lactato desidrogenase, com acúmulo de piruvato","Glicose-6-fosfato desidrogenase, com menor produção de NADPH","Glicocinase, com hipoglicemia grave"],"correta":3,"explicacao":"A G6PD inicia a via das pentoses, fonte de NADPH para manter a glutationa reduzida; sem ela, oxidantes como a primaquina causam hemólise."},{"id":"med-82f9e235","area":"Bioquímica","enunciado":"A enzima limitante do ciclo da ureia, ativada alostericamente pelo N-acetilglutamato, é a:","alternativas":["Carbamoil-fosfato sintetase II","Carbamoil-fosfato sintetase I","Arginase","Ornitina transcarbamilase","Argininossuccinato liase"],"correta":1,"explicacao":"A CPS I mitocondrial forma carbamoil-fosfato a partir de NH₄⁺ e depende de N-acetilglutamato; a CPS II é citosólica e atua na síntese de pirimidinas."},{"id":"med-66718c50","area":"Bioquímica","enunciado":"No escorbuto, a deficiência de vitamina C compromete principalmente:","alternativas":["A γ-carboxilação de fatores de coagulação","A síntese de rodopsina na retina","A descarboxilação oxidativa do piruvato","A absorção intestinal de cálcio","A hidroxilação de prolina e lisina na síntese do colágeno"],"correta":4,"explicacao":"O ascorbato é cofator das prolil e lisil hidroxilases; sem hidroxilação o colágeno é instável, gerando sangramento gengival e fragilidade vascular."},{"id":"med-be4568f9","area":"Histologia","enunciado":"No estômago, a célula que secreta ácido clorídrico e fator intrínseco é a:","alternativas":["Célula principal (zimogênica)","Célula G","Célula parietal (oxíntica)","Célula mucosa do colo","Célula enterocromafim-símile"],"correta":2,"explicacao":"As células parietais produzem HCl e fator intrínseco; as principais secretam pepsinogênio, as G gastrina e as enterocromafim-símiles histamina."},{"id":"med-64a55a8d","area":"Histologia","enunciado":"A célula responsável pela formação da bainha de mielina no sistema nervoso central é o:","alternativas":["Oligodendrócito","Célula de Schwann","Astrócito","Micróglia","Célula ependimária"],"correta":0,"explicacao":"No SNC a mielina é feita por oligodendrócitos (cada um mieliniza vários axônios); no SNP, pelas células de Schwann."},{"id":"med-1b2cafc2","area":"Histologia","enunciado":"O principal tipo de colágeno da lâmina basal é o:","alternativas":["Tipo I","Tipo II","Tipo III","Tipo IV","Tipo X"],"correta":3,"explicacao":"O colágeno IV forma rede na lâmina basal. O tipo I predomina em osso e tendão, o II na cartilagem hialina e o III nas fibras reticulares."},{"id":"med-9763bc7f","area":"Embriologia","enunciado":"O sistema nervoso central origina-se do(a):","alternativas":["Mesoderma paraxial","Ectoderma (neuroectoderma)","Endoderma","Mesoderma intermediário","Mesoderma da placa lateral"],"correta":1,"explicacao":"A notocorda induz o ectoderma a formar a placa neural, que se dobra em tubo neural, origem do encéfalo e da medula espinal."},{"id":"med-7e609d00","area":"Embriologia","enunciado":"Após o nascimento, a veia umbilical oblitera-se e origina o(a):","alternativas":["Ligamento venoso","Ligamento arterioso","Ligamento umbilical mediano","Ligamentos umbilicais mediais","Ligamento redondo do fígado"],"correta":4,"explicacao":"Veia umbilical dá o ligamento redondo do fígado; ducto venoso, o ligamento venoso; ducto arterioso, o ligamento arterioso; úraco, o umbilical mediano; artérias umbilicais, os umbilicais mediais."},{"id":"med-cdc49cae","area":"Genética","enunciado":"A causa mais frequente da síndrome de Down é:","alternativas":["Translocação robertsoniana herdada do pai","Mosaicismo por erro mitótico pós-zigótico","Não disjunção na meiose materna (trissomia livre)","Dissomia uniparental do cromossomo 21","Microdeleção no braço longo do cromossomo 21"],"correta":2,"explicacao":"Cerca de 95% dos casos são trissomia livre por não disjunção, geralmente na meiose materna e associada à idade materna avançada; translocações e mosaicismo são minoria."},{"id":"med-8506a7fb","area":"Genética","enunciado":"Homem com hemofilia A (herança recessiva ligada ao X) tem filhos com mulher sem a mutação. Espera-se que:","alternativas":["Todas as filhas sejam portadoras e nenhum filho homem seja afetado","50% das filhas sejam afetadas","50% dos filhos homens sejam afetados","Todos os filhos homens sejam afetados","25% da prole seja afetada, independentemente do sexo"],"correta":0,"explicacao":"O pai transmite seu X a todas as filhas (portadoras) e o Y a todos os filhos (que recebem o X normal da mãe); não há transmissão pai-filho."},{"id":"med-d55de8d8","area":"Imunologia","enunciado":"A anafilaxia após picada de abelha é exemplo de hipersensibilidade:","alternativas":["Tipo II, por anticorpos IgG contra antígenos de membrana","Tipo III, por deposição de imunocomplexos","Tipo IV, por linfócitos T sensibilizados","Tipo I, mediada por IgE ligada a mastócitos","Tipo I, mediada por IgG e complemento"],"correta":3,"explicacao":"Na hipersensibilidade imediata (tipo I), o antígeno liga IgE fixada a mastócitos e basófilos, liberando histamina e outros mediadores em minutos (Abbas)."},{"id":"med-d3fc06af","area":"Imunologia","enunciado":"Os linfócitos T CD8⁺ reconhecem peptídeos apresentados por:","alternativas":["Moléculas do MHC de classe II","Moléculas do MHC de classe I","Receptores do tipo Toll","Imunoglobulinas de superfície","Receptores de complemento (CR1)"],"correta":1,"explicacao":"O MHC I, presente em todas as células nucleadas, apresenta peptídeos citosólicos a T CD8⁺; o MHC II apresenta a T CD4⁺."},{"id":"med-dd01423f","area":"Imunologia","enunciado":"A primeira imunoglobulina produzida em uma resposta humoral primária é a:","alternativas":["IgG","IgA","IgE","IgD","IgM"],"correta":4,"explicacao":"A IgM pentamérica surge primeiro; depois a mudança de classe gera IgG, de maior afinidade. IgM específica indica infecção recente."},{"id":"med-0e26b9ac","area":"Microbiologia","enunciado":"Adolescente com febre, rigidez de nuca e petéquias tem, no liquor, diplococos gram-negativos. O agente mais provável é:","alternativas":["Streptococcus pneumoniae","Haemophilus influenzae","Neisseria meningitidis","Listeria monocytogenes","Streptococcus agalactiae"],"correta":2,"explicacao":"Meningococo: diplococo gram-negativo associado a petéquias/púrpura. O pneumococo é diplococo gram-positivo; H. influenzae, cocobacilo gram-negativo; Listeria, bacilo gram-positivo."},{"id":"med-65c43e0b","area":"Microbiologia","enunciado":"A tetanospasmina causa espasmos musculares porque:","alternativas":["Bloqueia a liberação de glicina e GABA pelos interneurônios inibitórios","Bloqueia a liberação de acetilcolina na junção neuromuscular","Inativa o fator de alongamento 2 por ADP-ribosilação","Ativa a adenilato ciclase dos enterócitos","Lisa diretamente as fibras musculares esqueléticas"],"correta":0,"explicacao":"A toxina tetânica cliva sinaptobrevina nos interneurônios inibitórios da medula, gerando paralisia espástica; a botulínica atua na junção neuromuscular, causando paralisia flácida."},{"id":"med-c18d8de0","area":"Microbiologia","enunciado":"A prova que diferencia Staphylococcus aureus dos demais estafilococos é a:","alternativas":["Catalase","Optoquina","Bacitracina","Coagulase","Teste CAMP"],"correta":3,"explicacao":"S. aureus é coagulase-positivo. A catalase separa estafilococos de estreptococos; optoquina identifica pneumococo; bacitracina, S. pyogenes; CAMP, S. agalactiae."},{"id":"med-8c36fda8","area":"Parasitologia","enunciado":"Surtos de doença de Chagas aguda na Amazônia têm sido associados principalmente a:","alternativas":["Picada de flebotomíneos","Ingestão de alimentos contaminados, como o açaí","Ingestão de carne suína malcozida","Contato da pele com água de igarapés","Picada de Aedes aegypti"],"correta":1,"explicacao":"A transmissão oral de Trypanosoma cruzi, por alimentos processados com triatomíneos infectados, é a principal forma na Amazônia e causa surtos familiares de casos agudos."},{"id":"med-7c6f0939","area":"Parasitologia","enunciado":"As recaídas tardias da malária por Plasmodium vivax devem-se a:","alternativas":["Gametócitos persistentes no sangue","Esporozoítos retidos nas glândulas salivares","Merozoítos sequestrados no baço","Oocistos no intestino humano","Hipnozoítos latentes nos hepatócitos"],"correta":4,"explicacao":"P. vivax (e P. ovale) formam hipnozoítos hepáticos que podem ser reativados meses depois; por isso a cura radical exige droga esquizonticida tecidual, como a primaquina."},{"id":"med-1b8e14c0","area":"Parasitologia","enunciado":"No hospedeiro humano, a Leishmania é encontrada principalmente na forma:","alternativas":["Promastigota, livre no sangue","Tripomastigota, no sangue periférico","Amastigota, no interior de macrófagos","Epimastigota, no tubo digestivo","Esporozoíto, nos hepatócitos"],"correta":2,"explicacao":"No vertebrado a Leishmania vive como amastigota intracelular em macrófagos; a forma promastigota ocorre no flebotomíneo e é a inoculada na picada."},{"id":"med-a2239c8d","area":"Parasitologia","enunciado":"O método de referência para o diagnóstico laboratorial de rotina da malária no Brasil é:","alternativas":["Gota espessa corada","Método de Kato-Katz","Método de Baermann-Moraes","Método da fita adesiva (Graham)","Método de Knott"],"correta":0,"explicacao":"A gota espessa concentra o sangue e permite detectar, identificar a espécie e estimar a parasitemia. Os demais métodos são usados para helmintos."},{"id":"med-fbbc43ba","area":"Patologia","enunciado":"O esôfago de Barrett, com substituição do epitélio escamoso por epitélio colunar com células caliciformes, é exemplo de:","alternativas":["Hiperplasia","Displasia","Hipertrofia","Metaplasia","Anaplasia"],"correta":3,"explicacao":"Metaplasia é a troca reversível de um tipo celular adulto por outro, mais resistente ao agressor (refluxo ácido); pode evoluir para displasia e adenocarcinoma."},{"id":"med-5174c334","area":"Patologia","enunciado":"O infarto isquêmico do encéfalo evolui caracteristicamente com necrose:","alternativas":["De coagulação","Liquefativa","Caseosa","Gordurosa","Fibrinoide"],"correta":1,"explicacao":"No SNC, a isquemia produz necrose liquefativa, com formação de cavidade; nos demais órgãos sólidos predomina a necrose de coagulação (Robbins)."},{"id":"med-0022ef01","area":"Patologia","enunciado":"A célula característica do linfoma de Hodgkin clássico é a célula de:","alternativas":["Langhans","Anitschkow","Kupffer","Schwann","Reed-Sternberg"],"correta":4,"explicacao":"A célula de Reed-Sternberg, grande e binucleada em 'olhos de coruja', é a célula neoplásica do linfoma de Hodgkin clássico. Células de Langhans aparecem em granulomas."},{"id":"med-8739ae62","area":"Farmacologia","enunciado":"A tosse seca associada ao uso de captopril deve-se a:","alternativas":["Bloqueio de receptores AT1 da angiotensina II","Aumento da secreção de aldosterona","Acúmulo de bradicinina por inibição de sua degradação pela ECA","Bloqueio de receptores β₂ brônquicos","Liberação de histamina por mastócitos pulmonares"],"correta":2,"explicacao":"A ECA (cininase II) também degrada bradicinina; com IECA ela se acumula e causa tosse e angioedema. Bloqueadores de AT1 raramente causam tosse."},{"id":"med-add4d965","area":"Farmacologia","enunciado":"O efeito antiagregante do ácido acetilsalicílico decorre de:","alternativas":["Inibição irreversível da COX-1 plaquetária","Bloqueio do receptor P2Y12 de ADP","Bloqueio da glicoproteína IIb/IIIa","Inibição da vitamina K epóxido redutase","Potencialização da antitrombina"],"correta":0,"explicacao":"O AAS acetila irreversivelmente a COX-1, reduzindo a síntese de tromboxano A₂; a plaqueta, sem núcleo, não sintetiza nova enzima, e o efeito dura a vida da plaqueta (Goodman)."},{"id":"med-2109d92b","area":"Farmacologia","enunciado":"Agricultor com miose, sialorreia, broncorreia e bradicardia após aplicar inseticida organofosforado. O fármaco que antagoniza esses efeitos muscarínicos é a:","alternativas":["Neostigmina","Fisostigmina","Pilocarpina","Atropina","Naloxona"],"correta":3,"explicacao":"Organofosforados inibem a acetilcolinesterase, acumulando acetilcolina; a atropina bloqueia receptores muscarínicos. Neostigmina e fisostigmina são anticolinesterásicos e piorariam o quadro."},{"id":"med-f6f86b34","area":"Farmacologia","enunciado":"As penicilinas exercem ação bactericida por:","alternativas":["Ligação à subunidade ribossomal 30S","Ligação às proteínas ligadoras de penicilina","Ligação à subunidade ribossomal 50S","Inibição da DNA-girase","Inibição da síntese de folato"],"correta":1,"explicacao":"Os β-lactâmicos inibem as PBPs e impedem as ligações cruzadas do peptidoglicano. Aminoglicosídeos atuam na 30S, macrolídeos na 50S, quinolonas na DNA-girase e sulfas no folato."},{"id":"med-d7497f8d","area":"Semiologia","enunciado":"O sinal de Blumberg (dor à descompressão brusca do abdome) indica:","alternativas":["Pielonefrite aguda","Colecistite aguda","Hemorragia retroperitoneal","Irritação meníngea","Irritação peritoneal, como na apendicite aguda"],"correta":4,"explicacao":"A dor à descompressão brusca reflete inflamação do peritônio parietal; no ponto de McBurney, sugere apendicite. Giordano sugere comprometimento renal."},{"id":"med-628cbce9","area":"Semiologia","enunciado":"Sopro sistólico ejetivo, em diamante, no foco aórtico e irradiado para as carótidas sugere:","alternativas":["Insuficiência mitral","Insuficiência aórtica","Estenose aórtica","Estenose mitral","Insuficiência tricúspide"],"correta":2,"explicacao":"A estenose aórtica gera sopro mesossistólico em crescendo-decrescendo com irradiação para o pescoço; a insuficiência mitral é holossistólica e irradia para a axila; insuficiência aórtica e estenose mitral são diastólicas."},{"id":"med-800cb33a","area":"Semiologia","enunciado":"No hemitórax direito há frêmito toracovocal aumentado, macicez à percussão e sopro tubário. O achado é compatível com:","alternativas":["Consolidação pulmonar (pneumonia)","Derrame pleural volumoso","Pneumotórax","Enfisema pulmonar","Atelectasia por obstrução brônquica"],"correta":0,"explicacao":"O parênquima condensado com brônquio pérvio transmite melhor as vibrações (frêmito aumentado e sopro tubário). No derrame, pneumotórax e atelectasia obstrutiva o frêmito diminui (Porto)."},{"id":"med-2ac65fe6","area":"Semiologia","enunciado":"O sinal de Romberg positivo (paciente estável de olhos abertos que oscila e cai ao fechá-los) indica principalmente:","alternativas":["Lesão do hemisfério cerebelar","Lesão do trato corticoespinal","Irritação meníngea","Ataxia sensitiva por déficit proprioceptivo","Lesão do nervo facial"],"correta":3,"explicacao":"Sem a visão, o equilíbrio depende da propriocepção (cordões posteriores/nervos periféricos). Na ataxia cerebelar, a instabilidade existe mesmo de olhos abertos."},{"id":"med-fce0f741","area":"Cardiologia","enunciado":"O eletrocardiograma típico da fibrilação atrial mostra:","alternativas":["Ondas F em 'dente de serra' com condução regular","Ausência de ondas P e intervalos RR irregulares","Dissociação completa entre ondas P e QRS","QRS alargados, regulares e de alta frequência","Ondas P precedendo cada QRS com intervalo PR constante"],"correta":1,"explicacao":"Na FA a atividade atrial desorganizada substitui a onda P por ondas f irregulares e a condução ao ventrículo é irregularmente irregular. 'Dente de serra' é do flutter."},{"id":"med-a600992f","area":"Cardiologia","enunciado":"A alteração eletrocardiográfica mais precoce e característica da hipercalemia é:","alternativas":["Onda U proeminente","Encurtamento do intervalo QT","Onda delta","Onda J de Osborn","Onda T apiculada e simétrica (em tenda)"],"correta":4,"explicacao":"A hipercalemia acelera a repolarização e gera T em tenda; com a piora, alarga QRS e some a onda P. Onda U sugere hipocalemia; QT curto, hipercalcemia; delta, pré-excitação; Osborn, hipotermia."},{"id":"med-5cbfc6a5","area":"Infectologia","enunciado":"Na dengue, a fase crítica, em que podem surgir sinais de alarme e extravasamento plasmático, ocorre tipicamente:","alternativas":["Nas primeiras 24 horas de febre","No pico febril do primeiro dia","Com a defervescência, entre o 3º e o 7º dia","Após três semanas do início dos sintomas","Apenas na fase de convalescença"],"correta":2,"explicacao":"A queda da febre coincide com o aumento da permeabilidade capilar; é quando o paciente deve ser vigiado para sinais de alarme e choque."},{"id":"med-dfded720","area":"Infectologia","enunciado":"Após enchente em Manaus, homem apresenta febre, mialgia intensa em panturrilhas, sufusão conjuntival, icterícia rubínica e insuficiência renal aguda. A hipótese mais provável é:","alternativas":["Leptospirose","Hepatite A","Malária por P. vivax","Dengue","Doença de Chagas aguda"],"correta":0,"explicacao":"Exposição a água contaminada por urina de roedores, dor em panturrilhas e sufusão conjuntival sugerem leptospirose; a forma icterohemorrágica (síndrome de Weil) cursa com icterícia rubínica e lesão renal."},{"id":"med-b75bf021","area":"Infectologia","enunciado":"Na Amazônia, o ciclo silvestre da febre amarela envolve primatas não humanos e mosquitos dos gêneros:","alternativas":["Anopheles e Culex","Lutzomyia e Psychodopygus","Triatoma e Rhodnius","Haemagogus e Sabethes","Simulium e Culicoides"],"correta":3,"explicacao":"Haemagogus e Sabethes mantêm o ciclo silvestre; o Aedes aegypti é o vetor do ciclo urbano. Anopheles transmite malária; Lutzomyia, leishmanioses; triatomíneos, Chagas."},{"id":"med-1d06ecbd","area":"Ética Médica","enunciado":"Segundo o Código de Ética Médica, em relação ao sigilo profissional, o médico:","alternativas":["Fica liberado do sigilo após o falecimento do paciente","Pode revelar fato sigiloso por motivo justo, dever legal ou consentimento escrito","Fica liberado do sigilo quando o fato já é de conhecimento público","Deve informar o diagnóstico do trabalhador ao empregador sempre que solicitado","Deve revelar o fato sigiloso ao depor como testemunha sempre que intimado"],"correta":1,"explicacao":"O CEM veda revelar fato conhecido pela profissão salvo motivo justo, dever legal ou consentimento escrito; a proibição persiste mesmo se o fato for público ou o paciente falecido, e, como testemunha, o médico declara seu impedimento."},{"id":"med-b2475dd8","area":"Epidemiologia","enunciado":"A sensibilidade de um teste diagnóstico corresponde à:","alternativas":["Proporção de não doentes que apresentam resultado negativo","Probabilidade de ter a doença dado um resultado positivo","Probabilidade de não ter a doença dado um resultado negativo","Proporção de resultados corretos entre todos os testados","Proporção de doentes que apresentam resultado positivo"],"correta":4,"explicacao":"Sensibilidade = VP/(VP+FN). A proporção de não doentes com teste negativo é a especificidade; as probabilidades pós-teste são os valores preditivos; os acertos totais, a acurácia."},{"id":"med-6cbb53a6","area":"Epidemiologia","enunciado":"Um estudo seleciona indivíduos expostos e não expostos a um fator e os acompanha ao longo do tempo para observar o surgimento da doença. Trata-se de estudo:","alternativas":["Caso-controle","Transversal","De coorte","Ecológico","Série de casos"],"correta":2,"explicacao":"A coorte parte da exposição para o desfecho, permitindo calcular incidência e risco relativo; o caso-controle parte da doença e investiga exposições passadas."}],"residencia":[{"id":"res-1c7e9f5c","area":"Clínica Médica","enunciado":"Critério diagnóstico de diabetes mellitus (em duas ocasiões, sem hiperglicemia inequívoca):","alternativas":["Glicemia de jejum ≥ 100 mg/dL","Glicemia de jejum ≥ 126 mg/dL","HbA1c ≥ 5,7%","Glicemia casual ≥ 140 mg/dL","TOTG 2 h ≥ 140 mg/dL"],"correta":1,"explicacao":"Jejum ≥ 126, HbA1c ≥ 6,5%, TOTG 2 h ≥ 200 ou casual ≥ 200 com sintomas. 100–125 é pré-diabetes."},{"id":"res-f757fbd2","area":"Clínica Médica","enunciado":"A primeira medida terapêutica na cetoacidose diabética é:","alternativas":["Insulina regular em bolus","Bicarbonato de sódio","Hidratação venosa com SF 0,9%","Reposição de fósforo","Glicose a 5%"],"correta":2,"explicacao":"Hidratação vem primeiro. Insulina só após checar K⁺ (se < 3,3 mEq/L, repor potássio antes)."},{"id":"res-630b1f2d","area":"Cirurgia","enunciado":"No ABCDE do trauma, a letra A corresponde a:","alternativas":["Avaliação neurológica","Via aérea e proteção cervical","Controle de hemorragia","Exposição","Respiração"],"correta":1,"explicacao":"A: via aérea + proteção cervical; B: respiração; C: circulação e hemorragia; D: neurológico; E: exposição/ambiente."},{"id":"res-c570bc3a","area":"Cirurgia","enunciado":"Dor à descompressão brusca da fossa ilíaca direita (sinal de Blumberg) sugere:","alternativas":["Colecistite","Apendicite aguda","Diverticulite","Pancreatite","Litíase renal"],"correta":1,"explicacao":"Blumberg indica irritação peritoneal, classicamente no ponto de McBurney na apendicite."},{"id":"res-7576a2af","area":"Pediatria","enunciado":"A vacina BCG, pelo calendário do PNI, é aplicada:","alternativas":["Aos 2 meses","Ao nascer","Aos 12 meses","Aos 4 anos","Aos 6 meses"],"correta":1,"explicacao":"Dose única ao nascer (ou o mais cedo possível), protege contra formas graves de tuberculose."},{"id":"res-a2ba5aa5","area":"Pediatria","enunciado":"Um marco do desenvolvimento esperado por volta dos 2 meses é:","alternativas":["Sentar sem apoio","Sorriso social","Andar com apoio","Pinça fina","Falar frases"],"correta":1,"explicacao":"Sorriso social ~2 meses; sentar sem apoio ~6 meses; pinça ~9–10 meses; andar ~12 meses."},{"id":"res-44bd0d73","area":"Ginecologia e Obstetrícia","enunciado":"A droga de escolha para prevenir e tratar convulsões na pré-eclâmpsia grave/eclâmpsia é:","alternativas":["Diazepam","Fenitoína","Sulfato de magnésio","Hidralazina","Nifedipino"],"correta":2,"explicacao":"Sulfato de magnésio (esquemas de Pritchard ou Zuspan). Hidralazina/nifedipino tratam a pressão."},{"id":"res-a15d620b","area":"Ginecologia e Obstetrícia","enunciado":"Gestação a termo corresponde à idade gestacional de:","alternativas":["34 a 36s6d","37 a 41s6d","36 a 40 semanas","38 a 42 semanas","≥ 42 semanas"],"correta":1,"explicacao":"Pré-termo < 37 semanas; termo 37 a 41s6d; pós-te
