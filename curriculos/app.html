ia","Responde por homicídio consumado com pena reduzida","Tem a pena reduzida de um a dois terços pelo arrependimento posterior","Não responde por crime algum, por se tratar de crime impossível"],"correta":1,"explicacao":"Art. 15 do Código Penal: o agente que voluntariamente desiste de prosseguir na execução só responde pelos atos já praticados (no caso, eventualmente, disparo de arma de fogo ou perigo para a vida)."},{"id":"oab-8fd049ba","area":"Penal","enunciado":"Durante uma caçada, Célio atirou contra um vulto na mata acreditando tratar-se de um animal, mas atingiu e matou um colega. O erro era evitável, se Célio tivesse agido com a cautela devida. Nesse caso:","alternativas":["Há erro de proibição, que isenta de pena","Há erro de tipo invencível, que exclui dolo e culpa","Há erro de tipo vencível, punível a título de culpa","Responde por homicídio doloso, pois assumiu o risco","Há legítima defesa putativa, que exclui a ilicitude"],"correta":2,"explicacao":"Art. 20, caput, do Código Penal: o erro sobre elemento constitutivo do tipo legal exclui o dolo, mas permite a punição por crime culposo, se previsto em lei."},{"id":"oab-50c34185","area":"Penal","enunciado":"Marcos tinha 20 anos na data do crime e 23 anos na data da sentença. Quanto aos prazos prescricionais aplicáveis a ele:","alternativas":["São reduzidos de metade, pois era menor de 21 anos ao tempo do crime","São reduzidos de um terço, pois era menor de 21 anos ao tempo do crime","Não há redução, pois era maior de 21 anos na data da sentença","São reduzidos de metade apenas se ele for maior de 70 anos na sentença","São contados em dobro, por se tratar de réu jovem"],"correta":0,"explicacao":"Art. 115 do Código Penal: são reduzidos de metade os prazos de prescrição quando o criminoso era, ao tempo do crime, menor de 21 anos, ou, na data da sentença, maior de 70 anos."},{"id":"oab-d0abd164","area":"Processo Penal","enunciado":"Laura foi vítima de crime de ação penal privada e descobriu quem era o autor do fato em 10 de março. Salvo disposição em contrário, o prazo para oferecer queixa-crime é de:","alternativas":["6 meses, contados da data do fato","30 dias, contados da conclusão do inquérito policial","6 meses, contados do conhecimento da autoria","1 ano, contado do dia em que soube quem é o autor","15 dias, contados do conhecimento da autoria"],"correta":2,"explicacao":"Art. 38 do CPP: o ofendido decai do direito de queixa se não o exercer dentro de seis meses, contados do dia em que vier a saber quem é o autor do crime."},{"id":"oab-8f008e4c","area":"Processo Penal","enunciado":"Em processo pelo procedimento comum ordinário, o juiz rejeitou a denúncia oferecida pelo Ministério Público por falta de justa causa. O recurso cabível é:","alternativas":["Recurso em sentido estrito","Apelação","Agravo em execução","Carta testemunhável","Embargos infringentes"],"correta":0,"explicacao":"Art. 581, I, do CPP: cabe recurso em sentido estrito da decisão que não receber a denúncia ou a queixa."},{"id":"oab-02647e6d","area":"Processo Penal","enunciado":"Douglas foi denunciado por latrocínio (roubo seguido de morte). O órgão competente para julgá-lo é:","alternativas":["O Tribunal do Júri, por haver resultado morte","O juízo criminal singular, pois o latrocínio é crime contra o patrimônio","O Tribunal do Júri, por se tratar de crime hediondo","O Juizado Especial Criminal","O juízo singular apenas se a morte resultar de culpa"],"correta":1,"explicacao":"Súmula 603 do STF: a competência para o processo e julgamento de latrocínio é do juiz singular e não do Tribunal do Júri, que julga os crimes dolosos contra a vida (art. 5º, XXXVIII, d, da Constituição; art. 74, § 1º, do CPP)."},{"id":"oab-846a8377","area":"Trabalho","enunciado":"Sandra completou seu período aquisitivo de férias, mas o empregador não as concedeu nos 12 meses subsequentes. Segundo a CLT, Sandra:","alternativas":["Tem direito ao pagamento das férias em dobro","Perde o direito às férias, que prescrevem","Tem direito io, a sentença julgou improcedentes os pedidos do reclamante. O prazo para interposição de recurso ordinário é de:","alternativas":["5 dias","8 dias","10 dias","15 dias","30 dias"],"correta":1,"explicacao":"Art. 895, I, da CLT e art. 6º da Lei 5.584/1970: o recurso ordinário é cabível no prazo de oito dias, prazo que é a regra geral dos recursos trabalhistas."},{"id":"oab-d6ec5e46","area":"Processo do Trabalho","enunciado":"Em reclamação trabalhista submetida ao procedimento sumaríssimo, cada parte pode indicar, no máximo:","alternativas":["3 testemunhas","6 testemunhas","1 testemunha","2 testemunhas","5 testemunhas"],"correta":3,"explicacao":"Art. 852-H, § 2º, da CLT: no procedimento sumaríssimo, as testemunhas, até o máximo de duas para cada parte, comparecerão independentemente de intimação; no rito ordinário, o limite é de três (art. 821)."},{"id":"oab-c599afc2","area":"Administrativo","enunciado":"Um município concedeu licença a um particular e, posteriormente, constatou que o ato foi praticado com vício de legalidade. Segundo o entendimento sumulado do STF, a Administração:","alternativas":["Deve revogar o ato, por conveniência e oportunidade","Só pode desfazer o ato mediante decisão judicial","Não pode desfazer o ato, pois gerou direito adquirido","Pode anular o ato, pois de atos ilegais não se originam direitos","Deve convalidar obrigatoriamente o ato, qualquer que seja o vício"],"correta":3,"explicacao":"Súmula 473 do STF: a Administração pode anular seus próprios atos, quando eivados de vícios que os tornem ilegais, porque deles não se originam direitos; ou revogá-los por motivo de conveniência ou oportunidade (no mesmo sentido, art. 53 da Lei 9.784/1999)."},{"id":"oab-d12b825c","area":"Administrativo","enunciado":"Um motorista de ambulância de hospital público estadual, em serviço, causou acidente que feriu o pedestre Nilo. Quanto à responsabilidade civil, é correto afirmar que:","alternativas":["O Estado responde apenas se Nilo provar a culpa do motorista","Apenas o motorista responde, de forma subjetiva","O Estado responde objetivamente, com direito de regresso contra o agente","O Estado e o motorista respondem objetivamente e de forma solidária","O Estado responde subjetivamente, com base na culpa do serviço"],"correta":2,"explicacao":"Art. 37, § 6º, da Constituição: as pessoas jurídicas de direito público responderão pelos danos que seus agentes, nessa qualidade, causarem a terceiros, assegurado o direito de regresso contra o responsável nos casos de dolo ou culpa."},{"id":"oab-1ec7c178","area":"Administrativo","enunciado":"Em 2016, um órgão federal concedeu vantagem a um servidor que estava de boa-fé. Em 2024, constatou-se que o ato era ilegal. Segundo a Lei 9.784/1999, a Administração:","alternativas":["Pode anular o ato a qualquer tempo, pois atos ilegais não se convalidam","Pode anular o ato em até dez anos da sua prática","Deve revogar o ato, com efeitos retroativos","Não pode mais anular o ato, pois decaiu o direito após cinco anos","Pode anular o ato em até vinte anos, por se tratar de verba pública"],"correta":3,"explicacao":"Art. 54 da Lei 9.784/1999: o direito da Administração de anular atos de que decorram efeitos favoráveis para os destinatários decai em cinco anos, contados da data em que foram praticados, salvo comprovada má-fé."},{"id":"oab-4230a631","area":"Tributário","enunciado":"Uma empresa declarou e pagou antecipadamente determinado tributo sujeito a lançamento por homologação, sem dolo, fraude ou simulação. A Fazenda não se manifestou. Segundo o CTN, o prazo para a Fazenda homologar ou lançar diferenças é de:","alternativas":["5 anos, contados do primeiro dia do exercício seguinte à declaração","10 anos, contados da ocorrência do fato gerador","5 anos, contados da ocorrência do fato gerador","2 anos, contados do pagamento","3 anos, contados da entrega da declaração"],"correta":2,"explicacao":"Art. 150, § 4º, do CTN: se a lei não fixar prazo, a homologação ocorre em cinco anos a contar da ocorrência do fato gerador; expirado esse prazo sem pronunciamento, considera-se homologado o lançamento, salvo dolo, fraude ou simulação."},{"id":"oab-293524fb","area":"Tributário","enunciado":"Um município lançou IPTU sobre o imóvel onde funciona o templo de uma igreja e realizou as celebrações religiosas. Segundo a Constituição, essa cobrança é:","alternativas":["Devida, pois a imunidade dos templos abrange apenas taxas","Indevida, pois há imunidade tributária dos templos de qualquer culto quanto a impostos","Devida, pois a imunidade alcança apenas tributos federais","Indevida apenas se a entidade religiosa comprovar ausência de patrimônio","Devida, pois IPTU é tributo real e não se sujeita a imunidades"],"correta":1,"explicacao":"Art. 150, VI, b, da Constituição: é vedado aos entes federativos instituir impostos sobre entidades religiosas e templos de qualquer culto; a imunidade abrange o imóvel onde se realizam os cultos."},{"id":"oab-1de2028f","area":"Tributário","enunciado":"A empresa Beta, antes de qualquer procedimento de fiscalização, percebeu que deixara de declarar e de recolher um tributo, confessou a infração e pagou integralmente o tributo devido com juros de mora. Segundo o CTN, Beta:","alternativas":["Deve pagar a multa punitiva, reduzida à metade","Deve pagar a multa, pois o tributo foi recolhido em atraso","Tem direito à restituição dos juros pagos","Tem a responsabilidade pela infração excluída, pela denúncia espontânea","Tem a responsabilidade excluída apenas se o débito for parcelado"],"correta":3,"explicacao":"Art. 138 do CTN: a responsabilidade é excluída pela denúncia espontânea da infração, acompanhada do pagamento do tributo devido e dos juros de mora, antes do início de qualquer procedimento administrativo ou medida de fiscalização."},{"id":"oab-4d3c2249","area":"Empresarial","enunciado":"Vânia recebeu um cheque emitido na mesma praça em que deve ser pago. Segundo a Lei do Cheque (Lei 7.357/1985), o prazo de apresentação desse cheque é de:","alternativas":["60 dias, contados da data de emissão","30 dias, contados da data de emissão","6 meses, contados da data de emissão","15 dias, contados da data de emissão","90 dias, contados da data de emissão"],"correta":1,"explicacao":"Art. 33 da Lei 7.357/1985: o cheque deve ser apresentado para pagamento em 30 dias, quando emitido no lugar onde houver de ser pago, e em 60 dias, quando emitido em outro lugar."},{"id":"oab-8030f13d","area":"Empresarial","enunciado":"A sociedade empresária Alfa Ltda., constituída e registrada há um ano, enfrenta crise financeira e pretende requerer recuperação judicial. Segundo a Lei 11.101/2005, esse pedido:","alternativas":["Pode ser deferido, pois não há exigência de tempo mínimo de atividade","Não preenche requisito legal, pois exige-se atividade regular há mais de 2 anos","Exige apenas a apresentação do plano de recuperação na petição inicial","Pode ser deferido se houver concordância prévia de metade dos credores","Não preenche requisito legal, pois exige-se atividade regular há mais de 5 anos"],"correta":1,"explicacao":"Art. 48, caput, da Lei 11.101/2005: poderá requerer recuperação judicial o devedor que, no momento do pedido, exerça regularmente suas atividades há mais de 2 anos, atendidos os demais requisitos."},{"id":"oab-42996f65","area":"Consumidor","enunciado":"Heitor comprou um aparelho de ginástica pela internet e, ao recebê-lo, desistiu da compra, embora o produto não tivesse defeito. Segundo o CDC, Heitor:","alternativas":["Não pode desistir, pois o produto não apresenta vício","Pode desistir em 30 dias, com retenção de multa de 10%","Pode desistir em 7 dias, mas deve arcar com o frete de devolução","Pode desistir em 7 dias do recebimento, com devolução imediata do valor pago","Pode desistir em 90 dias, por se tratar de produto durável"],"correta":3,"explicacao":"Art. 49 do CDC: o consumidor pode desistir do contrato no prazo de 7 dias a contar de sua assinatura ou do recebimento do produto, sempre que a contratação ocorrer fora do estabelecimento comercial, com devolução imediata dos valores pagos, monetariamente atualizados."},{"id":"oab-3cc601e6","area":"ECA","enunciado":"Um adolescente recebeu a medida socioeducativa de internação. Segundo o ECA, essa medida:","alternativas":["Tem prazo fixo de dois anos, sem necessidade de reavaliação","Deve ser reavaliada a cada ano e pode durar até cinco anos","Não pode exceder um ano, prorrogável uma vez","Não comporta prazo determinado e não pode exceder três anos","Tem prazo indeterminado, cessando apenas aos 18 anos"],"correta":3,"explicacao":"Art. 121, §§ 2º e 3º, do ECA: a internação não comporta prazo determinado, sua manutenção deve ser reavaliada no máximo a cada seis meses e o período máximo não excederá três anos; a liberação é compulsória aos 21 anos (§ 5º)."},{"id":"oab-cb839b1c","area":"Direitos Humanos","enunciado":"Uma vítima de violação de direitos humanos no Brasil pretende que seu caso seja julgado pela Corte Interamericana de Direitos Humanos. Segundo a Convenção Americana (Pacto de San José da Costa Rica), têm direito de submeter um caso à decisão da Corte:","alternativas":["Qualquer pessoa, diretamente, após esgotados os recursos internos","Apenas as organizações não governamentais reconhecidas","Somente a vítima, representada por advogado","Somente os Estados Partes e a Comissão Interamericana de Direitos Humanos","Qualquer Estado membro da ONU"],"correta":3,"explicacao":"Art. 61.1 da Convenção Americana sobre Direitos Humanos: somente os Estados Partes e a Comissão têm direito de submeter caso à decisão da Corte; o indivíduo apresenta petição à Comissão (art. 44)."},{"id":"oab-51092f8a","area":"Filosofia do Direito","enunciado":"Na Teoria Pura do Direito, Hans Kelsen explica que o fundamento último de validade de uma ordem jurídica reside:","alternativas":["Na norma fundamental (Grundnorm), pressuposta e não posta","Na vontade soberana do povo, expressa pela Constituição","Nos princípios morais universais do direito natural","Na regra de reconhecimento aceita pelas autoridades","Na eficácia social das normas perante os destinatários"],"correta":0,"explicacao":"Para Kelsen, a validade de cada norma decorre de uma norma superior, até a norma fundamental, que é pressuposta pelo pensamento jurídico; a regra de reconhecimento, que é uma prática social, é conceito de Hart."},{"id":"oab-bc76875a","area":"Ambiental","enunciado":"Uma indústria, operando com todas as licenças ambientais, causou vazamento acidental de produtos químicos que contaminou um rio. Quanto à obrigação de reparar o dano ambiental, a indústria:","alternativas":["Responde apenas se comprovada sua culpa","Não responde, pois possuía licença ambiental válida","Responde objetivamente, independentemente da existência de culpa","Responde apenas se o dano atingir área de preservação permanente","Responde subsidiariamente ao Poder Público que concedeu a licença"],"correta":2,"explicacao":"Art. 14, § 1º, da Lei 6.938/1981 (Política Nacional do Meio Ambiente): o poluidor é obrigado, independentemente da existência de culpa, a indenizar ou reparar os danos causados ao meio ambiente e a terceiros; a licença não afasta essa obrigação (art. 225, § 3º, da Constituição)."}]}/*FIM*/;

const normEstado=v=>({r:{...(v&&v.r||{})},g:{...(v&&v.g||{})},dias:{...(v&&v.dias||{})},sim:Array.isArray(v&&v.sim)?v.sim.slice(-50):[]});
let estado = normEstado();

let db=null, uid=null, sample=null, docEstado=null;
const LS="gabarito-am-v1";

function lsLer(){try{const v=JSON.parse(localStorage.getItem(LS)||"null");if(v){estado=normEstado(v.estado);extras=v.extras||[];}}catch(e){}}
function lsGravar(){try{localStorage.setItem(LS,JSON.stringify({estado,extras}))}catch(e){}}

let timer=null, gravando=false, pendente=false;
function salvar(){ lsGravar(); if(!docEstado) return; clearTimeout(timer); timer=setTimeout(flush,1200); setSync("salvando…"); }
async function flush(){
  if(gravando){pendente=true;return}
  gravando=true;
  try{ await docEstado.set(JSON.parse(JSON.stringify(estado))); setSync("salvo na sua conta"); }
  catch(e){ setSync("não salvou na conta — guardado neste aparelho"); }
  gravando=false; if(pendente){pendente=false;flush()}
}
function setSync(t){document.getElementById("sync").textContent=t}

async function conectar(){
  const use = window.claude && window.claude.use;
  if(!use) return;
  try{
    const [u,d,s] = await Promise.all([use("user"),use("db"),use("sample")]);
    sample = s;
    if(u && d){ uid = await u.id(); if(uid){ db=d; } }
    if(db){
      docEstado = db.doc("data/users/"+uid+"/estado");
      const snap = await docEstado.get();
      if(snap.exists){ estado=normEstado(snap.data()); if(migrar()) flush(); }
      else if(Object.keys(estado.r).length||Object.keys(estado.g).length){ flush(); }
      const col = docEstado.collection("questoes");
      const qs = await col.get();
      const remotas = qs.docs.map(x=>({...x.data(),id:x.id}));
      // envia para a conta as questões que só existiam neste aparelho
      const ids = new Set(remotas.map(x=>x.id));
      for(const x of extras){ if(!ids.has(x.id)){ const {id,...corpo}=x; try{await col.doc(id).set(corpo);remotas.push(x)}catch(e){} } }
      extras = remotas; lsGravar();

}

const P = {t: lembrar("t")||"enem", a:"", modo:"novas", q:null, esc:null, resp:false, ia:"", iaMsg:"", gerando:false};

function sortear(){
  const pool = todas().filter(q=>q.t===P.t && (!P.a||q.a===P.a));
  let cand = pool;
  if(P.modo==="erros") cand = pool.filter(q=>estado.r[q.id] && estado.r[q.id][2]===0);
  else if(P.modo==="novas"){ const n=pool.filter(q=>!estado.r[q.id]); cand = n.length?n:pool; }
  if(P.q && cand.length>1) cand = cand.filter(q=>q.id!==P.q.id);
  P.q = cand.length ? cand[Math.floor(Math.random()*cand.length)] : null;
  P.esc=null; P.resp=false; P.ia=""; P.iaMsg="";
  // embaralha as alternativas a cada exibição (P.esc guarda o índice original)
  P.ordem=[0,1,2,3,4].sort(()=>Math.random()-.5);
}
const letraDe=i=>LETRAS[P.ordem.indexOf(i)];

function responder(){
  if(P.esc===null||P.resp) return;
  P.resp=true;
  const ok = P.esc===P.q.c;
  const r = estado.r[P.q.id] || [0,0,0,0];
  estado.r[P.q.id] = [r[0]+(ok?1:0), r[1]+(ok?0:1), ok?1:0, Date.now()];
  estado.dias[hoje()] = (estado.dias[hoje()]||0)+1;
  salvar(); render();
}

async function explicarIA(){

// min = minutos por questão na prova real; pesos = participação aproximada de cada área.
// Sem pesos, cada área entra na proporção de questões disponíveis.
const FORMATO = {
  enem:{min:3, real:"180 questões em 2 dias", grupos:{"Linguagens":["Português","Literatura","Inglês","Redação"],"Humanas":["História","Geografia","Filosofia","Sociologia"],"Natureza":["Biologia","Química","Física"],"Matemática":["Matemática"]}, pesos:{"Linguagens":1,"Humanas":1,"Natureza":1,"Matemática":1}},
  medicina:{min:2.5, real:"provas de disciplina da graduação"},
  residencia:{min:2.4, real:"≈100 questões em 4 h (5 grandes áreas)", pesos:{"Clínica Médica":1,"Cirurgia":1,"Pediatria":1,"Ginecologia e Obstetrícia":1,"Medicina Preventiva":1}},
  direito:{min:2.5, real:"provas de disciplina da graduação"},
  oab:{min:3.75, corte:.5, real:"80 questões em 5 h; aprova com 40 acertos", pesos:{"Ética":8,"Constitucional":6,"Civil":7,"Processo Civil":6,"Penal":6,"Processo Penal":6,"Trabalho":5,"Processo do Trabalho":5,"Administrativo":5,"Tributário":5,"Empresarial":5,"Direitos Humanos":3,"ECA":2,"Consumidor":2,"Ambiental":2,"Filosofia do Direito":2}},
};
const TAMANHOS=[10,20,45,80];
const embaralhar=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function grupoDe(t,a){for(const [g,as] of Object.entries((FORMATO[t]||{}).grupos||{})) if(as.includes(a)) return g; return a}

function montarSimulado(t,n){
  const f=FORMATO[t]||{}, pool=todas().filter(q=>q.t===t), porG={};
  for(const q of pool)(porG[grupoDe(t,q.a)]=porG[grupoDe(t,q.a)]||[]).push(q);
  const ordem=f.pesos?Object.keys(f.pesos):[], gs=Object.keys(porG).sort((a,b)=>((ordem.indexOf(a)+1)||99)-((ordem.indexOf(b)+1)||99)||a.localeCompare(b,"pt"));
  const w=g=>f.pesos?(f.pesos[g]||1):porG[g].length, W=gs.reduce((s,g)=>s+w(g),0);
  n=Math.min(n,pool.length);
  // maiores restos, sem passar do que existe em cada área
  const cota=gs.map(g=>{const x=n*w(g)/W;return {g,x,k:Math.min(Math.floor(x),porG[g].length)}});
  let falta=n-cota.reduce((s,o)=>s+o.k,0);
  const porResto=cota.slice().sort((a,b)=>(b.x%1)-(a.x%1));
  while(falta>0){let andou=false;for(const o of porResto) if(falta&&o.k<porG[o.g].length){o.k++;falta--;andou=true} if(!andou)break}
  // prefere questões ainda não respondidas; áreas na ordem da prova
  const escolhe=g=>{const qs=embaralhar(porG[g]);return qs.filter(q=>!estado.r[q.id]).concat(qs.filter(q=>estado.r[q.id]))};
  return cota.flatMap(o=>embaralhar(escolhe(o.g).slice(0,o.k)));
}

const SIM_LS="sim";
let S = (()=>{try{const v=JSON.parse(lembrar(SIM_LS)||"null");if(v&&v.fase)return v}catch(e){}return null})() || {fase:"config", t:P.t, n:20, cron:true};
function guardarS(){lembrar(SIM_LS,JSON.stringify(S))}
const qPorId=id=>todas().find(q=>q.id===id);
const restante=()=>S.limite?Math.max(0,S.inicio+S.limite-Date.now()):null;
const mmss=ms=>{const s=Math.round(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};

function iniciarSimulado(){
  const qs=montarSimulado(S.t,S.n);
  if(!qs.length) return;
  S={fase:"prova", t:S.t, n:qs.length, cron:S.cron, ids:qs.map(q=>q.id),
     ordens:Object.fromEntries(qs.map(q=>[q.id,embaralhar([0,1,2,3,4])])), resp:{}, i:0,
     inicio:Date.now(), limite:S.cron?Math.round(qs.length*(FORMATO[S.t]||{}).min*60000):0, entregando:false};
  guardarS(); render(); window.scrollTo(0,0);
}

function entregarSimulado(){
  if(S.fase!=="prova") return;
  const fim=Date.now(), areas={}; let ac=0;
  for(const id of S.ids){
    const q=qPorId(id); if(!q) continue;
    const r=S.resp[id], ok=r===q.c; if(ok) ac++;
    (areas[q.a]=areas[q.a]||[0,0]); areas[q.a][0]+=ok?1:0; areas[q.a][1]++;
    if(r!==undefined){ const x=estado.r[id]||[0,0,0,0]; estado.r[id]=[x[0]+(ok?1:0),x[1]+(ok?0:1),ok?1:0,fim]; estado.dias[hoje()]=(estado.dias[hoje()]||0)+1; }
  }
  const seg=Math.round((Math.min(fim,S.limite?S.inicio+S.limite:fim)-S.inicio)/1000);
  estado.sim=estado.sim.concat([{d:fim,t:S.t,n:S.ids.length,ac,seg,areas}]).slice(-50);
  salvar();
  Object.assign(S,{fase:"fim",fim,ac,seg,areas,soErros:false}); guardarS(); render(); window.scrollTo(0,0);
}

function vSimulado(){
  const f=FORMATO[S.t]||{};
  if(S.fase==="config"){
    const disp=todas().filter(q=>q.t===S.t).length, n=Math.min(S.n,disp);
    const hist=estado.sim.filter(x=>x.t===S.t).slice(-5).reverse();
    return `<div class="sheet stack">
      <div><label class="lab">Trilha</label><div class="chips">${Object.entries(TRILHAS).map(([k,v])=>`<button class="chip" data-st="${k}" aria-pressed="${k===S.t}">${v.nome}</button>`).join("")}</div></div>
      <div><label class="lab">Número de questões</label><div class="chips">${TAMANHOS.map(x=>`<button class="chip" data-sn="${x}" aria-pressed="${x===S.n}" ${x>disp?"disabled":""}>${x}</button>`).join("")}</div></div>
      <label class="check" style="font-family:var(--display)"><input type="checkbox" id="s-cron" ${S.cron?"checked":""}><span>Cronometrar como na prova real (${f.min} min por questão → ${mmss(n*f.min*60000)})</span></label>
      <p class="note" style="margin:0">Prova real: ${esc(f.real||"")}. As questões seguem o peso de cada área${f.pesos?" na prova":""} e priorizam as que você ainda não respondeu. O gabarito só aparece na entrega.</p>
      <div class="row"><button class="btn" id="s-iniciar" ${disp?"":"disabled"}>Começar simulado de ${n} questões</button></div>
    </div>
    ${hist.length?`<section class="sec" style="margin-top:22px"><h2>Últimos simulados <span class="pct">${esc(TRILHAS[S.t].nome)}</span></h2><div class="bars">${hist.map(barraSim).join("")}</div></section>`:""}`;
  }
  if(S.fase==="prova"){
    const id=S.ids[S.i], q=qPorId(id), ord=S.ordens[id], marc=S.resp[id], rest=restante();
    const brancos=S.ids.filter(x=>S.resp[x]===undefined).length;
    return `<div class="provabar"><span class="tag">${esc(TRILHAS[S.t].nome)} · questão ${S.i+1} de ${S.ids.length}</span>
      <span class="relogio ${rest!==null&&rest<300000?"pouco":""}" id="relogio" aria-live="off">${rest===null?mmss(Date.now()-S.inicio):mmss(rest)}</span></div>
    ${q?`<article class="sheet">
      <div class="meta"><span>${esc(q.a)}</span></div>
      <p class="q">${esc(q.q)}</p>
      <ol class="alts">${ord.map((i,pos)=>`<li><button class="alt" data-si="${i}" data-s="${marc===i?"sel":""}"><span class="bubble">${LETRAS[pos]}</span><span>${esc(q.o[i])}</span></button></li>`).join("")}</ol>
      <div class="actions"><button class="btn ghost" id="s-ant" ${S.i?"":"disabled"}>Anterior</button>${S.i<S.ids.length-1?`<button class="btn" id="s-prox">Próxima</button>`:`<button class="btn" id="s-entregar">Entregar prova</button>`}</div>
    </article>`:`<div class="sheet"><p class="empty">Esta questão foi apagada. Siga para a próxima.</p></div>`}
    <section class="sec" style="margin-top:18px"><h2>Cartão-resposta <span class="pct">${S.ids.length-brancos}/${S.ids.length} marcadas</span></h2>
      <div class="cartao">${S.ids.map((x,k)=>`<button data-sgo="${k}" data-f="${S.resp[x]!==undefined?1:0}" aria-current="${k===S.i}" aria-label="Questão ${k+1}${S.resp[x]!==undefined?", marcada":""}">${k+1}</button>`).join("")}</div>
      <div class="actions">${S.entregando?`<div class="confirm">${brancos?`Faltam ${brancos} questão(ões) em branco, que contam como erro. `:""}Entregar agora? <button class="btn" id="s-entregar-sim">Entregar</button><button class="btn ghost" id="s-entregar-nao">Continuar</button></div>`:`<button class="btn ghost" id="s-entregar">Entregar prova</button><button class="btn ghost" id="s-desistir">Abandonar</button>`}</div>
    </section>
    <p class="note">Atalhos: A–E marcam, ← → mudam de questão.</p>`;
  }
  // resultado
  const pct=S.ac/S.ids.length, linhas=Object.entries(S.areas).map(([a,[x,n]])=>({a,x,n,p:x/n})).sort((a,b)=>a.p-b.p);
  const corte=f.corte?`<div class="tile"><b style="color:${pct>=f.corte?"var(--ok)":"var(--bad)"}">${pct>=f.corte?"Acima":"Abaixo"}</b><span>do corte de ${Math.round(f.corte*100)}% (${Math.ceil(f.corte*80)}/80 na OAB)</span></div>`:"";
  const lista=S.ids.map((id,k)=>({k,q:qPorId(id),r:S.resp[id]})).filter(x=>x.q&&(!S.soErros||x.r!==x.q.c));
  return `<div class="tiles">
    <div class="tile"><b>${S.ac}/${S.ids.length}</b><span>acertos</span></div>
    <div class="tile"><b>${Math.round(pct*100)}%</b><span>aproveitamento</span></div>
    <div class="tile"><b>${mmss(S.seg*1000)}</b><span>tempo${S.limite?" de "+mmss(S.limite):""}</span></div>
    ${corte}
  </div>
  <section class="sec"><h2>Por área <span class="pct">piores primeiro</span></h2><div class="bars">${linhas.map(l=>`<div class="bar"><span>${esc(l.a)}</span><small>${l.x}/${l.n}</small><div class="meter" role="img" aria-label="${Math.round(l.p*100)}% de acerto"><i style="width:${l.p*100}%"></i></div></div>`).join("")}</div></section>
  <section class="sec"><h2>Correção <label class="check" style="font:500 13px var(--display);padding:0"><input type="checkbox" id="s-soerros" ${S.soErros?"checked":""}><span>só erros e brancos</span></label></h2>
  ${lista.length?lista.map(({k,q,r})=>`<div class="rev"><div class="meta"><span>Questão ${k+1}</span><span>${esc(q.a)}</span></div><p class="q">${esc(q.q)}</p>
    <p class="sua ${r===q.c?"ok":"bad"}">${r===undefined?"Em branco":"Sua resposta: "+esc(q.o[r])}${r===q.c?" ✓":""}</p>
    ${r!==q.c?`<p class="sua ok">Gabarito: ${esc(q.o[q.c])}</p>`:""}<p style="color:var(--ink2)">${esc(q.e||"")}</p></div>`).join(""):`<p class="empty">Nenhum erro. Excelente!</p>`}
  </section>
  <div class="actions"><button class="btn" id="s-novo">Novo simulado</button><button class="btn ghost" id="s-errados">Treinar os erros na aba Praticar</button></div>`;
}
function barraSim(x){const p=x.ac/x.n,d=new Date(x.d);return `<div class="bar"><span>${d.toLocaleDateString("pt-BR")} · ${esc(TRILHAS[x.t]?.nome||x.t)} · ${x.n} questões</span><small>${x.ac}/${x.n} · ${Math.round(p*100)}% · ${mmss(x.seg*1000)}</small><div class="meter" role="img" aria-label="${Math.round(p*100)}% de acerto"><i style="width:${p*100}%"></i></div></div>`}

setInterval(()=>{ if(S.fase!=="prova") return; const el=document.getElementById("relogio"); const r=restante();
  if(r===null){ if(el) el.textContent=mmss(Date.now()-S.inicio); return }
  if(r<=0) return entregarSimulado();
  if(el){ el.textContent=mmss(r); el.classList.toggle("pouco",r<300000); } },1000);

/* ---------- Render e eventos ---------- */
let aba = (location.hash||"").slice(1) || lembrar("aba") || "praticar";
function render(){
  if(!["praticar","simulado","grade","desempenho","minhas"].includes(aba)) aba="praticar";
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===aba));
  $("#view").innerHTML = aba==="praticar"?vPraticar():aba==="simulado"?vSimulado():aba==="grade"?vGrade():aba==="desempenho"?vDesempenho():vMinhas();
}

document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;aba=b.dataset.tab;lembrar("aba",aba);render();window.scrollTo(0,0)});

document.getElementById("view").addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.t){P.t=b.dataset.t;P.a="";lembrar("t",P.t);sortear();return render()}
  if(b.dataset.gt){G.t=b.dataset.gt;lembrar("gt",G.t);return render()}
  if(b.dataset.i!==undefined&&!P.resp){P.esc=+b.dataset.i;return render()}
  if(b.id==="confirmar") return responder();
  if(b.id==="prox"||b.id==="pular"){sortear();render();return window.scrollTo(0,0)}
  if(b.id==="explicar") return explicarIA();
  if(b.id==="gerar") return gerarIA();
  if(b.dataset.st){S.t=b.dataset.st;guardarS();return render()}
  if(b.dataset.sn){S.n=+b.dataset.sn;guardarS();return render()}
  if(b.id==="s-iniciar") return iniciarSimulado();
  if(b.dataset.si!==undefined&&S.fase==="prova"){const id=S.ids[S.i];if(S.resp[id]===+b.dataset.si)delete S.resp[id];else S.resp[id]=+b.dataset.si;guardarS();return render()}
  if(b.id==="s-prox"||b.id==="s-ant"){S.i+=b.id==="s-prox"?1:-1;S.entregando=false;guardarS();render();return window.scrollTo(0,0)}
  if(b.dataset.sgo){S.i=+b.dataset.sgo;guardarS();render();return window.scrollTo(0,0)}
  if(b.id==="s-entregar"){S.entregando=true;render();return document.getElementById("s-entregar-sim")?.scrollIntoView({block:"center"})}
  if(b.id==="s-entregar-nao"){S.entregando=false;return render()}
  if(b.id==="s-entregar-sim") return entregarSimulado();
  if(b.id==="s-desistir"){S={fase:"config",t:S.t,n:S.n,cron:S.cron};guardarS();return render()}
  if(b.id==="s-novo"){S={fase:"config",t:S.t,n:S.n,cron:S.cron};guardarS();return render()}
  if(b.id==="s-errados"){P.t=S.t;P.a="";P.modo="erros";lembrar("t",P.t);sortear();aba="praticar";lembrar("aba",aba);render();return window.scrollTo(0,0)}
  if(b.id==="zerar"){M.zerar=true;return render()}
  if(b.id==="zerar-nao"){M.zerar=false;return render()}
  if(b.id==="zerar-sim"){estado=normEstado();M.zerar=false;salvar();return render()}
  if(b.dataset.del){M.apagar=b.dataset.del;return render()}
  if(b.hasAttribute("data-del-no")){M.apagar=null;return render()}
  if(b.dataset.delOk){await apagarExtra(b.dataset.delOk);M.apagar=null;if(P.q&&P.q.id===b.dataset.delOk)P.q=null;return render()}
  if(b.id==="copiar"){const txt=JSON.stringify({estado,extras});const ta=$("#imp");
    try{await navigator.clipboard.writeText(txt);M.msg="";b.textContent="Copiado"}catch(err){ta.value=txt;ta.select();b.textContent="Selecionado — copie com Ctrl+C"}return}
  if(b.id==="importar"){try{const v=JSON.parse($("#imp").value);if(!v||typeof v!=="object")throw 0;
      if(v.estado){estado=normEstado(v.estado);salvar()}
      const ids=new Set(extras.map(x=>x.id));for(const x of (v.extras||[]))if(x&&x.id&&!ids.has(x.id)&&Array.isArray(x.o))await gravarExtra(x);
      M.imp="";M.msg="Backup restaurado.";}catch(err){M.imp=$("#imp").value;M.msg="Texto inválido: cole exatamente o conteúdo copiado pelo botão \"Copiar backup\"."}
    aba="minhas";return render()}
});

document.getElementById("view").addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="s-cron"){S.cron=el.checked;guardarS();render()}
  else if(el.id==="s-soerros"){S.soErros=el.checked;guardarS();render()}
  else if(el.id==="f-area"){P.a=el.value;sortear();render()}
  else if(el.id==="f-modo"){P.modo=el.value;sortear();render()}
  else if(el.dataset.g){ if(el.checked) estado.g[el.dataset.g]=1; else delete estado.g[el.dataset.g]; salvar();
    const sec=el.dataset.g.split("|")[0];const [f,t]=progressoSec(sec);const s=el.closest(".sec");
    s.querySelector(".pct").textContent=`${f}/${t} · ${Math.round(f/t*100)}%`;s.querySelector(".meter i").style.width=(f/t*100)+"%"; }
});

document.getElementById("view").addEventListener("submit",async e=>{
  e.preventDefault();
  const o=[0,1,2,3,4].map(i=>$("#n-o"+i).value.trim());
  const x={id:novoId(),t:$("#n-t").value,a:$("#n-a").value.trim()||"Geral",q:$("#n-q").value.trim(),o,
    c:+document.querySelector('input[name="n-c"]:checked').value,e:$("#n-e").value.trim(),src:"minha"};
  if(!x.q||o.some(v=>!v)){M.msg="Preencha o enunciado e as 5 alternativas.";return render()}
  await gravarExtra(x); M.msg="Questão adicionada. Ela já entra no sorteio da aba Praticar."; render();
});

document.addEventListener("keydown",e=>{
  if(aba==="simulado"&&S.fase==="prova"&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    const i=LETRAS.indexOf(e.key.toUpperCase()), id=S.ids[S.i];
    if(i>=0&&S.ordens[id]){S.resp[id]=S.ordens[id][i];guardarS();render()}
    else if(e.key==="ArrowRight"&&S.i<S.ids.length-1){S.i++;guardarS();render()}
    else if(e.key==="ArrowLeft"&&S.i>0){S.i--;guardarS();render()}
    return;
  }
  if(aba!=="praticar"||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey) return;
  const i=LETRAS.indexOf(e.key.toUpperCase());
  if(i>=0&&P.q&&!P.resp){P.esc=P.ordem[i];render()}
  else if(e.key==="Enter"&&P.q){ if(!P.resp) responder(); else {sortear();render()} e.preventDefault(); }
});

lsLer(); if(migrar()) lsGravar(); render(); conectar();
</script>
