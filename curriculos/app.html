teste com sensibilidade de 90% e especificidade de 90% é aplicado a 1.000 pessoas, numa população com prevalência de 10% da doença. O valor preditivo positivo é:","alternativas":["90%","50%","10%","81%","98,8%"],"correta":1,"explicacao":"Doentes: 100 (90 VP, 10 FN). Sadios: 900 (810 VN, 90 FP). VPP = 90/(90 + 90) = 50%. O VPN seria 810/820 ≈ 98,8%; a baixa prevalência derruba o VPP.","tema":"testes-diagnosticos","subtema":"testes-diagnosticos.valores-preditivos","especialidade":"epidemiologia","disciplina":"Epidemiologia","dificuldade":3,"fonte":"autoral"},{"id":"res-b1ebedba","area":"Medicina Preventiva","enunciado":"Num ensaio clínico, o desfecho ocorreu em 20% do grupo controle e em 15% do grupo tratado. O número necessário para tratar (NNT) para evitar um desfecho é:","alternativas":["5","4","20","15","25"],"correta":2,"explicacao":"Redução absoluta do risco = 20% − 15% = 5% (0,05); NNT = 1/0,05 = 20. A redução relativa do risco seria de 25%.","tema":"estudos-epidemiologicos","subtema":"estudos-epidemiologicos.medidas-de-associacao-e-de-efeito","especialidade":"epidemiologia","disciplina":"Epidemiologia","dificuldade":3,"fonte":"autoral"},{"id":"res-33d4cacf","area":"Medicina Preventiva","enunciado":"Num estudo caso-controle, entre 100 casos, 60 foram expostos ao fator; entre 100 controles, 30 foram expostos. A medida de associação adequada e seu valor são:","alternativas":["Risco relativo de 2,0","Risco relativo de 3,5","Odds ratio de 2,0","Odds ratio de 3,5","Incidência de 60% nos expostos"],"correta":3,"explicacao":"No caso-controle não se calcula incidência nem risco relativo; usa-se a odds ratio = (60 × 70)/(40 × 30) = 4.200/1.200 = 3,5.","tema":"estudos-epidemiologicos","subtema":"estudos-epidemiologicos.medidas-de-associacao-e-de-efeito","especialidade":"epidemiologia","disciplina":"Epidemiologia","dificuldade":3,"fonte":"autoral"},{"id":"res-8ce34aec","area":"Medicina Preventiva","enunciado":"Um novo tratamento prolonga a sobrevida de pacientes com uma doença crônica, mas não a cura. Mantida a incidência, espera-se que a prevalência:","alternativas":["Diminua","Permaneça inalterada","Caia a zero","Iguale-se à incidência","Aumente"],"correta":4,"explicacao":"Em situação estável, prevalência ≈ incidência × duração média da doença. Prolongar a sobrevida sem curar aumenta a duração e, portanto, a prevalência.","tema":"medidas-de-frequencia-e-indicadores","subtema":"medidas-de-frequencia-e-indicadores.incidencia-e-prevalencia","especialidade":"epidemiologia","disciplina":"Epidemiologia","dificuldade":2,"fonte":"autoral"},{"id":"res-d440cf32","area":"Medicina Preventiva","enunciado":"Pesquisadores selecionam trabalhadores sem câncer de pulmão, classificam-nos como expostos ou não expostos ao amianto e os acompanham por 20 anos, comparando a incidência de câncer entre os grupos. O desenho do estudo é:","alternativas":["Coorte","Caso-controle","Transversal","Ecológico","Ensaio clínico randomizado"],"correta":0,"explicacao":"Partir da exposição em pessoas livres da doença e segui-las para medir a incidência define o estudo de coorte, que permite calcular o risco relativo. No caso-controle, parte-se da doença para investigar exposições passadas.","tema":"estudos-epidemiologicos","subtema":"estudos-epidemiologicos.estudos-de-coorte","especialidade":"epidemiologia","disciplina":"Epidemiologia","dificuldade":1,"fonte":"autoral"},{"id":"res-75c991a9","area":"Medicina Preventiva","enunciado":"Pela Lei 8.142/1990, a Conferência de Saúde, que avalia a situação de saúde e propõe diretrizes para a política de saúde, reúne-se:","alternativas":["Mensalmente, em caráter deliberativo permanente","A cada 4 anos, com representação dos vários segmentos sociais","A cada 2 anos, apenas com gestores","Anualmente, com membros indicados pelo Ministério da Saúde","Somente quando convocada pelo Congresso Nacional"],"correta":1,"explicacao":"A Lei 8.142/1990 define a Conferência de Saúde (a cada 4 anos) e o Conselho de Saúde (permanente e deliberativo), com representação paritária dos usuários em relação aos demais segmentos.","tema":"sus-principios-e-legislacao","subtema":"sus-principios-e-legislacao.lei-8-142-1990-e-controle-social","especialidade":"saude-publica-sus","disciplina":"Saúde Coletiva","dificuldade":2,"fonte":"autoral"},{"id":"res-2d9d331f","area":"Medicina Preventiva","enunciado":"Médico de família evita solicitar exames desnecessários a um paciente ansioso e assintomático, protegendo-o de sobrediagnóstico e intervenções excessivas. Esse é um exemplo de prevenção:","alternativas":["Primária","Secundária","Quaternária","Terciária","Primordial"],"correta":2,"explicacao":"A prevenção quaternária (Jamoulle) busca identificar pessoas em risco de medicalização excessiva e protegê-las de intervenções desnecessárias e de iatrogenia.","tema":"niveis-de-prevencao-e-rastreamento","subtema":"niveis-de-prevencao-e-rastreamento.prevencao-quaternaria","especialidade":"medicina-de-familia","disciplina":"Medicina de Família e Comunidade","dificuldade":2,"fonte":"autoral"},{"id":"res-f21c97df","area":"Medicina Preventiva","enunciado":"Um programa de rastreamento de câncer mostra maior sobrevida a partir do diagnóstico nos casos detectados no rastreamento, mas a mortalidade pela doença não muda. O viés que melhor explica o achado é:","alternativas":["Viés de memória","Viés de confusão por idade","Viés do entrevistador","Viés de tempo de antecipação (lead-time)","Viés de publicação"],"correta":3,"explicacao":"O rastreamento antecipa o diagnóstico, e o tempo de sobrevida medido a partir dele aumenta mesmo sem mudar a data do óbito. Por isso, o desfecho adequado para avaliar rastreamento é a mortalidade.","tema":"niveis-de-prevencao-e-rastreamento","subtema":"niveis-de-prevencao-e-rastreamento.vieses-do-rastreamento","especialidade":"epidemiologia","disciplina":"Epidemiologia","dificuldade":3,"fonte":"autoral"},{"id":"res-808bdcee","area":"Medicina Preventiva","enunciado":"Um município registrou, em um ano, 2.000 nascidos vivos, 30 óbitos de menores de 1 ano (12 deles no período neonatal) e 10 óbitos fetais. O coeficiente de mortalidade infantil é:","alternativas":["6 por 1.000 nascidos vivos","20 por 1.000 nascidos vivos","9 por 1.000 nascidos vivos","19,6 por 1.000 nascimentos","15 por 1.000 nascidos vivos"],"correta":4,"explicacao":"Coeficiente de mortalidade infantil = óbitos de menores de 1 ano / nascidos vivos × 1.000 = 30/2.000 × 1.000 = 15. Óbitos fetais não entram, e 12/2.000 = 6 seria o componente neonatal.","tema":"medidas-de-frequencia-e-indicadores","subtema":"medidas-de-frequencia-e-indicadores.mortalidade-infantil","especialidade":"epidemiologia","disciplina":"Epidemiologia","dificuldade":2,"fonte":"autoral"},{"id":"res-cfb7c225","area":"Clínica Médica","enunciado":"Homem de 28 anos é levado ao pronto-socorro pela família. Há 8 dias dorme 2 horas por noite sem sentir cansaço, fala sem parar, diz ter sido escolhido para “salvar a economia do país” e gastou todas as economias em compras. Nega uso de substâncias e exames clínicos são normais. É internado. O diagnóstico mais provável é:","alternativas":["Transtorno bipolar tipo II","Ciclotimia","Transtorno bipolar tipo I","Esquizofrenia","Transtorno de personalidade borderline"],"correta":2,"explicacao":"Episódio maníaco (humor expansivo e sintomas por pelo menos 7 dias ou com necessidade de internação) sem causa orgânica ou por substância define o transtorno bipolar tipo I pelo DSM-5, mesmo sem depressão prévia. No tipo II há hipomania, que por definição não exige internação nem causa prejuízo grave.","tema":"transtornos-do-humor","subtema":"transtornos-do-humor.transtorno-bipolar","especialidade":"psiquiatria","disciplina":"Psiquiatria","dificuldade":2,"fonte":"autoral"},{"id":"res-5eff446f","area":"Clínica Médica","enunciado":"Mulher de 45 anos com transtorno bipolar, estável em uso de carbonato de lítio há anos, inicia hidroclorotiazida para hipertensão. Duas semanas depois apresenta vômitos, diarreia, tremor grosseiro, ataxia e confusão mental. A hipótese mais provável é:","alternativas":["Intoxicação por lítio por redução da sua excreção renal","Síndrome serotoninérgica pela associação medicamentosa","Hipotireoidismo induzido pelo lítio","Síndrome neuroléptica maligna","Episódio misto do transtorno bipolar"],"correta":0,"explicacao":"Tiazídicos (assim como AINE e IECA) reduzem a depuração renal do lítio, cuja janela terapêutica é estreita; tremor grosseiro, sintomas gastrointestinais, ataxia e confusão são típicos da intoxicação. O manejo inclui suspender o lítio, dosar a litemia e hidratar.","tema":"transtornos-do-humor","subtema":"transtornos-do-humor.antidepressivos-e-estabilizadores-do-humor","especialidade":"psiquiatria","disciplina":"Psiquiatria","dificuldade":2,"fonte":"autoral"},{"id":"res-37df8d20","area":"Clínica Médica","enunciado":"Mulher de 26 anos relata crises súbitas e inesperadas de palpitação, falta de ar, tremores e medo de morrer, com pico em cerca de 10 minutos. Há 2 meses vive preocupada com novas crises e evita sair sozinha. ECG, TSH e glicemia são normais. O diagnóstico mais provável é:","alternativas":["Transtorno de ansiedade generalizada","Fobia específica","Transtorno de estresse pós-traumático","Transtorno de sintomas somáticos","Transtorno de pânico"],"correta":4,"explicacao":"Ataques de pânico recorrentes e inesperados seguidos por pelo menos 1 mês de preocupação com novas crises ou mudança de comportamento definem o transtorno de pânico (DSM-5), após exclusão de causas clínicas. Na ansiedade generalizada a preocupação é difusa e crônica, sem crises abruptas.","tema":"transtornos-de-ansiedade","subtema":"transtornos-de-ansiedade.transtorno-de-panico","especialidade":"psiquiatria","disciplina":"Psiquiatria","dificuldade":1,"fonte":"autoral"},{"id":"res-eb0e38a8","area":"Clínica Médica","enunciado":"Homem de 38 anos refere que, há cerca de 1 ano, na maioria dos dias, vive preocupado com trabalho, saúde e finanças, sem conseguir controlar os pensamentos. Queixa-se de tensão muscular, inquietação, cansaço fácil e sono ruim, sem crises súbitas. Não usa substâncias. O diagnóstico mais provável é:","alternativas":["Transtorno de pânico","Transtorno de ansiedade generalizada","Transtorno obsessivo-compulsivo","Fobia social","Transtorno de adaptação"],"correta":1,"explicacao":"Preocupação excessiva e difícil de controlar, na maioria dos dias por pelo menos 6 meses, associada a sintomas como tensão muscular, inquietação, fadiga e insônia, caracteriza a ansiedade generalizada no DSM-5. Não há ataques de pânico, obsessões/compulsões nem estressor delimitado.","tema":"transtornos-de-ansiedade","subtema":"transtornos-de-ansiedade.transtorno-de-ansiedade-generalizada","especialidade":"psiquiatria","disciplina":"Psiquiatria","dificuldade":1,"fonte":"autoral"},{"id":"res-8d33af6d","area":"Clínica Médica","enunciado":"Homem de 30 anos com esquizofrenia recebeu doses repetidas de haloperidol por agitação. No dia seguinte apresenta febre de 40 °C, rigidez muscular generalizada “em cano de chumbo”, rebaixamento do nível de consciência, sudorese, PA lábil e CPK muito elevada. O diagnóstico mais provável é:","alternativas":["Síndrome serotoninérgica","Hipertermia maligna","Distonia aguda","Síndrome neuroléptica maligna","Catatonia não maligna"],"correta":3,"explicacao":"Febre, rigidez intensa, alteração de consciência, disautonomia e CPK elevada após antagonista dopaminérgico caracterizam a síndrome neuroléptica maligna, que exige suspensão do antipsicótico e suporte intensivo. A síndrome serotoninérgica cursa com clônus e hiper-reflexia, e a hipertermia maligna ocorre com halogenados e succinilcolina.","tema":"esquizofrenia-e-psicoses","subtema":"esquizofrenia-e-psicoses.antipsicoticos","especialidade":"psiquiatria","disciplina":"Psiquiatria","dificuldade":2,"fonte":"autoral"},{"id":"res-1316bbc2","area":"Clínica Médica","enunciado":"Homem de 52 anos, etilista pesado e desnutrido, chega confuso, com marcha atáxica de base alargada e oftalmoplegia (nistagmo e paresia do olhar lateral). Glicemia capilar de 90 mg/dL. A conduta imediata mais adequada é:","alternativas":["Glicose hipertônica endovenosa isolada, sem outras medidas","Haloperidol intramuscular para controle da confusão","Tiamina parenteral, antes de qualquer oferta de glicose","Flumazenil endovenoso","Aguardar ressonância de crânio para iniciar o tratamento"],"correta":2,"explicacao":"A tríade confusão, ataxia e oftalmoplegia em etilista sugere encefalopatia de Wernicke, por deficiência de tiamina, cujo tratamento é tiamina parenteral imediata. Oferecer glicose sem tiamina pode precipitar ou agravar o quadro, e o diagnóstico é clínico, sem necessidade de aguardar imagem.","tema":"dependencia-quimica","subtema":"dependencia-quimica.alcool","especialidade":"psiquiatria","disciplina":"Psiquiatria","dificuldade":2,"fonte":"autoral"},{"id":"res-ca20e083","area":"Clínica Médica","enunciado":"Homem de 55 anos, internado para cirurgia eletiva, apresenta no terceiro dia de internação agitação, desorientação, alucinações visuais, tremores, sudorese, taquicardia e febre baixa. A esposa conta que ele bebe grande quantidade de destilado diariamente. O diagnóstico e o tratamento de base são:","alternativas":["Delirium tremens; benzodiazepínico","Alucinose alcoólica; haloperidol isolado","Encefalopatia hepática; lactulose","Esquizofrenia; antipsicótico de depósito","Síndrome de Korsakoff; tiamina oral isolada"],"correta":0,"explicacao":"O delirium tremens surge tipicamente 48 a 96 horas após a última dose de álcool, com delirium, alucinações e hiperatividade autonômica, e é tratado com benzodiazepínicos, além de suporte e tiamina. Na alucinose alcoólica o sensório está preservado e não há disautonomia importante.","tema":"dependencia-quimica","subtema":"dependencia-quimica.sindromes-de-abstinencia","especialidade":"psiquiatria","disciplina":"Psiquiatria","dificuldade":2,"fonte":"autoral"},{"id":"res-219c7c92","area":"Clínica Médica","enunciado":"Mulher de 42 anos com dor e edema há 4 meses em punhos, metacarpofalângicas e interfalângicas proximais de ambas as mãos, com rigidez matinal de 2 horas. As interfalângicas distais estão poupadas e não há lesões de pele. O diagnóstico mais provável é:","alternativas":["Osteoartrite nodal das mãos","Artrite psoriásica","Gota tofácea crônica","Artrite reativa","Artrite reumatoide"],"correta":4,"explicacao":"Poliartrite simétrica de pequenas articulações das mãos (punhos, MCF e IFP), com rigidez matinal prolongada e poupando as IFD, é o padrão clássico da artrite reumatoide. A osteoartrite e a artrite psoriásica acometem tipicamente as IFD, e a artrite reativa costuma ser oligoarticular de membros inferiores.","tema":"artrite-reumatoide","subtema":"artrite-reumatoide.quadro-clinico","especialidade":"reumatologia","disciplina":"Reumatologia","dificuldade":1,"fonte":"autoral"},{"id":"res-4a9e7b67","area":"Clínica Médica","enunciado":"Na investigação de uma poliartrite simétrica de pequenas articulações, o autoanticorpo de maior especificidade para artrite reumatoide, também associado a doença mais erosiva, é o:","alternativas":["Fator reumatoide","Anti-peptídeo citrulinado cíclico (anti-CCP)","Fator antinuclear (FAN)","Anti-DNA de dupla hélice","Anticorpo anticitoplasma de neutrófilo (ANCA)"],"correta":1,"explicacao":"O anti-CCP tem especificidade em torno de 95% para artrite reumatoide e se associa a pior prognóstico erosivo. O fator reumatoide é menos específico, aparecendo em outras doenças autoimunes, infecções crônicas e idosos.","tema":"artrite-reumatoide","subtema":"artrite-reumatoide.diagnostico","especialidade":"reumatologia","disciplina":"Reumatologia","dificuldade":1,"fonte":"autoral"},{"id":"res-f2873de2","area":"Clínica Médica","enunciado":"Mulher de 40 anos recebe diagnóstico de artrite reumatoide ativa, sem contraindicações a medicamentos. Qual a droga modificadora do curso da doença (DMCD) considerada âncora do tratamento inicial?","alternativas":["Anti-TNF antes de qualquer DMCD sintética","Ciclofosfamida endovenosa","AINE isolado até surgirem erosões","Metotrexato","Azatioprina"],"correta":3,"explicacao":"O metotrexato é a DMCD sintética de primeira escolha na artrite reumatoide, devendo ser iniciado precocemente para evitar dano articular. Biológicos como os anti-TNF são reservados, em geral, à falha das DMCD sintéticas, e AINE não modificam a evolução da doença.","tema":"artrite-reumatoide","subtema":"artrite-reumatoide.tratamento","especialidade":"reumatologia","disciplina":"Reumatologia","dificuldade":2,"fonte":"autoral"},{"id":"res-6564280f","area":"Clínica Médica","enunciado":"No lúpus eritematoso sistêmico, qual autoanticorpo é altamente específico e costuma ter títulos que acompanham a atividade da doença, especialmente da nefrite?","alternativas":["Anti-Sm","Fator antinuclear (FAN)","Anti-DNA de dupla hélice","Anti-histona","Anti-Ro (SS-A)"],"correta":2,"explicacao":"O anti-dsDNA é específico para o LES e seus títulos se correlacionam com a atividade, sobretudo renal. O anti-Sm é o mais específico, mas não varia com a atividade; o FAN é sensível e pouco específico, e o anti-histona se associa ao lúpus induzido por fármacos.","tema":"lupus-eritematoso-sistemico","subtema":"lupus-eritematoso-sistemico.autoanticorpos","especialidade":"reumatologia","disciplina":"Reumatologia","dificuldade":2,"fonte":"autoral"},{"id":"res-2db73de3","area":"Clínica Médica","enunciado":"Homem de 65 anos, em uso de hidralazina há 1 ano, apresenta artralgias, febre baixa e dor pleurítica. Função renal e sedimento urinário normais, sem alterações neurológicas. FAN positivo e anti-DNA de dupla hélice negativo. O diagnóstico mais provável e o anticorpo que o reforça são:","alternativas":["Lúpus induzido por fármaco; anti-histona","Lúpus sistêmico idiopático; anti-Sm","Artrite reumatoide; anti-CCP","Síndrome de Sjögren; anti-La (SS-B)","Esclerose sistêmica; anticentrômero"],"correta":0,"explicacao":"Hidralazina, procainamida e isoniazida são causas clássicas de lúpus induzido por fármacos, com artrite, serosite, FAN e anti-histona positivos e raro envolvimento renal ou neurológico. O quadro regride com a suspensão do fármaco.","tema":"lupus-eritematoso-sistemico","subtema":"lupus-eritematoso-sistemico.autoanticorpos","especialidade":"reumatologia","disciplina":"Reumatologia","dificuldade":2,"fonte":"autoral"},{"id":"res-8b212161","area":"Clínica Médica","enunciado":"Mulher de 24 anos com eritema malar, artrite e úlceras orais evolui com edema, hipertensão, proteinúria e hematúria com cilindros hemáticos. Qual achado laboratorial é esperado nessa situação de atividade renal?","alternativas":["Complemento C3 e C4 elevados","Anti-membrana basal glomerular positivo","ANCA com padrão citoplasmático (c-ANCA)","ASLO elevada com C3 normal","Consumo de complemento, com C3 e C4 reduzidos"],"correta":4,"explicacao":"A nefrite lúpica é mediada por imunocomplexos, que consomem complemento; C3 e C4 baixos, junto a anti-dsDNA elevado, indicam atividade. Anti-MBG e ANCA sugerem outras glomerulonefrites, e a pós-estreptocócica cursa com C3 baixo.","tema":"lupus-eritematoso-sistemico","subtema":"lupus-eritematoso-sistemico.nefrite-lupica","especialidade":"reumatologia","disciplina":"Reumatologia","dificuldade":2,"fonte":"autoral"},{"id":"res-dd635f90","area":"Clínica Médica","enunciado":"Homem de 32 anos com sangramento gengival e equimoses. Hemograma com pancitopenia, fibrinogênio baixo, TP e TTPa prolongados e D-dímero elevado. No sangue periférico há promielócitos atípicos com múltiplos bastonetes de Auer. Além do suporte transfusional, a medida específica a iniciar já na suspeita é:","alternativas":["Imatinibe (inibidor de tirosinoquinase)","Ácido all-trans-retinoico (ATRA)","Rituximabe (anti-CD20)","Hidroxiureia isolada","Heparina em dose plena"],"correta":1,"explicacao":"Promielócitos com múltiplos bastonetes de Auer e coagulação intravascular disseminada sugerem leucemia promielocítica aguda, ligada à t(15;17) (PML-RARA). O ATRA induz diferenciação dos promielócitos e deve ser iniciado já na suspeita, pois reduz a mortalidade hemorrágica precoce.","tema":"leucemias","subtema":"leucemias.leucemias-agudas","especialidade":"oncologia","disciplina":"Hematologia","dificuldade":3,"fonte":"autoral"},{"id":"res-37559888","area":"Clínica Médica","enunciado":"Homem de 50 anos com fadiga e desconforto em hipocôndrio esquerdo. Baço palpável a 10 cm do rebordo. Leucócitos de 150.000/mm³ com todas as formas da série granulocítica, basofilia e poucos blastos. A alteração genética que define o diagnóstico mais provável é:","alternativas":["t(15;17), com fusão PML-RARA","t(8;14), com ativação de MYC","Mutação pontual JAK2 V617F","t(9;22), cromossomo Philadelphia (BCR-ABL1)","t(14;18), com superexpressão de BCL2"],"correta":3,"explicacao":"Leucocitose com desvio escalonado até mielócitos, basofilia e esplenomegalia volumosa sugerem leucemia mieloide crônica, definida pela t(9;22) que gera a tirosinoquinase BCR-ABL1, alvo dos inibidores como o imatinibe. A t(15;17) é da leucemia promielocítica, a t(8;14) do Burkitt e a t(14;18) do linfoma folicular.","tema":"leucemias","subtema":"leucemias.leucemias-cronicas","especialidade":"oncologia","disciplina":"Hematologia","dificuldade":2,"fonte":"autoral"},{"id":"res-6a3e1d58","area":"Clínica Médica","enunciado":"Homem de 22 anos com linfonodos cervicais indolores há 3 meses, prurido e massa mediastinal anterior. A biópsia mostra células grandes binucleadas com nucléolos proeminentes (aspecto em “olhos de coruja”), CD15 e CD30 positivas, em meio a infiltrado inflamatório. O diagnóstico é:","alternativas":["Linfoma de Burkitt","Leucemia linfocítica crônica","Linfoma de Hodgkin clássico","Linfoma folicular","Tuberculose ganglionar"],"correta":2,"explicacao":"Células de Reed-Sternberg (binucleadas, CD15+ e CD30+) em fundo inflamatório reativo caracterizam o linfoma de Hodgkin clássico, com pico em adultos jovens e acometimento cervical e mediastinal. O Burkitt mostra padrão em “céu estrelado”, e o folicular predomina em idosos.","tema":"linfomas","subtema":"linfomas.linfoma-de-hodgkin","especialidade":"oncologia","disciplina":"Hematologia","dificuldade":2,"fonte":"autoral"},{"id":"res-3b63ce8d","area":"Clínica Médica","enunciado":"Mulher de 48 anos teve lesão pigmentada assimétrica do dorso excisada; o anatomopatológico revelou melanoma extensivo superficial, sem metástases clínicas. O principal fator prognóstico do tumor primário localizado é:","alternativas":["A espessura tumoral de Breslow","O diâmetro clínico da lesão","A cor predominante da lesão","O nível de invasão de Clark","A localização no tronco"],"correta":0,"explicacao":"No melanoma localizado, a espessura de Breslow (em milímetros, da camada granulosa ao ponto mais profundo) é o principal fator prognóstico e base do estadiamento T, orientando margens e pesquisa de linfonodo sentinela. O nível de Clark perdeu importância prognóstica em relação ao Breslow.","tema":"cancer-de-pele","subtema":"cancer-de-pele.melanoma","especialidade":"oncologia","disciplina":"Dermatologia","dificuldade":2,"fonte":"autoral"},{"id":"res-970c4d2b","area":"Clínica Médica","enunciado":"Homem de 68 anos com astenia e anemia microcítica e hipocrômica, ferritina baixa, sem sangramento visível e sem outras queixas. Qual é a investigação mais adequada?","alternativas":["Reposição de ferro e novo hemograma em 6 meses","Dosagem de CEA como exame diagnóstico","Pesquisa de sangue oculto e, se negativa, encerrar","Ultrassonografia de abdome como exame único","Colonoscopia, associada à endoscopia digestiva alta"],"correta":4,"explicacao":"Anemia ferropriva em homem ou mulher pós-menopausa impõe investigação do trato digestivo, sobretudo por neoplasia de cólon direito, que sangra de forma oculta. O CEA não serve para diagnóstico, sendo útil no seguimento, e um teste de sangue oculto negativo não exclui a lesão.","tema":"cancer-colorretal","subtema":"cancer-colorretal.diagnostico-e-estadiamento","especialidade":"oncologia","disciplina":"Gastroenterologia","dificuldade":1,"fonte":"autoral"},{"id":"res-b046893f","area":"Clínica Médica","enunciado":"Mulher de 55 anos com nódulo palpável endurecido na mama direita. A mamografia mostra massa espiculada classificada como BI-RADS 5. A conduta seguinte é:","alternativas":["Nova mamografia em 6 meses","Biópsia percutânea por agulha grossa (core biopsy)","Mastectomia sem diagnóstico histológico prévio","Dosagem de CA 15-3 para confirmar","Ultrassonografia anual de controle"],"correta":1,"explicacao":"BI-RADS 5 indica alta suspeita de malignidade e exige confirmação histológica, preferencialmente por biópsia percutânea com agulha grossa, antes de qualquer tratamento definitivo. Controle em 6 meses é conduta de BI-RADS 3, e marcadores tumorais não fazem diagnóstico.","tema":"cancer-de-mama","subtema":"cancer-de-mama.diagnostico","especialidade":"oncologia","disciplina":"Ginecologia e Obstetrícia","dificuldade":1,"fonte":"autoral"},{"id":"res-dfd94a7b","area":"Cirurgia","enunciado":"Mulher de 74 anos, diabética, não gestante e sem procedimento urológico programado, faz urocultura de rotina que mostra 10⁵ UFC/mL de Escherichia coli. Está sem febre, disúria ou outros sintomas. A conduta adequada é:","alternativas":["Antibiótico por 7 dias, por ser diabética","Antibiótico por 3 dias e urocultura de controle","Profilaxia antibiótica contínua por 6 meses","Não tratar a bacteriúria","Ultrassonografia de vias urinárias e antibiótico venoso"],"correta":3,"explicacao":"Bacteriúria assintomática é comum em idosas e diabéticas e seu tratamento não reduz complicações, apenas favorece resistência e efeitos adversos. Rastrear e tratar é indicado sobretudo na gestação e antes de procedimentos urológicos com sangramento de mucosa.","tema":"infeccao-do-trato-urinario","subtema":"infeccao-do-trato-urinario.bacteriuria-assintomatica","especialidade":"urologia","disciplina":"Urologia","dificuldade":2,"fonte":"autoral"},{"id":"res-d9900181","area":"Cirurgia","enunciado":"Homem de 35 anos com dor lombar em cólica intensa irradiada para a região inguinal e hematúria microscópica. O exame de imagem com maior sensibilidade e especificidade para confirmar litíase urinária é:","alternativas":["Radiografia simples de abdome","Urografia excretora","Tomografia computadorizada sem contraste","Tomografia com contraste em fase arterial","Cintilografia renal com DMSA"],"correta":2,"explicacao":"A tomografia sem contraste detecta praticamente todos os cálculos, inclusive os radiotransparentes, e mostra sinais de obstrução, sendo o padrão-ouro. A radiografia não vê cálculos de ácido úrico, e o contraste pode mascarar cálculos.","tema":"litiase-urinaria","subtema":"litiase-urinaria.diagnostico-por-imagem","especialidade":"urologia","disciplina":"Urologia","dificuldade":1,"fonte":"autoral"},{"id":"res-124662ea","area":"Cirurgia","enunciado":"Mulher de 40 anos com cálculo de 8 mm no ureter proximal esquerdo e hidronefrose apresenta febre de 39 °C, calafrios, taquicardia e hipotensão. A conduta mais adequada é:","alternativas":["Antibiótico e desobstrução urgente por cateter duplo J ou nefrostomia","Litotripsia extracorpórea por ondas de choque imediata","Antibiótico oral, analgesia e alta com retorno ambulatorial","Terapia expulsiva com alfabloqueador e reavaliação em 4 semanas","Nefrectomia de urgência"],"correta":0,"explicacao":"Cálculo obstrutivo com infecção é emergência urológica: além do antibiótico, a via urinária deve ser descomprimida de imediato (duplo J ou nefrostomia percutânea). O tratamento definitivo do cálculo é adiado até o controle da infecção.","tema":"litiase-urinaria","subtema":"litiase-urinaria.tratamento","especialidade":"urologia","disciplina":"Urologia","dificuldade":2,"fonte":"autoral"},{"id":"res-3a6a2155","area":"Cirurgia","enunciado":"Homem de 70 anos com sintomas do trato urinário inferior por hiperplasia prostática benigna e próstata de cerca de 70 g. Qual classe de medicamento reduz o volume prostático e o risco de retenção urinária aguda e de cirurgia ao longo do tempo?","alternativas":["Alfabloqueadores","Antimuscarínicos","Agonistas beta-3 adrenérgicos","Diuréticos tiazídicos","Inibidores da 5-alfa-redutase"],"correta":4,"explicacao":"Finasterida e dutasterida bloqueiam a conversão de testosterona em di-hidrotestosterona, reduzindo o volume prostático e a progressão da doença em próstatas volumosas. Os alfabloqueadores aliviam sintomas rapidamente ao relaxar a musculatura lisa, mas não reduzem a glândula.","tema":"doencas-da-prostata","subtema":"doencas-da-prostata.hiperplasia-prostatica-benigna","especialidade":"urologia","disciplina":"Urologia","dificuldade":2,"fonte":"autoral"},{"id":"res-3cada997","area":"Cirurgia","enunciado":"No toque retal de um homem de 66 anos palpa-se nódulo endurecido na próstata. O adenocarcinoma de próstata origina-se mais frequentemente na zona:","alternativas":["De transição","Periférica","Central","Estroma fibromuscular anterior","Periuretral"],"correta":1,"explicacao":"Cerca de 70% dos adenocarcinomas prostáticos surgem na zona periférica, posterolateral e acessível ao toque retal. A hiperplasia prostática benigna, por sua vez, origina-se na zona de transição, junto à uretra.","tema":"doencas-da-prostata","subtema":"doencas-da-prostata.cancer-de-prostata","especialidade":"urologia","disciplina":"Urologia","dificuldade":1,"fonte":"autoral"},{"id":"res-19f95f59","area":"Cirurgia","enunciado":"Motociclista com fratura exposta da tíbia após trauma de alta energia, ferida de 15 cm, extensa lesão de partes moles e lesão da artéria tibial anterior que exige reparo vascular para salvar o membro. Pela classificação de Gustilo e Anderson, essa fratura é do tipo:","alternativas":["I","II","IIIA","IIIC","IIIB"],"correta":3,"explicacao":"Na classificação de Gustilo e Anderson, o tipo III envolve lesão extensa de partes moles ou alta energia; é IIIC quando há lesão arterial que requer reparo. O IIIB exige cobertura com retalho por exposição óssea, e o IIIA tem cobertura adequada.","tema":"fraturas-e-luxacoes","subtema":"fraturas-e-luxacoes.fraturas-expostas","especialidade":"ortopedia","disciplina":"Ortopedia e Traumatologia","dificuldade":2,"fonte":"autoral"},{"id":"res-d1192c56","area":"Cirurgia","enunciado":"Homem de 25 anos, com fratura fechada da diáfise da tíbia imobilizada com gesso circular, refere dor intensa, desproporcional à lesão e refratária a analgésicos, que piora com a extensão passiva dos dedos. O pulso pedioso está presente. A conduta correta é:","alternativas":["Elevar bastante o membro acima do coração e reavaliar em 24 horas","Aumentar a dose de opioide e manter o gesso até o dia seguinte","Abrir o gesso e, confirmada a síndrome compartimental, fasciotomia","Aguardar a perda do pulso pedioso para confirmar o quadro","Arteriografia antes de qualquer outra medida"],"correta":2,"explicacao":"Dor desproporcional e à extensão passiva são sinais precoces da síndrome compartimental; a presença de pulso não a exclui, pois a ausência é tardia. Deve-se remover curativos e gesso constritivos, manter o membro na altura do coração e, se persistir, fazer fasciotomia de urgência.","tema":"fraturas-e-luxacoes","subtema":"fraturas-e-luxacoes.sindrome-compartimental","especialidade":"ortopedia","disciplina":"Ortopedia e Traumatologia","dificuldade":2,"fonte":"autoral"},{"id":"res-93deba7d","area":"Cirurgia","enunciado":"Após queda, adulto apresenta fratura da diáfise do úmero no terço médio-distal e não consegue estender o punho e os dedos (“mão caída”). O nervo provavelmente lesado é o:","alternativas":["Radial","Mediano","Ulnar","Axilar","Musculocutâneo"],"correta":0,"explicacao":"O nervo radial passa no sulco espiral do úmero e é o mais lesado nas fraturas diafisárias, gerando queda do punho por paralisia dos extensores. A maioria dessas neuropraxias se recupera espontaneamente.","tema":"fraturas-e-luxacoes","subtema":"fraturas-e-luxacoes.lesoes-neurovasculares-associadas","especialidade":"ortopedia","disciplina":"Ortopedia e Traumatologia","dificuldade":1,"fonte":"autoral"},{"id":"res-591044b0","area":"Cirurgia","enunciado":"Jovem sofre luxação anterior do ombro durante partida de vôlei. Antes e depois da redução, deve-se testar a sensibilidade da face lateral do ombro (região do deltoide), pois o nervo mais frequentemente lesado nessa luxação é o:","alternativas":["Radial","Musculocutâneo","Supraescapular","Torácico longo","Axilar"],"correta":4,"explicacao":"O nervo axilar contorna o colo cirúrgico do úmero e é estirado na luxação anterior do ombro, causando hipoestesia na face lateral do ombro e fraqueza do deltoide. Por isso o exame neurológico deve ser registrado antes e após a redução.","tema":"fraturas-e-luxacoes","subtema":"fraturas-e-luxacoes.lesoes-neurovasculares-associadas","especialidade":"ortopedia","disciplina":"Ortopedia e Traumatologia","dificuldade":1,"fonte":"autoral"},{"id":"res-3f2fd06f","area":"Cirurgia","enunciado":"Criança de 10 anos cai sobre a mão espalmada. A radiografia mostra traço de fratura que percorre parte da placa de crescimento do rádio distal e sai pela metáfise, deixando um fragmento metafisário triangular. Pela classificação de Salter-Harris, trata-se do tipo:","alternativas":["I","II","III","IV","V"],"correta":1,"explicacao":"O tipo II de Salter-Harris atravessa a fise e sai pela metáfise (fragmento de Thurston-Holland), sendo o mais comum. O tipo I é só pela fise, o III sai pela epífise, o IV cruza epífise, fise e metáfise, e o V é compressão da fise.","tema":"fraturas-e-luxacoes","subtema":"fraturas-e-luxacoes.principios-de-classificacao","especialidade":"ortopedia","disciplina":"Ortopedia e Traumatologia","dificuldade":2,"fonte":"autoral"},{"id":"res-a92b77d1","area":"Clínica Médica","enunciado":"Mulher de 45 anos com cefaleia súbita, de máxima intensidade em segundos (“a pior da vida”), durante esforço, seguida de vômitos e rigidez de nuca. Exame neurológico sem déficits focais. A investigação inicial adequada é:","alternativas":["Ressonância com contraste em regime ambulatorial eletivo","Analgesia e alta com diagnóstico de enxaqueca","Eletroencefalograma","TC de crânio sem contraste e, se normal, punção lombar","Punção lombar antes de qualquer exame de imagem"],"correta":3,"explicacao":"Cefaleia em trovoada sugere hemorragia subaracnoide, cuja investigação começa pela TC sem contraste, mais sensível nas primeiras horas. Se a TC for normal e a suspeita persistir, a punção lombar busca xantocromia ou sangue.","tema":"cefaleias","subtema":"cefaleias.cefaleias-secundarias","especialidade":"neurologia","disciplina":"Neurologia","dificuldade":2,"fonte":"autoral"},{"id":"res-1ba190c7","area":"Clínica Médica","enunciado":"Homem de 30 anos apresenta crise tônico-clônica generalizada que já dura 7 minutos. Após proteger as vias aéreas, oferecer oxigênio e checar a glicemia, a primeira medicação indicada é:","alternativas":["Fenitoína endovenosa como primeira droga","Fenobarbital como primeira droga","Benzodiazepínico, como diazepam ou midazolam","Haloperidol intramuscular","Carbamazepina por sonda nasogástrica"],"correta":2,"explicacao":"Crise que dura mais de 5 minutos já é tratada como estado de mal epiléptico, e benzodiazepínicos são a primeira linha por sua ação rápida. Fenitoína ou outros anticonvulsivantes endovenosos entram em seguida se a crise persistir.","tema":"epilepsia","subtema":"epilepsia.estado-de-mal-epileptico","especialidade":"neurologia","disciplina":"Neurologia","dificuldade":1,"fonte":"autoral"},{"id":"res-2eff2062","area":"Clínica Médica","enunciado":"Homem de 70 anos apresenta, de forma súbita, fraqueza e hipoestesia predominantes no membro inferior direito, com face e membro superior pouco acometidos, além de apatia. O território arterial mais provavelmente acometido é o da artéria:","alternativas":["Cerebral anterior esquerda","Cerebral média esquerda","Cerebral anterior direita","Cerebral posterior esquerda","Basilar"],"correta":0,"explicacao":"A artéria cerebral anterior irriga a face medial do lobo frontal e parietal, onde está representado o membro inferior; sua oclusão causa déficit crural contralateral e alterações comportamentais como abulia. Na cerebral média predomina o déficit faciobraquial, com afasia se o hemisfério for o dominante.","tema":"acidente-vascular-cerebral","subtema":"acidente-vascular-cerebral.avc-isquemico","especialidade":"neurologia","disciplina":"Neurologia","dificuldade":2,"fonte":"autoral"},{"id":"res-643e9078","area":"Clínica Médica","enunciado":"Homem de 40 anos apresenta sete manchas hipocrômicas no tronco e nos membros, com perda de sensibilidade térmica e dolorosa. A baciloscopia de raspado intradérmico é negativa. Pela classificação operacional do Ministério da Saúde, o caso é:","alternativas":["Paucibacilar, pela baciloscopia negativa","Paucibacilar, por não haver nervo espessado","Indeterminado, sem classificação operacional","Multibacilar apenas se a biópsia confirmar","Multibacilar, pelo número de lesões"],"correta":4,"explicacao":"Na classificação operacional, mais de cinco lesões de pele definem o caso como multibacilar, assim como a baciloscopia positiva em qualquer número de lesões. Uma baciloscopia negativa não torna o caso paucibacilar quando há mais de cinco lesões.","tema":"hanseniase","subtema":"hanseniase.classificacao","especialidade":"dermatologia","disciplina":"Dermatologia","dificuldade":2,"fonte":"autoral"},{"id":"res-227c3fbb","area":"Clínica Médica","enunciado":"Homem de 68 anos, agricultor, com lesão de crescimento lento há 2 anos no canto interno do olho: pápula de brilho perolado, com telangiectasias na superfície e ulceração central. Sem linfonodos palpáveis. O diagnóstico mais provável é:","alternativas":["Carcinoma espinocelular","Carcinoma basocelular","Melanoma nodular","Ceratose seborreica","Ceratoacantoma"],"correta":1,"explicacao":"Pápula perolada com telangiectasias e úlcera central em área fotoexposta é típica do carcinoma basocelular, o câncer de pele mais comum, localmente invasivo e com metástase rara. O espinocelular costuma ser ceratótico, crescer mais rápido e surgir sobre ceratoses actínicas.","tema":"cancer-de-pele","subtema":"cancer-de-pele.carcinoma-basocelular","especialidade":"dermatologia","disciplina":"Dermatologia","dificuldade":1,"fonte":"autoral"},{"id":"res-b2a73841","area":"Clínica Médica","enunciado":"Trabalhador rural de 30 anos, após atividade em área de mata, apresenta há 2 meses úlcera indolor na perna, arredondada, de bordas elevadas e endurecidas “em moldura” e fundo granuloso avermelhado. O diagnóstico mais provável é:","alternativas":["Esporotricose","Cancro duro da sífilis","Úlcera venosa","Leishmaniose tegumentar","Pioderma gangrenoso"],"correta":3,"explicacao":"Úlcera indolor, com bordas elevadas em moldura e fundo granuloso, em pessoa exposta a área de mata, é o quadro clássico da leishmaniose cutânea, transmitida por flebotomíneos. A esporotricose forma nódulos em trajeto linfático, e o cancro duro é genital e regride espontaneamente.","tema":"leishmaniose","subtema":"leishmaniose.leishmaniose-tegumentar","especialidade":"dermatologia","disciplina":"Dermatologia","dificuldade":1,"fonte":"autoral"},{"id":"res-79e60130","area":"Clínica Médica","enunciado":"Profissional de saúde apresenta sorologia para hepatite B com HBsAg não reagente, anti-HBc total não reagente e anti-HBs reagente. A interpretação é:","alternativas":["Imunidade por infecção passada","Infecção aguda em janela imunológica","Imunidade por vacinação","Infecção crônica","Suscetível à infecção"],"correta":2,"explicacao":"Anti-HBs isolado, sem anti-HBc, indica imunidade conferida pela vacina, que contém apenas o antígeno de superfície. Na imunidade por infecção prévia, o anti-HBc total também é reagente.","tema":"hepatites-virais","subtema":"hepatites-virais.marcadores-sorologicos","especialidade":"gastroenterologia","disciplina":"Gastroenterologia","dificuldade":1,"fonte":"autoral"},{"id":"res-809ad5e9","area":"Clínica Médica","enunciado":"Homem de 58 anos com cirrose alcoólica e ascite apresenta febre baixa, dor abdominal difusa e confusão leve. Paracentese diagnóstica: 480 polimorfonucleares/mm³, cultura em andamento. O diagnóstico é:","alternativas":["Peritonite bacteriana espontânea","Peritonite bacteriana secundária","Ascite neutrocítica afastada pela cultura","Bacterascite monomicrobiana","Ascite quilosa"],"correta":0,"explicacao":"Contagem de polimorfonucleares de 250/mm³ ou mais no líquido ascítico, sem foco cirúrgico, confirma peritonite bacteriana espontânea, e o antibiótico deve ser iniciado sem aguardar a cultura. Bacterascite é cultura positiva com menos de 250 polimorfonucleares/mm³.","tema":"cirrose-hepatica","subtema":"cirrose-hepatica.ascite-e-peritonite-bacteriana-espontanea","especialidade":"gastroenterologia","disciplina":"Gastroenterologia","dificuldade":2,"fonte":"autoral"},{"id":"res-1e78b165","area":"Clínica Médica","enunciado":"Homem de 60 anos com pirose há mais de 10 anos faz endoscopia com área de mucosa de cor salmão acima da junção esofagogástrica. A biópsia que confirma esôfago de Barrett mostra:","alternativas":["Epitélio escamoso com eosinófilos abundantes","Displasia de alto grau obrigatória","Hiperplasia de células basais apenas","Adenocarcinoma invasivo","Metaplasia intestinal com células caliciformes"],"correta":4,"explicacao":"O esôfago de Barrett é a substituição do epitélio escamoso por epitélio colunar com metaplasia intestinal (células caliciformes), consequência do refluxo crônico. É lesão precursora do adenocarcinoma de esôfago, e a displasia pode ou não estar presente.","tema":"doenca-do-refluxo-e-ulcera-peptica","subtema":"doenca-do-refluxo-e-ulcera-peptica.esofago-de-barrett","especialidade":"gastroenterologia","disciplina":"Gastroenterologia","dificuldade":2,"fonte":"autoral"},{"id":"res-7fe62faf","area":"Clínica Médica","enunciado":"Mulher de 50 anos, vegana estrita há 15 anos sem suplementação, com fadiga, parestesias em pés e perda da sensibilidade vibratória e proprioceptiva. Hemograma com anemia macrocítica e neutrófilos hipersegmentados. O diagnóstico mais provável é:","alternativas":["Deficiência de ácido fólico","Deficiência de vitamina B12","Anemia ferropriva","Anemia de doença crônica","Anemia hemolítica autoimune"],"correta":1,"explicacao":"Anemia megaloblástica com acometimento dos cordões posteriores aponta para deficiência de B12, que existe apenas em alimentos de origem animal. A deficiência de folato causa a mesma anemia, mas não a lesão neurológica; na de B12, ácido metilmalônico e homocisteína estão elevados.","tema":"anemias","subtema":"anemias.anemias-megaloblasticas","especialidade":"hematologia","disciplina":"Hematologia","dificuldade":2,"fonte":"autoral"},{"id":"res-8ea43ec2","area":"Clínica Médica","enunciado":"Menino de 3 anos com hemartroses de repetição no joelho e hematomas musculares após pequenos traumas. Tio materno com quadro semelhante. Plaquetas normais, TP normal e TTPa prolongado. O diagnóstico mais provável é:","alternativas":["Deficiência de fator VII","Deficiência de vitamina K","Púrpura trombocitopênica imune","Deficiência de fator VIII","Trombastenia de Glanzmann"],"correta":3,"explicacao":"Sangramentos profundos (hemartroses, hematomas), herança ligada ao X e TTPa prolongado isolado sugerem hemofilia A, por deficiência de fator VIII. A deficiência de fator VII prolonga só o TP, a de vitamina K prolonga o TP, e os distúrbios plaquetários causam sangramento mucocutâneo.","tema":"hemostasia-e-coagulopatias","subtema":"hemostasia-e-coagulopatias.hemofilias","especialidade":"hematologia","disciplina":"Hematologia","dificuldade":1,"fonte":"autoral"},{"id":"res-229be15d","area":"Clínica Médica","enunciado":"Adolescente de 14 anos com icterícia intermitente, esplenomegalia e anemia. Mãe fez colecistectomia jovem por cálculos. Reticulocitose, CHCM elevado, esferócitos no sangue periférico, teste de Coombs direto negativo e fragilidade osmótica aumentada. O diagnóstico é:","alternativas":["Anemia hemolítica autoimune","Deficiência de G6PD","Esferocitose hereditária","Beta-talassemia menor","Anemia falciforme"],"correta":2,"explicacao":"Esferócitos com CHCM alto, fragilidade osmótica aumentada, Coombs negativo e história familiar caracterizam a esferocitose hereditária, defeito de proteínas da membrana (como espectrina e anquirina). Na hemólise autoimune também há esferócitos, mas o Coombs direto é positivo.","tema":"anemias","subtema":"anemias.anemias-hemoliticas","especialidade":"hematologia","disciplina":"Hematologia","dificuldade":2,"fonte":"autoral"}],"direito":[{"id":"dir-dc378632","area":"Constitucional","enunciado":"NÃO é cláusula pétrea (art. 60, §4º, CF):","alternativas":["Forma federativa de Estado","Voto direto, secreto, universal e periódico","Separação dos Poderes","Direitos e garantias individuais","Forma republicana de governo"],"correta":4,"explicacao":"A república não está no rol do art. 60, §4º (foi objeto do plebiscito de 1993).","disciplina":"Constitucional","dificuldade":1,"fonte":"autoral"},{"id":"dir-88cf9e94","area":"Constitucional","enunciado":"O remédio constitucional que protege a liberdade de locomoção é o:","alternativas":["Mandado de segurança","Habeas data","Habeas corpus","Mandado de injunção","Ação popular"],"correta":2,"explicacao":"Habeas corpus (art. 5º, LXVIII). Habeas data protege informações pessoais.","disciplina":"Constitucional","dificuldade":1,"fonte":"autoral"},{"id":"dir-bef15209","area":"Constitucional","enunciado":"Para conhecer ou retificar informações pessoais em bancos de dados públicos, cabe:","alternativas":["Habeas corpus","Habeas data","Ação civil pública","Mandado de injunção","Reclamação"],"correta":1,"explicacao":"Habeas data (art. 5º, LXXII, CF; Lei 9.507/1997).","disciplina":"Constitucional","dificuldade":1,"fonte":"autoral"},{"id":"dir-6b1671e3","area":"Civil","enunciado":"Após o Estatuto da Pessoa com Deficiência (Lei 13.146/2015), são absolutamente incapazes:","alternativas":["Os menores de 18 anos","Os ébrios habituais","Os menores de 16 anos","Os pródigos","As pessoas com deficiência mental"],"correta":2,"explicacao":"Art. 3º do CC: só os menores de 16 anos. Ébrios habituais e pródigos são relativamente incapazes (art. 4º).","disciplina":"Civil","dificuldade":1,"fonte":"autoral"},{"id":"dir-a223d292","area":"Civil","enunciado":"A menoridade civil cessa, em regra, aos:","alternativas":["16 anos","21 anos","18 anos","14 anos","Com o casamento aos 16"],"correta":2,"explicacao":"Art. 5º do CC: 18 anos completos. A emancipação é exceção.","disciplina":"Civil","dificuldade":1,"fonte":"autoral"},{"id":"dir-743b9371","area":"Penal","enunciado":"NÃO é excludente de ilicitude (art. 23, CP):","alternativas":["Legítima defesa","Estado de necessidade","Estrito cumprimento do dever legal","Exercício regular de direito","Coação moral irresistível"],"correta":4,"explicacao":"Coação moral irresistível exclui a culpabilidade (inexigibilidade de conduta diversa, art. 22).","disciplina":"Penal","dificuldade":1,"fonte":"autoral"},{"id":"dir-ec5bff20","area":"Penal","enunciado":"\"Não há crime sem lei anterior que o defina\" expressa o princípio da:","alternativas":["Insignificância","Legalidade (e anterioridade)","Culpabilidade","Intervenção mínima","Proporcionalidade"],"correta":1,"explicacao":"Art. 5º, XXXIX, CF e art. 1º, CP.","disciplina":"Penal","dificuldade":1,"fonte":"autoral"},{"id":"dir-e02d9936","area":"Processo Civil","enunciado":"No CPC/2015, os prazos processuais em dias são contados:","alternativas":["Em dias corridos","Somente em dias úteis","Em dias úteis só na Justiça Federal","Em horas","Excluindo apenas domingos"],"correta":1,"explicacao":"Art. 219 do CPC: contam-se apenas os dias úteis.","disciplina":"Processo Civil","dificuldade":1,"fonte":"autoral"},{"id":"dir-b4d50a67","area":"Administrativo","enunciado":"NÃO está expresso no caput do art. 37 da CF:","alternativas":["Legalidade","Impessoalidade","Moralidade","Razoabilidade","Eficiência"],"correta":3,"explicacao":"LIMPE: Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência. Razoabilidade é implícito.","disciplina":"Administrativo","dificuldade":1,"fonte":"autoral"},{"id":"dir-56817d1a","area":"Tributário","enunciado":"O tributo cuja obrigação independe de atividade estatal específica relativa ao contribuinte é o:","alternativas":["Imposto","Taxa","Contribuição de melhoria","Empréstimo compulsório","Pedágio"],"correta":0,"explicacao":"Art. 16 do CTN. Taxas e contribuições de melhoria são vinculadas a uma atuação estatal.","disciplina":"Tributário","dificuldade":2,"fonte":"autoral"},{"id":"dir-6cbe0dd8","area":"Ambiental","enunciado":"Legislar sobre florestas, fauna e proteção do meio ambiente é competência:","alternativas":["Privativa da União","Exclusiva dos Estados","Concorrente (União, Estados e DF)","Exclusiva dos Municípios","Residual dos Estados"],"correta":2,"explicacao":"Art. 24, VI, CF. A União edita normas gerais; os Estados suplementam. Municípios suplementam no interesse local (art. 30).","disciplina":"Ambiental","dificuldade":2,"fonte":"autoral"},{"id":"dir-2adeb60c","area":"Trabalho","enunciado":"O empregado adquire direito a férias após:","alternativas":["6 meses","12 meses de vigência do contrato","24 meses","3 meses","Qualquer período"],"correta":1,"explicacao":"Art. 130 da CLT: a cada 12 meses (período aquisitivo), até 30 dias, conforme faltas.","disciplina":"Trabalho","dificuldade":1,"fonte":"autoral"},{"id":"dir-775adf8a","area":"Introdução ao Direito","enunciado":"Salvo disposição em contrário, a lei começa a vigorar em todo o país:","alternativas":["45 dias depois de oficialmente publicada","Na data de sua publicação","30 dias depois de oficialmente publicada","90 dias depois de oficialmente publicada","3 meses depois de oficialmente publicada"],"correta":0,"explicacao":"Art. 1º da LINDB (Decreto-Lei 4.657/1942): vacatio legis de 45 dias, salvo disposição em contrário. No estrangeiro, quando admitida, a obrigatoriedade começa 3 meses depois (art. 1º, §1º).","disciplina":"Introdução ao Direito","dificuldade":1,"fonte":"autoral"},{"id":"dir-fc45fbed","area":"Introdução ao Direito","enunciado":"Quando a lei for omissa, o juiz decidirá o caso de acordo com:","alternativas":["A equidade, a doutrina e a jurisprudência","A analogia, os costumes e os princípios gerais de direito","Somente a analogia, vedado o uso dos costumes","O direito comparado e a doutrina majoritária","Nada, devendo extinguir o processo por ausência de lei"],"correta":1,"explicacao":"Art. 4º da LINDB. O juiz não se exime de decidir alegando lacuna (art. 140 do CPC).","disciplina":"Introdução ao Direito","dificuldade":1,"fonte":"autoral"},{"id":"dir-6927439f","area":"Introdução ao Direito","enunciado":"A Lei A foi revogada pela Lei B. Anos depois, a Lei C revogou a Lei B, sem dizer nada sobre a Lei A. Nessa situação, a Lei A:","alternativas":["Volta a vigorar automaticamente, pois a lei que a revogou deixou de existir","Volta a vigorar apenas se a Lei C for de mesma hierarquia","Não volta a vigorar, pois a repristinação só ocorre se houver disposição expressa","Volta a vigorar após nova vacatio legis de 45 dias","Volta a vigorar somente nos pontos não tratados pela Lei C"],"correta":2,"explicacao":"Art. 2º, §3º, da LINDB: salvo disposição em contrário, a lei revogada não se restaura por ter a lei revogadora perdido a vigência (vedação da repristinação tácita).","disciplina":"Introdução ao Direito","dificuldade":3,"fonte":"autoral"},{"id":"dir-91b927af","area":"Constitucional","enunciado":"Um casal de turistas franceses, que não está a serviço da França, tem um filho durante a viagem, em Manaus. Pela Constituição, a criança é:","alternativas":["Brasileira naturalizada","Estrangeira, pois os pais são franceses","Brasileira nata apenas se registrada em repartição brasileira e optar pela nacionalidade após a maioridade","Brasileira nata","Apátrida até completar 18 anos"],"correta":3,"explicacao":"Art. 12, I, 'a', da CF: são brasileiros natos os nascidos no Brasil, ainda que de pais estrangeiros, desde que estes não estejam a serviço de seu país (critério do ius soli).","disciplina":"Constitucional","dificuldade":2,"fonte":"autoral"},{"id":"dir-6389dd49","area":"Constitucional","enunciado":"É cargo privativo de brasileiro nato:","alternativas":["Ministro do Superior Tribunal de Justiça","Senador da República","Governador de Estado","Procurador-Geral da República","Ministro do Supremo Tribunal Federal"],"correta":4,"explicacao":"Art. 12, §3º, da CF: Presidente e Vice, Presidentes da Câmara e do Senado, Ministro do STF, carreira diplomática, oficial das Forças Armadas e Ministro de Estado da Defesa. Os demais cargos citados podem ser ocupados por naturalizados.","disciplina":"Constitucional","dificuldade":1,"fonte":"autoral"},{"id":"dir-7a958ab6","area":"Constitucional","enunciado":"Sem consentimento do morador, é possível ingressar na casa dele:","alternativas":["Durante o dia, por determinação judicial","À noite, por determinação judicial","A qualquer hora, por requisição do delegado de polícia","Durante o dia, por ordem do Ministério Público","À noite, por ordem de autoridade administrativa sanitária"],"correta":0,"explicacao":"Art. 5º, XI, da CF: a casa é asilo inviolável, salvo em flagrante delito, desastre, para prestar socorro ou, durante o dia, por determinação judicial.","disciplina":"Constitucional","dificuldade":2,"fonte":"autoral"},{"id":"dir-442f20da","area":"Constitucional","enunciado":"Quando a falta de norma regulamentadora torna inviável o exercício de direitos e liberdades constitucionais, o remédio adequado é:","alternativas":["Mandado de segurança","Mandado de injunção","Ação popular","Habeas data","Ação civil pública"],"correta":1,"explicacao":"Art. 5º, LXXI, da CF (regulamentado pela Lei 13.300/2016): o mandado de injunção combate a omissão normativa que inviabiliza direitos.","disciplina":"Constitucional","dificuldade":2,"fonte":"autoral"},{"id":"dir-d5260823","area":"Constitucional","enunciado":"A idade mínima exigida como condição de elegibilidade para Senador é de:","alternativas":["30 anos","21 anos","35 anos","18 anos","40 anos"],"correta":2,"explicacao":"Art. 14, §3º, VI, 'a', da CF: 35 anos para Presidente, Vice-Presidente e Senador; 30 para Governador; 21 para Deputado e Prefeito; 18 para Vereador.","disciplina":"Constitucional","dificuldade":1,"fonte":"autoral"},{"id":"dir-7f4a108d","area":"Constitucional","enunciado":"Tem legitimidade para propor ação direta de inconstitucionalidade (ADI) perante o STF:","alternativas":["O Prefeito de capital de Estado","O Advogado-Geral da União","A seccional estadual da OAB","O Conselho Federal da Ordem dos Advogados do Brasil","O Defensor Público-Geral do Estado"],"correta":3,"explicacao":"Art. 103, VII, da CF inclui o Conselho Federal da OAB. Prefeitos e seccionais da OAB não constam do rol, e o AGU atua na defesa do ato impugnado (art. 103, §3º).","disciplina":"Constitucional","dificuldade":2,"fonte":"autoral"},{"id":"dir-6e5765c2","area":"Constitucional","enunciado":"Compete privativamente à União legislar sobre:","alternativas":["Direito tributário","Direito penitenciário","Direito urbanístico","Educação, cultura e ensino","Direito eleitoral"],"correta":4,"explicacao":"Art. 22, I, da CF (direito civil, comercial, penal, processual, eleitoral, agrário, marítimo, aeronáutico, espacial e do trabalho). As demais matérias são de competência concorrente (art. 24, I e IX).","disciplina":"Constitucional","dificuldade":2,"fonte":"autoral"},{"id":"dir-5c99154b","area":"Civil","enunciado":"Quando a lei não fixar prazo menor, a prescrição ocorre em:","alternativas":["10 anos","5 anos","3 anos","15 anos","20 anos"],"correta":0,"explicacao":"Art. 205 do Código Civil: prazo geral de 10 anos. O CC/1916 previa 20 anos para ações pessoais.","disciplina":"Civil","dificuldade":1,"fonte":"autoral"},{"id":"dir-5e6ec6a7","area":"Civil","enunciado":"A vítima de um acidente de trânsito, sem nenhum vínculo contratual com o causador, pretende indenização. A pretensão de reparação civil prescreve em:","alternativas":["1 ano","3 anos","5 anos","10 anos","20 anos"],"correta":1,"explicacao":"Art. 206, §3º, V, do Código Civil: prescreve em 3 anos a pretensão de reparação civil (responsabilidade extracontratual).","disciplina":"Civil","dificuldade":2,"fonte":"autoral"},{"id":"dir-4aff4014","area":"Civil","enunciado":"Sobre o início da personalidade civil, o Código Civil estabelece que:","alternativas":["Começa da concepção, com plena capacidade de fato","Começa com o registro de nascimento em cartório","Começa do nascimento com vida, ressalvados desde a concepção os direitos do nascituro","Começa aos 16 anos, com a capacidade relativa","Começa do nascimento com vida, sem qualquer proteção jurídica ao nascituro"],"correta":2,"explicacao":"Art. 2º do Código Civil: a personalidade começa do nascimento com vida, ressalvados desde a concepção os direitos do nascituro.","disciplina":"Civil","dificuldade":2,"fonte":"autoral"},{"id":"dir-5c3098e1","area":"Civil","enunciado":"O domicílio da pessoa natural é, em regra:","alternativas":["O lugar onde nasceu","O lugar onde foi registrada","Qualquer lugar onde esteja no momento","O lugar onde reside com ânimo definitivo","O lugar indicado no seu título de eleitor"],"correta":3,"explicacao":"Art. 70 do Código Civil. Tendo várias residências, qualquer delas pode ser considerada domicílio (art. 71).","disciplina":"Civil","dificuldade":1,"fonte":"autoral"},{"id":"dir-f0111918","area":"Civil","enunciado":"João, inexperiente em negócios, vende um terreno em Parintins por um quinto do valor de mercado, sem ter sido enganado nem ameaçado pelo comprador. O defeito do negócio jurídico é:","alternativas":["Estado de perigo","Dolo","Coação","Fraude contra credores","Lesão"],"correta":4,"explicacao":"Art. 157 do Código Civil: há lesão quando a pessoa, sob premente necessidade ou por inexperiência, se obriga a prestação manifestamente desproporcional. É causa de anulabilidade (art. 171, II).","disciplina":"Civil","dificuldade":3,"fonte":"autoral"},{"id":"dir-3d2f9a72","area":"Civil","enunciado":"Um adolescente de 15 anos, que mora com os pais, quebra a vitrine de uma loja. Quanto aos pais, é correto afirmar que:","alternativas":["Respondem pela reparação, ainda que não haja culpa de sua parte","Só respondem se a vítima provar que falharam no dever de vigilância","Não respondem, pois apenas o próprio menor responde com seus bens","Respondem apenas se o filho tiver sido emancipado","Respondem somente na esfera penal, não na civil"],"correta":0,"explicacao":"Arts. 932, I, e 933 do Código Civil: os pais respondem pelos filhos menores sob sua autoridade e companhia, ainda que não haja culpa de sua parte (responsabilidade objetiva por fato de terceiro).","disciplina":"Civil","dificuldade":2,"fonte":"autoral"},{"id":"dir-bd853c25","area":"Civil","enunciado":"Uma pessoa viúva, com dois filhos, deseja fazer testamento. Ela pode dispor livremente de:","alternativas":["Toda a herança","Metade da herança","Um terço da herança","Um quarto da herança","Nada, pois há herdeiros necessários"],"correta":1,"explicacao":"Arts. 1.845 e 1.846 do Código Civil: os descendentes são herdeiros necessários e a eles pertence metade dos bens (a legítima); a outra metade é disponível (art. 1.789).","disciplina":"Civil","dificuldade":2,"fonte":"autoral"},{"id":"dir-8a66c7e9","area":"Penal","enunciado":"Salvo disposição em contrário, a pena do crime tentado é:","alternativas":["A mesma do crime consumado","A do crime consumado, diminuída de metade","A do crime consumado, diminuída de um a dois terços","A do crime consumado, diminuída de um sexto a um terço","Nenhuma, pois a tentativa não é punível"],"correta":2,"explicacao":"Art. 14, II e parágrafo único, do Código Penal.","disciplina":"Penal","dificuldade":1,"fonte":"autoral"},{"id":"dir-cbb6b7de","area":"Penal","enunciado":"Pedro dispara contra Lucas com intenção de matar, erra o tiro e, embora tivesse mais munição e pudesse continuar, decide ir embora por vontade própria. Lucas não se fere. Houve:","alternativas":["Tentativa de homicídio, com redução de um a dois terços","Arrependimento posterior, com redução de pena","Arrependimento eficaz, com isenção total de pena","Desistência voluntária, respondendo Pedro apenas pelos atos já praticados","Crime impossível, sem punição"],"correta":3,"explicacao":"Art. 15 do Código Penal: quem voluntariamente desiste de prosseguir na execução só responde pelos atos já praticados (no caso, por exemplo, disparo de arma de fogo ou perigo à vida).","disciplina":"Penal","dificuldade":3,"fonte":"autoral"},{"id":"dir-27488d4f","area":"Penal","enunciado":"Nos crimes cometidos sem violência ou grave ameaça, reparado o dano ou restituída a coisa por ato voluntário do agente até o recebimento da denúncia ou da queixa, ocorre:","alternativas":["Extinção da punibilidade","Desistência voluntária","Arrependimento eficaz","Perdão judicial obrigatório","Arrependimento posterior"],"correta":4,"explicacao":"Art. 16 do Código Penal (arrependimento posterior), causa obrigatória de diminuição de pena, de um a dois terços.","disciplina":"Penal","dificuldade":2,"fonte":"autoral"},{"id":"dir-8695925c","area":"Penal","enunciado":"Segundo o Código Penal, NÃO exclui a imputabilidade penal:","alternativas":["A emoção ou a paixão","A menoridade de 18 anos","A doença mental que torna o agente, ao tempo da ação, inteiramente incapaz de entender o caráter ilícito do fato","A embriaguez completa proveniente de caso fortuito ou força maior","O desenvolvimento mental retardado que retira inteiramente a capacidade de autodeterminação"],"correta":0,"explicacao":"Art. 28, I, do Código Penal: emoção e paixão não excluem a imputabilidade. As demais hipóteses estão nos arts. 26, 27 e 28, §1º.","disciplina":"Penal","dificuldade":2,"fonte":"autoral"},{"id":"dir-001609eb","area":"Penal","enunciado":"Carlos pegou emprestado o notebook de um colega e, já com o bem em mãos, decidiu não devolvê-lo e vendeu-o. Carlos praticou:","alternativas":["Furto","Apropriação indébita","Roubo","Estelionato","Receptação"],"correta":1,"explicacao":"Art. 168 do Código Penal: apropriar-se de coisa alheia móvel de que tem a posse ou a detenção. No furto (art. 155), o agente subtrai a coisa, que não estava legitimamente em seu poder.","disciplina":"Penal","dificuldade":3,"fonte":"autoral"},{"id":"dir-5107cd57","area":"Penal","enunciado":"Pelo Código Penal, o crime é doloso quando o agente quis o resultado ou:","alternativas":["Deu causa a ele por imprudência","Deu causa a ele por negligência","Assumiu o risco de produzi-lo","Deu causa a ele por imperícia","Poderia prevê-lo, mas confiou que não ocorreria"],"correta":2,"explicacao":"Art. 18, I, do Código Penal (dolo direto e dolo eventual). Imprudência, negligência e imperícia caracterizam o crime culposo (art. 18, II).","disciplina":"Penal","dificuldade":1,"fonte":"autoral"},{"id":"dir-53a88342","area":"Processo Civil","enunciado":"No CPC/2015, o prazo para opor embargos de declaração é de:","alternativas":["15 dias","10 dias","3 dias","5 dias","30 dias"],"correta":3,"explicacao":"Art. 1.023 do CPC. Os demais recursos, em regra, têm prazo de 15 dias (art. 1.003, §5º).","disciplina":"Processo Civil","dificuldade":1,"fonte":"autoral"},{"id":"dir-2988a31b","area":"Processo Civil","enunciado":"O réu, devidamente intimado, não comparece à audiência de conciliação do art. 334 do CPC e não apresenta justificativa. A consequência legal é:","alternativas":["Revelia, com presunção de veracidade dos fatos alegados pelo autor","Extinção do processo sem resolução do mérito","Confissão ficta sobre toda a matéria de direito","Nenhuma, pois a audiência é facultativa para o réu","Ato atentatório à dignidade da justiça, sancionado com multa"],"correta":4,"explicacao":"Art. 334, §8º, do CPC: multa de até 2% da vantagem econômica pretendida ou do valor da causa. A revelia decorre da falta de contestação (art. 344), não da ausência à audiência.","disciplina":"Processo Civil","dificuldade":2,"fonte":"autoral"},{"id":"dir-29d5cdb3","area":"Processo Civil","enunciado":"A presunção de veracidade decorrente da revelia NÃO ocorre quando:","alternativas":["Havendo pluralidade de réus, algum deles contestar a ação","O réu for pessoa jurídica de direito privado","O litígio versar sobre direitos patrimoniais disponíveis","O autor tiver juntado documentos com a petição inicial","O réu tiver sido citado pessoalmente"],"correta":0,"explicacao":"Art. 345, I, do CPC. Também não ocorre em direitos indisponíveis, falta de instrumento indispensável ou alegações inverossímeis (art. 345, II a IV).","disciplina":"Processo Civil","dificuldade":2,"fonte":"autoral"},{"id":"dir-f73f25e6","area":"Processo Civil","enunciado":"Autor que mora em Manaus ajuíza ação reivindicatória de um imóvel situado em Itacoatiara contra réu domiciliado em Belém. É competente o foro de:","alternativas":["Belém, domicílio do réu","Itacoatiara, local da situação do imóvel","Manaus, domicílio do autor","Qualquer um, à escolha do autor","Brasília, por envolver partes de Estados diferentes"],"correta":1,"explicacao":"Art. 47 do CPC: para ações fundadas em direito real sobre imóveis, é competente o foro de situação da coisa.","disciplina":"Processo Civil","dificuldade":3,"fonte":"autoral"},{"id":"dir-afaebb34","area":"Processo Penal","enunciado":"Pelo CPP, o inquérito policial deve terminar, em regra, no prazo de:","alternativas":["30 dias em qualquer caso","15 dias se preso e 60 dias se solto","10 dias se preso e 30 dias se solto","5 dias se preso e 10 dias se solto","90 dias, prorrogáveis livremente"],"correta":2,"explicacao":"Art. 10 do CPP. Estando solto, o prazo pode ser prorrogado pelo juiz quando o fato for de difícil elucidação (art. 10, §3º).","disciplina":"Processo Penal","dificuldade":1,"fonte":"autoral"},{"id":"dir-dc8a110b","area":"Processo Penal","enunciado":"Em crime de ação penal privada, o ofendido deve oferecer queixa, sob pena de decadência, em regra no prazo de:","alternativas":["6 meses, contado da data do fato","30 dias, contado do conhecimento da autoria","1 ano, contado da data do fato","6 meses, contado do conhecimento da autoria","2 anos, contado do conhecimento da autoria"],"correta":3,"explicacao":"Art. 38 do CPP (e art. 103 do CP): 6 meses a partir do conhecimento da autoria.","disciplina":"Processo Penal","dificuldade":1,"fonte":"autoral"},{"id":"dir-acfa3811","area":"Processo Penal","enunciado":"NÃO se considera em flagrante delito quem:","alternativas":["Está cometendo a infração penal","Acaba de cometer a infração penal","É perseguido, logo após, em situação que faça presumir ser o autor","É encontrado, logo depois, com instrumentos ou objetos que façam presumir ser ele o autor","É identificado por testemunhas três dias após o crime, sem perseguição nem objetos"],"correta":4,"explicacao":"Art. 302 do CPP lista as hipóteses de flagrante próprio, impróprio e presumido. Identificação posterior, sem perseguição nem objetos, não autoriza prisão em flagrante.","disciplina":"Processo Penal","dificuldade":2,"fonte":"autoral"},{"id":"dir-bb726343","area":"Administrativo","enunciado":"Um ato administrativo válido deixa de ser conveniente e oportuno para o interesse público. A Administração pode extingui-lo por meio de:","alternativas":["Revogação, respeitados os direitos adquiridos","Anulação, com efeitos retroativos","Convalidação","Cassação","Caducidade"],"correta":0,"explicacao":"Art. 53 da Lei 9.784/1999 e Súmula 473 do STF: a Administração anula atos ilegais e pode revogar atos por conveniência ou oportunidade, respeitados os direitos adquiridos.","disciplina":"Administrativo","dificuldade":1,"fonte":"autoral"},{"id":"dir-cc6c791d","area":"Administrativo","enunciado":"O servidor nomeado para cargo de provimento efetivo em virtude de concurso público adquire estabilidade após:","alternativas":["2 anos de efetivo exercício","3 anos de efetivo exercício","5 anos de efetivo exercício","A posse no cargo","1 ano de estágio probatório"],"correta":1,"explicacao":"Art. 41, caput e §4º, da CF: estabilidade após três anos de efetivo exercício, sendo obrigatória a avaliação especial de desempenho por comissão.","disciplina":"Administrativo","dificuldade":1,"fonte":"autoral"},{"id":"dir-58efd06c","area":"Administrativo","enunciado":"Uma viatura estadual, conduzida por servidor em serviço, colide com um carro particular. Quanto à responsabilidade civil, é correto afirmar que:","alternativas":["O Estado só responde se a vítima provar a culpa do servidor","Só o servidor responde, pessoalmente e de forma objetiva","O Estado responde objetivamente, com direito de regresso contra o servidor","O Estado responde subsidiariamente, apenas se o servidor não tiver bens","Não há responsabilidade, pois o servidor agia no exercício da função"],"correta":2,"explicacao":"Art. 37, §6º, da CF: as pessoas jurídicas de direito público respondem pelos danos que seus agentes causarem a terceiros, com regresso contra o responsável nos casos de dolo ou culpa.","disciplina":"Administrativo","dificuldade":2,"fonte":"autoral"},{"id":"dir-9407f768","area":"Administrativo","enunciado":"NÃO é modalidade de licitação prevista na Lei 14.133/2021:","alternativas":["Pregão","Concorrência","Leilão","Tomada de preços","Diálogo competitivo"],"correta":3,"explicacao":"Art. 28 da Lei 14.133/2021: pregão, concorrência, concurso, leilão e diálogo competitivo. Tomada de preços e convite existiam na antiga Lei 8.666/1993.","disciplina":"Administrativo","dificuldade":2,"fonte":"autoral"},{"id":"dir-23e0b61b","area":"Tributário","enunciado":"Uma lei que institui um novo imposto (sem estar entre as exceções constitucionais) é publicada em dezembro. Em regra, esse imposto poderá ser cobrado:","alternativas":["Imediatamente, na data da publicação","Em 1º de janeiro do ano seguinte, ainda que não decorridos 90 dias","Somente após 90 dias, mesmo que no mesmo exercício","Somente após dois exercícios financeiros","No exercício seguinte, desde que decorridos 90 dias da publicação da lei"],"correta":4,"explicacao":"Art. 150, III, 'b' e 'c', da CF: anterioridade do exercício e anterioridade nonagesimal se aplicam cumulativamente, salvo as exceções do art. 150, §1º.","disciplina":"Tributário","dificuldade":3,"fonte":"autoral"},{"id":"dir-9d9d0a1a","area":"Tributário","enunciado":"Segundo o conceito de tributo do art. 3º do CTN, o tributo:","alternativas":["Não constitui sanção de ato ilícito","Pode ser pago em serviços prestados ao Estado","É cobrado mediante atividade discricionária","Pode ser instituído por contrato com o contribuinte","É uma prestação voluntária"],"correta":0,"explicacao":"Art. 3º do CTN: prestação pecuniária compulsória, em moeda ou cujo valor nela se possa exprimir, que não constitua sanção de ato ilícito, instituída em lei e cobrada mediante atividade administrativa plenamente vinculada. A multa é sanção, não tributo.","disciplina":"Tributário","dificuldade":1,"fonte":"autoral"},{"id":"dir-c448982c","area":"Tributário","enunciado":"Uma igreja em Manaus recebe cobrança de IPTU sobre o templo e de uma taxa municipal de fiscalização. Sobre a imunidade dos templos, é correto afirmar que:","alternativas":["Alcança impostos e taxas, mas não contribuições","Alcança somente impostos, de modo que a entidade continua sujeita às taxas","Alcança todos os tributos, sem exceção","Não alcança o IPTU, apenas o imposto de renda","Depende de lei complementar municipal para produzir efeitos"],"correta":1,"explicacao":"Art. 150, VI, 'b', da CF: a imunidade veda a instituição de impostos sobre templos de qualquer culto; taxas e outras espécies tributárias não são abrangidas.","disciplina":"Tributário","dificuldade":2,"fonte":"autoral"},{"id":"dir-327eacf7","area":"Trabalho","enunciado":"NÃO é requisito para a caracterização da relação de emprego segundo a CLT:","alternativas":["Pessoalidade","Não eventualidade","Exclusividade","Subordinação","Onerosidade"],"correta":2,"explicacao":"Arts. 2º e 3º da CLT: pessoa física, pessoalidade, não eventualidade, onerosidade (salário) e subordinação (dependência). O empregado pode ter mais de um emprego.","disciplina":"Trabalho","dificuldade":1,"fonte":"autoral"},{"id":"dir-b0d89039","area":"Trabalho","enunciado":"A remuneração do serviço extraordinário (hora extra) deve ser, no mínimo:","alternativas":["20% superior à da hora normal","100% superior à da hora normal","Igual à da hora normal","50% superior à da hora normal","30% superior à da hora normal"],"correta":3,"explicacao":"Art. 7º, XVI, da CF (e art. 59, §1º, da CLT). O percentual de 20% corresponde ao adicional noturno urbano (art. 73 da CLT).","disciplina":"Trabalho","dificuldade":1,"fonte":"autoral"},{"id":"dir-e851d773","area":"Trabalho","enunciado":"A empregada gestante tem garantia de emprego, vedada a dispensa arbitrária ou sem justa causa:","alternativas":["Desde a confirmação da gravidez até o parto","Desde a admissão até um ano após o parto","Somente durante a licença-maternidade","Desde o parto até quatro meses depois","Desde a confirmação da gravidez até cinco meses após o parto"],"correta":4,"explicacao":"Art. 10, II, 'b', do ADCT da CF/88.","disciplina":"Trabalho","dificuldade":1,"fonte":"autoral"},{"id":"dir-1da77ad9","area":"Ambiental","enunciado":"As terras tradicionalmente ocupadas pelos índios, como as do Alto Rio Negro, são:","alternativas":["Bens da União, destinadas à posse permanente e ao usufruto exclusivo dos índios","Propriedade privada das comunidades indígenas, podendo ser vendidas por decisão coletiva","Bens dos Estados em que se localizam","Bens dos Municípios, com usufruto compartilhado","Terras devolutas passíveis de usucapião após 15 anos"],"correta":0,"explicacao":"Arts. 20, XI, e 231, §2º, da CF: posse permanente e usufruto exclusivo das riquezas do solo, dos rios e dos lagos. Essas terras são inalienáveis e ridos","20 dias úteis"],"correta":1,"explicacao":"Art. 335 do CPC.","disciplina":"Processo Civil","dificuldade":1,"fonte":"autoral"},{"id":"oab-4c56a54c","area":"Processo Civil","enunciado":"O prazo para apelação no CPC/2015 é de:","alternativas":["5 dias","10 dias","15 dias úteis","30 dias","8 dias"],"correta":2,"explicacao":"Art. 1.003, §5º: 15 dias para todos os recursos, exceto embargos de declaração (5 dias).","disciplina":"Processo Civil","dificuldade":1,"fonte":"autoral"},{"id":"oab-51160cef","area":"Processo Penal","enunciado":"Com o indiciado preso, o inquérito policial deve terminar em (regra do CPP):","alternativas":["30 dias","10 dias","15 dias","5 dias","60 dias"],"correta":1,"explicacao":"Art. 10 do CPP: 10 dias se preso, 30 se solto. Há leis especiais com prazos diferentes.","disciplina":"Processo Penal","dificuldade":1,"fonte":"autoral"},{"id":"oab-19a76129","area":"ECA","enunciado":"Para o ECA, adolescente é a pessoa entre:","alternativas":["10 e 18 anos","12 e 18 anos incompletos","14 e 21 anos","12 e 21 anos","13 e 17 anos"],"correta":1,"explicacao":"Art. 2º do ECA: criança até 12 anos incompletos; adolescente de 12 a 18 anos incompletos.","disciplina":"ECA","dificuldade":1,"fonte":"autoral"},{"id":"oab-9ab054b5","area":"Consumidor","enunciado":"O prazo para reclamar de vício aparente em produto durável é de:","alternativas":["30 dias","90 dias","5 anos","7 dias","1 ano"],"correta":1,"explicacao":"Art. 26, II, do CDC. Não durável: 30 dias. Os 7 dias são o arrependimento em compras fora do estabelecimento (art. 49).","disciplina":"Consumidor","dificuldade":1,"fonte":"autoral"},{"id":"oab-280a8198","area":"Empresarial","enunciado":"Na sociedade limitada, a responsabilidade dos sócios:","alternativas":["É ilimitada","É restrita ao valor de suas quotas","Não existe","É subsidiária e ilimitada","É proporcional ao lucro"],"correta":1,"explicacao":"Art. 1.052 do Código Civil: a responsabilidade de cada sócio é restrita ao valor de suas quotas, mas todos respondem solidariamente pela integralização do capital social.","disciplina":"Empresarial","dificuldade":1,"fonte":"autoral"},{"id":"oab-c337b16a","area":"Ética","enunciado":"Em 2019, a Seccional tomou conhecimento oficial de falta disciplinar praticada pelo advogado Rui. Nenhum ato interruptivo ocorreu desde então. Sobre a pretensão punitiva da OAB, é correto afirmar que ela prescreve em:","alternativas":["2 anos, contados da data da prática do fato","5 anos, contados da data da constatação oficial do fato","3 anos, contados da data da constatação oficial do fato","10 anos, contados da data da prática do fato","Não prescreve, por se tratar de processo disciplinar de natureza ética"],"correta":1,"explicacao":"Art. 43 do Estatuto da Advocacia (Lei 8.906/1994): a pretensão à punibilidade das infrações disciplinares prescreve em cinco anos, contados da constatação oficial do fato.","disciplina":"Ética","dificuldade":3,"fonte":"autoral"},{"id":"oab-06f7e527","area":"Ética","enunciado":"Maria, advogada, foi arrolada como testemunha em processo sobre fatos que conheceu ao patrocinar os interesses de seu antigo cliente, o qual, inclusive, autorizou por escrito o depoimento. Nesse caso, Maria:","alternativas":["É obrigada a depor, pois a autorização do cliente afasta o sigilo profissional","Só pode recusar-se se ainda for advogada do cliente","Pode recusar-se a depor, ainda que autorizada ou solicitada pelo cliente","Deve depor, mas apenas sobre fatos posteriores ao fim do mandato","Só pode recusar-se mediante autorização prévia do Conselho Seccional"],"correta":2,"explicacao":"Art. 7º, XIX, do Estatuto da Advocacia: é direito do advogado recusar-se a depor sobre fato relacionado a pessoa de quem seja ou foi advogado, mesmo quando autorizado ou solicitado pelo constituinte.","disciplina":"Ética","dificuldade":2,"fonte":"autoral"},{"id":"oab-f088d205","area":"Ética","enunciado":"Carlos, advogado, renunciou ao mandato que lhe fora outorgado em ação cível e notificou regularmente o cliente. Quanto à sua responsabilidade após a renúncia, Carlos:","alternativas":["Deixa de representar o cliente imediatamente após a notificação","Continua a representar o cliente por 30 dias após a notificação","Continua a representar o cliente até o trânsito em julgado da ação","Continua a representá-lo nos 10 dias seguintes, salvo se substituído antes","Só se desobriga após homologação judicial da renúncia"],"correta":3,"explicacao":"Art. 5º, § 3º, do Estatuto da Advocacia: o advogado que renunciar ao mandato continuará, durante os dez dias seguintes à notificação da renúncia, a representar o mandante, salvo se for substituído antes.","disciplina":"Ética","dificuldade":2,"fonte":"autoral"},{"id":"oab-e3946a33","area":"Ética","enunciado":"Lucas, policial militar da ativa, foi aprovado no Exame de Ordem e deseja advogar nas horas vagas, apenas em causas de família. Segundo o Estatuto da Advocacia, Lucas:","alternativas":["Pode advogar em causas de família, pois há mero impedimento contra a Fazenda que o remunera","Pode advogar livremente, desde que fora do horário de serviço","Pode advogar apenas em causas próprias e de parentes","Não pode advogar, pois a atividade policial é incompatível com a advocacia","Pode advogar se obtiver autorização do comandante da corporação"],"correta":3,"explicacao":"Art. 28, V, do Estatuto da Advocacia: a advocacia é incompatível com as atividades de ocupantes de cargos ou funções vinculados direta ou indiretamente a atividade policial de qualquer natureza; a incompatibilidade gera proibição total (art. 27).","disciplina":"Ética","dificuldade":2,"fonte":"autoral"},{"id":"oab-a209c66f","area":"Ética","enunciado":"Joana, advogada regularmente inscrita, tomou posse como analista administrativa em uma autarquia estadual, cargo sem poder de decisão relevante. Quanto ao exercício da advocacia, Joana:","alternativas":["Está proibida de advogar em qualquer causa, por incompatibilidade","Pode advogar livremente, inclusive contra o Esta
