rmo ≥ 42 semanas."},{"id":"res-ea256408","area":"Medicina Preventiva","enunciado":"Sensibilidade de um teste diagnóstico é:","alternativas":["Proporção de doentes com teste positivo","Proporção de sadios com teste negativo","Probabilidade de doença dado teste positivo","Proporção de positivos na população","Taxa de falsos positivos"],"correta":0,"explicacao":"Sensibilidade = VP/(VP+FN). Especificidade = VN/(VN+FP). A probabilidade de doença dado teste positivo é o valor preditivo positivo."},{"id":"res-2ecf9576","area":"Medicina Preventiva","enunciado":"A Lei Orgânica da Saúde, que regula o SUS, é a:","alternativas":["Lei 8.142/1990","Lei 8.080/1990","Lei 9.656/1998","Lei 13.979/2020","Constituição, art. 5º"],"correta":1,"explicacao":"Lei 8.080/1990. A 8.142/1990 trata de participação social e financiamento; a 9.656/1998, de planos de saúde."},{"id":"res-72daf190","area":"Medicina Preventiva","enunciado":"São princípios doutrinários do SUS:","alternativas":["Universalidade, integralidade e equidade","Descentralização, regionalização e hierarquização","Lucro, eficiência e mercado","Privatização e seletividade","Participação popular e cofinanciamento"],"correta":0,"explicacao":"Doutrinários: universalidade, integralidade, equidade. Descentralização, regionalização e hierarquização são princípios organizativos."},{"id":"res-53920861","area":"Clínica Médica","enunciado":"Mulher de 70 anos com hiponatremia crônica (Na⁺ 112 mEq/L) recebe correção rápida do sódio e, dois dias depois, evolui com disartria, disfagia e tetraparesia. A complicação mais provável é:","alternativas":["Síndrome de desmielinização osmótica","Edema cerebral por hiponatremia persistente","Acidente vascular cerebral isquêmico de tronco","Encefalopatia de Wernicke","Síndrome de Guillain-Barré"],"correta":0,"explicacao":"A correção rápida da hiponatremia crônica causa desmielinização osmótica (mielinólise pontina), com quadro bifásico de disartria, disfagia e tetraparesia; por isso a velocidade de correção deve ser limitada."},{"id":"res-8c625d79","area":"Clínica Médica","enunciado":"Paciente renal crônico chega com K⁺ de 7,8 mEq/L e ECG com ondas T apiculadas e alargamento do QRS. A primeira medida, visando proteger o miocárdio, é:","alternativas":["Poliestirenossulfonato de cálcio por via oral","Gluconato de cálcio endovenoso","Furosemida endovenosa","Hemodiálise imediata como única medida","Bicarbonato de sódio como primeira escolha"],"correta":1,"explicacao":"Com alteração eletrocardiográfica, o cálcio EV estabiliza a membrana do cardiomiócito em minutos, sem reduzir o potássio; em seguida vêm as medidas que deslocam o K⁺ para dentro da célula (insulina com glicose, beta-2 agonista) e as que o removem."},{"id":"res-a2cbe9d5","area":"Clínica Médica","enunciado":"Toracocentese: proteína pleural 4,0 g/dL (sérica 6,0 g/dL); LDH pleural 300 U/L (sérica 250 U/L; limite superior 240 U/L). Pelos critérios de Light, o derrame é:","alternativas":["Transudato, pois a relação de proteínas é menor que 1","Transudato, típico de insuficiência cardíaca","Exsudato, pois preenche os três critérios de Light","Exsudato apenas pelo critério da LDH pleural","Indeterminado, sendo obrigatório dosar o gradiente de albumina"],"correta":2,"explicacao":"Light: exsudato se proteína pleural/sérica > 0,5 (aqui 0,67), LDH pleural/sérica > 0,6 (aqui 1,2) ou LDH pleural > 2/3 do limite superior sérico (300 > 160). Basta um critério; este caso preenche os três."},{"id":"res-938bf64a","area":"Clínica Médica","enunciado":"Homem de 68 anos com pneumonia comunitária, confuso, FR 34 irpm, PA 110/70 mmHg e ureia 30 mg/dL. Seu escore CURB-65 é:","alternativas":["1","2","4","3","5"],"correta":3,"explicacao":"CURB-65: Confusão (1), Ureia > 50 mg/dL (0), FR ≥ 30 (1), PAS < 90 ou PAD ≤ 60 (0), idade ≥ 65 (1) = 3, o que indica pneumonia grave com indicação de internação."},{"id":"res-47c52df8","area":"Clínica Médica","enunciado":"Mulher de 35 anos com menorragia, fadiga e anemia microcítica e hipocrômica. O perfil laboratorial esperado na anemia ferropriva é:","alternativas":["Ferritina elevada e capacidade total de ligação do ferro baixa","Ferritina normal e saturação de transferrina elevada","Ferro sérico elevado e ferritina elevada","Ferritina baixa e capacidade total de ligação do ferro baixa","Ferritina baixa e capacidade total de ligação do ferro elevada"],"correta":4,"explicacao":"Na ferropenia os estoques caem (ferritina baixa) e a transferrina aumenta (CTLF alta, saturação baixa). Ferritina alta com CTLF baixa sugere anemia de doença crônica."},{"id":"res-d4b2f7e4","area":"Clínica Médica","enunciado":"Mulher de 40 anos, assintomática, apresenta TSH 8,5 mUI/L (referência 0,4–4,5) e T4 livre normal, confirmados em nova dosagem. O diagnóstico é:","alternativas":["Hipotireoidismo subclínico","Hipotireoidismo primário franco","Hipotireoidismo central","Hipertireoidismo subclínico","Síndrome do eutireoidiano doente"],"correta":0,"explicacao":"TSH elevado com T4 livre normal define hipotireoidismo subclínico; TSH alto com T4 livre baixo é hipotireoidismo primário franco; TSH baixo/normal com T4 livre baixo sugere causa central."},{"id":"res-23e6a1e9","area":"Clínica Médica","enunciado":"Adulto com edema generalizado, albumina sérica de 2,0 g/dL e colesterol elevado. Qual achado urinário completa a definição de síndrome nefrótica?","alternativas":["Hematúria dismórfica com cilindros hemáticos","Proteinúria acima de 3,5 g/24 h","Proteinúria entre 150 e 300 mg/24 h","Leucocitúria com cilindros leucocitários","Glicosúria com glicemia normal"],"correta":1,"explicacao":"Síndrome nefrótica: proteinúria > 3,5 g/24 h (no adulto), hipoalbuminemia, edema e dislipidemia. Hematúria dismórfica com cilindros hemáticos caracteriza síndrome nefrítica."},{"id":"res-fea5e4d7","area":"Clínica Médica","enunciado":"Homem de 58 anos com dor torácica há 1 hora. O ECG mostra supradesnivelamento do segmento ST em DII, DIII e aVF. A parede acometida é a:","alternativas":["Anterior extensa","Lateral alta","Inferior","Septal","Posterior isolada"],"correta":2,"explicacao":"DII, DIII e aVF exploram a parede inferior, geralmente irrigada pela coronária direita. V1–V4 correspondem à parede anterosseptal e DI/aVL à lateral alta."},{"id":"res-b3ec8e48","area":"Clínica Médica","enunciado":"Jovem com febre, cefaleia e rigidez de nuca. Líquor turvo com 2.500 células/mm³ (90% neutrófilos), glicose de 20 mg/dL (glicemia 100 mg/dL) e proteína de 250 mg/dL. O padrão é mais compatível com meningite:","alternativas":["Viral","Tuberculosa","Fúngica criptocócica","Bacteriana","Carcinomatosa"],"correta":3,"explicacao":"Pleocitose neutrofílica intensa, glicose baixa (relação líquor/sangue < 0,4) e proteína alta caracterizam meningite bacteriana. A viral tem predomínio linfocitário e glicose normal; a tuberculosa, linfócitos com glicose baixa e evolução subaguda."},{"id":"res-7eb4f1dd","area":"Clínica Médica","enunciado":"Adulto com diagnóstico novo de tuberculose pulmonar, sem tratamento prévio. Pelo Manual de Recomendações para o Controle da Tuberculose do Ministério da Saúde, o esquema básico é:","alternativas":["2 meses de rifampicina, isoniazida e pirazinamida, seguidos de 4 meses de isoniazida isolada","2 meses de rifampicina e isoniazida, seguidos de 4 meses de etambutol","9 meses de isoniazida isolada","12 meses de rifampicina, isoniazida, pirazinamida e etambutol","2 meses de rifampicina, isoniazida, pirazinamida e etambutol, seguidos de 4 meses de rifampicina e isoniazida"],"correta":4,"explicacao":"O esquema básico brasileiro para adultos é 2RHZE/4RH: fase intensiva de 2 meses com quatro fármacos e fase de manutenção de 4 meses com rifampicina e isoniazida."},{"id":"res-bb2bc86e","area":"Clínica Médica","enunciado":"Gasometria: pH 7,25; pCO₂ 29 mmHg; HCO₃⁻ 14 mEq/L. Na⁺ 140, Cl⁻ 104 mEq/L. A interpretação correta é:","alternativas":["Acidose metabólica com ânion gap aumentado e compensação respiratória adequada","Acidose metabólica hiperclorêmica com ânion gap normal","Acidose respiratória aguda","Acidose metabólica com ânion gap aumentado e acidose respiratória associada","Alcalose respiratória com compensação metabólica"],"correta":0,"explicacao":"Ânion gap = 140 − (104 + 14) = 22 (aumentado). Pela fórmula de Winters, pCO₂ esperada = 1,5 × 14 + 8 = 29 ± 2; a pCO₂ medida (29) indica compensação respiratória adequada."},{"id":"res-9c606336","area":"Clínica Médica","enunciado":"Tabagista de 60 anos com dispneia progressiva e tosse crônica. Qual achado espirométrico confirma limitação persistente ao fluxo aéreo compatível com DPOC?","alternativas":["Relação VEF1/CVF < 0,70 apenas antes do broncodilatador","Relação VEF1/CVF < 0,70 após broncodilatador","Aumento do VEF1 de 20% após broncodilatador","CVF reduzida com relação VEF1/CVF aumentada","Capacidade de difusão do CO aumentada"],"correta":1,"explicacao":"Segundo a GOLD, o diagnóstico exige VEF1/CVF < 0,70 pós-broncodilatador. CVF reduzida com relação preservada ou aumentada sugere distúrbio restritivo."},{"id":"res-5523c7de","area":"Cirurgia","enunciado":"Homem de 70 kg sofre queimadura de 2º e 3º graus em 30% da superfície corporal, além de 10% de queimadura de 1º grau. Pela fórmula de Parkland (4 mL × kg × %SCQ), o volume de cristaloide a infundir nas primeiras 8 horas após a queimadura é:","alternativas":["8.400 mL","5.600 mL","4.200 mL","2.800 mL","11.200 mL"],"correta":2,"explicacao":"Considera-se só a área de 2º e 3º graus: 4 × 70 × 30 = 8.400 mL em 24 h, metade (4.200 mL) nas primeiras 8 h a partir do momento da queimadura. A 10ª edição do ATLS propõe iniciar com 2 mL/kg/%SCQ em adultos, ajustando pela diurese."},{"id":"res-6873edc4","area":"Cirurgia","enunciado":"Vítima de trauma craniano abre os olhos apenas à pressão/estímulo doloroso, fala palavras inapropriadas e localiza o estímulo doloroso. Sua pontuação na Escala de Coma de Glasgow é:","alternativas":["8","9","11","10","12"],"correta":3,"explicacao":"Abertura ocular à pressão = 2; resposta verbal com palavras inapropriadas = 3; resposta motora que localiza = 5. Total: 10."},{"id":"res-41922d8e","area":"Cirurgia","enunciado":"Politraumatizado com taquicardia importante, hipotensão, pulso fino, ansiedade, confusão e débito urinário reduzido. Pela classificação do choque hemorrágico do ATLS, a perda volêmica estimada é de:","alternativas":["Até 15% (classe I)","15% a 30% (classe II)","Mais de 40% (classe IV)","Menos de 5%, sem repercussão clínica","30% a 40% (classe III)"],"correta":4,"explicacao":"A classe III (30–40%) é a primeira com queda da pressão arterial, além de taquicardia acentuada, confusão e oligúria. Na classe II a PA ainda está preservada; na classe IV há hipotensão grave, letargia e diurese mínima."},{"id":"res-c0790836","area":"Cirurgia","enunciado":"Após ferimento no tórax, paciente evolui com dispneia intensa, hipotensão, turgência jugular, desvio da traqueia para a esquerda e murmúrio vesicular abolido à direita. A conduta imediata é:","alternativas":["Descompressão torácica imediata do lado direito, sem aguardar exame de imagem","Radiografia de tórax para confirmar o diagnóstico","Pericardiocentese","Intubação orotraqueal e ventilação com pressão positiva antes de qualquer outra medida","Toracotomia de reanimação no centro cirúrgico"],"correta":0,"explicacao":"O quadro é de pneumotórax hipertensivo, cujo diagnóstico é clínico. O ATLS recomenda descompressão imediata (agulha ou digital) seguida de drenagem em selo d'água; aguardar imagem ou ventilar com pressão positiva antes piora o quadro."},{"id":"res-3303de46","area":"Cirurgia","enunciado":"Durante herniorrafia inguinal, o cirurgião encontra saco herniário que emerge lateralmente aos vasos epigástricos inferiores, através do anel inguinal profundo. Trata-se de hérnia:","alternativas":["Inguinal direta","Inguinal indireta","Femoral","Umbilical","De Spiegel"],"correta":1,"explicacao":"A hérnia indireta passa pelo anel inguinal profundo, lateral aos vasos epigástricos inferiores. A direta protrui pelo triângulo de Hesselbach, medial a esses vasos; a femoral fica abaixo do ligamento inguinal."},{"id":"res-85bf277a","area":"Cirurgia","enunciado":"Mulher de 45 anos com dor em hipocôndrio direito há 2 dias, febre e parada da inspiração à palpação profunda do hipocôndrio direito. O exame de imagem inicial de escolha é:","alternativas":["Tomografia computadorizada de abdome com contraste","Colangiorressonância","Ultrassonografia de abdome","Colangiopancreatografia retrógrada endoscópica","Radiografia simples de abdome"],"correta":2,"explicacao":"O sinal de Murphy sugere colecistite aguda. A ultrassonografia é o exame inicial (Diretrizes de Tóquio): barata, sem radiação e sensível para cálculos, espessamento da parede e líquido perivesicular."},{"id":"res-0ff88a16","area":"Cirurgia","enunciado":"Homem de 55 anos com antecedente de colectomia há 5 anos apresenta dor abdominal em cólica, vômitos, distensão e parada de eliminação de gases e fezes. A causa mais provável da obstrução é:","alternativas":["Neoplasia de intestino delgado","Hérnia interna congênita","Íleo biliar","Aderências (bridas) pós-operatórias","Volvo de sigmoide"],"correta":3,"explicacao":"As aderências pós-operatórias são a principal causa de obstrução de intestino delgado em adultos com cirurgia abdominal prévia; hérnias e neoplasias vêm em seguida."},{"id":"res-b3d648ff","area":"Cirurgia","enunciado":"Paciente com coledocolitíase conhecida apresenta febre com calafrios, icterícia e dor em hipocôndrio direito, evoluindo com hipotensão e confusão mental. O diagnóstico é:","alternativas":["Colecistite aguda não complicada","Pancreatite aguda leve","Hepatite viral aguda","Abscesso hepático amebiano","Colangite aguda grave (pêntade de Reynolds)"],"correta":4,"explicacao":"Febre, icterícia e dor em hipocôndrio direito formam a tríade de Charcot da colangite; somadas a hipotensão e alteração do estado mental formam a pêntade de Reynolds, que indica colangite grave com necessidade de drenagem biliar urgente."},{"id":"res-f7a696e7","area":"Cirurgia","enunciado":"Vítima de ferimento por arma branca em região precordial apresenta hipotensão, turgência jugular e bulhas cardíacas abafadas, com murmúrio vesicular presente e simétrico. A principal hipótese é:","alternativas":["Tamponamento cardíaco","Pneumotórax hipertensivo","Hemotórax maciço","Contusão pulmonar","Choque neurogênico"],"correta":0,"explicacao":"Hipotensão, turgência jugular e abafamento de bulhas compõem a tríade de Beck. Murmúrio simétrico afasta pneumotórax hipertensivo e hemotórax maciço, que causariam murmúrio abolido de um lado."},{"id":"res-162b9bc1","area":"Cirurgia","enunciado":"Pela classificação de Atlanta revisada (2012), o diagnóstico de pancreatite aguda exige:","alternativas":["Obrigatoriamente tomografia com necrose pancreática","Pelo menos dois de três critérios clínicos, laboratoriais e de imagem","Lipase acima de 10 vezes o limite superior, isoladamente","Presença de sinal de Cullen ou de Grey-Turner","Três ou mais critérios de Ranson na admissão"],"correta":1,"explicacao":"Atlanta revisada: dois de três critérios (dor típica; amilase/lipase ≥ 3× o limite superior; imagem compatível). Ranson avalia gravidade, não diagnóstico, e os sinais de Cullen e Grey-Turner são raros e inespecíficos."},{"id":"res-0e8a6af8","area":"Pediatria","enunciado":"Lactente de 4 meses, no inverno, com coriza há 3 dias, seguida de taquipneia, tiragem subcostal, sibilos e crepitações difusas. O agente etiológico mais provável é:","alternativas":["Streptococcus pneumoniae","Mycoplasma pneumoniae","Vírus sincicial respiratório","Adenovírus","Bordetella pertussis"],"correta":2,"explicacao":"O quadro é de bronquiolite viral aguda, primeiro episódio de sibilância no lactente, cujo principal agente é o vírus sincicial respiratório, com pico no outono e inverno."},{"id":"res-7c1e8d52","area":"Pediatria","enunciado":"Criança de 2 anos com diarreia aguda, irritada, com sede intensa, olhos fundos e sinal da prega que desaparece lentamente, sem sinais de gravidade, aceitando líquidos pela boca. Pelo manejo do Ministério da Saúde, a conduta é:","alternativas":["Plano A: tratamento domiciliar com aumento da oferta de líquidos","Plano C: hidratação venosa imediata","Jejum e hidratação venosa de manutenção","Plano B: reidratação oral com SRO na unidade de saúde","Antibiótico empírico e antidiarreico"],"correta":3,"explicacao":"Dois ou mais sinais (irritabilidade, sede, olhos fundos, prega que desaparece lentamente) indicam desidratação, tratada com o Plano B (SRO sob supervisão na unidade). O Plano C é para desidratação grave (letargia, prega muito lenta, incapacidade de beber)."},{"id":"res-2ee0c524","area":"Pediatria","enunciado":"Recém-nascido a termo apresenta icterícia visível com 18 horas de vida. A conduta mais adequada é:","alternativas":["Tranquilizar a mãe, pois se trata de icterícia fisiológica","Suspender o aleitamento materno por 48 horas","Expor o recém-nascido ao sol em casa","Aguardar a alta e reavaliar na consulta da primeira semana","Considerar a icterícia patológica e investigar hemólise"],"correta":4,"explicacao":"Icterícia nas primeiras 24 horas de vida é sempre patológica, geralmente por hemólise (incompatibilidade ABO/Rh), e exige investigação com dosagem de bilirrubinas. A fisiológica surge após 24 horas."},{"id":"res-061df4bc","area":"Pediatria","enunciado":"No 5º minuto de vida, um recém-nascido tem frequência cardíaca de 120 bpm, choro forte, flexão ativa dos membros, careta ao estímulo da sonda nasal e extremidades cianóticas com corpo róseo. O boletim de Apgar é:","alternativas":["8","6","7","9","10"],"correta":0,"explicacao":"FC > 100 = 2; choro forte = 2; flexão ativa = 2; careta = 1; acrocianose = 1. Total: 8."},{"id":"res-65c66e7f","area":"Pediatria","enunciado":"Menino de 4 anos com edema palpebral e de membros inferiores, proteinúria maciça, albumina de 1,8 g/dL, PA normal e sem hematúria. A causa mais provável é:","alternativas":["Glomerulonefrite pós-estreptocócica","Doença de lesões mínimas","Nefropatia membranosa","Glomerulonefrite membranoproliferativa","Nefropatia por IgA"],"correta":1,"explicacao":"A doença de lesões mínimas responde pela maioria das síndromes nefróticas entre 1 e 10 anos e costuma ser corticossensível. A pós-estreptocócica e a nefropatia por IgA são nefríticas, com hematúria."},{"id":"res-a71a87fe","area":"Pediatria","enunciado":"Criança de 2 anos com coriza há 2 dias acorda à noite com tosse ladrante, rouquidão e estridor inspiratório. O agente mais frequentemente envolvido é:","alternativas":["Haemophilus influenzae tipo b","Staphylococcus aureus","Vírus parainfluenza","Vírus sincicial respiratório","Streptococcus pyogenes"],"correta":2,"explicacao":"O quadro é de laringotraqueíte viral (crupe), cuja principal causa é o parainfluenza. O Haemophilus influenzae tipo b causa epiglotite, com toxemia, sialorreia e sem tosse ladrante."},{"id":"res-af83c75f","area":"Pediatria","enunciado":"Criança de 3 anos com febre há 6 dias, conjuntivite não exsudativa bilateral, lábios fissurados, língua em framboesa, edema de mãos e pés e linfonodo cervical de 2 cm. A complicação mais temida dessa doença é:","alternativas":["Glomerulonefrite rapidamente progressiva","Encefalite","Insuficiência hepática aguda","Aneurisma de artérias coronárias","Artrite séptica"],"correta":3,"explicacao":"É a doença de Kawasaki, vasculite de médios vasos cuja complicação mais importante são os aneurismas coronarianos; o tratamento com imunoglobulina endovenosa e AAS reduz esse risco."},{"id":"res-66649a88","area":"Pediatria","enunciado":"Lactente de 4 semanas, do sexo masculino, com vômitos não biliosos em jato após as mamadas, fome logo após vomitar e perda de peso. O distúrbio metabólico esperado é:","alternativas":["Acidose metabólica hiperclorêmica","Acidose metabólica com ânion gap aumentado","Alcalose respiratória","Hipercalemia com acidose","Alcalose metabólica hipoclorêmica e hipocalêmica"],"correta":4,"explicacao":"Na estenose hipertrófica do piloro, a perda de ácido clorídrico pelos vômitos causa alcalose metabólica hipoclorêmica, e a hipocalemia decorre da perda renal de potássio por hiperaldosteronismo secundário."},{"id":"res-98247263","area":"Pediatria","enunciado":"Lactente de 10 meses com febre alta há 3 dias, em bom estado geral. No dia em que a febre cessa, surge exantema maculopapular róseo em tronco. A principal hipótese é:","alternativas":["Exantema súbito (roséola), pelo herpesvírus humano 6","Sarampo","Escarlatina","Eritema infeccioso, pelo parvovírus B19","Rubéola"],"correta":0,"explicacao":"O exantema súbito caracteriza-se por febre alta por 3 a 5 dias com exantema que aparece após a defervescência, típico de lactentes, causado pelo HHV-6 (e HHV-7). No sarampo e na escarlatina o exantema surge com febre."},{"id":"res-04a21f49","area":"Pediatria","enunciado":"Segundo a OMS e o Ministério da Saúde, o aleitamento materno deve ser:","alternativas":["Exclusivo até os 4 meses e complementado até 1 ano","Exclusivo até os 6 meses e complementado até 2 anos ou mais","Exclusivo até os 12 meses","Exclusivo até os 6 meses e interrompido com a introdução alimentar","Complementado com água e chás desde o 1º mês"],"correta":1,"explicacao":"Recomenda-se aleitamento materno exclusivo até os 6 meses, sem água ou chás, e mantido com alimentação complementar até 2 anos ou mais."},{"id":"res-51600c9b","area":"Ginecologia e Obstetrícia","enunciado":"Gestante de 33 semanas com sangramento vaginal vermelho vivo, indolor, de início súbito, útero com tônus normal e BCF presentes. A principal hipótese e o cuidado ao exame são:","alternativas":["Descolamento prematuro de placenta; amniotomia imediata","Rotura uterina; laparotomia imediata","Placenta prévia; evitar toque vaginal até a ultrassonografia","Vasa prévia; toque vaginal para avaliar o colo","Trabalho de parto prematuro; tocólise e toque vaginal seriado"],"correta":2,"explicacao":"Sangramento vermelho vivo, indolor e com útero relaxado sugere placenta prévia. O toque vaginal pode provocar hemorragia grave e deve ser evitado até a ultrassonografia definir a posição da placenta."},{"id":"res-45b1eb4c","area":"Ginecologia e Obstetrícia","enunciado":"Gestante de 35 semanas, hipertensa crônica, com dor abdominal súbita e intensa, sangramento vaginal escuro, útero hipertônico e BCF de 100 bpm. O diagnóstico mais provável é:","alternativas":["Placenta prévia","Trabalho de parto fisiológico","Rotura prematura de membranas","Descolamento prematuro de placenta","Apendicite aguda na gestação"],"correta":3,"explicacao":"Dor súbita, hipertonia uterina, sangramento escuro e sofrimento fetal, com hipertensão como principal fator de risco, caracterizam o descolamento prematuro de placenta."},{"id":"res-9b60b71a","area":"Ginecologia e Obstetrícia","enunciado":"Mulher de 28 anos com atraso menstrual de 7 semanas, dor pélvica intensa, hipotensão e taquicardia. β-hCG positivo, ultrassonografia sem saco gestacional intrauterino e grande quantidade de líquido livre na cavidade. A conduta é:","alternativas":["Metotrexato intramuscular","Conduta expectante com β-hCG seriado","Curetagem uterina","Repetir a ultrassonografia em 48 horas","Cirurgia imediata"],"correta":4,"explicacao":"É gravidez ectópica rota com instabilidade hemodinâmica, o que exige cirurgia imediata. Metotrexato e conduta expectante só cabem em pacientes estáveis, com massa íntegra."},{"id":"res-d5c77329","area":"Ginecologia e Obstetrícia","enunciado":"Gestante com VDRL reagente e teste treponêmico positivo, sem alergia conhecida. O único tratamento considerado adequado para prevenir a sífilis congênita é:","alternativas":["Penicilina G benzatina","Ceftriaxona","Azitromicina","Doxiciclina","Eritromicina"],"correta":0,"explicacao":"Para o Ministério da Saúde, só a penicilina benzatina (iniciada até 30 dias antes do parto) trata adequadamente o feto. Outros antimicrobianos não previnem a sífilis congênita; em caso de alergia, faz-se dessensibilização."},{"id":"res-4180a88b","area":"Ginecologia e Obstetrícia","enunciado":"Puérpera evolui com sangramento volumoso logo após a dequitação, com útero amolecido e acima da cicatriz umbilical. A causa mais comum de hemorragia pós-parto, compatível com o quadro, é:","alternativas":["Retenção de restos placentários","Atonia uterina","Laceração de trajeto","Coagulopatia","Inversão uterina"],"correta":1,"explicacao":"Dos \"4 T\" (tônus, trauma, tecido, trombina), o tônus, isto é, a atonia uterina, é a causa mais frequente. Útero amolecido e aumentado confirma o mecanismo; as primeiras medidas são massagem uterina e uterotônicos, com ocitocina como primeira escolha."},{"id":"res-1a81202d","area":"Ginecologia e Obstetrícia","enunciado":"Mulher de 20 anos com 11 semanas de atraso menstrual, sangramento vaginal, útero maior que o esperado para a idade gestacional, β-hCG muito elevado e ultrassonografia com imagem em \"flocos de neve\", sem embrião. O diagnóstico e o seguimento são:","alternativas":["Abortamento retido; misoprostol e alta sem seguimento","Gestação gemelar; pré-natal de alto risco","Mola hidatiforme completa; esvaziamento e β-hCG seriado","Gravidez ectópica; metotrexato","Mioma uterino; miomectomia"],"correta":2,"explicacao":"Útero aumentado, β-hCG muito alto e imagem em flocos de neve sem embrião caracterizam mola completa. Trata-se com esvaziamento (preferencialmente por aspiração) e segue-se com β-hCG seriado até normalizar, para detectar neoplasia trofoblástica gestacional."},{"id":"res-07e7fe47","area":"Ginecologia e Obstetrícia","enunciado":"Mulher de 24 anos com ciclos a cada 60–90 dias e hirsutismo, sem outras causas de hiperandrogenismo. Pelos critérios de Rotterdam, o diagnóstico de síndrome dos ovários policísticos:","alternativas":["Exige ultrassonografia com ovários policísticos, obrigatoriamente","Exige resistência insulínica comprovada","Exige obesidade associada","Já pode ser feito, pois há dois dos três critérios","Não pode ser feito sem LH/FSH maior que 2"],"correta":3,"explicacao":"Rotterdam: dois de três critérios (oligo/anovulação, hiperandrogenismo clínico ou laboratorial, morfologia policística à ultrassonografia), após excluir outras causas. Resistência insulínica, obesidade e relação LH/FSH não são critérios."},{"id":"res-31ff7aa0","area":"Ginecologia e Obstetrícia","enunciado":"Puérpera Rh negativo, com Coombs indireto negativo durante a gestação, tem recém-nascido Rh positivo. A conduta para prevenir aloimunização é:","alternativas":["Nenhuma, pois o Coombs indireto foi negativo","Imunoglobulina anti-D apenas se o Coombs direto do RN for positivo","Exsanguineotransfusão profilática do recém-nascido","Imunoglobulina anti-D somente na próxima gestação","Imunoglobulina anti-D até 72 horas após o parto"],"correta":4,"explicacao":"Mãe Rh negativo não sensibilizada (Coombs indireto negativo) com RN Rh positivo deve receber imunoglobulina anti-D em até 72 horas. Se já estiver sensibilizada, a imunoglobulina não tem mais efeito."},{"id":"res-4c7767b9","area":"Ginecologia e Obstetrícia","enunciado":"Mulher com corrimento acinzentado, homogêneo e com odor de peixe que piora após a relação sexual, pH vaginal de 5,0, teste das aminas positivo e clue cells à microscopia. O diagnóstico e o tratamento são:","alternativas":["Vaginose bacteriana; metronidazol","Candidíase vulvovaginal; fluconazol","Tricomoníase; tratamento apenas da parceria","Vaginite atrófica; estrogênio tópico","Cervicite gonocócica; ceftriaxona"],"correta":0,"explicacao":"Os critérios de Amsel (corrimento homogêneo, pH > 4,5, teste das aminas positivo, clue cells; três de quatro) confirmam vaginose bacteriana, tratada com metronidazol. A candidíase tem pH < 4,5 e corrimento grumoso."},{"id":"res-b63e3a89","area":"Medicina Preventiva","enunciado":"Um teste com sensibilidade de 90% e especificidade de 90% é aplicado a 1.000 pessoas, numa população com prevalência de 10% da doença. O valor preditivo positivo é:","alternativas":["90%","50%","10%","81%","98,8%"],"correta":1,"explicacao":"Doentes: 100 (90 VP, 10 FN). Sadios: 900 (810 VN, 90 FP). VPP = 90/(90 + 90) = 50%. O VPN seria 810/820 ≈ 98,8%; a baixa prevalência derruba o VPP."},{"id":"res-b1ebedba","area":"Medicina Preventiva","enunciado":"Num ensaio clínico, o desfecho ocorreu em 20% do grupo controle e em 15% do grupo tratado. O número necessário para tratar (NNT) para evitar um desfecho é:","alternativas":["5","4","20","15","25"],"correta":2,"explicacao":"Redução absoluta do risco = 20% − 15% = 5% (0,05); NNT = 1/0,05 = 20. A redução relativa do risco seria de 25%."},{"id":"res-33d4cacf","area":"Medicina Preventiva","enunciado":"Num estudo caso-controle, entre 100 casos, 60 foram expostos ao fator; entre 100 controles, 30 foram expostos. A medida de associação adequada e seu valor são:","alternativas":["Risco relativo de 2,0","Risco relativo de 3,5","Odds ratio de 2,0","Odds ratio de 3,5","Incidência de 60% nos expostos"],"correta":3,"explicacao":"No caso-controle não se calcula incidência nem risco relativo; usa-se a odds ratio = (60 × 70)/(40 × 30) = 4.200/1.200 = 3,5."},{"id":"res-8ce34aec","area":"Medicina Preventiva","enunciado":"Um novo tratamento prolonga a sobrevida de pacientes com uma doença crônica, mas não a cura. Mantida a incidência, espera-se que a prevalência:","alternativas":["Diminua","Permaneça inalterada","Caia a zero","Iguale-se à incidência","Aumente"],"correta":4,"explicacao":"Em situação estável, prevalência ≈ incidência × duração média da doença. Prolongar a sobrevida sem curar aumenta a duração e, portanto, a prevalência."},{"id":"res-d440cf32","area":"Medicina Preventiva","enunciado":"Pesquisadores selecionam trabalhadores sem câncer de pulmão, classificam-nos como expostos ou não expostos ao amianto e os acompanham por 20 anos, comparando a incidência de câncer entre os grupos. O desenho do estudo é:","alternativas":["Coorte","Caso-controle","Transversal","Ecológico","Ensaio clínico randomizado"],"correta":0,"explicacao":"Partir da exposição em pessoas livres da doença e segui-las para medir a incidência define o estudo de coorte, que permite calcular o risco relativo. No caso-controle, parte-se da doença para investigar exposições passadas."},{"id":"res-75c991a9","area":"Medicina Preventiva","enunciado":"Pela Lei 8.142/1990, a Conferência de Saúde, que avalia a situação de saúde e propõe diretrizes para a política de saúde, reúne-se:","alternativas":["Mensalmente, em caráter deliberativo permanente","A cada 4 anos, com representação dos vários segmentos sociais","A cada 2 anos, apenas com gestores","Anualmente, com membros indicados pelo Ministério da Saúde","Somente quando convocada pelo Congresso Nacional"],"correta":1,"explicacao":"A Lei 8.142/1990 define a Conferência de Saúde (a cada 4 anos) e o Conselho de Saúde (permanente e deliberativo), com representação paritária dos usuários em relação aos demais segmentos."},{"id":"res-2d9d331f","area":"Medicina Preventiva","enunciado":"Médico de família evita solicitar exames desnecessários a um paciente ansioso e assintomático, protegendo-o de sobrediagnóstico e intervenções excessivas. Esse é um exemplo de prevenção:","alternativas":["Primária","Secundária","Quaternária","Terciária","Primordial"],"correta":2,"explicacao":"A prevenção quaternária (Jamoulle) busca identificar pessoas em risco de medicalização excessiva e protegê-las de intervenções desnecessárias e de iatrogenia."},{"id":"res-f21c97df","area":"Medicina Preventiva","enunciado":"Um programa de rastreamento de câncer mostra maior sobrevida a partir do diagnóstico nos casos detectados no rastreamento, mas a mortalidade pela doença não muda. O viés que melhor explica o achado é:","alternativas":["Viés de memória","Viés de confusão por idade","Viés do entrevistador","Viés de tempo de antecipação (lead-time)","Viés de publicação"],"correta":3,"explicacao":"O rastreamento antecipa o diagnóstico, e o tempo de sobrevida medido a partir dele aumenta mesmo sem mudar a data do óbito. Por isso, o desfecho adequado para avaliar rastreamento é a mortalidade."},{"id":"res-808bdcee","area":"Medicina Preventiva","enunciado":"Um município registrou, em um ano, 2.000 nascidos vivos, 30 óbitos de menores de 1 ano (12 deles no período neonatal) e 10 óbitos fetais. O coeficiente de mortalidade infantil é:","alternativas":["6 por 1.000 nascidos vivos","20 por 1.000 nascidos vivos","9 por 1.000 nascidos vivos","19,6 por 1.000 nascimentos","15 por 1.000 nascidos vivos"],"correta":4,"explicacao":"Coeficiente de mortalidade infantil = óbitos de menores de 1 ano / nascidos vivos × 1.000 = 30/2.000 × 1.000 = 15. Óbitos fetais não entram, e 12/2.000 = 6 seria o componente neonatal."}],"direito":[{"id":"dir-dc378632","area":"Constitucional","enunciado":"NÃO é cláusula pétrea (art. 60, §4º, CF):","alternativas":["Forma federativa de Estado","Voto direto, secreto, universal e periódico","Separação dos Poderes","Direitos e garantias individuais","Forma republicana de governo"],"correta":4,"explicacao":"A república não está no rol do art. 60, §4º (foi objeto do plebiscito de 1993)."},{"id":"dir-88cf9e94","area":"Constitucional","enunciado":"O remédio constitucional que protege a liberdade de locomoção é o:","alternativas":["Mandado de segurança","Habeas data","Habeas corpus","Mandado de injunção","Ação popular"],"correta":2,"explicacao":"Habeas corpus (art. 5º, LXVIII). Habeas data protege informações pessoais."},{"id":"dir-bef15209","area":"Constitucional","enunciado":"Para conhecer ou retificar informações pessoais em bancos de dados públicos, cabe:","alternativas":["Habeas corpus","Habeas data","Ação civil pública","Mandado de injunção","Reclamação"],"correta":1,"explicacao":"Habeas data (art. 5º, LXXII, CF; Lei 9.507/1997)."},{"id":"dir-6b1671e3","area":"Civil","enunciado":"Após o Estatuto da Pessoa com Deficiência (Lei 13.146/2015), são absolutamente incapazes:","alternativas":["Os menores de 18 anos","Os ébrios habituais","Os menores de 16 anos","Os pródigos","As pessoas com deficiência mental"],"correta":2,"explicacao":"Art. 3º do CC: só os menores de 16 anos. Ébrios habituais e pródigos são relativamente incapazes (art. 4º)."},{"id":"dir-a223d292","area":"Civil","enunciado":"A menoridade civil cessa, em regra, aos:","alternativas":["16 anos","21 anos","18 anos","14 anos","Com o casamento aos 16"],"correta":2,"explicacao":"Art. 5º do CC: 18 anos completos. A emancipação é exceção."},{"id":"dir-743b9371","area":"Penal","enunciado":"NÃO é excludente de ilicitude (art. 23, CP):","alternativas":["Legítima defesa","Estado de necessidade","Estrito cumprimento do dever legal","Exercício regular de direito","Coação moral irresistível"],"correta":4,"explicacao":"Coação moral irresistível exclui a culpabilidade (inexigibilidade de conduta diversa, art. 22)."},{"id":"dir-ec5bff20","area":"Penal","enunciado":"\"Não há crime sem lei anterior que o defina\" expressa o princípio da:","alternativas":["Insignificância","Legalidade (e anterioridade)","Culpabilidade","Intervenção mínima","Proporcionalidade"],"correta":1,"explicacao":"Art. 5º, XXXIX, CF e art. 1º, CP."},{"id":"dir-e02d9936","area":"Processo Civil","enunciado":"No CPC/2015, os prazos processuais em dias são contados:","alternativas":["Em dias corridos","Somente em dias úteis","Em dias úteis só na Justiça Federal","Em horas","Excluindo apenas domingos"],"correta":1,"explicacao":"Art. 219 do CPC: contam-se apenas os dias úteis."},{"id":"dir-b4d50a67","area":"Administrativo","enunciado":"NÃO está expresso no caput do art. 37 da CF:","alternativas":["Legalidade","Impessoalidade","Moralidade","Razoabilidade","Eficiência"],"correta":3,"explicacao":"LIMPE: Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência. Razoabilidade é implícito."},{"id":"dir-56817d1a","area":"Tributário","enunciado":"O tributo cuja obrigação independe de atividade estatal específica relativa ao contribuinte é o:","alternativas":["Imposto","Taxa","Contribuição de melhoria","Empréstimo compulsório","Pedágio"],"correta":0,"explicacao":"Art. 16 do CTN. Taxas e contribuições de melhoria são vinculadas a uma atuação estatal."},{"id":"dir-6cbe0dd8","area":"Ambiental","enunciado":"Legislar sobre florestas, fauna e proteção do meio ambiente é competência:","alternativas":["Privativa da União","Exclusiva dos Estados","Concorrente (União, Estados e DF)","Exclusiva dos Municípios","Residual dos Estados"],"correta":2,"explicacao":"Art. 24, VI, CF. A União edita normas gerais; os Estados suplementam. Municípios suplementam no interesse local (art. 30)."},{"id":"dir-2adeb60c","area":"Trabalho","enunciado":"O empregado adquire direito a férias após:","alternativas":["6 meses","12 meses de vigência do contrato","24 meses","3 meses","Qualquer período"],"correta":1,"explicacao":"Art. 130 da CLT: a cada 12 meses (período aquisitivo), até 30 dias, conforme faltas."},{"id":"dir-775adf8a","area":"Introdução ao Direito","enunciado":"Salvo disposição em contrário, a lei começa a vigorar em todo o país:","alternativas":["45 dias depois de oficialmente publicada","Na data de sua publicação","30 dias depois de oficialmente publicada","90 dias depois de oficialmente publicada","3 meses depois de oficialmente publicada"],"correta":0,"explicacao":"Art. 1º da LINDB (Decreto-Lei 4.657/1942): vacatio legis de 45 dias, salvo disposição em contrário. No estrangeiro, quando admitida, a obrigatoriedade começa 3 meses depois (art. 1º, §1º)."},{"id":"dir-fc45fbed","area":"Introdução ao Direito","enunciado":"Quando a lei for omissa, o juiz decidirá o caso de acordo com:","alternativas":["A equidade, a doutrina e a jurisprudência","A analogia, os costumes e os princípios gerais de direito","Somente a analogia, vedado o uso dos costumes","O direito comparado e a doutrina majoritária","Nada, devendo extinguir o processo por ausência de lei"],"correta":1,"explicacao":"Art. 4º da LINDB. O juiz não se exime de decidir alegando lacuna (art. 140 do CPC)."},{"id":"dir-6927439f","area":"Introdução ao Direito","enunciado":"A Lei A foi revogada pela Lei B. Anos depois, a Lei C revogou a Lei B, sem dizer nada sobre a Lei A. Nessa situação, a Lei A:","alternativas":["Volta a vigorar automaticamente, pois a lei que a revogou deixou de existir","Volta a vigorar apenas se a Lei C for de mesma hierarquia","Não volta a vigorar, pois a repristinação só ocorre se houver disposição expressa","Volta a vigorar após nova vacatio legis de 45 dias","Volta a vigorar somente nos pontos não tratados pela Lei C"],"correta":2,"explicacao":"Art. 2º, §3º, da LINDB: salvo disposição em contrário, a lei revogada não se restaura por ter a lei revogadora perdido a vigência (vedação da repristinação tácita)."},{"id":"dir-91b927af","area":"Constitucional","enunciado":"Um casal de turistas franceses, que não está a serviço da França, tem um filho durante a viagem, em Manaus. Pela Constituição, a criança é:","alternativas":["Brasileira naturalizada","Estrangeira, pois os pais são franceses","Brasileira nata apenas se registrada em repartição brasileira e optar pela nacionalidade após a maioridade","Brasileira nata","Apátrida até completar 18 anos"],"correta":3,"explicacao":"Art. 12, I, 'a', da CF: são brasileiros natos os nascidos no Brasil, ainda que de pais estrangeiros, desde que estes não estejam a serviço de seu país (critério do ius soli)."},{"id":"dir-6389dd49","area":"Constitucional","enunciado":"É cargo privativo de brasileiro nato:","alternativas":["Ministro do Superior Tribunal de Justiça","Senador da República","Governador de Estado","Procurador-Geral da República","Ministro do Supremo Tribunal Federal"],"correta":4,"explicacao":"Art. 12, §3º, da CF: Presidente e Vice, Presidentes da Câmara e do Senado, Ministro do STF, carreira diplomática, oficial das Forças Armadas e Ministro de Estado da Defesa. Os demais cargos citados podem ser ocupados por naturalizados."},{"id":"dir-7a958ab6","area":"Constitucional","enunciado":"Sem consentimento do morador, é possível ingressar na casa dele:","alternativas":["Durante o dia, por determinação judicial","À noite, por determinação judicial","A qualquer hora, por requisição do delegado de polícia","Durante o dia, por ordem do Ministério Público","À noite, por ordem de autoridade administrativa sanitária"],"correta":0,"explicacao":"Art. 5º, XI, da CF: a casa é asilo inviolável, salvo em flagrante delito, desastre, para prestar socorro ou, durante o dia, por determinação judicial."},{"id":"dir-442f20da","area":"Constitucional","enunciado":"Quando a falta de norma regulamentadora torna inviável o exercício de direitos e liberdades constitucionais, o remédio adequado é:","alternativas":["Mandado de segurança","Mandado de injunção","Ação popular","Habeas data","Ação civil pública"],"correta":1,"explicacao":"Art. 5º, LXXI, da CF (regulamentado pela Lei 13.300/2016): o mandado de injunção combate a omissão normativa que inviabiliza direitos."},{"id":"dir-d5260823","area":"Constitucional","enunciado":"A idade mínima exigida como condição de elegibilidade para Senador é de:","alternativas":["30 anos","21 anos","35 anos","18 anos","40 anos"],"correta":2,"explicacao":"Art. 14, §3º, VI, 'a', da CF: 35 anos para Presidente, Vice-Presidente e Senador; 30 para Governador; 21 para Deputado e Prefeito; 18 para Vereador."},{"id":"dir-7f4a108d","area":"Constitucional","enunciado":"Tem legitimidade para propor ação direta de inconstitucionalidade (ADI) perante o STF:","alternativas":["O Prefeito de capital de Estado","O Advogado-Geral da União","A seccional estadual da OAB","O Conselho Federal da Ordem dos Advogados do Brasil","O Defensor Público-Geral do Estado"],"correta":3,"explicacao":"Art. 103, VII, da CF inclui o Conselho Federal da OAB. Prefeitos e seccionais da OAB não constam do rol, e o AGU atua na defesa do ato impugnado (art. 103, §3º)."},{"id":"dir-6e5765c2","area":"Constitucional","enunciado":"Compete privativamente à União legislar sobre:","alternativas":["Direito tributário","Direito penitenciário","Direito urbanístico","Educação, cultura e ensino","Direito eleitoral"],"correta":4,"explicacao":"Art. 22, I, da CF (direito civil, comercial, penal, processual, eleitoral, agrário, marítimo, aeronáutico, espacial e do trabalho). As demais matérias são de competência concorrente (art. 24, I e IX)."},{"id":"dir-5c99154b","area":"Civil","enunciado":"Quando a lei não fixar prazo menor, a prescrição ocorre em:","alternativas":["10 anos","5 anos","3 anos","15 anos","20 anos"],"correta":0,"explicacao":"Art. 205 do Código Civil: prazo geral de 10 anos. O CC/1916 previa 20 anos para ações pessoais."},{"id":"dir-5e6ec6a7","area":"Civil","enunciado":"A vítima de um acidente de trânsito, sem nenhum vínculo contratual com o causador, pretende indenização. A pretensão de reparação civil prescreve em:","alternativas":["1 ano","3 anos","5 anos","10 anos","20 anos"],"correta":1,"explicacao":"Art. 206, §3º, V, do Código Civil: prescreve em 3 anos a pretensão de reparação civil (responsabilidade extracontratual)."},{"id":"dir-4aff4014","area":"Civil","enunciado":"Sobre o início da personalidade civil, o Código Civil estabelece que:","alternativas":["Começa da concepção, com plena capacidade de fato","Começa com o registro de nascimento em cartório","Começa do nascimento com vida, ressalvados desde a concepção os direitos do nascituro","Começa aos 16 anos, com a capacidade relativa","Começa do nascimento com vida, sem qualquer proteção jurídica ao nascituro"],"correta":2,"explicacao":"Art. 2º do Código Civil: a personalidade começa do nascimento com vida, ressalvados desde a concepção os direitos do nascituro."},{"id":"dir-5c3098e1","area":"Civil","enunciado":"O domicílio da pessoa natural é, em regra:","alternativas":["O lugar onde nasceu","O lugar onde foi registrada","Qualquer lugar onde esteja no momento","O lugar onde reside com ânimo definitivo","O lugar indicado no seu título de eleitor"],"correta":3,"explicacao":"Art. 70 do Código Civil. Tendo várias residências, qualquer delas pode ser considerada domicílio (art. 71)."},{"id":"dir-f0111918","area":"Civil","enunciado":"João, inexperiente em negócios, vende um terreno em Parintins por um quinto do valor de mercado, sem ter sido enganado nem ameaçado pelo comprador. O defeito do negócio jurídico é:","alternativas":["Estado de perigo","Dolo","Coação","Fraude contra credores","Lesão"],"correta":4,"explicacao":"Art. 157 do Código Civil: há lesão quando a pessoa, sob premente necessidade ou por inexperiência, se obriga a prestação manifestamente desproporcional. É causa de anulabilidade (art. 171, II)."},{"id":"dir-3d2f9a72","area":"Civil","enunciado":"Um adolescente de 15 anos, que mora com os pais, quebra a vitrine de uma loja. Quanto aos pais, é correto afirmar que:","alternativas":["Respondem pela reparação, ainda que não haja culpa de sua parte","Só respondem se a vítima provar que falharam no dever de vigilância","Não respondem, pois apenas o próprio menor responde com seus bens","Respondem apenas se o filho tiver sido emancipado","Respondem somente na esfera penal, não na civil"],"correta":0,"explicacao":"Arts. 932, I, e 933 do Código Civil: os pais respondem pelos filhos menores sob sua autoridade e companhia, ainda que não haja culpa de sua parte (responsabilidade objetiva por fato de terceiro)."},{"id":"dir-bd853c25","area":"Civil","enunciado":"Uma pessoa viúva, com dois filhos, deseja fazer testamento. Ela pode dispor livremente de:","alternativas":["Toda a herança","Metade da herança","Um terço da herança","Um quarto da herança","Nada, pois há herdeiros necessários"],"correta":1,"explicacao":"Arts. 1.845 e 1.846 do Código Civil: os descendentes são herdeiros necessários e a eles pertence metade dos bens (a legítima); a outra metade é disponível (art. 1.789)."},{"id":"dir-8a66c7e9","area":"Penal","enunciado":"Salvo disposição em contrário, a pena do crime tentado é:","alternativas":["A mesma do crime consumado","A do crime consumado, diminuída de metade","A do crime consumado, diminuída de um a dois terços","A do crime consumado, diminuída de um sexto a um terço","Nenhuma, pois a tentativa não é punível"],"correta":2,"explicacao":"Art. 14, II e parágrafo único, do Código Penal."},{"id":"dir-cbb6b7de","area":"Penal","enunciado":"Pedro dispara contra Lucas com intenção de matar, erra o tiro e, embora tivesse mais munição e pudesse continuar, decide ir embora por vontade própria. Lucas não se fere. Houve:","alternativas":["Tentativa de homicídio, com redução de um a dois terços","Arrependimento posterior, com redução de pena","Arrependimento eficaz, com isenção total de pena","Desistência voluntária, respondendo Pedro apenas pelos atos já praticados","Crime impossível, sem punição"],"correta":3,"explicacao":"Art. 15 do Código Penal: quem voluntariamente desiste de prosseguir na execução só responde pelos atos já praticados (no caso, por exemplo, disparo de arma de fogo ou perigo à vida)."},{"id":"dir-27488d4f","area":"Penal","enunciado":"Nos crimes cometidos sem violência ou grave ameaça, reparado o dano ou restituída a coisa por ato voluntário do agente até o recebimento da denúncia ou da queixa, ocorre:","alternativas":["Extinção da punibilidade","Desistência voluntária","Arrependimento eficaz","Perdão judicial obrigatório","Arrependimento posterior"],"correta":4,"explicacao":"Art. 16 do Código Penal (arrependimento posterior), causa obrigatória de diminuição de pena, de um a dois terços."},{"id":"dir-8695925c","area":"Penal","enunciado":"Segundo o Código Penal, NÃO exclui a imputabilidade penal:","alternativas":["A emoção ou a paixão","A menoridade de 18 anos","A doença mental que torna o agente, ao tempo da ação, inteiramente incapaz de entender o caráter ilícito do fato","A embriaguez completa proveniente de caso fortuito ou força maior","O desenvolvimento mental retardado que retira inteiramente a capacidade de autodeterminação"],"correta":0,"explicacao":"Art. 28, I, do Código Penal: emoção e paixão não excluem a imputabilidade. As demais hipóteses estão nos arts. 26, 27 e 28, §1º."},{"id":"dir-001609eb","area":"Penal","enunciado":"Carlos pegou emprestado o notebook de um colega e, já com o bem em mãos, decidiu não devolvê-lo e vendeu-o. Carlos praticou:","alternativas":["Furto","Apropriação indébita","Roubo","Estelionato","Receptação"],"correta":1,"explicacao":"Art. 168 do Código Penal: apropriar-se de coisa alheia móvel de que tem a posse ou a detenção. No furto (art. 155), o agente subtrai a coisa, que não estava legitimamente em seu poder."},{"id":"dir-5107cd57","area":"Penal","enunciado":"Pelo Código Penal, o crime é doloso quando o agente quis o resultado ou:","alternativas":["Deu causa a ele por imprudência","Deu causa a ele por negligência","Assumiu o risco de produzi-lo","Deu causa a ele por imperícia","Poderia prevê-lo, mas confiou que não ocorreria"],"correta":2,"explicacao":"Art. 18, I, do Código Penal (dolo direto e dolo eventual). Imprudência, negligência e imperícia caracterizam o crime culposo (art. 18, II)."},{"id":"dir-53a88342","area":"Processo Civil","enunciado":"No CPC/2015, o prazo para opor embargos de declaração é de:","alternativas":["15 dias","10 dias","3 dias","5 dias","30 dias"],"correta":3,"explicacao":"Art. 1.023 do CPC. Os demais recursos, em regra, têm prazo de 15 dias (art. 1.003, §5º)."},{"id":"dir-2988a31b","area":"Processo Civil","enunciado":"O réu, devidamente intimado, não comparece à audiência de conciliação do art. 334 do CPC e não apresenta justificativa. A consequência legal é:","alternativas":["Revelia, com presunção de veracidade dos fatos alegados pelo autor","Extinção do processo sem resolução do mérito","Confissão ficta sobre toda a matéria de direito","Nenhuma, pois a audiência é facultativa para o réu","Ato atentatório à dignidade da justiça, sancionado com multa"],"correta":4,"explicacao":"Art. 334, §8º, do CPC: multa de até 2% da vantagem econômica pretendida ou do valor da causa. A revelia decorre da falta de contestação (art. 344), não da ausência à audiência."},{"id":"dir-29d5cdb3","area":"Processo Civil","enunciado":"A presunção de veracidade decorrente da revelia NÃO ocorre quando:","alternativas":["Havendo pluralidade de réus, algum deles contestar a ação","O réu for pessoa jurídica de direito privado","O litígio versar sobre direitos patrimoniais disponíveis","O autor tiver juntado documentos com a petição inicial","O réu tiver sido citado pessoalmente"],"correta":0,"explicacao":"Art. 345, I, do CPC. Também não ocorre em direitos indisponíveis, falta de instrumento indispensável ou alegações inverossímeis (art. 345, II a IV)."},{"id":"dir-f73f25e6","area":"Processo Civil","enunciado":"Autor que mora em Manaus ajuíza ação reivindicatória de um imóvel situado em Itacoatiara contra réu domiciliado em Belém. É competente o foro de:","alternativas":["Belém, domicílio do réu","Itacoatiara, local da situação do imóvel","Manaus, domicílio do autor","Qualquer um, à escolha do autor","Brasília, por envolver partes de Estados diferentes"],"correta":1,"explicacao":"Art. 47 do CPC: para ações fundadas em direito real sobre imóveis, é competente o foro de situação da coisa."},{"id":"dir-afaebb34","area":"Processo Penal","enunciado":"Pelo CPP, o inquérito policial deve terminar, em regra, no prazo de:","alternativas":["30 dias em qualquer caso","15 dias se preso e 60 dias se solto","10 dias se preso e 30 dias se solto","5 dias se preso e 10 dias se solto","90 dias, prorrogáveis livremente"],"correta":2,"explicacao":"Art. 10 do CPP. Estando solto, o prazo pode ser prorrogado pelo juiz quando o fato for de difícil elucidação (art. 10, §3º)."},{"id":"dir-dc8a110b","area":"Processo Penal","enunciado":"Em crime de ação penal privada, o ofendido deve oferecer queixa, sob pena de decadência, em regra no prazo de:","alternativas":["6 meses, contado da data do fato","30 dias, contado do conhecimento da autoria","1 ano, contado da data do fato","6 meses, contado do conhecimento da autoria","2 anos, contado do conhecimento da autoria"],"correta":3,"explicacao":"Art. 38 do CPP (e art. 103 do CP): 6 meses a partir do conhecimento da autoria."},{"id":"dir-acfa3811","area":"Processo Penal","enunciado":"NÃO se considera em flagrante delito quem:","alternativas":["Está cometendo a infração penal","Acaba de cometer a infração penal","É perseguido, logo após, em situação que faça presumir ser o autor","É encontrado, logo depois, com instrumentos ou objetos que façam presumir ser ele o autor","É identificado por testemunhas três dias após o crime, sem perseguição nem objetos"],"correta":4,"explicacao":"Art. 302 do CPP lista as hipóteses de flagrante próprio, impróprio e presumido. Identificação posterior, sem perseguição nem objetos, não autoriza prisão em flagrante."},{"id":"dir-bb726343","area":"Administrativo","enunciado":"Um ato administrativo válido deixa de ser conveniente e oportuno para o interesse público. A Administração pode extingui-lo por meio de:","alternativas":["Revogação, respeitados os direitos adquiridos","Anulação, com efeitos retroativos","Convalidação","Cassação","Caducidade"],"correta":0,"explicacao":"Art. 53 da Lei 9.784/1999 e Súmula 473 do STF: a Administração anula atos ilegais e pode revogar atos por conveniência ou oportunidade, respeitados os direitos adquiridos."},{"id":"dir-cc6c791d","area":"Administrativo","enunciado":"O servidor nomeado para cargo de provimento efetivo em virtude de concurso público adquire estabilidade após:","alternativas":["2 anos de efetivo exercício","3 anos de efetivo exercício","5 anos de efetivo exercício","A posse no cargo","1 ano de estágio probatório"],"correta":1,"explicacao":"Art. 41, caput e §4º, da CF: estabilidade após três anos de efetivo exercício, sendo obrigatória a avaliação especial de desempenho por comissão."},{"id":"dir-58efd06c","area":"Administrativo","enunciado":"Uma viatura estadual, conduzida por servidor em serviço, colide com um carro particular. Quanto à responsabilidade civil, é correto afirmar que:","alternativas":["O Estado só responde se a vítima provar a culpa do servidor","Só o servidor responde, pessoalmente e de forma objetiva","O Estado responde objetivamente, com direito de regresso contra o servidor","O Estado responde subsidiariamente, apenas se o servidor não tiver bens","Não há responsabilidade, pois o servidor agia no exercício da função"],"correta":2,"explicacao":"Art. 37, §6º, da CF: as pessoas jurídicas de direito público respondem pelos danos que seus agentes causarem a terceiros, com regresso contra o responsável nos casos de dolo ou culpa."},{"id":"dir-9407f768","area":"Administrativo","enunciado":"NÃO é modalidade de licitação prevista na Lei 14.133/2021:","alternativas":["Pregão","Concorrência","Leilão","Tomada de preços","Diálogo competitivo"],"correta":3,"explicacao":"Art. 28 da Lei 14.133/2021: pregão, concorrência, concurso, leilão e diálogo competitivo. Tomada de preços e convite existiam na antiga Lei 8.666/1993."},{"id":"dir-23e0b61b","area":"Tributário","enunciado":"Uma lei que institui um novo imposto (sem estar entre as exceções constitucionais) é publicada em dezembro. Em regra, esse imposto poderá ser cobrado:","alternativas":["Imediatamente, na data da publicação","Em 1º de janeiro do ano seguinte, ainda que não decorridos 90 dias","Somente após 90 dias, mesmo que no mesmo exercício","Somente após dois exercícios financeiros","No exercício seguinte, desde que decorridos 90 dias da publicação da lei"],"correta":4,"explicacao":"Art. 150, III, 'b' e 'c', da CF: anterioridade do exercício e anterioridade nonagesimal se aplicam cumulativamente, salvo as exceções do art. 150, §1º."},{"id":"dir-9d9d0a1a","area":"Tributário","enunciado":"Segundo o conceito de tributo do art. 3º do CTN, o tributo:","alternativas":["Não constitui sanção de ato ilícito","Pode ser pago em serviços prestados ao Estado","É cobrado mediante atividade discricionária","Pode ser instituído por contrato com o contribuinte","É uma prestação voluntária"],"correta":0,"explicacao":"Art. 3º do CTN: prestação pecuniária compulsória, em moeda ou cujo valor nela se possa exprimir, que não constitua sanção de ato ilícito, instituída em lei e cobrada mediante atividade administrativa plenamente vinculada. A multa é sanção, não tributo."},{"id":"dir-c448982c","area":"Tributário","enunciado":"Uma igreja em Manaus recebe cobrança de IPTU sobre o templo e de uma taxa municipal de fiscalização. Sobre a imunidade dos templos, é correto afirmar que:","alternativas":["Alcança impostos e taxas, mas não contribuições","Alcança somente impostos, de modo que a entidade continua sujeita às taxas","Alcança todos os tributos, sem exceção","Não alcança o IPTU, apenas o imposto de renda","Depende de lei complementar municipal para produzir efeitos"],"correta":1,"explicacao":"Art. 150, VI, 'b', da CF: a imunidade veda a instituição de impostos sobre templos de qualquer culto; taxas e outras espécies tributárias não são abrangidas."},{"id":"dir-327eacf7","area":"Trabalho","enunciado":"NÃO é requisito para a caracterização da relação de emprego segundo a CLT:","alternativas":["Pessoalidade","Não eventualidade","Exclusividade","Subordinação","Onerosidade"],"correta":2,"explicacao":"Arts. 2º e 3º da CLT: pessoa física, pessoalidade, não eventualidade, onerosidade (salário) e subordinação (dependência). O empregado pode ter mais de um emprego."},{"id":"dir-b0d89039","area":"Trabalho","enunciado":"A remuneração do serviço extraordinário (hora extra) deve ser, no mínimo:","alternativas":["20% superior à da hora normal","100% superior à da hora normal","Igual à da hora normal","50% superior à da hora normal","30% superior à da hora normal"],"correta":3,"explicacao":"Art. 7º, XVI, da CF (e art. 59, §1º, da CLT). O percentual de 20% corresponde ao adicional noturno urbano (art. 73 da CLT)."},{"id":"dir-e851d773","area":"Trabalho","enunciado":"A empregada gestante tem garantia de emprego, vedada a dispensa arbitrária ou sem justa causa:","alternativas":["Desde a confirmação da gravidez até o parto","Desde a admissão até um ano após o parto","Somente durante a licença-maternidade","Desde o parto até quatro meses depois","Desde a confirmação da gravidez até cinco meses após o parto"],"correta":4,"explicacao":"Art. 10, II, 'b', do ADCT da CF/88."},{"id":"dir-1da77ad9","area":"Ambiental","enunciado":"As terras tradicionalmente ocupadas pelos índios, como as do Alto Rio Negro, são:","alternativas":["Bens da União, destinadas à posse permanente e ao usufruto exclusivo dos índios","Propriedade privada das comunidades indígenas, podendo ser vendidas por decisão coletiva","Bens dos Estados em que se localizam","Bens dos Municípios, com usufruto compartilhado","Terras devolutas passíveis de usucapião após 15 anos"],"correta":0,"explicacao":"Arts. 20, XI, e 231, §2º, da CF: posse permanente e usufruto exclusivo das riquezas do solo, dos rios e dos lagos. Essas terras são inalienáveis e indisponíveis, e os direitos sobre elas são imprescritíveis (art. 231, §4º)."},{"id":"dir-c67cc917","area":"Ambiental","enunciado":"Uma madeireira, por decisão de seu diretor e em benefício da empresa, desmata ilegalmente área protegida no Amazonas. Sobre a responsabilidade penal da pessoa jurídica:","alternativas":["Não é possível, pois pessoa jurídica não pode ser sujeito ativo de crime","É possível, por ter sido decidida por seu diretor em benefício da empresa","É possível apenas na esfera administrativa, não na penal","Exclui a responsabilidade penal do diretor pessoa física","Só é possível se a empresa for pública"],"correta":1,"explicacao":"Art. 225, §3º, da CF e art. 3º da Lei 9.605/1998. A responsabilidade da pessoa jurídica não exclui a das pessoas físicas autoras, coautoras ou partícipes (art. 3º, parágrafo único)."},{"id":"dir-5a6259c1","area":"Empresarial","enunciado":"Pelo Código Civil, NÃO é considerado empresário, em regra:","alternativas":["Quem exerce profissionalmente atividade econômica organizada para a circulação de bens","Quem exerce profissionalmente atividade econômica organizada para a produção de bens","Quem exerce profissão intelectual de natureza científica, literária ou artística","Quem exerce profissionalmente atividade econômica organizada para a prestação de serviços","O comerciante individual de um mercadinho no bairro"],"correta":2,"explicacao":"Art. 966, caput e parágrafo único, do Código Civil. O profissional intelectual só será empresário se o exercício da profissão constituir elemento de empresa."},{"id":"dir-c5edb85e","area":"Empresarial","enunciado":"Na sociedade limitada, a responsabilidade de cada sócio:","alternativas":["É ilimitada e solidária por todas as dívidas da sociedade","É restrita ao valor de suas quotas, sem qualquer solidariedade entre os sócios","É ilimitada apenas para o sócio administrador","É restrita ao valor de suas quotas, mas todos respondem solidariamente pela integralização do capital social","Não existe, pois apenas a sociedade responde, mesmo que o capital não esteja integralizado"],"correta":3,"explicacao":"Art. 1.052 do Código Civil."},{"id":"dir-81649a82","area":"Direitos Humanos","enunciado":"Os tratados e convenções internacionais sobre direitos humanos aprovados, em cada Casa do Congresso Nacional, em dois turnos, por três quintos dos votos dos respectivos membros, serão:","alternativas":["Equivalentes às leis ordinárias","Equivalentes às leis complementares","Normas de hierarquia inferior aos decretos","Aplicáveis apenas após referendo popular","Equivalentes às emendas constitucionais"],"correta":4,"explicacao":"Art. 5º, §3º, da CF (incluído pela EC 45/2004). Exemplo: a Convenção sobre os Direitos das Pessoas com Deficiência."}],"oab":[{"id":"oab-198a7cff","area":"Ética","enunciado":"Para se inscrever como advogado é preciso, entre outros requisitos:","alternativas":["Mestrado em Direito","Aprovação no Exame de Ordem","2 anos de estágio","Idade mínima de 25 anos","Concurso público"],"correta":1,"explicacao":"Art. 8º, IV, do Estatuto da Advocacia (Lei 8.906/1994)."},{"id":"oab-488b6d6d","area":"Ética","enunciado":"Os honorários de sucumbência pertencem:","alternativas":["À parte vencedora","Ao advogado","Ao Estado","À OAB","Metade à parte, metade ao advogado"],"correta":1,"explicacao":"Art. 23 do EAOAB: pertencem ao advogado, que pode executá-los autonomamente."},{"id":"oab-95dc217e","area":"Processo Civil","enunciado":"No procedimento comum do CPC, o prazo para contestar é de:","alternativas":["10 dias úteis","15 dias úteis","5 dias","30 dias corridos","20 dias úteis"],"correta":1,"explicacao":"Art. 335 do CPC."},{"id":"oab-4c56a54c","area":"Processo Civil","enunciado":"O prazo para apelação no CPC/2015 é de:","alternativas":["5 dias","10 dias","15 dias úteis","30 dias","8 dias"],"correta":2,"explicacao":"Art. 1.003, §5º: 15 dias para todos os recursos, exceto embargos de declaração (5 dias)."},{"id":"oab-51160cef","area":"Processo Penal","enunciado":"Com o indiciado preso, o inquérito policial deve terminar em (regra do CPP):","alternativas":["30 dias","10 dias","15 dias","5 dias","60 dias"],"correta":1,"explicacao":"Art. 10 do CPP: 10 dias se preso, 30 se solto. Há leis especiais com prazos diferentes."},{"id":"oab-19a76129","area":"ECA","enunciado":"Para o ECA, adolescente é a pessoa entre:","alternativas":["10 e 18 anos","12 e 18 anos incompletos","14 e 21 anos","12 e 21 anos","13 e 17 anos"],"correta":1,"explicacao":"Art. 2º do ECA: criança até 12 anos incompletos; adolescente de 12 a 18 anos incompletos."},{"id":"oab-9ab054b5","area":"Consumidor","enunciado":"O prazo para reclamar de vício aparente em produto durável é de:","alternativas":["30 dias","90 dias","5 anos","7 dias","1 ano"],"correta":1,"explicacao":"Art. 26, II, do CDC. Não durável: 30 dias. Os 7 dias são o arrependimento em compras fora do estabelecimento (art. 49)."},{"id":"oab-280a8198","area":"Empresarial","enunciado":"Na sociedade limitada, a responsabilidade dos sócios:","alternativas":["É ilimitada","É restrita ao valor de suas quotas","Não existe","É subsidiária e ilimitada","É proporcional ao lucro"],"correta":1,"explicacao":"Art. 1.052 do Código Civil: a responsabilidade de cada sócio é restrita ao valor de suas quotas, mas todos respondem solidariamente pela integralização do capital social."},{"id":"oab-c337b16a","area":"Ética","enunciado":"Em 2019, a Seccional tomou conhecimento oficial de falta disciplinar praticada pelo advogado Rui. Nenhum ato interruptivo ocorreu desde então. Sobre a pretensão punitiva da OAB, é correto afirmar que ela prescreve em:","alternativas":["2 anos, contados da data da prática do fato","5 anos, contados da data da constatação oficial do fato","3 anos, contados da data da constatação oficial do fato","10 anos, contados da data da prática do fato","Não prescreve, por se tratar de processo disciplinar de natureza ética"],"correta":1,"explicacao":"Art. 43 do Estatuto da Advocacia (Lei 8.906/1994): a pretensão à punibilidade das infrações disciplinares prescreve em cinco anos, contados da constatação oficial do fato."},{"id":"oab-06f7e527","area":"Ética","enunciado":"Maria, advogada, foi arrolada como testemunha em processo sobre fatos que conheceu ao patrocinar os interesses de seu antigo cliente, o qual, inclusive, autorizou por escrito o depoimento. Nesse caso, Maria:","alternativas":["É obrigada a depor, pois a autorização do cliente afasta o sigilo profissional","Só pode recusar-se se ainda for advogada do cliente","Pode recusar-se a depor, ainda que autorizada ou solicitada pelo cliente","Deve depor, mas apenas sobre fatos posteriores ao fim do mandato","Só pode recusar-se mediante autorização prévia do Conselho Seccional"],"correta":2,"explicacao":"Art. 7º, XIX, do Estatuto da Advocacia: é direito do advogado recusar-se a depor sobre fato relacionado a pessoa de quem seja ou foi advogado, mesmo quando autorizado ou solicitado pelo constituinte."},{"id":"oab-f088d205","area":"Ética","enunciado":"Carlos, advogado, renunciou ao mandato que lhe fora outorgado em ação cível e notificou regularmente o cliente. Quanto à sua responsabilidade após a renúncia, Carlos:","alternativas":["Deixa de representar o cliente imediatamente após a notificação","Continua a representar o cliente por 30 dias após a notificação","Continua a representar o cliente até o trânsito em julgado da ação","Continua a representá-lo nos 10 dias seguintes, salvo se substituído antes","Só se desobriga após homologação judicial da renúncia"],"correta":3,"explicacao":"Art. 5º, § 3º, do Estatuto da Advocacia: o advogado que renunciar ao mandato continuará, durante os dez dias seguintes à notificação da renúncia, a representar o mandante, salvo se for substituído antes."},{"id":"oab-e3946a33","area":"Ética","enunciado":"Lucas, policial militar da ativa, foi aprovado no Exame de Ordem e deseja advogar nas horas vagas, apenas em causas de família. Segundo o Estatuto da Advocacia, Lucas:","alternativas":["Pode advogar em causas de família, pois há mero impedimento contra a Fazenda que o remunera","Pode advogar livremente, desde que fora do horário de serviço","Pode advogar apenas em causas próprias e de parentes","Não pode advogar, pois a atividade policial é incompatível com a advocacia","Pode advogar se obtiver autorização do comandante da corporação"],"correta":3,"explicacao":"Art. 28, V, do Estatuto da Advocacia: a advocacia é incompatível com as atividades de ocupantes de cargos ou funções vinculados direta ou indiretamente a atividade policial de qualquer natureza; a incompatibilidade gera proibição total (art. 27)."},{"id":"oab-a209c66f","area":"Ética","enunciado":"Joana, advogada regularmente inscrita, tomou posse como analista administrativa em uma autarquia estadual, cargo sem poder de decisão relevante. Quanto ao exercício da advocacia, Joana:","alternativas":["Está proibida de advogar em qualquer causa, por incompatibilidade","Pode advogar livremente, inclusive contra o Estado","Está impedida apenas de advogar em causas trabalhistas","Deve licenciar-se da OAB enquanto ocupar o cargo","Está impedida de advogar contra a Fazenda Pública que a remunera"],"correta":4,"explicacao":"Art. 30, I, do Estatuto da Advocacia: os servidores da administração direta, indireta e fundacional são impedidos de exercer a advocacia contra a Fazenda Pública que os remunere ou à qual seja vinculada a entidade empregadora."},{"id":"oab-656d73b7","area":"Ética","enunciado":"A sociedade de advogados Silva & Souza pretende divulgar seus serviços por meio de um outdoor em avenida movimentada, com o nome dos sócios e as áreas de atuação. Segundo o Código de Ética e Disciplina da OAB, essa publicidade:","alternativas":["É permitida, desde que contenha apenas informações objetivas","É permitida mediante prévia autorização do Conselho Seccional","É permitida, desde que não mencione valores de honorários","É vedada apenas se contiver fotografia dos sócios","É vedada, pois o Código proíbe publicidade por meio de outdoors"],"correta":4,"explicacao":"Art. 40, II, do Código de Ética e Disciplina da OAB: é vedado o uso de outdoors, painéis luminosos ou formas assemelhadas de publicidade."},{"id":"oab-5ad7c482","area":"Ética","enunciado":"Ana, advogada, firmou contrato escrito de honorários com seu cliente, que deixou de pagar as parcelas após a conclusão do serviço. Segundo o Estatuto da Advocacia, o contrato escrito de honorários:","alternativas":["Exige prévio ajuizamento de ação de conhecimento para cobrança","Só vale como título executivo se homologado pela OAB","Só pode ser cobrado por meio de ação monitória","Não tem força executiva, servindo apenas como prova escrita","Constitui título executivo, permitindo a execução direta do crédito"],"correta":4,"explicacao":"Art. 24 do Estatuto da Advocacia: a decisão judicial que fixar ou arbitrar honorários e o contrato escrito que os estipular são títulos executivos e constituem crédito privilegiado na falência, concordata, concurso de credores, insolvência civil e liquidação extrajudicial."},{"id":"oab-255411d8","area":"Ética","enunciado":"Pedro, advogado, é sócio de uma sociedade de advogados com sede em Belo Horizonte. Ele foi convidado a ingressar como sócio em outra sociedade de advogados, também sediada em Belo Horizonte. Segundo o Estatuto da Advocacia, Pedro:","alternativas":["Não pode integrar a segunda, por terem sede na área do mesmo Conselho Seccional","Pode integrar ambas, desde que comunique o fato ao Conselho Seccional","Pode integrar ambas, desde que as sociedades atuem em áreas distintas","Pode integrar ambas, desde que tenha participação minoritária em uma delas","Só pode integrar a segunda sociedade se ela for unipessoal"],"correta":0,"explicacao":"Art. 15, § 4º, do Estatuto da Advocacia: nenhum advogado pode integrar mais de uma sociedade de advogados com sede ou filial na mesma área territorial do respectivo Conselho Seccional."},{"id":"oab-14c81919","area":"Constitucional","enunciado":"Roberto deseja conhecer as informações a seu respeito constantes de um banco de dados de caráter público mantido por órgão federal, que se recusou a fornecê-las. A ação constitucional adequada é:","alternativas":["Habeas data","Mandado de segurança","Habeas corpus","Mandado de injunção","Ação popular"],"correta":0,"explicacao":"Art. 5º, LXXII, a, da Constituição: conceder-se-á habeas data para assegurar o conhecimento de informações relativas à pessoa do impetrante, constantes de registros ou bancos de dados de entidades governamentais ou de caráter público."},{"id":"oab-2886890b","area":"Constitucional","enunciado":"O Presidente da República editou medida provisória criando um novo tipo penal para punir fraudes em licitações. Essa medida provisória é:","alternativas":["Constitucional, desde que convertida em lei no prazo de 60 dias","Constitucional, por se tratar de caso de relevância e urgência","Constitucional, se aprovada por maioria absoluta do Congresso","Inconstitucional apenas se previr pena de reclusão","Inconstitucional, pois é vedada a edição de medida provisória sobre direito penal"],"correta":4,"explicacao":"Art. 62, § 1º, I, b, da Constituição: é vedada a edição de medidas provisórias sobre matéria relativa a direito penal, processual penal e processual civil."},{"id":"oab-80975d76","area":"Constitucional","enunciado":"Um grupo de cidadãos pretende apresentar, mediante coleta de assinaturas, proposta de emenda à Constituição Federal. Considerando o texto constitucional, entre os legitimados à propositura de emenda está(ão):","alternativas":["Os cidadãos, por iniciativa popular subscrita por 1% do eleitorado nacional","Qualquer Governador de Estado","O Supremo Tribunal Federal","Um décimo dos membros da Câmara dos Deputados","Mais da metade das Assembleias Legislativas das unidades da Federação"],"correta":4,"explicacao":"Art. 60, I a III, da Constituição: a Constituição pode ser emendada mediante proposta de um terço dos membros da Câmara ou do Senado, do Presidente da República ou de mais da metade das Assembleias Legislativas, cada uma pela maioria relativa de seus membros."},{"id":"oab-cc61cf3d","area":"Constitucional","enunciado":"Paula, com 32 anos de idade, filiada a partido político e em pleno gozo dos direitos políticos, pretende se candidatar nas próximas eleições. Pelo critério da idade mínima, Paula NÃO pode concorrer ao cargo de:","alternativas":["Governadora","Deputada Federal","Senadora","Prefeita","Vereadora"],"correta":2,"explicacao":"Art. 14, § 3º, VI, da Constituição: a idade mínima é de 35 anos para Presidente, Vice-Presidente e Senador; 30 para Governador; 21 para Deputado e Prefeito; 18 para Vereador."},{"id":"oab-b2f5b9ec","area":"Civil","enunciado":"Em janeiro de 2023, o carro de Fábio foi atingido por veículo conduzido por Gustavo, que agiu com culpa. Fábio pretende ajuizar ação de reparação civil. Pela regra geral do Código Civil, o prazo prescricional dessa pretensão é de:","alternativas":["1 ano","5 anos","10 anos","2 anos","3 anos"],"correta":4,"explicacao":"Art. 206, § 3º, V, do Código Civil: prescreve em três anos a pretensão de reparação civil."},{"id":"oab-b20158c8","area":"Civil","enunciado":"Segundo o Código Civil, com a redação dada pelo Estatuto da Pessoa com Deficiência (Lei 13.146/2015), é absolutamente incapaz de exercer pessoalmente os atos da vida civil:","alternativas":["O pródigo","O ébrio habitual","O menor de 16 anos","A pessoa com deficiência mental","O maior de 16 e menor de 18 anos"],"correta":2,"explicacao":"Art. 3º do Código Civil: são absolutamente incapazes apenas os menores de 16 anos; pródigos, ébrios habituais e maiores de 16 e menores de 18 são relativamente incapazes (art. 4º)."},{"id":"oab-122e164d","area":"Civil","enunciado":"Lúcia comprou um automóvel usado de um particular e, logo após a entrega, constatou um defeito oculto no motor que torna o bem impróprio ao uso. Pela regra geral do Código Civil (sem considerar vícios que só podem ser conhecidos mais tarde), o prazo decadencial para Lúcia obter a redibição é de:","alternativas":["7 dias, contados da entrega efetiva","90 dias, contados da descoberta do vício","1 ano, contado da entrega efetiva","3 anos, contados da celebração do contrato","30 dias, contados da entrega efetiva"],"correta":4,"explicacao":"Art. 445 do Código Civil: o adquirente decai do direito de obter a redibição ou abatimento no preço no prazo de 30 dias se a coisa for móvel, e de um ano se for imóvel, contado da entrega efetiva."},{"id":"oab-921f649c","area":"Civil","enunciado":"José, viúvo, tem dois filhos e deseja deixar, por testamento, todo o seu patrimônio a um amigo de infância. Segundo o Código Civil, José:","alternativas":["Só pode dispor de metade dos bens, reservada a legítima dos filhos","Pode dispor livremente de todo o patrimônio, por ser viúvo","Pode dispor de dois terços de seus bens","Não pode fazer testamento enquanto tiver descendentes","Pode dispor de todo o patrimônio, desde que os filhos sejam maiores"],"correta":0,"explicacao":"Arts. 1.845, 1.846 e 1.789 do Código Civil: descendentes são herdeiros necessários, e pertence a eles, de pleno direito, a metade dos bens da herança; havendo herdeiros necessários, o testador só pode dispor da metade."},{"id":"oab-fb8fc796","area":"Processo Civil","enunciado":"Proferida sentença, o réu opôs embargos de declaração alegando omissão. Quanto ao prazo para interposição de apelação pelas partes, a oposição dos embargos de declaração:","alternativas":["Suspende o prazo, que volta a correr pelo saldo restante","Não produz qualquer efeito sobre o prazo recursal","Interrompe o prazo para a interposição de recurso","Interrompe o prazo apenas para a parte que opôs os embargos","Suspende o prazo apenas se os embargos forem acolhidos"],"correta":2,"explicacao":"Art. 1.026 do CPC: os embargos de declaração não possuem efeito suspensivo e interrompem o prazo para a interposição de recurso."},{"id":"oab-d7ef213c","area":"Processo Civil","enunciado":"Em ação de obrigação de fazer, o juiz indeferiu o pedido de tutela provisória de urgência formulado pela autora. O recurso cabível contra essa decisão interlocutória é:","alternativas":["Apelação","Agravo interno","Recurso ordinário","Embargos infringentes","Agravo de instrumento"],"correta":4,"explicacao":"Art. 1.015, I, do CPC: cabe agravo de instrumento contra as decisões interlocutórias que versarem sobre tutelas provisórias."},{"id":"oab-099cbebb","area":"Processo Civil","enunciado":"Em ação de cobrança movida contra dois devedores solidários, apenas um deles contestou, impugnando a existência da dívida, fato comum a ambos. O outro réu foi revel. Quanto ao efeito material da revelia, é correto afirmar que:","alternativas":["Presumem-se verdadeiras as alegações do autor em relação ao réu revel","Não se presumem verdadeiras, pois um dos litisconsortes contestou","O processo deve ser extinto em relação ao réu revel","O juiz deve julgar antecipadamente o pedido apenas contra o revel","O réu revel será condenado automaticamente, sem produção de provas"],"correta":1,"explicacao":"Art. 345, I, do CPC: a revelia não produz o efeito de presunção de veracidade se, havendo pluralidade de réus, algum deles contestar a ação."},{"id":"oab-942d0685","area":"Processo Civil","enunciado":"Transitou em julgado decisão de mérito proferida por juiz absolutamente incompetente. A parte prejudicada pretende ajuizar ação rescisória. Pela regra geral do CPC, o prazo para tanto é de:","alternativas":["1 ano, contado do trânsito em julgado","2 anos, contados do trânsito em julgado da última decisão","5 anos, contados da prolação da decisão","2 anos, contados da ciência do vício pela parte","90 dias, contados do trânsito em julgado"],"correta":1,"explicacao":"Art. 975 do CPC: o direito à rescisão se extingue em dois anos contados do trânsito em julgado da última decisão proferida no processo; a incompetência absoluta é hipótese de rescisória (art. 966, II)."},{"id":"oab-50b1a0b7","area":"Penal","enunciado":"Tiago furtou um celular e, arrependido, devolveu-o voluntariamente à vítima antes do recebimento da denúncia. Segundo o Código Penal, Tiago:","alternativas":["Terá direito à redução da pena de um a dois terços, pelo arrependimento posterior","Terá extinta a punibilidade","Responderá apenas pelos atos já praticados, pela desistência voluntária","Não será punido, pelo arrependimento eficaz","Não terá qualquer benefício, pois o crime já se consumou"],"correta":0,"explicacao":"Art. 16 do Código Penal: nos crimes cometidos sem violência ou grave ameaça, reparado o dano ou restituída a coisa até o recebimento da denúncia, por ato voluntário do agente, a pena será reduzida de um a dois terços."},{"id":"oab-cdbbb050","area":"Penal","enunciado":"Rafael, pretendendo matar Bruno, disparou uma vez contra ele, errando o alvo. Embora tivesse outras munições e nada o impedisse, decidiu por vontade própria não prosseguir. Bruno não sofreu lesões. Rafael:","alternativas":["Responde por tentativa de homicídio","Responde apenas pelos atos já praticados, em razão da desistência voluntár
