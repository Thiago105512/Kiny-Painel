# Publica o app (docs/index.html) no Firebase Hosting do projeto simulado2027
# a cada push no branch do app. Precisa do segredo FIREBASE_SERVICE_ACCOUNT
# (JSON da conta de serviço: Firebase → Configurações do projeto → Contas de serviço → Gerar nova chave privada).
name: Publicar no Firebase
on:
  push:
    branches: [claude/curriculo-enem-vestibulares-9lfc7s]
    paths: ["docs/**", "firebase.json", "curriculos/firestore.rules", ".github/workflows/firebase-hosting.yml"]
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: simulado2027
          channelId: live
